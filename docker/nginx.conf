# Fathom's server config. It serves exactly one file to GET and HEAD, and
# refuses everything else.
#
# ---------------------------------------------------------------------------
# THE TWO THINGS THAT ARE EASY TO GET WRONG HERE
# ---------------------------------------------------------------------------
#
# 1. DO NOT ADD A FULL `Content-Security-Policy` HEADER.
#
#    The page already carries its own CSP in a <meta> tag, and it is strict:
#    `default-src 'none'`, `connect-src 'none'`, plus the two things the app
#    genuinely needs — `script-src 'unsafe-inline' 'wasm-unsafe-eval'` and
#    `worker-src blob:`.
#
#    When a page has BOTH a meta CSP and a header CSP, the browser enforces
#    BOTH — the effective policy is the intersection. So a header CSP that
#    forgets `'wasm-unsafe-eval'` does not "add security", it BREAKS THE APP:
#    the WebAssembly module stops instantiating and Fathom cannot read a config
#    at all. Duplicating the meta policy here would also mean two copies to keep
#    in step, and the artifact's CSP changes when the artifact does.
#
#    So exactly one CSP directive is sent, below, and it is the one that CANNOT
#    be set from a meta tag: `frame-ancestors`. Browsers ignore `frame-ancestors`
#    in <meta> by specification, which makes the server the only place it can
#    live. It restricts nothing the page itself does, so it cannot break it.
#
# 2. DO NOT ADD CORS HEADERS. There is nothing to allow.
#
#    Fathom makes no cross-origin requests — it makes no requests at all; its
#    own CSP says `connect-src 'none'`. An `Access-Control-Allow-Origin` header
#    here would grant other origins the right to read this page's responses in
#    exchange for nothing. The correct CORS policy for this app is the absence
#    of one, and the cross-origin isolation headers below are the opposite of
#    permissive: they say "nobody embeds this, nobody reads this cross-origin".
# ---------------------------------------------------------------------------

server {
    # The unprivileged image runs as uid 101 and cannot bind below 1024.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version in responses or error pages.
    server_tokens off;

    # One file, ~1.2 MB, mostly base64. Nothing is uploaded, ever.
    client_max_body_size 1k;
    client_body_buffer_size 1k;

    # Slow-loris and resource guards. A static file server needs no patience.
    client_body_timeout   5s;
    client_header_timeout 5s;
    send_timeout          10s;
    keepalive_timeout     15s;

    # The base64 module compresses well. gzip_static would be better but needs
    # a build step; this is the cheap version.
    gzip             on;
    gzip_types       text/html;
    gzip_min_length  1024;
    # gzip + a secret + an attacker-chosen input is BREACH. None of the three
    # applies here — the response is one static public file with no per-request
    # content and no cookies — but the reasoning is written down rather than
    # assumed, because the day this serves anything per-user it stops being true.

    # ---- GET and HEAD only. Everything else is 405, before any handler. ----
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        limit_except GET HEAD { deny all; }

        try_files /index.html =404;
        autoindex off;

        # --- the one CSP directive a meta tag cannot carry (see note 1) ---
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # --- clickjacking, for browsers older than frame-ancestors ---
        add_header X-Frame-Options "DENY" always;

        # --- never let the browser guess a type it was told ---
        add_header X-Content-Type-Options "nosniff" always;

        # --- the page sets this in a meta tag too; harmless to agree ---
        add_header Referrer-Policy "no-referrer" always;

        # --- cross-origin isolation: not embeddable, not readable elsewhere ---
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;

        # --- a config tool needs no device permissions. Turn them all off. ---
        add_header Permissions-Policy
            "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
            always;

        # --- revalidate: the artifact changes on every build, and a stale
        #     cached copy of a security tool is its own small hazard ---
        add_header Cache-Control "no-cache, must-revalidate" always;
        etag on;
    }

    # Dotfiles, and anything else that is not the one file. Belt and braces:
    # the web root holds exactly one file, so this should be unreachable.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deliberately NO `error_page ... /index.html`. Mapping errors onto the app
    # would answer a rejected POST with 200 and a copy of Fathom, which turns
    # the 405 above into decoration. `server_tokens off` already strips the
    # version from the default error pages, which is the part that mattered.
}
