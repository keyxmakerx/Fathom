# schema/schema.yaml — the file the product is generated from (ADR-0008; grammar: docs/60-content/62-schema-spec.md).
# Content: 11-ir-schema.md (config layer) and 19-service-and-physical-model.md (physical + service layers).
# 62 wins on form, 11/19 win on content; every site where they strain against each other carries a comment.
# Top-level key order is fixed and validated (62 §2.3). New declarations are appended to their block.

schema:
  version: "0.2"    # 0.1 was one minor bump from an empty baseline (19 §7.5, 62 §16.1 — 62's
                    # "3.2" is explicitly illustrative). 0.2 adds physical placement
                    # (ADR-0035), priced against 62 §16.2's table item by item: one new node
                    # kind (Rack, minor), two new edge kinds (HasRack, MountedIn, minor),
                    # seven new fields all optional-or-on-a-new-declarer (minor), zero
                    # removals, zero retypes, zero reordered tuples, no containment
                    # restructured — MountedIn is a reference, so no existing kind's owner
                    # changes. Whole change = MINOR.

scalars:
  # ---- 11 §4.3 catalogue, bound row for row (62 §3.2). Meanings are 11's; impl paths are the
  # ---- binding targets codegen checks (schema.scalar.unbound).
  - { name: Ip4Addr,            impl: fathom_ir::scalar::Ip4Addr }
  - { name: Ip6Addr,            impl: fathom_ir::scalar::Ip6Addr }
  - { name: IpAddr,             impl: fathom_ir::scalar::IpAddr }
  - { name: IpPrefix,           impl: fathom_ir::scalar::IpPrefix }
  - { name: InterfaceAddress,   impl: fathom_ir::scalar::InterfaceAddress }
  - { name: IpRange,            impl: fathom_ir::scalar::IpRange }
  - { name: MacAddress,         impl: fathom_ir::scalar::MacAddress }
  - { name: IpProtocol,         impl: fathom_ir::scalar::IpProtocol }
  - { name: L4Port,             impl: fathom_ir::scalar::L4Port }
  - { name: PortRange,          impl: fathom_ir::scalar::PortRange }
  - { name: VlanId,             impl: fathom_ir::scalar::VlanId }
  - { name: Asn,                impl: fathom_ir::scalar::Asn }
  - { name: Seconds,            impl: fathom_ir::scalar::Seconds }
  - { name: Kilobytes,          impl: fathom_ir::scalar::Kilobytes }
  - { name: DhGroup,            impl: fathom_ir::scalar::DhGroup }
  - { name: EncryptionAlgorithm, impl: fathom_ir::scalar::EncryptionAlgorithm }
  - { name: IntegrityAlgorithm, impl: fathom_ir::scalar::IntegrityAlgorithm }
  - { name: AuthMethod,         impl: fathom_ir::scalar::AuthMethod }
  - { name: IkeVersion,         impl: fathom_ir::scalar::IkeVersion }
  - { name: Identifier,         impl: fathom_ir::scalar::Identifier }
  - { name: InterfaceName,      impl: fathom_ir::scalar::InterfaceName }
  - { name: OsVersion,          impl: fathom_ir::scalar::OsVersion }
  - { name: Timestamp,          impl: fathom_ir::scalar::Timestamp }
  - { name: Fqdn,               impl: fathom_ir::scalar::Fqdn }
  - { name: RouteDistinguisher, impl: fathom_ir::scalar::RouteDistinguisher }
  - { name: SecretPlaceholder,  impl: fathom_ir::scalar::SecretPlaceholder }
  - { name: Text,               impl: fathom_ir::scalar::Text }
  # NOTE (form vs content): 11 §4.3 catalogues Mtu and IkeId as semantic scalars; 62 §3.1 row 3
  # lists both among the structured value types (Mtu is a struct {bytes, layer} per 11 §4.4;
  # IkeId is a tagged union). 62's binding form is followed; the divergence is a defect to file
  # per 62 §1's precedence rule.
  - { name: Mtu,                impl: fathom_ir::value::Mtu,            structured: true }
  - { name: IkeId,              impl: fathom_ir::value::IkeId,          structured: true }
  # ---- 62 §3.1's remaining structured value types.
  - { name: PeerSpec,           impl: fathom_ir::value::PeerSpec,       structured: true }
  - { name: Dpd,                impl: fathom_ir::value::Dpd,            structured: true }
  - { name: PostalAddress,      impl: fathom_ir::value::PostalAddress,  structured: true }
  - { name: AttrValue,          impl: fathom_ir::value::AttrValue,      structured: true }
  - { name: NameConformance,    impl: fathom_ir::value::NameConformance, structured: true }
  # ---- The five new scalars 62 §3.3 defines (transcription candidates for 11 §4.3,
  # ---- 62 §24 Disagreement 1). PostalAddress and AttrValue are above.
  - { name: Date,               impl: fathom_ir::scalar::Date }
  - { name: LatLon,             impl: fathom_ir::scalar::LatLon }
  # VERIFY: Clli accepted lengths (8-char site prefix vs 11-char full code) — 62 §3.3's own
  # marker; charset-and-length validation only until confirmed.
  - { name: Clli,               impl: fathom_ir::scalar::Clli }
  # ---- The known holes 62 §3.4 closes (PolicyAction and HostService are schema enums and live
  # ---- under schema/enums/; aggregate_device_count / reth_count are Device fields below).
  - { name: Bandwidth,          impl: fathom_ir::scalar::Bandwidth }
  - { name: TzName,             impl: fathom_ir::scalar::TzName }
  - { name: PlatformId,         impl: fathom_ir::scalar::PlatformId }
  - { name: InferenceRuleId,    impl: fathom_ir::scalar::InferenceRuleId }
  - { name: RouteTarget,        impl: fathom_ir::scalar::RouteTarget }
  # ---- Bindings used as field types by 11 §6 / 19 §§3-6 but present in no scalar catalogue.
  # VERIFY: none of the following appears in 11 §4.3 or 62 §3; each is used as a type by a field
  # table (shape given in the citing section where one is given). Declared structured — no vendor
  # round-trip is stated for any of them. Confirm classification at 11's next catalogue edit.
  - { name: NextHop,            impl: fathom_ir::value::NextHop,        structured: true, contains_reference: true }
      # 11 §6.5 — the registered NodeId exception
  - { name: QualifiedNextHop,   impl: fathom_ir::value::QualifiedNextHop, structured: true, contains_reference: true }
      # 11 §6.5 StaticRoute.qualified: [(NextHop, preference, metric)]
  - { name: NodePriority,       impl: fathom_ir::value::NodePriority,   structured: true }
      # 11 §6.3 RedundancyGroup.node_priority: [(member_index, u8)]
  - { name: OspfArea,           impl: fathom_ir::value::OspfArea,       structured: true }
  - { name: OspfAreaId,         impl: fathom_ir::scalar::OspfAreaId }
  - { name: PolicyScope,        impl: fathom_ir::value::PolicyScope,    structured: true, contains_reference: true }
      # 11 §6.6 — carries zone/unit NodeIds, registered like NextHop
  - { name: AddressValue,       impl: fathom_ir::value::AddressValue,   structured: true }
  - { name: L4Spec,             impl: fathom_ir::value::L4Spec,         structured: true }
  - { name: NatScope,           impl: fathom_ir::value::NatScope,       structured: true, contains_reference: true }
      # 11 §6.6 — Zone/Interface/RoutingInstance NodeIds
  - { name: NatAction,          impl: fathom_ir::value::NatAction,      structured: true }
  - { name: VpnMonitor,         impl: fathom_ir::value::VpnMonitor,     structured: true, contains_reference: true }
      # 11 §6.7 — source_interface: NodeId
  - { name: PortPosition,       impl: fathom_ir::value::PortPosition,   structured: true }
  - { name: Transceiver,        impl: fathom_ir::value::Transceiver,    structured: true }
  - { name: SplitRatio,         impl: fathom_ir::value::SplitRatio,     structured: true }
  - { name: EndpointCardinality, impl: fathom_ir::value::EndpointCardinality, structured: true }
      # 19 §4.3 { min: u8, max: Option<u8> }
  - { name: AttributeDecl,      impl: fathom_ir::value::AttributeDecl,  structured: true }
  - { name: FieldPath,          impl: fathom_ir::value::FieldPath,      structured: true }
  - { name: Resolution,         impl: fathom_ir::value::Resolution,     structured: true }
      # 19 §6.6 — derived-only; never serialised (62 §11)
  - { name: SyslogHost,         impl: fathom_ir::value::SyslogHost,     structured: true }
      # VERIFY: 11 §6.8 writes SyslogTarget.host: IpAddr|Fqdn — a union 62 §4.3's type grammar
      # cannot spell; a tagged structured value in the PeerSpec shape is assumed here.

classes:
  - class: InterfaceLike
    members: [Interface, AggregateInterface, RethInterface, TunnelInterface]
    doc: Anything a LogicalUnit can be contained by and an endpoint can attach to.
  - class: MultiMemberInterface
    members: [AggregateInterface, RethInterface]
    doc: |
      Cross-vendor rules address this, never the kinds — 11 §12.1's reth/LAG split.
  - class: PortHost
    members: [Chassis, PassiveNode]
    doc: The two owners of PhysicalPort. 19 §3.3, carried per 19 §7.4 row 5.

kinds:
  # Identity tuples are transcribed only where 11 §10.3 or 19 states them. Kinds for which no
  # source document states a tuple carry `identity: []` with the reason in doc, per 62 §4.2 —
  # inventing a natural key here would be the defect, not the gap.

  # ======================= config layer — 11 §6.3 organisational and device =======================
  - kind: Site
    layer: config
    emits: true          # stays emits: true because Site.timezone is Emit O (62 §4.2)
    doc: |
      Organisational grouping of devices and external peers (11 §6.3). Contains Device and
      ExternalPeer; a Tunnel spans sites and is contained by the workspace root.
    fields:
      - { name: name,        type: Text,       card: "1",    emit: "—", doc: Display name. }
      - { name: code,        type: Identifier, card: "0..1", emit: "—", doc: Short code used in generated object names. }
      - { name: address,     type: Text,       card: "0..1", emit: "—", doc: Free prose. }
      - { name: timezone,    type: TzName,     card: "0..1", emit: O, doc: Feeds NTP/logging emit. }
      - { name: criticality, type: "enum { core, branch, lab, dc }", card: "0..1", emit: "—", doc: "Used by rule severity weighting, not by emit." }
    # Two tiers, most specific first, matching the two `SiteList` claims below.
    # `code` is the strong key — it is what generated object names are built from
    # (19 §8), so a workspace that uses naming already keeps it unique. `name` is
    # card 1 and therefore always usable, which is what makes tier 2 a fallback
    # rather than a second strong key: two sites may legitimately share a display
    # name, and re-identification is ordered, so tier 2 is only reached when no
    # code matched.
    identity:
      - [ code ]
      - [ name ]

  - kind: Device
    layer: config
    emits: true
    doc: |
      The unit that a configuration file is a configuration file of (11 §6.3). An SRX chassis
      cluster is one Device with two Chassis, because it has one config.
    fields:
      - { name: hostname,   type: Identifier, card: "1", emit: R }
      - { name: platform,   type: PlatformId, card: "1", emit: R, doc: "junos-srx, panos, ios-xe. Not \"vendor\". FK into schema/platforms.yaml." }
      - { name: os_version, type: OsVersion,  card: "0..1", emit: "—", doc: Drives every rule versions predicate (11 §4.7). }
      - { name: role, type: "enum { firewall, router, switch, load_balancer, other }", card: "0..1", emit: "—" }
      - { name: domain_name, type: Fqdn, card: "0..1", emit: O, doc: Batfish Domain_Name. }
      - { name: management_address, type: IpAddr, card: "0..1", emit: "—", doc: Inventory only. Never used to reach the device (invariant 2). }
      - { name: cluster_id, type: u16, card: "0..1", emit: "R*", emit_required_when: { platforms: [junos-srx] }, doc: junos-srx chassis cluster only. }
          # VERIFY: 11 §6.3 scopes R* to "junos-srx chassis cluster only"; the cluster-only half
          # of the predicate is not stated in 62 §12.3's grammar terms.
      - { name: default_cross_zone_action, type: enum(policy_action), card: "0..1", emit: "—", doc: "Batfish. Almost always Default(deny) — a provenance state, not a variant (62 §3.4)." }
      - { name: default_inbound_action, type: enum(policy_action), card: "0..1", emit: "—", doc: Batfish. }
      - name: aggregate_device_count
        type: u16
        card: "0..1"
        emit: "R*"
        emit_required_when: { platforms: ["junos-*"], when: "exists(AggregateInterface within Device)" }
        doc: |
          set chassis aggregated-devices ethernet device-count N. 62 §3.4 / 82 §15 — required
          when the device owns at least one AggregateInterface. Paired with reth_count.
      - name: reth_count
        type: u16
        card: "0..1"
        emit: "R*"
        emit_required_when: { platforms: [junos-srx], when: "exists(RethInterface within Device)" }
        doc: set chassis cluster reth-count N. 62 §3.4 / 82 §15's first hard stop.
      - name: name_conformance
        type: NameConformance
        card: "1"
        emit: "—"
        derived: { fn: derive.device.name-conformance, depends_on: [hostname, platform] }
        doc: |
          19 §8.3 — { state: enum(conformance_state), reason: Text? } per 62 §11.2. Evaluated
          against the active Policy naming scheme.
          VERIFY: the derive fn name and the full depends_on (19 §8.3 says it includes the
          traversal to Premises via Site) are not stated as declarations anywhere; the read
          set above is the minimum the prose names and is certainly incomplete.
    # The root of re-identification. `11` §10.4's algorithm takes a capture that
    # already names its device — it maps a re-parse onto the objects *inside* a
    # known box. Which box a fresh paste belongs to was the one question that
    # algorithm never answered, and without it a second paste of the same SRX
    # makes a second Device (WO-09's `apply_new_device` says so in its name).
    #
    # Tier 1 is the pair a config actually carries. `hostname` is card 1, so a
    # parsed Device always has it, and `platform` is stamped by whichever
    # dictionary read the capture — so tier 1 is always usable, which no other
    # candidate here is. It is deliberately the pair and not `hostname` alone: a
    # `core-01` SRX and a `core-01` Nexus are two boxes.
    #
    # Tier 2 survives a rename, the same role tier 2 plays for `IkeGateway`.
    # It is usable far less often — `management_address` is `0..1` and no
    # junos-srx dictionary entry populates it today — and that is the honest
    # state, not a defect to paper over: a renamed box with no recorded
    # management address is not re-identifiable from its text, and the answer
    # there is to ask the operator, never to match on something weaker.
    #
    # What this does NOT do: decide the collision UX. Two real boxes may share a
    # hostname and a platform, and a match is a proposal to a human, not an
    # automatic merge (`70` §14).
    identity:
      - [ hostname, platform ]
      - [ platform, management_address ]

  - kind: Chassis
    layer: config
    emits: true
    doc: One physical box of a Device (11 §6.3). Standalone boxes have one.
    fields:
      - { name: member_index, type: u8, card: "1", emit: "R*", emit_required_when: { platforms: [] }, doc: Junos node0/node1; VC member id. }
          # VERIFY: R* platform set unstated in 11 §6.3 (the note names Junos forms only);
          # platforms: [] carries the unstated set — the RoutingInstance.route_distinguisher
          # spelling, required by 62 §4.3's iff-rule.
      - { name: model,  type: Identifier, card: "0..1", emit: "—", doc: SRX345. }
      - { name: serial, type: Identifier, card: "0..1", emit: "—", doc: Inventory. Sensitive-ish; never leaves the workspace. }
      - { name: slots,  type: u8, card: "0..1", emit: "—", doc: "FPC count, for interface-name validation." }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for Chassis.

  - kind: RedundancyGroup
    layer: config
    emits: true
    doc: |
      Junos chassis-cluster redundancy group, owned by Device — both nodes share one
      configuration, so the RG is a property of the config, not of a box (11 §6.3).
    fields:
      - { name: number, type: u8, card: "1", emit: R, doc: RG0 is the routing-engine group; RG1+ carry interfaces. }
      - { name: node_priority, type: NodePriority, card: "0..n", emit: "R*", emit_required_when: { platforms: [] } }
          # VERIFY: R* platform set unstated in 11 §6.3; platforms: [] carries the unstated set
          # (the RoutingInstance.route_distinguisher spelling), per 62 §4.3's iff-rule.
      - { name: preempt, type: bool, card: "0..1", emit: O }
      - { name: hold_down_interval, type: Seconds, card: "0..1", emit: O }
          # VERIFY: 11 §6.3's own marker — exact Junos statement names and defaults for
          # hold-down-interval and gratuitous-arp-count on current SRX releases.
      - { name: gratuitous_arp_count, type: u8, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for RedundancyGroup.

  - kind: ExternalPeer
    layer: config
    emits: false    # VERIFY: kind-level flag unstated; every field is Emit "—" in 11 §6.3
                    # ("the far end you do not model"), so false is the conservative reading.
    doc: |
      The far end you do not model (11 §6.3). Required by partiality — a Tunnel with one
      modelled side is the normal case, not an error. Also the physical horizon terminal
      (19 §3.4.1) and a path terminal (19 §5.2).
    fields:
      - { name: label,   type: Text,   card: "1",    emit: "—", doc: "\"Site B\", \"AWS eu-west-1 VGW\"." }
      - { name: address, type: IpAddr, card: "0..1", emit: "—", doc: The peer address as we see it. }
      - { name: organisation, type: Text, card: "0..1", emit: "—" }
      - { name: contact,      type: Text, card: "0..1", emit: "—" }
      - { name: platform_guess, type: PlatformId, card: "0..1", emit: "—", doc: Origin::Inferred from IKE behaviour or what the user said. Drives interop rules only. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for ExternalPeer.

  # ======================= config layer — 11 §6.4 interface kinds =======================
  - kind: Interface
    layer: config
    emits: true
    doc: |
      A physical-port configuration object (11 §6.4; 19 §3.1 — the hardware census lives on
      PhysicalPort, reached through Occupies). Loopbacks and IRBs are form discriminants,
      not kinds (11 §6.1).
    fields:
      - { name: name, type: InterfaceName, card: "1", emit: R, comparator: parsed_then_raw, doc: "ge-0/0/0. parsed wins on comparison, raw wins on emit (11 §4.6)." }
      - { name: form, type: "enum { ethernet, serial, loopback, management, irb }", card: "1", emit: "—", doc: "Discriminant, not a kind (11 §6.1)." }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: admin_up, type: bool, card: "0..1", emit: O, doc: Junos emits the negative (disable); the emitter owns that inversion. }
      - { name: mtu, type: Mtu, card: "0..1", emit: O, doc: L2Frame-layer by schema constraint (11 §4.4). }
      - { name: speed, type: Bandwidth, card: "0..1", emit: O, doc: The configured rate — a different fact from PhysicalPort.speed_max (19 §3.3). }
      - { name: duplex, type: "enum { full, half, auto }", card: "0..1", emit: O }
      - { name: flow_control, type: bool, card: "0..1", emit: O }
      - { name: vlan_tagging, type: bool, card: "0..1", emit: "R*", emit_required_when: { platforms: ["junos-*"] }, doc: Required on Junos before a unit may carry a VLAN id. }
          # VERIFY: the unit-carries-a-vlan half of the predicate is not stated in 62 §12.3 terms.
    identity:
      - [ owner(Device), name.parsed ]
      - [ owner(Device), name.raw ]

  - kind: AggregateInterface
    layer: config
    emits: true
    doc: |
      LAG — ae on Junos, port-channel on IOS, bond on Linux (11 §6.4). One kind with
      per-platform naming. Junos emit requires the sibling Device.aggregate_device_count
      (emission: emit.junos.aggregate-device-count).
    fields:
      - { name: name, type: InterfaceName, card: "1", emit: R }
      - { name: lacp_mode, type: enum(lacp_mode), card: "0..1", emit: O }
      - { name: lacp_periodic, type: "enum { fast, slow }", card: "0..1", emit: O }
      - { name: minimum_links, type: u8, card: "0..1", emit: O }
      - { name: link_speed, type: Bandwidth, card: "0..1", emit: "R*", emit_required_when: { platforms: ["junos-*"] }, doc: Junos aggregated-ether-options link-speed. }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: admin_up, type: bool, card: "0..1", emit: O }
      - { name: mtu, type: Mtu, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for AggregateInterface.

  - kind: RethInterface
    layer: config
    emits: true
    doc: |
      Junos chassis-cluster redundant Ethernet (11 §6.4). Not a LAG — members are on
      different chassis, one forwarding at a time. The required InRedundancyGroup edge is
      what earns the kind.
    fields:
      - { name: name, type: InterfaceName, card: "1", emit: R, doc: reth0. }
      - { name: minimum_links, type: u8, card: "0..1", emit: O }
      - { name: lacp_mode, type: enum(lacp_mode), card: "0..1", emit: O, doc: reth can run LACP across the cluster on supported releases. }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: admin_up, type: bool, card: "0..1", emit: O }
      - { name: mtu, type: Mtu, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for RethInterface.

  - kind: TunnelInterface
    layer: config
    emits: true
    doc: |
      st0 on SRX, Tunnel0 on IOS, tunnel.1 on PAN-OS (11 §6.4). No speed, no duplex,
      no media — that absence is the reason it is a kind.
    fields:
      - { name: name, type: InterfaceName, card: "1", emit: R, doc: st0. }
      - { name: technology, type: "enum { ipsec_vti, gre, gre_over_ipsec, vxlan, other }", card: "1", emit: "—", doc: Determines which rules apply. }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: admin_up, type: bool, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for TunnelInterface.

  - kind: LogicalUnit
    layer: config
    emits: true
    doc: |
      The Junos unit / the Cisco sub-interface (11 §6.4). Contained by any InterfaceLike.
      st0.0 is rendered from (TunnelInterface st0, index 0), never stored joined (11 §4.6).
    fields:
      - { name: index, type: u32, card: "1", emit: R }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: vlan_id, type: VlanId, card: "0..1", emit: "R*", emit_required_when: { platforms: ["junos-*"] }, doc: Junos vlan-id on a tagged unit. }
          # VERIFY: the tagged-unit half of the predicate is not stated in 62 §12.3 terms.
      - { name: families, type: "set{family}", card: "0..n", emit: R, doc: At least one family is required for the unit to carry an address. }
      - { name: family_mtu, type: "map(Family, Mtu)", card: "0..n", emit: O, doc: set interfaces st0 unit 0 family inet mtu 1400. L3Payload-layer (11 §4.4). }
          # NOTE (form vs content): 62 §4.3 states map keys are Identifier; 11 §6.4 keys this
          # map by Family. 11 wins on content; the grammar mismatch is a defect to file.
      - { name: encapsulation, type: Identifier, card: "0..1", emit: O }
      - { name: admin_up, type: bool, card: "0..1", emit: O }
    identity:
      - [ owner(InterfaceLike), index ]

  - kind: Address
    layer: config
    emits: true
    doc: An IP address on a LogicalUnit (11 §6.4). Not a postal address — that is Premises.
    fields:
      - { name: value, type: InterfaceAddress, card: "1", emit: R, doc: 10.255.0.1/30 — host bits preserved (11 §4.3). }
      - { name: family, type: "enum { inet, inet6 }", card: "1", emit: R, doc: Derivable from value; stored because an Unknown value still has a known family. }
      - { name: is_primary, type: bool, card: "0..1", emit: O }
      - { name: is_preferred, type: bool, card: "0..1", emit: O, doc: Junos distinguishes these; most platforms do not. }
      - { name: vrrp_group, type: u8, card: "0..1", emit: O, doc: Batfish VRRP_Groups. }
    identity:
      - [ owner(LogicalUnit), value ]

  - kind: Vlan
    layer: config
    emits: true
    doc: A VLAN on a Device (11 §6.4).
    fields:
      - { name: vlan_id, type: VlanId, card: "1", emit: R }
      - { name: name, type: Identifier, card: "0..1", emit: "R*", emit_required_when: { platforms: ["junos-*"] }, doc: Junos names VLANs; IOS numbers them. }
          # VERIFY: R* platform set inferred from "Junos names VLANs"; not stated as a set.
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for Vlan.

  # ======================= config layer — 11 §6.5 routing kinds =======================
  - kind: RoutingInstance
    layer: config
    emits: true
    doc: |
      The neutral core of Junos instance-type / Cisco vrf / PAN virtual router (11 §6.5,
      §12.3). The default instance is modelled explicitly, not as None.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: isolation, type: "enum { routing_table_only, l3_vpn, l2_bridge, forwarding, non_forwarding }", card: "1", emit: R }
      - { name: router_id, type: Ip4Addr, card: "0..1", emit: O }
      - { name: route_distinguisher, type: RouteDistinguisher, card: "0..1", emit: "R*", emit_required_when: { platforms: [], when: "isolation == L3Vpn" }, doc: L3Vpn only (11 §6.5). }
          # VERIFY: platform set unstated (empty = the predicate alone governs — a reading 62
          # §4.3 does not pin down).
      - { name: vrf_import, type: Identifier, card: "0..n", emit: "R*", emit_required_when: { platforms: [], when: "isolation == L3Vpn" }, doc: "Policy names, resolved to RoutingPolicy nodes when those exist." }
          # VERIFY: 11 marks R* with no platform or predicate; L3Vpn is inferred from the
          # route_distinguisher row.
      - { name: vrf_export, type: Identifier, card: "0..n", emit: "R*", emit_required_when: { platforms: [], when: "isolation == L3Vpn" } }
          # VERIFY: as vrf_import.
      - { name: vrf_target, type: RouteTarget, card: "0..n", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for RoutingInstance.

  - kind: StaticRoute
    layer: config
    emits: true
    doc: A static route in a RoutingInstance (11 §6.5).
    fields:
      - { name: destination, type: IpPrefix, card: "1", emit: R, doc: 10.2.0.0/16 — host bits zeroed (11 §4.3). }
      - name: next_hop
        type: NextHop
        card: "1..n"
        emit: R
        doc: |
          Address / Interface(NodeId -> LogicalUnit) / Discard / Reject / NextTable.
          The registered contains_reference exception (11 §6.5).
      - { name: preference, type: u16, card: "0..1", emit: O, doc: Junos preference; Cisco administrative distance. }
      - { name: metric, type: u32, card: "0..1", emit: O }
      - { name: resolve, type: bool, card: "0..1", emit: O }
      - { name: no_readvertise, type: bool, card: "0..1", emit: O }
      - { name: qualified, type: QualifiedNextHop, card: "0..n", emit: O, doc: Junos qualified-next-hop. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for StaticRoute.

  - kind: LearnedRoute
    layer: config
    emits: false    # VERIFY: kind-level flag unstated; 11 §6.5 says "Never emitted. Never
                    # hand-entered. Produced by inference only", so false is the conservative reading.
    doc: Inference output only (11 §6.5, §9.5). Never emitted, never hand-entered.
    fields:
      - { name: destination, type: IpPrefix, card: "1", emit: "—" }
      - { name: via, type: NodeId, card: "1", emit: "—", doc: The LogicalUnit or RoutingProtocol it resolves through. }
          # NOTE (form vs content): NodeId is not a declarable type in 62 §4.3's grammar; 11 §6.5
          # states it. Transcribed as written; a defect to file alongside MemberOfReth.chassis.
      - { name: basis, type: InferenceRuleId, card: "1", emit: "—", doc: Which heuristic produced it. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for LearnedRoute.

  - kind: RoutingProtocol
    layer: config
    emits: true
    doc: A routing protocol instance under a RoutingInstance (11 §6.5).
    fields:
      - { name: protocol, type: "enum { ospf, ospf_v3, bgp, isis, rip, ldp }", card: "1", emit: R }
      - { name: router_id, type: Ip4Addr, card: "0..1", emit: O }
      - { name: local_as, type: Asn, card: "0..1", emit: "R*", emit_required_when: { platforms: [], when: "protocol == Bgp" }, doc: BGP. }
      - { name: reference_bandwidth, type: Bandwidth, card: "0..1", emit: O, doc: Batfish OSPF property. }
      - { name: areas, type: OspfArea, card: "0..n", emit: "R*", emit_required_when: { platforms: [], when: "protocol == Ospf" }, doc: OSPF. }
          # VERIFY: whether OspfV3 also requires areas is unstated in 11 §6.5.
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for RoutingProtocol.

  - kind: ProtocolAdjacency
    layer: config
    emits: true
    doc: A neighbour/adjacency under a RoutingProtocol (11 §6.5).
    fields:
      - { name: peer_address, type: IpAddr, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: BGP neighbour. }
          # VERIFY: the BGP-only predicate reads the owning RoutingProtocol.protocol, which 62
          # §12.3's path grammar (edge-hop only, no owner hop) cannot spell; platforms: []
          # carries the declarable half per 62 §4.3's iff-rule, the predicate stays undeclared.
      - { name: peer_as, type: Asn, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: BGP. }
          # VERIFY: as peer_address.
      - { name: local_address, type: IpAddr, card: "0..1", emit: O }
      - { name: area, type: OspfAreaId, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: OSPF interface adjacency. }
          # VERIFY: as peer_address (OSPF-only, owner-hop predicate).
      - { name: cost, type: u32, card: "0..1", emit: O, doc: Batfish OSPF_Cost. }
      - { name: network_type, type: "enum { broadcast, point_to_point, non_broadcast, p2mp }", card: "0..1", emit: O, doc: Batfish OSPF_Network_Type. }
      - { name: import_policy, type: Identifier, card: "0..n", emit: O }
      - { name: export_policy, type: Identifier, card: "0..n", emit: O }
      - { name: route_reflector_client, type: bool, card: "0..1", emit: O }
      - { name: passive, type: bool, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for ProtocolAdjacency.

  # ======================= config layer — 11 §6.6 security-policy kinds =======================
  - kind: Zone
    layer: config
    emits: true
    doc: A security zone (11 §6.6). Per-interface host-inbound lives on the ZoneMember edge.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: "WAN, VPN, TRUST." }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: host_inbound_system_services, type: "set{host_service}", card: "0..n", emit: O, doc: Zone-wide; the per-interface form lives on the edge (11 §7.5). }
      - { name: host_inbound_protocols, type: "set{host_protocol}", card: "0..n", emit: O, doc: "ospf, bgp, bfd." }
      - { name: screen, type: Identifier, card: "0..1", emit: O, doc: "Reference to a screen profile, unmodelled for now (11 §12.4 bag)." }
      - { name: application_tracking, type: bool, card: "0..1", emit: O }
      - { name: tcp_rst, type: bool, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for Zone.

  - kind: PolicySet
    layer: config
    emits: true
    doc: |
      The ordered container that absorbs the deepest cross-vendor break (11 §6.6, §12.2):
      Junos zone-pair lists, PAN one global list.
    fields:
      - { name: scope, type: PolicyScope, card: "1", emit: R, doc: ZonePair / InterfaceDirection / Global / Vsys. Registered contains_reference. }
      - { name: evaluation, type: "enum { first_match, first_match_global }", card: "1", emit: "—" }
      - { name: default_action, type: enum(policy_action), card: "0..1", emit: "—", doc: "Batfish Default_Cross_Zone_Action, per set." }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for PolicySet.

  - kind: SecurityPolicy
    layer: config
    emits: true
    doc: One security policy within a PolicySet (11 §6.6).
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: TO-B. }
      - { name: ordinal, type: u32, card: "1", emit: R, doc: Position within the PolicySet. Gaps are legal and deliberate. }
      - { name: action, type: enum(policy_action), card: "1", emit: R }
      - { name: match_any_source, type: bool, card: "0..1", emit: R, doc: Set(true) means the vendor's any keyword — distinct from an everything-set. }
      - { name: match_any_destination, type: bool, card: "0..1", emit: R }
      - { name: log_init, type: bool, card: "0..1", emit: O }
      - { name: log_close, type: bool, card: "0..1", emit: O }
      - { name: count, type: bool, card: "0..1", emit: O }
      - { name: scheduler, type: Identifier, card: "0..1", emit: O }
      - { name: description, type: Text, card: "0..1", emit: O }
      - { name: enabled, type: bool, card: "0..1", emit: O, doc: Junos deactivate / PAN disabled. }
    identity:
      - [ owner(PolicySet), name ]
      - [ owner(PolicySet), ordinal ]

  - kind: AddressObject
    layer: config
    emits: true
    doc: |
      A named address object (11 §6.6). Zone-scoped address books are the InAddressBook
      edge, not a field — the global book is simply the absence of the edge.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: value, type: AddressValue, card: "1", emit: R, doc: Prefix / Range / Dns / Wildcard. }
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for AddressObject.

  - kind: AddressSet
    layer: config
    emits: true
    doc: |
      A named set of address objects (11 §6.6). Nesting via Contains is legal; cycles are an
      L0 validity error checked on write (union-find) — the check is store-side, not a §12
      constraint declaration, because 62 §12.3's grammar cannot express acyclicity.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for AddressSet.

  - kind: Application
    layer: config
    emits: true
    doc: |
      A service/application object (11 §6.6). app_id set with l4 Unknown is emittable on
      panos and blocked on junos-srx (NoL4Equivalent) — the honest boundary of 11 §12.2.
    fields:
      - { name: l4, type: L4Spec, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: "{ protocol, source_ports, destination_ports }." }
          # VERIFY: R* platform set unstated; 11 §6.6 implies required everywhere except panos
          # when app_id is Set, which 62 §4.3's emit_required_when cannot negate. platforms: []
          # carries the declarable half per 62 §4.3's iff-rule.
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: app_id, type: Identifier, card: "0..1", emit: "R*", emit_required_when: { platforms: [panos] }, doc: PAN-OS App-ID. No Junos equivalent (11 §12.2). }
      - { name: inactivity_timeout, type: Seconds, card: "0..1", emit: O }
      - { name: alg, type: Identifier, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for Application.

  - kind: ApplicationSet
    layer: config
    emits: true
    doc: A named set of applications (11 §6.6).
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
          # VERIFY: 11 §6.6 heads "Application, ApplicationSet" but tables only Application's
          # fields; name alone is declared here rather than mirroring AddressSet's description.
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for ApplicationSet.

  - kind: NatRuleSet
    layer: config
    emits: true
    doc: A NAT rule set (11 §6.6). NAT is modelled because side 4's tunnel trap needs it.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: nat_type, type: "enum { source, destination, static }", card: "1", emit: R }
      - { name: from, type: NatScope, card: "1", emit: R, doc: Zone / Interface / RoutingInstance. Registered contains_reference. }
      - { name: to, type: NatScope, card: "0..1", emit: "R*", emit_required_when: { platforms: [], when: "nat_type == Source" }, doc: Source NAT only. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for NatRuleSet.

  - kind: NatRule
    layer: config
    emits: true
    doc: One NAT rule (11 §6.6). NatAction::Off is the explicit no-NAT rule.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R }
      - { name: ordinal, type: u32, card: "1", emit: R }
      - { name: match_source, type: IpPrefix, card: "0..n", emit: O }
      - { name: match_destination, type: IpPrefix, card: "0..n", emit: O }
      - { name: then, type: NatAction, card: "1", emit: R, doc: Interface / Pool / Off / Static. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for NatRule.

  # ======================= config layer — 11 §6.7 crypto and VPN kinds =======================
  - kind: IkeProposal
    layer: config
    emits: true
    doc: IKE phase-1 proposal (11 §6.7). The AEAD constraint is declared in constraints:.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: IKE-P1. }
      - { name: authentication_method, type: AuthMethod, card: "0..1", emit: R }
      - { name: dh_group, type: DhGroup, card: "0..1", emit: R }
      - { name: encryption_algorithm, type: EncryptionAlgorithm, card: "0..1", emit: R }
      - name: authentication_algorithm
        type: IntegrityAlgorithm
        card: "0..1"
        emit: "R*"
        emit_required_when: { platforms: [], when: "encryption_algorithm.aead == false" }
        doc: |
          Must be Absent when the encryption algorithm is AEAD; with CBC both must be set —
          a missing hash is a silent proposal mismatch (11 §6.7).
        # VERIFY: 11 states the R* condition only as the AEAD note; the == false spelling is
        # this file's transcription into 62 §12.3's grammar.
      - { name: lifetime_seconds, type: Seconds, card: "0..1", emit: O, constraints: { range: { min: 180, max: 86400, platforms: ["junos-*"] } }, doc: "Default 3600; 28800 is the P1 recommendation, not the default (11 §5.3)." }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for IkeProposal.

  - kind: IkePolicy
    layer: config
    emits: true
    doc: IKE phase-1 policy (11 §6.7).
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: IKE-POL. }
      - { name: mode, type: "enum { main, aggressive }", card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: IKEv1 only; silently ignored under v2-only (11 §6.7). }
          # VERIFY: the IKEv1-only predicate reads the referencing gateway's version — a
          # cross-node direction 62 §12.3's one-edge-hop grammar cannot reach from here.
          # platforms: [] carries the declarable half per 62 §4.3's iff-rule.
      - { name: pre_shared_key, type: SecretPlaceholder, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: "11 §4.5. Emits pre-shared-key ascii-text \"<PSK>\" — a correct emit, not a blocked one." }
          # VERIFY: R* condition (pre-shared-keys auth method, held by the proposal) unstated in
          # declarable form; platforms: [] carries the declarable half per 62 §4.3's iff-rule.
      - { name: certificate_id, type: Identifier, card: "0..1", emit: "R*", emit_required_when: { platforms: [] }, doc: rsa-signatures. }
          # VERIFY: as pre_shared_key.
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for IkePolicy.

  # 62 §20.1's worked example (fields, identity, similarity), content-identical; reflowed to
  # single-line flow because §20.1's own multi-line layout violates 62 §2.2 ("flow-style
  # maps/sequences on a single line only") — a 62-internal §2.2-vs-§20 contradiction, a defect
  # to file against 62 per §1.
  - kind: IkeGateway
    layer: config
    emits: true
    doc: |
      IKE phase-1 gateway (11 §6.7). One per peer relationship.
    fields:
      - { name: name,            type: Identifier, card: "1",    emit: R }
      - { name: peer,            type: PeerSpec,   card: "0..1", emit: R, doc: Address(IpAddr) or Dynamic(IkeId) — one field with two shapes. }
      - { name: version,         type: IkeVersion, card: "0..1", emit: O }
      - { name: local_identity,  type: IkeId,      card: "0..1", emit: O }
      - { name: remote_identity, type: IkeId,      card: "0..1", emit: O }
      - { name: dpd,             type: Dpd,        card: "0..1", emit: O }
      - { name: nat_keepalive,   type: Seconds,    card: "0..1", emit: O }
      - { name: no_nat_traversal, type: bool,      card: "0..1", emit: O }
      - { name: description,     type: Text,       card: "0..1", emit: O }
    identity:
      - [ owner(Device), name ]                                    # tier 1
      - [ owner(Device), peer.address, edge(ExternalInterface) ]   # tier 2 —
                                                                   # survives rename
      - [ edge_in(TunnelEndpoint via IpsecVpn), side ]             # tier 3 —
                                                                   # survives readdressing
    similarity: { name: 4, peer.address: 3, edge(ExternalInterface): 2 }  # illustrative

  - kind: IpsecProposal
    layer: config
    emits: true
    doc: IPsec phase-2 proposal (11 §6.7).
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: IPSEC-P2. }
      - { name: protocol, type: "enum { esp, ah }", card: "0..1", emit: R, doc: AH is integrity-only and breaks through NAT. }
      - { name: encryption_algorithm, type: EncryptionAlgorithm, card: "0..1", emit: "R*", emit_required_when: { platforms: [], when: "protocol == Esp" }, doc: ESP only. }
      - { name: authentication_algorithm, type: IntegrityAlgorithm, card: "0..1", emit: "R*", emit_required_when: { platforms: [], when: "encryption_algorithm.aead == false" }, doc: Same AEAD constraint as IkeProposal. }
          # VERIFY: as IkeProposal.authentication_algorithm.
      - { name: lifetime_seconds, type: Seconds, card: "0..1", emit: O, constraints: { range: { min: 180, max: 86400, platforms: ["junos-*"] } }, doc: Default 3600. }
      - { name: lifetime_kilobytes, type: Kilobytes, card: "0..1", emit: O, doc: "If flaps track throughput rather than time, check lifetime-kilobytes first." }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for IpsecProposal.

  - kind: IpsecPolicy
    layer: config
    emits: true
    doc: IPsec phase-2 policy (11 §6.7).
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: IPSEC-POL. }
      - { name: perfect_forward_secrecy, type: DhGroup, card: "0..1", emit: O, doc: "ipsec.pfs.absent reads exactly this field and requires Absent, not Unknown, to fire." }
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for IpsecPolicy.

  - kind: IpsecVpn
    layer: config
    emits: true
    doc: |
      The VPN object binding gateway, policy and (route-based) an st0 unit (11 §6.7).
      mode determines whether BindsInterface is required or forbidden — see
      constraints: ipsec-vpn.mode-binds-interface.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: VPN-B. }
      - { name: establish_tunnels, type: enum(establish_tunnels), card: "0..1", emit: O, doc: "Default on_traffic (sourced in corpus/defaults, 11 §5.3)." }
      - { name: df_bit, type: "enum { copy, clear, set }", card: "0..1", emit: O, doc: Default copy. }
      - { name: vpn_monitor, type: VpnMonitor, card: "0..1", emit: O }
      - { name: idle_time, type: Seconds, card: "0..1", emit: O }
      - { name: mode, type: enum(vpn_mode), card: "1", emit: R }
      - { name: description, type: Text, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for IpsecVpn.

  - kind: TrafficSelector
    layer: config
    emits: true
    doc: |
      A phase-2 traffic selector (11 §6.7). Zero selectors is modelled as absence; the SRX's
      implied any-to-any is an inferred node with Origin::Inferred, distinguishable from one
      the user wrote.
    fields:
      - { name: name, type: Identifier, card: "1", emit: R, doc: TS1. }
      - { name: local_ip, type: IpPrefix, card: "1", emit: R }
      - { name: remote_ip, type: IpPrefix, card: "1", emit: R }
      - { name: protocol, type: IpProtocol, card: "0..1", emit: O }
      - { name: local_ports, type: PortRange, card: "0..n", emit: O, doc: Not expressible on every platform; blocks emit where not. }
      - { name: remote_ports, type: PortRange, card: "0..n", emit: O }
    identity:
      - [ owner(IpsecVpn), name ]
      - [ owner(IpsecVpn), local_ip, remote_ip ]

  - kind: Tunnel
    layer: config
    emits: false    # VERIFY: kind-level flag unstated; every field is Emit "—" ("this node has
                    # no vendor representation", 11 §6.7), so false is the conservative reading.
    doc: |
      The cross-device abstraction (11 §6.7). Two IpsecVpn endpoints, or one plus an
      ExternalPeer; zero IpsecVpn endpoints is a planned tunnel and is legal. The
      exactly-one-of-two-shapes rule is prose in 11 §6.7 with no declared constraint id —
      not transcribed as a constraints: entry.
    fields:
      - { name: name, type: Text, card: "1", emit: "—" }
      - { name: mode, type: enum(vpn_mode), card: "0..1", emit: "—", doc: Must agree with both endpoints. }
      - { name: intended_state, type: "enum { up, standby, decommissioned }", card: "0..1", emit: "—", doc: Drives severity — a flapping standby is not a flapping primary. }
      - { name: overlay_prefix, type: IpPrefix, card: "0..1", emit: "—", doc: "The st0 transit link, when both sides are modelled." }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for Tunnel.

  # ======================= config layer — 11 §6.8 device-level settings =======================
  - kind: SecurityFlowSettings
    layer: config
    emits: true
    doc: One per Device (11 §6.8). Exists because mtu.mss-clamp.absent needs somewhere to look.
    fields:
      - { name: tcp_mss_all_tcp, type: u16, card: "0..1", emit: O, doc: all-tcp hits everything through the box. }
      - { name: tcp_mss_ipsec_vpn, type: u16, card: "0..1", emit: O, doc: Clamps only tunnel traffic — the clean fix. }
      - { name: tcp_mss_gre_in, type: u16, card: "0..1", emit: O }
      - { name: tcp_mss_gre_out, type: u16, card: "0..1", emit: O }
      - { name: force_ip_reassembly, type: bool, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for SecurityFlowSettings.

  - kind: SystemSettings
    layer: config
    emits: true
    doc: One per Device (11 §6.8).
    fields:
      - { name: time_zone, type: TzName, card: "0..1", emit: O }
      - { name: root_authentication_set, type: bool, card: "0..1", emit: "—", doc: A fact about whether a credential exists. Never the credential (invariant 3). }
      - { name: name_servers, type: IpAddr, card: "0..n", emit: O, doc: Batfish DNS_Servers. }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for SystemSettings.

  - kind: NtpServer
    layer: config
    emits: true
    doc: |
      An NTP server target (11 §6.8). In the schema because clock skew kills certificates.
      VERIFY: 11 §6.8 gives only the struct sketch { address: IpAddr, prefer: bool,
      key_id: u32 } — every card and emit flag below is the conservative reading, not stated.
    fields:
      - { name: address, type: IpAddr, card: "1", emit: O }
      - { name: prefer, type: bool, card: "0..1", emit: O }
      - { name: key_id, type: u32, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for NtpServer.

  - kind: SyslogTarget
    layer: config
    emits: true
    doc: |
      A syslog target (11 §6.8).
      VERIFY: 11 §6.8 gives only the struct sketch { host: IpAddr|Fqdn, facility, severity,
      structured_data: bool } — facility/severity are untyped there and every card and emit
      flag below is the conservative reading, not stated.
    fields:
      - { name: host, type: SyslogHost, card: "1", emit: O }
      - { name: facility, type: Identifier, card: "0..1", emit: O }
      - { name: severity, type: Identifier, card: "0..1", emit: O }
      - { name: structured_data, type: bool, card: "0..1", emit: O }
    identity: []    # VERIFY: no identity tuple stated in 11 §10.3 for SyslogTarget.

  # ======================= physical layer — 19 §3 =======================
  - kind: PhysicalPort
    layer: physical
    emits: false
    doc: |
      A front-panel opening (19 §3.3). Contained by whatever has a faceplate — Chassis or
      PassiveNode (the PortHost class). A port exists because hardware exists; an interface
      exists because configuration exists; neither may be the other's identity (19 §3.2).
      NOTE (form vs content): 62 §4.1's declaration sketch shows position: Identifier,
      card "1"; 19 §3.3's field table (PortPosition, 0..1) is the normative content and wins.
    fields:
      - { name: label, type: Text, card: "1", emit: "—", doc: "The silkscreen: \"1\", \"PON 0/1\". Not the interface name." }
      - { name: position, type: PortPosition, card: "0..1", emit: "—", doc: "{ slot: Option<u8>, subslot: Option<u8>, index: u16 }." }
      - { name: connector, type: "enum { rj45, sfp, sfp_plus, sfp28, qsfp, qsfp28, lc, sc, mpo, f, bnc, other }", card: "0..1", emit: "—" }
      - { name: service, type: "enum { ethernet, pon, rf, serial, console, management, other }", card: "0..1", emit: "—", doc: What the cage is for. }
      - { name: speed_max, type: Bandwidth, card: "0..1", emit: "—", doc: The cage's ceiling — a different fact from Interface.speed. }
      - name: transceiver
        type: Transceiver
        card: "0..1"
        emit: "—"
        doc: |
          Absent means we looked and the cage is empty; Unknown means nobody looked. A
          catalogue-populated port is Unknown and may not be Absent (11 §8.5).
      - { name: notes, type: Text, card: "0..1", emit: "—" }
      # 62 §11.2's derived-field example, verbatim.
      - name: occupied
        type: bool
        card: "1"
        emit: "—"                          # forced; declaring anything else is an error
        derived:
          fn: derive.physicalport.occupied
          depends_on:
            - adjacency(self, Occupies, In)
        doc: True iff at least one Interface Occupies this port.
    identity:
      - [ owner(PortHost), position ]    # tier 1 — a physical coordinate
      - [ owner(PortHost), label ]       # tier 2 — the silkscreen

  - kind: Cable
    layer: physical
    emits: false
    doc: |
      A physical run between two termination points (19 §3.4). Promoted from 11 §7.3's Link
      edge. label distinguishes; assembly groups (excluded from identity). A one-ended cable
      with no label has no recovery key — if you record a planned cable, label it; the
      fewer-than-two-Terminates-and-no-label advisory lint 19 §3.4 asks of 62 §18 is not in
      62 §18.2's shipped warning table and is not invented here.
    fields:
      - { name: label, type: Text, card: "0..1", emit: "—", doc: "The tag on this cable. Unique among the cables it could be confused with, or absent." }
      - name: assembly
        type: Text
        card: "0..1"
        emit: "—"
        doc: |
          The grouping id deliberately shared — breakout assembly, multi-fibre bundle.
          Excluded from identity; grouping is a query, not a key.
      - { name: media, type: "enum { cat5e, cat6, cat6a, twinax, smf, mmf, coax, power, virtual, other }", card: "0..1", emit: "—", doc: Deliberately no unknown-shaped variant — Presence carries that (19 §3.4). }
      - { name: length_m, type: u32, card: "0..1", emit: "—" }
      - { name: installed_on, type: Date, card: "0..1", emit: "—", doc: "Stored, rendered, never evaluated (75 §4.4)." }
      - { name: ownership, type: "enum { ours, provider, customer }", card: "0..1", emit: "—", doc: Carries the modelling horizon (19 §3.4.1). }
      - { name: provider_circuit, type: Text, card: "0..1", emit: "—", doc: Free prose until Circuit exists — promotion trigger written in 19 §3.4.2. }
      - { name: notes, type: Text, card: "0..1", emit: "—" }
      - { name: last_confirmed, type: Date, card: "0..1", emit: "—", doc: "19 §6.10 — Origin::Hand only; rendered as ADR-0027's stamp, never evaluated." }
    identity:
      # NOTE (form vs content): 62 §8.1's term grammar has edge(E) with no end qualifier;
      # 19 §3.4 writes the tier with Terminates:A / Terminates:B (end field normalised by
      # NodeId order). 19's content is transcribed verbatim; the grammar gap is a defect to file.
      - [ edge(Terminates:A), edge(Terminates:B) ]   # tier 1 — the pair of ports IS the cable
      - [ label ]                                    # tier 2 — one-ended and planned cables

  - kind: PassiveNode
    layer: physical
    emits: false
    doc: |
      A splitter, ODF, patch panel, WDM mux, media converter or enclosure — hardware with
      ports and no configuration (19 §3.6). Owns PhysicalPorts exactly as a Chassis does.
      Contained by Premises, not Site.
    fields:
      - { name: label, type: Text, card: "1", emit: "—", doc: "No hostname: nothing addresses it." }
      - { name: form, type: "enum { splitter, patch_panel, odf, wdm, media_converter, enclosure, other }", card: "1", emit: "—" }
      - { name: split_ratio, type: SplitRatio, card: "0..1", emit: "—", doc: "{ inputs: u8, outputs: u16 } — 1:32." }
      - { name: model, type: Identifier, card: "0..1", emit: "—" }
      - { name: serial, type: Identifier, card: "0..1", emit: "—" }
    identity:
      - [ owner(Premises), label ]

  - kind: Premises
    layer: physical
    emits: false
    doc: |
      A place with a street address (19 §3.5). Not called Address — that kind is an IP
      address. Enrichment is closed permanently: no geocoding, no lookup; coordinates are
      user-typed only. One kind serves a central office and a customer location.
    fields:
      - { name: label, type: Text, card: "1", emit: "—", doc: "Riverside CO, 412 Oak St." }
      - { name: street, type: PostalAddress, card: "0..1", emit: "—", doc: "Structured value type, not a Scalar (62 §3.1). Personal-data channel — 37 §2.2." }
      - { name: clli, type: Clli, card: "0..1", emit: "—" }
      - { name: form, type: "enum { central_office, hut, cabinet, headend, data_centre, customer_premises, pole, handhole, other }", card: "0..1", emit: "—" }
      - { name: region, type: Identifier, card: "0..1", emit: "—", doc: "The {ST} candidate under one reading (19 §10 F2)." }
      - { name: coordinates, type: LatLon, card: "0..1", emit: "—", doc: "User-typed only. Never looked up. Fixed-point, never float (62 §3.3)." }
      - { name: notes, type: Text, card: "0..1", emit: "—" }
    identity:
      - [ clli ]        # tier 1 — globally unique, machine-assigned
      - [ street ]      # tier 2 — via canonical()
      - [ label ]       # tier 3

  # ======================= service layer — 19 §4 and §6 =======================
  - kind: Tenant
    layer: service
    emits: false
    doc: |
      Contains services and nothing physical (19 §4.1) — tenancy of infrastructure is never
      asserted, so it can never drift. The operator is a Tenant; a workspace is seeded with
      exactly one Tenant { kind: internal } at creation, making containment total.
    fields:
      - { name: name, type: Text, card: "1", emit: "—" }
      - { name: code, type: Identifier, card: "0..1", emit: "—" }
      - { name: kind, type: "enum { customer, internal }", card: "1", emit: "—", doc: "Discriminant, not a kind (11 §6.1)." }
      - { name: account_ref, type: Identifier, card: "0..1", emit: "—" }
      - { name: contact, type: Text, card: "0..1", emit: "—" }
      - { name: description, type: Text, card: "0..1", emit: "—" }
    identity:
      - [ code ]
      - [ name ]

  # 62 §20.2's worked example, content-identical; reflowed to single-line flow per 62 §2.2
  # (§20.2's own multi-line layout is the §2.2-vs-§20 contradiction filed at IkeGateway).
  - kind: Service
    layer: service
    emits: false
    doc: One sold or internal service (19 §4.2). The type is the OfType edge.
    fields:
      - { name: cid,   type: Identifier, card: "0..1", emit: "—", fold: ascii_case, required_when: "edge(OfType).requires_cid == true", doc: "The carrier identifier. A name, never identity." }
          # L1 hole, never
          #   a refusal
      - { name: reach, type: "enum { external, internal }", card: "1", emit: "—" }
      - { name: label, type: Text, card: "0..1", emit: "—" }
      - { name: in_service_on,  type: Date, card: "0..1", emit: "—", doc: "Stored, rendered, never evaluated (75 §3.8)." }
      - { name: ceased_on,      type: Date, card: "0..1", emit: "—" }
      - { name: last_confirmed, type: Date, card: "0..1", emit: "—", doc: "Origin::Hand only. Stored, sorted, exported, never compared." }
      - { name: attributes, type: "map(Identifier, AttrValue)", card: "0..n", emit: "—", validated_against: edge(OfType) }
      - { name: description, type: Text, card: "0..1", emit: "—" }
    identity:
      - [ owner(Tenant), cid ]
      - [ owner(Tenant), label ]

  - kind: ServiceType
    layer: service
    emits: false
    doc: |
      The closed metamodel's extension point (19 §4.3): what varies is the contents of a
      declared map, not the set of declared fields. Built-ins ship as corpus declarations
      (corpus/service-types/, 62 §20.4) and are materialised at workspace creation with
      Origin::Imported { format: Corpus }; a user's edit is Origin::Hand and wins on merge.
      An AttributeDecl is never deleted, only withdrawn.
    fields:
      - { name: name, type: Text, card: "1", emit: "—" }
      - { name: code, type: Identifier, card: "1", emit: "—" }
      - { name: builtin_id, type: Identifier, card: "0..1", emit: "—", doc: Set on shipped types; Absent on user types. }
      - { name: endpoint_cardinality, type: EndpointCardinality, card: "1", emit: "—", doc: DIA 1..1; E-Line 2..2; E-LAN 2..n. }
      - { name: endpoint_identifier_required, type: bool, card: "1", emit: "—", doc: The UNI ID switch. }
      - { name: uni_scope, type: "enum { global, per_tenant, per_service }", card: "1", emit: "—", doc: Scope of the UNI-ID uniqueness rule. }
      - { name: requires_cid, type: bool, card: "1", emit: "—", doc: false for internal types. }
      - { name: attributes, type: AttributeDecl, card: "0..n", emit: "—", doc: "The extension point, closed (AttrType is a closed Rust enum, 62 §13.3)." }
      - { name: endpoint_attributes, type: AttributeDecl, card: "0..n", emit: "—", doc: Per-endpoint extension point. }
      - { name: completeness, type: FieldPath, card: "0..n", emit: "—", doc: "The 11 §9.1 L3 profile, per type." }
    identity:
      - [ builtin_id ]
      - [ code ]

  - kind: ServiceEndpoint
    layer: service
    emits: false
    doc: |
      One location of a service — E-LAN first (19 §4.4). A Demarc endpoint with no
      AttachesTo is legal and is not a hole.
    fields:
      - { name: uni_id, type: Identifier, card: "0..1", emit: "—", fold: ascii_case, doc: The per-location identifier. Absent where the type declares none; never invented. }
      - { name: role, type: "enum { uni, nni, enni, demarc }", card: "1", emit: "—", doc: Which side of the demarcation. }
      - { name: ordinal, type: u32, card: "1", emit: "—", doc: Stable display order; gaps legal (SecurityPolicy.ordinal precedent). }
      - { name: label, type: Text, card: "0..1", emit: "—" }
      - { name: in_service_on, type: Date, card: "0..1", emit: "—", doc: "Per-endpoint, because E-LAN sites turn up separately." }
      - { name: ceased_on, type: Date, card: "0..1", emit: "—" }
      - name: attributes
        type: "map(Identifier, AttrValue)"
        card: "0..n"
        emit: "—"
        doc: |
          Validated against ServiceType.endpoint_attributes (19 §4.4).
          VERIFY: the validation context is two hops away (owner(Service) then OfType);
          62 §12.2's validated_against takes a single edge of this kind, so the clause is
          not declarable here as written — a form gap to file.
    identity:
      - [ owner(Service), uni_id ]
      - [ owner(Service), ordinal ]
      - [ owner(Service), edge(AttachesTo) ]

  - kind: ServicePath
    layer: service
    emits: false
    doc: |
      A service holds ordered paths; a path holds ordered segments (19 §6.2). A Historic
      path outlives the service's current routing; ordinal keeps tier 1 non-degenerate.
    fields:
      - { name: ordinal, type: u32, card: "1", emit: "—", doc: Stable display order within the service; gaps legal. The identity discriminant. }
      - { name: role, type: "enum { working, protect, historic }", card: "1", emit: "—" }
      - { name: label, type: Text, card: "0..1", emit: "—" }
      - { name: last_confirmed, type: Date, card: "0..1", emit: "—", doc: "Origin::Hand only, never compared." }
      - { name: note, type: Text, card: "0..1", emit: "—" }
    identity:
      - [ owner(Service), ordinal ]
      - [ owner(Service), label ]

  - kind: PathSegment
    layer: service
    emits: false
    doc: |
      One claim along a path (19 §6.2). A node, not an edge — a Boundary segment has one
      endpoint. A segment names its two ports and never the cable: re-patch a cable and
      every path through it follows automatically.
    fields:
      - { name: ordinal, type: u32, card: "1", emit: "—", doc: Position along the path; gaps legal. }
      - { name: kind, type: enum(segment_kind), card: "1", emit: "—", doc: The discriminant (19 §6.3). }
      - name: boundary_reason
        type: "enum { customer_premises, third_party_carrier, not_ours, policy_stop }"
        card: "0..1"
        emit: "—"
        required_when: "kind == Boundary"
        doc: |
          19 §6.2 marks this R* when kind == Boundary; on an emits: false kind the emit
          column is forced to "—", so the conditional lands as 62 §4.3's required_when —
          an L1 hole, never a refusal. (62 §4.3 itself names this field as the example.)
      - { name: warp_technology, type: "enum { l2ptp, pseudowire, evpn, vlan, other }", card: "0..1", emit: "—", required_when: "kind == Warp", doc: Same transcription as boundary_reason — 19's R* cell as required_when. }
      - { name: max_hops, type: u8, card: "0..1", emit: "—", doc: Overrides the workspace default of 8 (19 §6.6). }
      - { name: note, type: Text, card: "0..1", emit: "—" }
      - name: resolution
        type: Resolution
        card: "0..1"
        emit: "—"
        derived:
          fn: derive.pathsegment.resolution
          depends_on:
            - adjacency(self, EntersAt, Out)
            - adjacency(self, ExitsAt, Out)
            - adjacency(self, MustTraverse, Out)
        doc: |
          19 §6.6's six-outcome enum; demand-driven and budgeted, never serialised.
          VERIFY: the derive fn name is unstated (the computation is resolve_warp /
          infer.service.warp.resolve) and card 0..1 reflects the demanded-not-yet state —
          both are conservative readings, not declarations in 19.
      - name: corroboration
        type: "enum { corroborated, unwitnessed, contradicted }"
        card: "0..1"
        emit: "—"
        derived:
          fn: derive.pathsegment.corroboration
          depends_on:
            - resolution
            - adjacency(self, EntersAt, Out)
            - adjacency(self, ExitsAt, Out)
        doc: |
          19 §6.10 — a graph function, not a clock function.
          VERIFY: fn name and exact depends_on unstated in 19; transcribed conservatively.
    identity:
      - [ owner(ServicePath), ordinal ]
      # NOTE (form vs content): EntersAt / ExitsAt carry two-level bounds (0..n at L0), and
      # 62 §8.2 prohibits identity terms through a relaxed range (schema.identity.ambiguous-edge).
      # 19 §6.2 declares this tier anyway; 19's content is transcribed and the collision is a
      # defect to file per 62 §1.
      - [ owner(ServicePath), edge(EntersAt), edge(ExitsAt) ]

  # ======================= physical placement — 19 §3.10, ADR-0035 =======================
  # Appended, never inserted (62 §2.3): declaration order is diff order and generated
  # enum order, so a new kind goes at the tail of the block.
  - kind: Rack
    layer: physical
    emits: false
    doc: |
      A frame or cabinet of 19-inch mounting positions (ADR-0035). 19 §3.10 predicted this
      kind and priced it -- "Chassis --MountedIn--> Rack later is a new kind plus a reference
      edge = minor" -- and this is that edit, paid.

      Contained by Premises, exactly as PassiveNode is and for the same reason (19 §3.6): a
      rack has no operational identity, it is only somewhere. It is deliberately NOT a Site
      (an operational grouping, layer: config) and NOT a nested Premises (which has a street
      address, a CLLI and coordinates; a rack has none of those, and 70 §10.8's own cost 3
      records that nesting Premises still would not put devices in racks).

      NOTHING PARSES A RACK. No Junos statement -- no vendor statement known to this project --
      says which rack a box is in or at what height. Every Rack and every MountedIn is
      Origin::Hand, and that is a property of the world, not a gap in the ingest dictionary.
    fields:
      - { name: label, type: Text, card: "1", emit: "—", doc: "The name stencilled on the frame: R12, AISLE-3-04. No hostname -- nothing addresses a rack." }
      - name: height_u
        type: u8
        card: "1"
        emit: "—"
        constraints:
          range: { min: 1, max: 100, platforms: [] }
        doc: |
          Capacity in rack units. One rack unit is 1.75 in / 44.45 mm under EIA-310 and
          IEC 60297 (en.wikipedia.org/wiki/Rack_unit and /wiki/19-inch_rack, both read
          2026-08-15). There is NO standard height: 42U is the industry-standard cabinet and
          42U-48U is the common range, but arbitrary heights are real and are allowed
          (netbox.readthedocs.io/en/stable/models/dcim/rack/, read 2026-08-15). So this is a
          required field with no default rather than a constant. The range is a sanity bound
          on a typo, not a claim about what racks exist.
      - name: unit_numbering
        type: "enum { ascending, descending }"
        card: "1"
        emit: "—"
        doc: |
          Which end of the frame is U1. REQUIRED, WITH NO DEFAULT, AND THAT IS THE POINT.

          ADR-0034 forbids answering this from memory, and the lookup came back split rather
          than clean. Wikipedia's rack-unit page defines the unit and is SILENT on direction
          (read 2026-08-15). NetBox issue netbox-community/netbox#191 records a real estate
          whose Knurr racks number "U01 at top of rack and U41 at rack bottom", against
          NetBox's opposite default (read 2026-08-15). NetBox ships the disagreement as a
          field: "a toggle is provided to indicate whether rack units are in ascending (from
          the ground up) or descending order" (netbox.readthedocs.io, read 2026-08-15).

          Three sources, no universal convention, so none is assumed. `ascending` means U1 is
          at the FLOOR, which is the more common convention but is not the default here --
          an elevation drawn with the wrong direction is upside down and every position in it
          is wrong while looking entirely plausible, which is precisely the silent-wrongness
          56 §0 exists to prevent. A rack whose direction nobody stated is not drawn.
      - { name: notes, type: Text, card: "0..1", emit: "—" }
    identity:
      - [ owner(Premises), label ]    # tier 1 -- a physical coordinate, PassiveNode's precedent exactly

edges:
  # reverse_index is true throughout: 12's DepKey::Adjacency and 19 §8.3's increment scope
  # require reverse adjacency, and ADR-0007's reverse index already guarantees it (11 §14.3).
  # emit_dict is null except where a dictionary entry ships (62 §19.5's sequencing: the schema
  # ships first; the dictionary grows behind the coverage ledger).

  # ---- containment, 11 §7.2 ----
  # NOTE (form vs content): 11 §7.2 and 19 §5 write "*root*" for workspace-root containment;
  # 62's grammar gives from:/to: as kind sets with no root token. `root` below is that token,
  # transcribed — a form gap to file.
  - edge: HasDevice
    class: containment
    from: [Site]
    to: [Device]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasChassis
    class: containment
    from: [Device]
    to: [Chassis]
    out: "1..n"
    in: "1"
    reverse_index: true
