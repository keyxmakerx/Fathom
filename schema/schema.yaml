    class: reference
    from: [PathSegment]
    to: [PhysicalPort, InterfaceLike, LogicalUnit]
    out: { l0: "0..n", l1: "0..1" }
    in: "0..n"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: |
      19 §5.2. Two-level bound: a concurrent write of two entry ports on one segment must
      converge rather than conflict, so the store bound relaxes and the L1 rule
      service.path.segment.multiple-entry patrols the excess (62 §6.2's requirement that the
      patrolling rule be named here).
  - edge: ExitsAt
    class: reference
    from: [PathSegment]
    to: [PhysicalPort, InterfaceLike, LogicalUnit]
    out: { l0: "0..n", l1: "0..1" }
    in: "0..n"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: |
      19 §5.2. Same two-level bound as EntersAt; patrolled by
      service.path.segment.multiple-entry. A Boundary segment deliberately leaves this unset.
  - edge: MustTraverse
    class: reference
    from: [PathSegment]
    to: [Device, PassiveNode]
    out: "0..n"
    in: "0..n"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 19 §5.2, §6.7 — constrain, never freeze; honoured by resolve_warp.

  # ======================= physical placement — ADR-0035 =======================
  - edge: HasRack
    class: containment
    from: [Premises]
    to: [Rack]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: |
      ADR-0035. A rack hangs off the place it stands in, exactly as HasPassiveNode hangs a
      splitter off one (19 §3.6). in: "1" keeps containment a forest and makes
      owner(Premises) usable as Rack's identity term.
  - edge: MountedIn
    class: reference
    from: [Chassis]
    to: [Rack]
    out: "0..1"
    in: "0..n"
    reverse_index: true
    symmetric: false
    fields:
      - name: position_u
        type: u8
        card: "1"
        emit: "—"
        constraints:
          range: { min: 1, max: 100, platforms: [] }
        doc: |
          The LOWEST-NUMBERED unit this chassis occupies -- NetBox's rule, taken deliberately
          rather than invented: "this field indicates the base rack unit in which the device
          is mounted", and a multi-U device occupies its lowest-numbered unit
          (netbox.readthedocs.io/en/stable/models/dcim/device/, read 2026-08-15).

          "Lowest-numbered" is not "nearest the floor": under descending numbering the
          lowest-numbered unit is the TOP of the occupied run. The rule is stated on the
          numbers so it means one thing under both directions of Rack.unit_numbering.
      - name: height_u
        type: u8
        card: "0..1"
        emit: "—"
        constraints:
          range: { min: 1, max: 100, platforms: [] }
        doc: |
          How many contiguous units the chassis fills. Optional: somebody who knows a box is
          at U12 but has not counted its height has said something true and useful, and
          refusing it would lose the fact. Absent renders as 1U and is MARKED as unstated --
          it is never silently assumed (19 §6's warp, 70 §16: incomplete is drawn and marked,
          never refused).
      - { name: face, type: "enum { front, rear }", card: "0..1", emit: "—", doc: "Which side the chassis is mounted on. \"If installed in a rack, this field denotes the primary face on which the device is mounted\" (netbox.readthedocs.io/en/stable/models/dcim/device/, read 2026-08-15). Optional for the same reason height_u is." }
    emit_dict: null
    doc: |
      ADR-0035. Physical placement of one box in one frame.

      A REFERENCE EDGE, AND IT HAS TO BE. Chassis already has a containment parent (Device,
      via HasChassis) and containment is a forest, so a rack cannot contain a chassis without
      taking it away from its device. 70 §10.8's cost 3 posed the fork as "either HasDevice
      widens or a rack is a Site" and both limbs are wrong, because THE THING IN THE RACK IS
      NOT THE DEVICE, IT IS THE CHASSIS: a Junos chassis cluster is one Device with two
      Chassis, and putting node0 and node1 in separate racks is the normal reason to have a
      cluster at all. A containment edge from a rack to a device cannot express that; this
      can, and it needs no widening of anything.

      The placement fields sit on the EDGE rather than on Chassis because "at U12, front" is
      a fact about the mounting, not about the box: a chassis on a shelf has no U, and moving
      one between racks should touch one relation rather than three fields on a node. Edges
      are first-class and carry typed fields (ADR-0007); Link, Terminates and Occupies already
      do.

derived_edges:
  # Contract: separate arena, never serialised, never merged, never edited; rebuilt on load
  # and after every mutation batch (11 §3.5; 62 §11). produced_by is an InferenceRuleId.
  - edge: ResolvesVia
    from: [StaticRoute]
    to: [LogicalUnit]
    produced_by: infer.route.next-hop-interface
    fields: []
    doc: |
      Matches NextHop::Interface, or NextHop::Address against a connected Address prefix
      (11 §7.6).
  - edge: SelectorCovers
    from: [TrafficSelector]
    to: [StaticRoute]
    produced_by: infer.ts.route-coverage
    fields: []
    doc: The selector's remote_ip is covered by a route pointing at the bound st0 unit (11 §7.6).
  - edge: NatOverlaps
    from: [NatRule]
    to: [TrafficSelector]
    produced_by: infer.nat.tunnel-overlap
    fields: []
    doc: Side 4's source-NAT trap (11 §7.6).
  - edge: WouldNegotiate
    from: [IpsecVpn]
    to: [IpsecVpn]
    produced_by: infer.tunnel.compat
    fields: []
    doc: The Batfish-shaped static compatibility check, only when both sides are modelled (11 §7.6).
  - edge: SharesFate
    from: [LogicalUnit]
    to: [RedundancyGroup]
    produced_by: infer.reth.fate
    fields: []
    doc: A unit on a reth inherits the RG's failover (11 §7.6).
  - edge: Cabled
    from: [Interface]
    to: [Interface, ExternalPeer]
    produced_by: infer.port.cabled-peer
    fields:
      - { name: via_passive, type: u8, card: "1", emit: "—", doc: How many PassThrough hops were walked. }
    doc: |
      11 §6.4's traversal name kept, re-classed derived (19 §3.8). DECLARED PROPERTY (19 §6.4,
      recorded here per 62 §11): Cabled has NO inference consumer — its consumers are the
      diagram, the port row's peer cell and the trace surface. A future rule reading it is a
      two-level pass and fails the loader.
  - edge: WarpResolvesVia
    from: [PathSegment]
    to: [PhysicalPort]
    produced_by: infer.service.warp.resolve
    fields:
      - { name: candidate, type: u8, card: "1", emit: "—" }
        # VERIFY: cards and emits for candidate/ordinal unstated in 19 §5.3's table.
      - { name: ordinal, type: u16, card: "1", emit: "—" }
    doc: |
      The warp's derived expansion (19 §5.3, §6.6). Named WarpResolvesVia because ResolvesVia
      is taken — the collision schema.edge.duplicate exists to catch.
  - edge: CarriedBy
    from: [Service]
    to: [Device, PassiveNode]
    produced_by: infer.service.carried-by
    fields: []
    doc: |
      Asserted EntersAt/ExitsAt/AttachesTo only — never through a resolved
      warp; one level deep per 11 §9.5 constraint 1. Under-reports across
      warps and its explainer must say so (19 §5.3).

constraints:
  - id: ike-proposal.aead-excludes-hash
    kind: IkeProposal
    level: L2
    require: "encryption_algorithm.aead == true implies authentication_algorithm is Absent"
    on_violation: block_emit
    doc: |
      11 §6.7: GCM is AEAD, so there is no separate authentication-algorithm; with CBC both
      must be set.
      NOTE (form vs content): 11 writes this as when:/require: with "is Absent or Unknown";
      62 §12.3's grammar has implies but no disjunction, so the Unknown arm is not spellable.
      11's content wins in intent; the grammar gap is a defect to file.
      VERIFY: the dropped "or Unknown" arm — as declared, an Unknown hash on an AEAD proposal
      blocks emit, which is stricter than 11 states.
  - id: ipsec-proposal.aead-excludes-hash
    kind: IpsecProposal
    level: L2
    require: "encryption_algorithm.aead == true implies authentication_algorithm is Absent"
    on_violation: block_emit
    doc: 11 §6.7 — "same AEAD constraint as IkeProposal". Same form notes as its sibling.
  - id: ipsec-vpn.mode-binds-interface
    kind: IpsecVpn
    level: L1
    require: "mode == RouteBased implies edge(BindsInterface) is Set"
    on_violation: report_hole
    doc: |
      11 §6.7: BindsInterface is required when mode == RouteBased and forbidden when
      PolicyBased.
      VERIFY: 11 states this as prose with no id or level; L1 is the conservative reading
      (a missing edge is a hole). The forbidden-when-PolicyBased half needs negation, which
      §12.3's grammar lacks, and edge(...) with no field path strains the path grammar —
      both defects to file.
  - id: occupies.same-device
    edge: Occupies
    level: L0
    require: "device_of(from) == device_of(owner(to))"
    on_violation: reject_write
    doc: |
      19 §3.7, verbatim: without this, Occupies becomes a general "this config points at that
      hardware" edge and the layer separation rots in a month.
      NOTE (form vs content): device_of() and owner(to) are not 62 §12.3 grammar productions;
      19's content is transcribed as written — a grammar gap to file.
  - id: passthrough.same-owner
    edge: PassThrough
    level: L0
    require: "owner(from) == owner(to)"
    on_violation: reject_write
    doc: 62 §12.2, verbatim (19 §5.1).
  - id: service.attributes.typed-by-oftype
    kind: Service
    field: attributes
    level: L0
    validated_against: edge(OfType)
    on_violation: reject_write
    doc: |
      19 §4.3: unknown keys and wrong-typed values are refused against the
      ServiceType reached through OfType. The field may not be written while
      that edge is absent; the error names the missing edge.
  - id: service.cid.required-when-external
    kind: Service
    level: L1
    require: "reach == External implies cid is Set"
    on_violation: report_hole
    doc: |
      62 §12.2 / 19 §4.6 — L1 rather than L0 because a service must be creatable before its
      CID is known. Surfaces as a completeness prompt.

emission:
  requires_for_emit:
    - id: emit.junos.aggregate-device-count
      platforms: ["junos-*"]
      when: "exists(AggregateInterface within Device)"
      requires: [Device.aggregate_device_count]
      on_violation: block_emit
    - id: emit.junos-srx.reth-count
      platforms: [junos-srx]
      when: "exists(RethInterface within Device)"
      requires: [Device.reth_count]
      on_violation: block_emit

matching:
  residue_guard:
    accept: 0.75        # minimum similarity for a residue match to bind
    margin: 0.15        # best must beat runner-up by this, else ambiguous → no bind
    max_residue: 4096   # when |unmatched G| × |unmatched P| exceeds this, per kind
                        # (11 §10.4 step 4), the matcher does not attempt residue
                        # matching at all; everything orphans explicitly

scopes:
  capture:
    layer_filter: config      # 19 §9.1 A1: re-identification step 1 gains the
                              # positive conjunct layer(kind(n)) == config
    absence_origin_columns:
      imported: nothing       # 19 §9.1 A2: Origin::Imported under Section/Whole
                              # scope → nothing happens. Catalogue ports do not
                              # tombstone because a config re-parse omitted them
    staleness_bands: config_only  # 19 §7.3 A3 / §3.9: 11 §8.7's wall-clock
                              # staleness bands apply only where layer == config.
                              # Without this, a catalogue port renders differently
                              # on two days and 19 §6.10's determinism argument
                              # is false
  import:
    - format: Corpus              # builtin service types, 19 §4.3.1
      kinds: [ServiceType]
      tiers: [1]                  # builtin_id only — a corpus refresh may never
                                  # re-identify a user type by code
      absence: nothing
    - format: HardwareCatalogue   # 19 §3.9
      kinds: [PhysicalPort]
      tiers: [1]
      absence: nothing
    - format: SiteList
      kinds: [Premises, Site]
      tiers: [1, 2]
      absence: nothing
    - format: TypeSet             # 19 §4.3.2's export/import
      kinds: [ServiceType]
      tiers: [1, 2]               # builtin_id, then code
      absence: nothing
    # No shipped import scope asserts `absent` in v1 (62 §9.5's DECISION);
    # declaring absence: absent is schema.scope.absent-unshipped.

naming_eligible:
  - Device.hostname                    # the anchor field a scheme may select
  - site.premises.region               # paths a `field` segment may read,
  - site.premises.clli                 # each ≤ 3 hops from the anchor kind
  - site.name
