    doc: 11 §7.2.
  - edge: HasRoutingProtocol
    class: containment
    from: [RoutingInstance]
    to: [RoutingProtocol]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasAdjacency
    class: containment
    from: [RoutingProtocol]
    to: [ProtocolAdjacency]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasZone
    class: containment
    from: [Device]
    to: [Zone]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasPolicySet
    class: containment
    from: [Device]
    to: [PolicySet]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasPolicy
    class: containment
    from: [PolicySet]
    to: [SecurityPolicy]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasAddressObject
    class: containment
    from: [Device]
    to: [AddressObject, AddressSet]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasApplication
    class: containment
    from: [Device]
    to: [Application, ApplicationSet]
    out: "0..n"
    in: "1"
    reverse_index: true
    symmetric: false
    fields: []
    emit_dict: null
    doc: 11 §7.2.
  - edge: HasNatRuleSet
    class: containment
    from: [Device]
    to: [NatRuleSet]
    out: "0..n"
    in: "1"
