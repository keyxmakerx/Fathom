# schema/platforms.yaml — the platform registry and the vendors block (62 §14, verbatim).
# Vendor ids are schema; token spellings are policy (Policy.vendor_tokens, 62 §15).
# PlatformId (62 §3.4) is a foreign key into this file; free-text platform strings are a
# build error wherever they appear.

vendors:
  juniper:   {}
  palo-alto: {}
  cisco:     {}
  arista:    {}
  fortinet:  {}
  calix:     {}          # hardware-catalogue vendors are the same namespace —
  nokia:     {}          # 19 §3.9's catalogue vendor: is a FK into this block,
  adtran:    {}          # which is what makes 76 X11's cross-check possible
                         # Nokia 7210 SAS surveyed 2026-09-12 from public captures only —
                         # docs/surveys/nokia-7210-sas.md. No config body seen; no platform row.
  ciena:     {}          # owner-named 2026-08-06 (70 §7). Vendor only: no platform is
                         # declared below because no Ciena config has been seen, and
                         # inventing a family or version_scheme would fabricate vendor
                         # behaviour (conventions § Document conventions)

  # Owner-named 2026-08-10. Each was surveyed against primary vendor documentation
  # before being written here, and the survey is `64` — what text the equipment will
  # hand a human, with a URL and a date for every claim (ADR-0034). Ciena's precedent
  # governs which of these earn a `platforms:` row below: **a vendor is registered when
  # the owner names it; a platform is declared only when a real config has been seen.**
  opnsense:  {}          # `64` §1: whole config is one plain XML file, /conf/config.xml,
                         # and `pluginctl -g` prints it (or any subtree) as JSON. Read at
                         # opnsense/core commit ae0088be, 2026-08-09. Platform declared.
  tp-link:   {}          # `64` §1: switches yes, gateways no, APs no, controller backup
                         # no. Only the switch line has a capture path, so only it gets a
                         # platform row.
  sodola:    {}          # `64` §5: **vendor only, deliberately.** No Sodola CLI manual
                         # exists, no first-hand capture exists anywhere, and the vendor's
                         # own site refused every request. "Sodola" spans at least three
                         # unrelated firmware stacks, so one row would be wrong for two of
                         # them. This needs a device on a desk, not more research.

  apc:       {}          # hardware-catalogue vendor only, added 2026-09-16 for
                         # corpus/catalogue/apc/ (ADR-0044 §1's catalogue/ part
                         # of an engine): a rack PDU. No config platform — a PDU
                         # has ports and power, not a CLI to capture.
  panduit:   {}          # hardware-catalogue vendor only, added 2026-09-16 for
                         # corpus/catalogue/panduit/: passive patch panels
                         # (copper and fibre). Same reasoning as `apc` above.
  tripplite: {}          # hardware-catalogue vendor only, added 2026-09-18 for
                         # corpus/catalogue/tripplite/: a passive rack shelf
                         # (ADR-0051 §1's PassiveNode.form gaining `shelf`).
                         # Same reasoning as `apc`/`panduit` above — a shelf
                         # has ports and power for nobody.
  icc:       {}          # hardware-catalogue vendor only, added 2026-09-18 for
                         # corpus/catalogue/icc/: a 12-port surface-mount RJ45
                         # outlet box (ADR-0051 §1's `outlet` form). Same
                         # reasoning as `apc`/`panduit` above.
  cyberpower: {}         # hardware-catalogue vendor only, added 2026-09-18 for
                         # corpus/catalogue/cyberpower/: a tower UPS with NEMA
                         # 5-15R outlets and a captive NEMA 5-15P cord. Same
                         # reasoning as `apc`/`panduit` above — has power and
                         # a management jack, not a CLI to capture.

  ubiquiti:  {}          # Added 2026-09-19 for corpus/catalogue/ubiquiti/ (a UniFi
                         # gateway and two UniFi switches) and the `edgeos` platform
                         # row below. Ubiquiti is two worlds: UniFi devices are
                         # configured by a controller and export no text config a
                         # person pastes (corpus/dict/README-ubiquiti.md records what
                         # was checked and why no UniFi dictionary exists), while
                         # EdgeOS routers (EdgeRouter/EdgeMAX) are Vyatta-derived and
                         # do print one, hence the platform row.

  proxmox:   {}          # Owner-named 2026-08-28 (`70` §18.4): *"proxmox would probably
                         # need to be an engine"* — the first general-purpose host vendor,
                         # and the sentence that set the direction for ADR-0037 §5's open
                         # question (engines, not a catch-all platform). Vendor only: the
                         # survey ran the same day and is `64` §7 — config is plain text
                         # (colon-separated key/value, near family A), `qm config`/`pct
                         # config`/`pvesh` print it, secrets sit apart in /etc/pve/priv/,
                         # and the likely paste shape is an UNREDACTED pvereport, which the
                         # gate must learn first. The platform row still waits on a real
                         # capture being seen, per the precedent above — the survey read
                         # manuals and pve-manager's source, not a config off a box.

  linux:     {}          # Added 2026-09-19 for corpus/dict/linux-host/ and
                         # corpus/explainers/linux-*-basics.yaml. Vendor only, same
                         # precedent as ciena/sodola above, but for a different reason
                         # than either: a real capture WAS seen (synthetic `ip -d link
                         # show` / `ip -4 -6 addr show` / `ip route show` / `bridge vlan
                         # show` output, built against the iproute2 manual pages), but
                         # `crates/fathom-ingest/src/shape.rs`'s unconditional
                         # verb-initial check refuses every line of it before any
                         # dictionary is consulted — a core front-end gap, not a missing
                         # entry. No `linux-host` platform row exists because the "the
                         # core can read it" half of the test still fails. Full finding:
                         # corpus/dict/README-linux-host.md.

# Cisco Meraki has NO vendor entry of its own and NO platform row, and that is the
# finding rather than an omission. `64` §2: Cisco's own FAQ states "The dashboard
# configuration cannot be backed up or exported to a local copy" (checked 2026-08-10),
# the Local Status Page shows uplink status only, and MX/MS/MR expose no device CLI.
# There is nothing for a human to copy, so under invariant 2 there is nothing Fathom
# can ingest. Meraki is a Cisco product and `cisco` is already registered above, so
# nothing is missing from the vendor namespace either.
#
# The one exception is Meraki-managed Catalyst (C9300-M), whose Dashboard DOES show a
# full IOS-XE running-config as selectable text. That is an `ios-xe` capture wearing a
# Meraki badge and it belongs to the `ios-xe` row below — not to a Meraki row that
# would imply the rest of the Meraki line is reachable.

platforms:
  junos-srx: { vendor: juniper,   family: junos,   version_scheme: junos }
  junos-mx:  { vendor: juniper,   family: junos,   version_scheme: junos }
  junos-ex:  { vendor: juniper,   family: junos,   version_scheme: junos }
  panos:     { vendor: palo-alto, family: panos,   version_scheme: panos }
  ios-xe:    { vendor: cisco,     family: ios,     version_scheme: iosxe }
  nx-os:     { vendor: cisco,     family: nxos,    version_scheme: nxos }
  eos:       { vendor: arista,    family: eos,     version_scheme: eos }
  fortios:   { vendor: fortinet,  family: fortios, version_scheme: fortios }
  # Added 2026-08-10, each with a capture path established in `64` §1 and a source.
  opnsense:  { vendor: opnsense,  family: opnsense, version_scheme: opnsense }
  omada-sw:  { vendor: tp-link,   family: omada,   version_scheme: omada }
  # `omada-sw` and not `omada`: the name says switches, because switches are the only
  # part of the Omada line with a capture path. The ER gateways' 109-page CLI guide has
  # zero hits for `running-config`, the APs' CLI is read-only diagnostics by TP-Link's
  # own statement, and the controller's backup is an encrypted binary that shares the
  # `.cfg` extension with the switch's plain-text export (`64` §1) — a collision the
  # paste surface must name, since the two files look identical until you open them.
  # Added 2026-09-19, corpus/dict/edgeos/ built against it: `show configuration
  # commands` prints the running config as flat `set <path> <value>` statements —
  # the same shape Junos's `display set` produces, corroborated across at least two
  # independent listings each time a syntax claim below rests on one (no direct
  # fetch of a vendor or community page was possible; egress to every domain tried
  # was blocked — see corpus/dict/README-ubiquiti.md). `show configuration` (no
  # `commands`) prints a nested curly-brace tree instead, which this platform row
  # does NOT cover: the ingest core's shaper only shapes verb-initial flat
  # statements (`crates/fathom-ingest/src/shape.rs`'s `VERBS`), so a nested-brace
  # capture is not parseable by the dictionary this row backs. See
  # corpus/dict/README-ubiquiti.md for exactly what the core would need to read it.
  edgeos:    { vendor: ubiquiti,  family: edgeos,  version_scheme: edgeos }
