# schema/field-keys.yaml — the append-only field-key registry (62 §2.3, §17.1).
# One integer key per (kind|edge).field, assigned once, NEVER reused; the wire format
# (11 §14.1) keys on these integers, which is why declaration order is never
# load-bearing for stored bytes. New fields append at the tail with the next integer;
# a removed field retires its key forever. 62 §17.1 mirrors this table into
# ir_types.rs and schema.json at codegen; this file is the authoritative assignment
# the generator consumes, so an accidental renumbering is a diff here, not a silent
# wire change.
# VERIFY: keys are assigned to derived fields too (Device.name_conformance,
# PhysicalPort.occupied, PathSegment.resolution, PathSegment.corroboration) although they
# are never serialised (62 §11.2) — 62 §17.1 is silent on whether derived fields get wire
# keys; assigning them is the conservative (append-only-safe) reading.
