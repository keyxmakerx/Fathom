# Name a build. A tag `v*` on a commit `main` already published gives that
# commit's image a second, human name (`ghcr.io/keyxmakerx/fathom-server:v0.1.0-alpha.1`)
# WITHOUT BUILDING ANYTHING: the new tag points at the very digest publish.yml
# pushed, tested and attested for that commit. Written 2026-10-25 for the Alpha
# list's "pinned build" (Sign-offs page, r28-alpha).
#
# ---------------------------------------------------------------------------
# WHY PROMOTE, NOT REBUILD
# ---------------------------------------------------------------------------
# Until this date publish.yml also ran on `v*` tags and rebuilt the image. The
# build is not byte-reproducible, so a tag push would have produced a second
# digest for the same commit and re-pushed `sha-<commit>` onto it. A host pinned
# to `FATHOM_TAG=sha-<commit>` with `pull_policy: always` would then have moved
# to an image nobody tested, on its next `up`, while still saying it was pinned.
# Promoting keeps one digest per commit, and the provenance attestation already
# stored beside that digest covers the release name too.
#
# ---------------------------------------------------------------------------
# WHAT IT REFUSES
# ---------------------------------------------------------------------------
# - A tag on a commit with no `sha-<commit>` image: main never published it, so
#   it never passed the gate floor. Tag a commit on main after its publish run
#   is green; re-run this job if the tag beat the publish.
# - An image whose provenance does not verify as built by publish.yml, in this
#   repository, from that commit, on refs/heads/main. `gh attestation verify`
#   flags read from `gh attestation verify --help`, gh 2.89.0, 2026-10-25.
# - A tag name Docker would not accept as an image tag.
#
# There are three images per commit: the server, the backup service (ADR-0070)
# and the optional Passbolt helper (ADR-0071 part four). A release names all
# three: `FATHOM_TAG` picks the tag of each, so naming only some would leave a
# pinned host unable to pull the others.
# One matrix leg per image; each leg refuses on its own terms.
#
# Actions are pinned to the same commit SHAs as publish.yml, for the reason
# given there.
name: release

on:
  push:
    tags: ['v*']

# The workflow grants nothing; each job asks for what it needs below.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # add the release tag to the existing image
      attestations: read   # verify the provenance publish.yml attached
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/keyxmakerx/fathom-server
            digest_var: FATHOM_DIGEST
          - image: ghcr.io/keyxmakerx/fathom-backup
            digest_var: FATHOM_BACKUP_DIGEST
          # Missing until 2026-11-02: publish.yml has pushed this third image
          # since ADR-0071 part four, and compose.yaml names it at FATHOM_TAG,
          # so a host pinned to a release with the `passbolt` profile on asked
          # for a tag that was never made.
          - image: ghcr.io/keyxmakerx/fathom-passbolt-helper
            digest_var: FATHOM_PASSBOLT_DIGEST
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - name: Set up buildx (for imagetools)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the image main published for this commit
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[A-Za-z0-9_.-]{1,127}$'; then
            echo "::error::'$TAG' is not a usable image tag"; exit 1
          fi
          if ! out=$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA}" 2>&1); then
            echo "::error::No ${IMAGE}:sha-${GITHUB_SHA}. Main has not published this commit; tag a commit after its publish run is green."
            echo "$out"; exit 1
          fi
          digest=$(printf '%s\n' "$out" | awk '$1 == "Digest:" { print $2; exit }')
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not read a digest for sha-${GITHUB_SHA}"; echo "$out"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Its provenance says publish.yml built it from this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/publish.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners

      - name: Add the release tag to that digest
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${TAG}" "${IMAGE}@${DIGEST}"
          got=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" | awk '$1 == "Digest:" { print $2; exit }')
          if [ "$got" != "$DIGEST" ]; then
            echo "::error::${TAG} resolves to ${got}, not ${DIGEST}"; exit 1
          fi

      - name: Record what was named
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ steps.resolve.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Released ${TAG}"
            echo
            echo '```'
            echo "image   ${IMAGE}:${TAG}@${DIGEST}"
            echo "commit  ${GITHUB_SHA}"
            echo '```'
            echo
            echo "To pin a host to it, in \`.env\` (docs/OPERATING.md, \"Pinning a host to one build\"):"
            echo
            echo '```'
            echo "FATHOM_TAG=${TAG}"
            echo "${{ matrix.digest_var }}=${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # A COMPOSE FILE WITH EVERY IMAGE HASHED, attached to the GitHub release.
  # -------------------------------------------------------------------------
  # Added 2026-11-02. compose.yaml pins every image somebody else builds by
  # digest, and names Fathom's own three by tag (`latest` unless FATHOM_TAG
  # says otherwise) so a host that pulls it follows `main`. A compose front end
  # (Cosmos, Portainer, Unraid) then shows postgres and rclone as
  # `name@sha256:...` and Fathom as `name:latest`. For a release that is the
  # wrong way round: the release IS one set of bytes. So this job writes
  # `compose.pinned.yaml`, the tagged commit's compose.yaml with Fathom's
  # image lines rewritten to `name:<release>@sha256:<digest>`, and attaches it
  # to the release. Paste that file and every image in the stack is a hash.
  #
  # It reads each digest back from the registry under the release tag the
  # promote job just added, and refuses unless it is the same digest as
  # `sha-<commit>`: the image main published, tested and attested.
  pinned-compose:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and attach the file
      packages: read       # read the digests back
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up buildx (for imagetools)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write compose.pinned.yaml
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/release/pin-compose.sh "$TAG" "$GITHUB_SHA" compose.yaml > compose.pinned.yaml

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A tag with a hyphen (v0.1.0-alpha.1) is a pre-release by semver's
          # own rule, and is marked so.
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" "${pre[@]}" \
              --notes "Every image in compose.pinned.yaml is pinned by digest: paste it into a compose front end, or save it as compose.yaml beside your .env. docs/OPERATING.md, \"Pinning a host to one build\"."
          fi
          gh release upload "$TAG" compose.pinned.yaml --clobber
          {
            echo "### compose.pinned.yaml"
            echo
            echo '```'
            grep -E '^\s+image:' compose.pinned.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
