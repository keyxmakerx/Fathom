# Build the container image and push it to GHCR, so a server can pull it rather
# than build it. Cosmos Cloud (and Unraid's Docker UI, and plain `docker run`)
# can only run images, not build them -- there is no `build:` in the Cosmos
# container schema -- so without this there is nothing for them to pull.
#
# WHAT SHIPS, since 2026-09-19: the two final stages of `deploy/Dockerfile`,
# as two images. `fathom-server` is the distroless server binary with the
# schema and corpus beside it; `fathom-caddy` is Caddy with the built client
# baked in. `compose.yaml` builds the same two stages from a checkout; these
# are the same images, published, for a host that can only pull. Until this
# date the workflow built the root Dockerfile, which packaged the retired
# single-file client behind nginx, and it had never published anything since
# the client was rebuilt: its inline gate floor ran the server's tests with no
# PostgreSQL to run them against, and failed there every time.
#
# ---------------------------------------------------------------------------
# WHY THE GATES RUN HERE TOO, DUPLICATING ci.yml
# ---------------------------------------------------------------------------
# ci.yml runs the verification floor, but it is a separate workflow, so nothing
# stops a push to main from publishing an image while ci.yml is still running or
# has already failed. `needs:` does not reach across workflow files. Rather than
# wire up a workflow_run dependency -- which is easy to get subtly wrong and
# fails open -- the floor runs inline, before the image is built. It costs about
# a minute, on merges only, and it buys a property worth stating plainly:
# NO IMAGE IS EVER PUBLISHED THAT DID NOT PASS THE FLOOR.
#
# ---------------------------------------------------------------------------
# WHY EVERY ACTION IS PINNED TO A COMMIT SHA
# ---------------------------------------------------------------------------
# A tag like @v7 is a moving pointer that the action's owner can repoint at any
# commit, including after a repository compromise. This workflow holds a token
# that can write packages, so a repointed tag would be a direct path to
# publishing a modified Fathom. The SHAs below were resolved with
# `git ls-remote --tags` on 2026-08-11 and each is a lightweight tag, so the SHA
# is the commit itself and not a tag object. The version in the trailing comment
# is documentation; the SHA is the pin. Every input used below was confirmed to
# exist in that commit's action.yml rather than assumed from memory (ADR-0034).
#
# ci.yml still pins actions/checkout by tag. That is an inconsistency worth
# closing, but it is a separate change to a separate gate and is not made here.
#
# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT
# ---------------------------------------------------------------------------
# No GitHub Actions build cache (`cache-from: type=gha`). The cache is writable
# by any workflow run on the repository, which makes it a place to plant a layer
# that ends up inside a published image. The build it would accelerate is about
# twenty seconds of Rust -- the workspace has no third-party code to compile --
# so the trade is a supply-chain surface for almost no time.
#
# linux/amd64 only. Unraid is amd64, and an arm64 image would need a cross
# toolchain for the wasm and native builds -- real work, for a platform nobody
# has asked for. Say so rather than quietly emitting a single-arch image that
# looks multi-arch.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least privilege, and each one is load-bearing:
#   contents:     read the tree.
#   packages:     push to GHCR. This is the one that matters.
#   id-token:     mint the OIDC token the provenance attestation is signed with.
#   attestations: write the attestation back to the repository.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  # Hardcoded lowercase on purpose. The repository is `keyxmakerx/Fathom` with a
  # capital F, and GHCR rejects uppercase in an image name. metadata-action
  # happens to lowercase it for you (sanitizeImageName, meta.ts) but
  # attest-build-provenance does not, so one spelling used everywhere is safer
  # than relying on one action's normalisation and not the other's.
  SERVER_IMAGE: ghcr.io/keyxmakerx/fathom-server
  CADDY_IMAGE: ghcr.io/keyxmakerx/fathom-caddy

concurrency:
  # A second merge should supersede the first rather than race it to `latest`.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The same PostgreSQL and roles `ci.yml` provisions for the test suite,
    # because the floor below runs that suite and it needs a real database
    # (`crates/fathom-server/tests/support/mod.rs` refuses to run without one).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- the verification floor, before anything is built or pushed ----
      - name: Provision a non-superuser test role (RLS does not bind to a superuser)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE fathom_test LOGIN PASSWORD 'fathom_test_pw' NOSUPERUSER CREATEROLE;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE fathom_test OWNER fathom_test;"
      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        env:
          DATABASE_URL: postgres://fathom_app:fathom_app_pw@127.0.0.1:5432/fathom_test
          FATHOM_MIGRATE_DATABASE_URL: postgres://fathom_test:fathom_test_pw@127.0.0.1:5432/fathom_test
        run: cargo test --workspace --locked

      - name: Schema gates
        run: cargo run --locked -p fathom-schema --bin fathom-schema-check

      # ---- build and push ----
      # A runner's default buildx builder uses the `docker` driver, which cannot
      # produce attestations at all:
      #
      #   ERROR: failed to build: Attestation is not supported for the docker
      #   driver.
      #
      # That is what failed run 1 of this workflow, after every gate above it had
      # passed. This step creates a `docker-container` builder, which can. It is
      # needed even though the inline attestations are turned off below, because
      # `provenance: false` is itself expressed to buildx as an attestation flag.
      - name: Set up buildx (the default `docker` driver cannot attest)
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels, server
        id: meta_server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Fathom server
            org.opencontainers.image.description=The Fathom server. A security-first network documentation tool; configs pass a redaction gate before anything is stored.
      - name: Tags and labels, caddy
        id: meta_caddy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.CADDY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Fathom caddy
            org.opencontainers.image.description=Caddy terminating TLS in front of the Fathom server, with the Fathom client baked in.
      # `file` and `target` are inputs of build-push-action at this pin
      # (action.yml, read 2026-09-19), the same way `compose.yaml` names them.
      - name: Build and push, server
        id: build_server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          provenance: false
          sbom: false
      - name: Build and push, caddy
        id: build_caddy
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: caddy
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_caddy.outputs.tags }}
          labels: ${{ steps.meta_caddy.outputs.labels }}
          provenance: false
          sbom: false
      - name: Attest build provenance, server
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.SERVER_IMAGE }}
          subject-digest: ${{ steps.build_server.outputs.digest }}
          push-to-registry: true
      - name: Attest build provenance, caddy
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CADDY_IMAGE }}
          subject-digest: ${{ steps.build_caddy.outputs.digest }}
          push-to-registry: true
      - name: Record what shipped
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo
            echo '```'
            echo "server  ${SERVER_IMAGE}@${{ steps.build_server.outputs.digest }}"
            echo "caddy   ${CADDY_IMAGE}@${{ steps.build_caddy.outputs.digest }}"
            echo "commit  ${GITHUB_SHA}"
            echo '```'
            echo
            echo "Pull by digest, not by tag; \`compose.yaml\`'s \`image:\` lines take exactly this form."
          } >> "$GITHUB_STEP_SUMMARY"
