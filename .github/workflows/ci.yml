# The mechanical verification floor (78-execution-protocol.md §6: every PR, no exceptions).
# The toolchain is pinned by rust-toolchain.toml and rustup honours it — nothing here
# chooses a version.
#
# --locked is on EVERY cargo invocation, not just the test step. A cargo command without
# it may rewrite Cargo.lock, so an earlier unlocked step silently repairs the lockfile the
# later locked step was meant to catch: the gate passes and the drift ships. ADR-0032 §4.
#
# NOT YET PRESENT: gate zero — fail the build when Cargo.lock gains a non-first-party
# package with no approval record. ADR-0032 §6 requires it before any dependency lands,
# and ADR-0032 is Proposed. It is Stage A of the program plan, not this commit.
name: gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Schema gates
        run: cargo run --locked -p fathom-schema --bin fathom-schema-check
