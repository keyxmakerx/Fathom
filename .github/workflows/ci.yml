# The mechanical verification floor (78-execution-protocol.md §6: every PR, no exceptions),
# plus the five-layer dependency gate WO-11 §5 step 0 designed.
#
# The toolchain is pinned by rust-toolchain.toml and rustup honours it — nothing here
# chooses a version.
#
# --locked is on EVERY cargo invocation, not just the test step. A cargo command without
# it may rewrite Cargo.lock, so an earlier unlocked step silently repairs the lockfile the
# later locked step was meant to catch: the gate passes and the drift ships. ADR-0032 §4.
#
# THE ORDERING IS THE CONTROL, and it is not cosmetic. ADR-0032 items 2 and 3 are the same
# defect seen twice: a crate's build.rs executes on this runner before any gate produces a
# result. So every check that can run without compiling anything runs first — gate zero,
# the look-alike check, the three shell tests, then cargo-deny and cargo-audit, which read
# `cargo metadata` and the lockfile and never invoke a build script. Only after all of them
# does anything compile. A tripwire that runs after the code has already run is decoration.
#
# THE FIVE LAYERS, and the honest gap (WO-11 §5 step 0):
#
#   1. gate-zero               a crate arriving with no human approval record
#   2. cargo-deny              an unexpected registry, a bad licence, a duplicate version,
#                              a named-and-banned crate — see deny.toml
#   3. cargo-audit             filed RustSec advisories and yanks
#   4. --locked + a REVIEWED lockfile diff, plus scripts/lockfile-lookalikes.sh, which
#                              makes the mechanical half of it mechanical
#   5. scripts/crate-cooldown.sh   a release that lives ninety minutes
#
# NOTHING SANDBOXES A BUILD SCRIPT. Stable Rust has no equivalent of "install without
# running scripts", which is exactly how the August 2026 payload ran. Layers 2, 4 and 5
# are the mitigation — not a sandbox, because there is not one.
name: gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request replaces the run still going for the older one.
# Pushes to main are never cancelled.
concurrency:
  group: gates-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI never opens a debugger, and incremental data is written once and never reused.
  # Both only make `target` bigger to save, restore and link.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  gates:
    runs-on: ubuntu-latest

    # `crates/fathom-server`'s repository-layer tests (Phase 2: accounts,
    # organisations, the scope hierarchy) run against a real PostgreSQL, not
    # a mock. `POSTGRES_USER` here is the image's initdb bootstrap role,
    # which the official image always creates as a SUPERUSER regardless of
    # the name given it -- and Postgres exempts superusers from row-level
    # security unconditionally, `FORCE ROW LEVEL SECURITY` or not. Testing
    # the tenant-isolation policies in
    # `migrations/0002_identity_and_scope.sql` through THIS role would make
    # every isolation assertion pass whether or not the policies actually
    # work. So the step below this service provisions a second, deliberately
    # non-superuser role and database -- the MIGRATION role
    # (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0) -- and only that
    # role's connection string is ever handed to `cargo test` as
    # `FATHOM_MIGRATE_DATABASE_URL`. The RUNTIME role (`fathom_app`,
    # `DATABASE_URL`) is not created here at all: it comes from
    # `migrations/0006_runtime_role.sql`, inside the chain, and
    # `tests/support::migrated_pool` provisions its login off the migration
    # role's connection every run -- exactly what `src/main.rs` does at
    # startup, proved here rather than assumed.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits: a pull request's checkout is the merge commit, and its
          # first parent is the base, so `HEAD^1..HEAD` is exactly the change.
          fetch-depth: 2

      # The test suite takes most of this job's time. A pull request that
      # changes only paths no Rust code reads skips it; every gate, format,
      # clippy and the schema check still run. Anything else, and every push
      # to main, runs the whole suite. Rust tests read `client/src/engine/`,
      # `client/src/document/vectors/`, `docs/archive/` and `design/`, so
      # those count as Rust.
      - name: Does this change reach Rust?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rust=false
          while IFS= read -r f; do
            case "$f" in
              client/src/engine/*|client/src/document/vectors/*|docs/archive/*) rust=true ;;
              docs/*|client/*|.claude/*|.context/*) ;;
              */*) rust=true ;;
              *.md) ;;
              *) rust=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "Rust test suite needed: $rust"

      # CREATEROLE, and only that, on top of NOSUPERUSER:
      # `crates/fathom-server/migrations/0005_planes.sql` creates the second
      # database role -- the sightless operator plane -- inside the migration
      # chain, so that "run the chain from an empty database" produces the
      # whole fence rather than half of it. the database init script (inline in `compose.yaml`)
      # grants the deployment's `fathom` role the same attribute, for the
      # same reason and with the same accounting written out there. It is NOT
      # superuser and NOT BYPASSRLS, which is what
      # `fathom_server::rls::assert_rls_binds` checks and what makes every
      # isolation assertion in this suite mean something.
      - name: Provision a non-superuser test role (RLS does not bind to a superuser)
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE ROLE fathom_test LOGIN PASSWORD 'fathom_test_pw' NOSUPERUSER CREATEROLE;"
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c \
            "CREATE DATABASE fathom_test OWNER fathom_test;"

      # ---- Layer 1, and everything else that needs no toolchain at all. ----

      - name: Gate zero — no unapproved dependency
        run: ./scripts/gate-zero.sh

      # ADR-0032 §5's record-before-admission process, mirrored for the browser client:
      # gate-zero.sh reads Cargo.lock only, and package.json/package-lock.json had no gate
      # at all before this. Needs no toolchain, so it runs beside gate-zero.
      - name: Gate npm — no unapproved client dependency
        run: ./scripts/gate-npm.sh

      - name: Layer 4 (mechanical half) — no look-alike crate names
        run: ./scripts/lockfile-lookalikes.sh

      # ADR-0040 §6's four forbidden sentences, made mechanical. That record's own
      # failure-mode table answers "marketing says zero-knowledge because it sounds
      # better" with a policy, where the two rules either side of it in the same table
      # got CI checks. This is that gap closed.
      - name: No user-facing surface claims what ADR-0040 §6 forbids
        run: ./scripts/forbidden-claims.sh

      # ADR-0060 decision 12: every client package is under a licence on deny.toml's list
      # (build tools may also be MPL-2.0), and the About page lists what the lockfile ships.
      - name: Licences — every client package is free to use
        run: node scripts/licences-npm.mjs

      # The gates' own tests. A gate nobody has watched fail is not known to work,
      # so each of these drives its gate over fixtures and asserts it FAILS on the
      # bad case — including the August 2026 shape, proc-macro1 beside proc-macro2.
      - name: The gates' own tests
        run: |
          ./scripts/tests/gate-zero-test.sh
          ./scripts/tests/gate-npm-test.sh
          ./scripts/tests/lockfile-lookalikes-test.sh
          ./scripts/tests/crate-cooldown-test.sh
          ./scripts/tests/forbidden-claims-test.sh
          ./scripts/tests/licences-npm-test.sh

      # ---- Layers 2 and 3, still before anything compiles. ----

      # Pinned, checksummed release binaries rather than `cargo install`: building
      # either tool from source compiles ~200 crates and runs their build scripts,
      # which is the hazard these tools exist to gate.
      - name: Fetch cargo-deny and cargo-audit (pinned, checksummed)
        run: |
          ./scripts/ci/fetch-audit-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install

      # ADR-0032 item 2: --locked on EVERY invocation, and a metadata check first.
      # Without this, an unlocked step re-resolves and writes a fresh Cargo.lock that
      # the next --locked step then reads and finds consistent, so the gate passes and
      # the drift ships. cargo metadata does not run build scripts.
      # `--offline` below needs the crate sources on disk, and a fresh runner has none.
      # This step passed on every PR up to #17 only because the lockfile then held zero
      # external crates; with 115 it fails on a cache-less machine ("no matching package
      # named `deadpool-postgres` found"), reproduced 2026-09-04 with an empty CARGO_HOME.
      # `cargo fetch --locked` downloads exactly the locked set, refuses to touch
      # Cargo.lock, and runs no build script — so the control the next step exists for
      # is intact.
      - name: Fetch the locked crate set (no build scripts run)
        run: cargo fetch --locked

      - name: Lockfile is consistent and complete
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

      - name: Layer 2 — cargo-deny (sources, licences, bans, duplicates)
        run: cargo-deny --manifest-path Cargo.toml --locked check

      - name: Layer 3 — cargo-audit against the RustSec database
        run: cargo-audit audit --file Cargo.lock

      # G3's positive control: cargo-audit is handed a lockfile pinning a version
      # with a real filed advisory and must reject it, then the patched version and
      # must accept it. Without the second half, a gate that refuses everything
      # would look identical to a gate that works.
      - name: Layer 3's positive control
        run: ./scripts/tests/advisory-gate-test.sh

      # Layer 6 — closes the gap in docs/PHASE-2-STORAGE-DESIGN.md §12.5. cargo-deny
      # and cargo-audit above both read RustSec only; OSV.dev also carries advisories
      # GitHub reviewed and RustSec never received (GHSA-3rjw-m598-pq24 against `cmov`
      # was one). Needs the OSV.dev API, so it runs alongside layer 5, not before it.
      - name: Layer 6 — OSV.dev advisory gate (RustSec + GitHub-reviewed)
        run: ./scripts/osv-gate.sh

      # A local fixture server, no network needed: the vulnerable pin must fail and
      # name the advisory, the patched pin must pass, an allow-listed finding must
      # pass, and an unreachable endpoint must fail closed. Same reasoning as Layer
      # 3's positive control just above.
      - name: Layer 6's positive control
        run: ./scripts/tests/osv-gate-test.sh

      # ---- Layer 5. Needs the crates.io API, so it is last, because it needs the crates.io API. ----

      - name: Layer 5 — the version cooldown
        run: ./scripts/crate-cooldown.sh

      # ---- The verification floor (78 §6). Everything below this line compiles. ----

      # The build cache, added 2026-10-02: without it every run compiled the
      # whole workspace from nothing. GitHub's own action, pinned to the
      # commit `git ls-remote` gave for v6.1.0 on 2026-10-02. It holds build
      # output only (`target`); v3 because Cargo.toml's dev profile changed what is built, and a
      # cache built under the old settings would be restored and then rebuilt on every run
      # without ever being saved again. The crates themselves still come from the
      # checksummed `cargo fetch --locked` above, after every dependency gate
      # has run. Cargo's own fingerprints decide what is rebuilt; the key
      # (lockfile and toolchain file) only decides when a new cache is saved.
      - name: Cache the cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: cargo-v3-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v3-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        if: steps.scope.outputs.rust == 'true'
        # `FATHOM_MIGRATE_DATABASE_URL` is the non-superuser, CREATEROLE-
        # holding role/database the step above provisioned -- see its
        # comment. `DATABASE_URL` names the RUNTIME role instead
        # (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0); nothing creates
        # it ahead of time, because `tests/support::migrated_pool` provisions
        # its login itself, off the migration role's connection, the same
        # way `src/main.rs` does at startup. Both values are also this
        # crate's own defaults (`crates/fathom-server/tests/support/mod.rs`),
        # spelled out here so a developer reading this file does not have to
        # go looking for them.
        env:
          DATABASE_URL: postgres://fathom_app:fathom_app_pw@127.0.0.1:5432/fathom_test
          FATHOM_MIGRATE_DATABASE_URL: postgres://fathom_test:fathom_test_pw@127.0.0.1:5432/fathom_test
        # Test binaries run side by side (about 20 minutes one after another).
        run: ./scripts/ci/parallel-tests.sh
      - name: Schema gates
        run: cargo run --locked -p fathom-schema --bin fathom-schema-check

  # ADR-0071 part four, Passbolt: the optional helper, `helpers/passbolt/`, is its own workspace
  # with its own lockfile so that rpgp's packages never enter Fathom's (owner's answers
  # 2026-10-26, r34-passbolt v2 B and r34-passbolt-crates A). That is only safe if its lockfile
  # passes the same gates, so this job runs them over it, then its format, clippy and tests (the
  # tests talk to GnuPG, which a Passbolt server uses and this runner carries), then builds its
  # image and asks the running container to answer through its socket with no network at all.
  passbolt-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch cargo-deny and cargo-audit (pinned, checksummed)
        run: |
          ./scripts/ci/fetch-audit-tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install

      - name: The helper lockfile's gates (gate-zero, look-alikes, deny, audit, cooldown, OSV)
        run: ./scripts/gate-passbolt-helper.sh

      - name: Format
        run: cargo fmt --manifest-path helpers/passbolt/Cargo.toml --check

      - name: Clippy, warnings are errors
        run: cargo clippy --manifest-path helpers/passbolt/Cargo.toml --all-targets --locked -- -D warnings

      - name: Tests, against GnuPG
        run: |
          gpg --version | head -1
          cargo test --manifest-path helpers/passbolt/Cargo.toml --locked

      - name: Build the image and ping it with no network
        run: |
          set -euo pipefail
          docker build -f deploy/passbolt-helper.Dockerfile --target helper -t fathom-passbolt-helper:ci .
          docker volume create passbolt-ci
          docker run -d --name pbh --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --user 65532:65532 \
            -v passbolt-ci:/run/fathom-passbolt fathom-passbolt-helper:ci
          for i in $(seq 1 20); do
            docker run --rm -v passbolt-ci:/run/fathom-passbolt alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8 \
              test -S /run/fathom-passbolt/helper.sock && break
            sleep 1
          done
          sudo python3 -I -c '
          import socket, struct, json, sys, glob
          path = glob.glob("/var/lib/docker/volumes/passbolt-ci/_data/helper.sock")[0]
          s = socket.socket(socket.AF_UNIX); s.connect(path)
          b = json.dumps({"op": "ping"}).encode()
          s.sendall(struct.pack(">I", len(b)) + b)
          n = struct.unpack(">I", s.recv(4))[0]
          a = json.loads(s.recv(n))
          print(a); sys.exit(0 if a.get("ok") is True else 1)
          '
          docker logs pbh
          docker rm -f pbh

  # The client's own tests and typecheck. Until this job nothing ran vitest in CI: the image build
  # typechecks the client, but a red client test reached main unseen. The tests load the real
  # redaction gate, so the wasm engine is built first, and they run in the same pinned Node image
  # `deploy/Dockerfile`'s client-build stage uses (keep the two digests together).
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install

      - name: Build the wasm engine the tests load
        run: bash scripts/build-wasm.sh

      - name: Typecheck and test the client
        run: |
          docker run --rm -v "$PWD":/w -w /w/client \
            node@sha256:f1127b82781601ca2a57c96811cf6be9da3d1f77d58ec13bab49e5f79cf8c84c \
            sh -c 'npm ci --ignore-scripts && npm run typecheck && npm run lint && npm test'

  # THE STACK, END TO END. Added 2026-09-19: until this job, nobody had ever
  # run `compose.yaml`, because the environment this repository is developed
  # in has no Docker daemon, and three first-start faults were found only by
  # reading it. This runner has one. Build every image from the checkout, bring
  # the stack up, wait for the server's own healthcheck, fetch the health
  # endpoint and the client on the published port, and prove the setup
  # password (ADR-0057 decision 1, 2026-09-24 -- no token file any more) gets
  # the first operator all the way in over HTTP. `down -v` at the end, always,
  # so a failed run leaves nothing behind for the next.
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FATHOM_OPERATOR_NOTICE_ADDRESS: ci@example.invalid
      # A real password (CLAUDE.md rule 2): past the fifteen-character floor
      # and not on the bundled common list, the same shape a person actually
      # sets in .env.
      FATHOM_SETUP_PASSWORD: harbour-lantern-ci-setup-nine
      # A tag no registry holds, so every `up` in this job runs the images
      # `--build` produced from this checkout and never pulls a published
      # one in their place (a `latest` tag would be re-pulled on every `up`).
      FATHOM_TAG: ci
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: The health endpoint answers on the published port
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/health > /dev/null; then
              echo "health: 200 after ${i} tries"; exit 0
            fi
            sleep 2
          done
          echo "health never answered"; exit 1
      - name: The client is served
        run: curl -fs http://localhost:8080/ | grep -q "<title>"
      - name: No first-operator token file is written
        run: |
          if docker compose cp server:/var/lib/fathom/bootstrap/first-operator-token ./first-operator-token 2>err.txt; then
            echo "ADR-0057 decision 1: no token file should exist, but one was copied out of the container"
            exit 1
          fi
          cat err.txt
          rm -f err.txt
      # ADR-0070. One backup and one restore test now, rather than waiting for
      # the night: the dump is taken as the superuser (43 tables FORCE row
      # security), sealed, and restored into a throwaway database. Then a keys
      # file is made, and the data file is opened with it and its phrase.
      - name: A backup is made and restores
        run: |
          set -euo pipefail
          docker compose exec -T backup backup-loop.sh once
          docker compose exec -T backup backup-loop.sh test
          docker compose exec -T backup cat /var/lib/fathom/backups/status | tee status.txt
          grep -qx "last_result ok" status.txt
          grep -qx "last_test_result ok" status.txt
          docker compose run --rm -T backup-keys > keys.fkeys 2> phrase.txt
          phrase=$(grep -Eo '[A-Z2-7]{4}(-[A-Z2-7]{4}){3}(-[A-Z2-7]{5}){2}' phrase.txt | head -1)
          test -n "$phrase"
          file=$(awk '$1 == "last_backup_file" { print $2 }' status.txt)
          docker compose cp "backup:/var/lib/fathom/backups/$file" ./latest.fdata
          docker compose run --rm -T -v "$PWD:/w:ro" -e FATHOM_RECOVERY_PHRASE="$phrase" \
            --entrypoint fathom-server backup restore /w/latest.fdata --keys /w/keys.fkeys --check
          rm -f keys.fkeys phrase.txt latest.fdata status.txt
      # A password nobody can use is not a way in. This speaks the browser
      # client's own bytes with Node's WebCrypto and no dependency: redeem the
      # setup password, sign in as the operator it names, and read the
      # operator register with a signed request. Until 2026-09-21 the job
      # stopped at "the file exists", and a client that could not redeem it
      # passed.
      - name: The setup password gets the first operator in over HTTP
        env:
          FATHOM_CI_EXPECT_BACKUP: "1"
        run: node scripts/ci/first-operator-signin.mjs http://localhost:8080
      # Since 2026-10-31 the keys are made by the `db` container's own start
      # (`compose.yaml`, the `db_start` config), not by a one-shot container,
      # so restarting `db` is what runs it again.
      - name: A restart keeps its keys
        run: |
          generated() { docker compose logs --no-log-prefix db | grep -c "fathom-keys: generated"; }
          before=$(generated)
          test "$before" -eq 7 || { echo "expected seven secrets generated at first start (backup.key and vault.key since 2026-10-25), saw $before"; exit 1; }
          docker compose restart db server
          docker compose up --detach --wait --wait-timeout 120
          after=$(generated)
          test "$after" -eq 7 || { echo "a restart regenerated a secret: $after generated lines"; exit 1; }
          curl -fs http://localhost:8080/health > /dev/null
      - name: No one-shot container is left behind
        run: |
          set -euo pipefail
          docker compose ps --all --format '{{.Service}} {{.State}}' | tee ps.txt
          if grep -v ' running$' ps.txt; then echo "a container is not running; first boot should leave only the real services"; exit 1; fi
          rm -f ps.txt
      # 2026-10-26: an install whose compose front end kept a compose file from before
      # vault.key existed ran the new image on a keys volume without it, which the server
      # mounts read-only, and the server crash-looped. Taking vault.key away stands for that
      # volume: the server must still start, saying why the vault's own logins are off, and
      # the next start of `db` must then add vault.key and change no other key.
      - name: An upgrade from a keys volume without vault.key starts, and db adds it
        run: |
          set -euo pipefail
          keys() { docker compose exec -T db sh -c \
            'cd /var/lib/fathom/keys && sha256sum master.key chain.key backup.key db_bootstrap.pw db_migrate.pw db_app.pw && ls vault.key 2>/dev/null || true'; }
          before=$(keys | grep -v vault.key)
          docker compose exec -T db rm /var/lib/fathom/keys/vault.key
          docker compose restart server
          healthy() {
            for i in $(seq 1 30); do
              curl -fs http://localhost:8080/health > /dev/null && return 0
              sleep 2
            done
            echo "health never answered"; return 1
          }
          healthy
          docker compose logs --no-log-prefix server | grep -q "vault.key does not exist and this server cannot create it" \
            || { echo "the server started without vault.key but did not say so"; exit 1; }
          made_before=$(docker compose logs --no-log-prefix db | grep -c "fathom-keys: generated")
          loaded=$(docker compose logs --no-log-prefix server | grep -c "vault key loaded")
          docker compose restart db server
          docker compose up --detach --wait --wait-timeout 120
          docker compose logs --no-log-prefix db | grep "fathom-keys: generated" | tail -n +$((made_before + 1)) | tee init.txt
          grep -q "generated vault.key" init.txt
          test "$(grep -c generated init.txt)" -eq 1 || { echo "db's start regenerated a key it already had"; exit 1; }
          after=$(keys)
          echo "$after" | grep -qx vault.key
          test "$before" = "$(echo "$after" | grep -v vault.key)" || { echo "an existing key changed"; exit 1; }
          healthy
          test "$(docker compose logs --no-log-prefix server | grep -c "vault key loaded")" -gt "$loaded"
          rm -f init.txt
      - name: Logs, on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - name: Down
        if: always()
        run: docker compose down -v
