# The mechanical verification floor (78-execution-protocol.md §6: every PR, no exceptions).
# The toolchain is pinned by rust-toolchain.toml and rustup honours it — nothing here
# chooses a version.
#
# --locked is on EVERY cargo invocation, not just the test step. A cargo command without
# it may rewrite Cargo.lock, so an earlier unlocked step silently repairs the lockfile the
# later locked step was meant to catch: the gate passes and the drift ships. ADR-0032 §4.
#
# GATE ZERO IS NOW PRESENT (2026-08-15, scripts/gate-zero.sh): the build fails when
# Cargo.lock gains a non-first-party package with no approval record in deps/decisions/.
# ADR-0032 §6 requires it BEFORE any dependency lands, and the owner has approved the
# first two crates, so it landed first — which is the whole substance of §6.
#
# It runs FIRST, before any cargo command, because ADR-0032 item 2 and item 3 are the
# same defect seen twice: a crate's build.rs executes on this runner before any gate
# produces a result. A tripwire that runs after the code has already run is decoration.
#
# STILL NOT PRESENT: ADR-0034 §4's dependency-vulnerability scan. Gate zero checks that
# a human wrote a record, not that the crate is free of known advisories. The advisory
# check for the first two crates was done by hand and is recorded in their approval
# records; it is not yet mechanical, and it should be.
name: gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Before rustup, before cargo, before anything can execute a build script.
      - name: Gate zero — no unapproved dependency
        run: ./scripts/gate-zero.sh

      - name: Install the pinned toolchain (reads rust-toolchain.toml)
        run: rustup toolchain install

      # ADR-0032 item 2: --locked on EVERY invocation, and a metadata check first.
      # Without this, an unlocked step re-resolves and writes a fresh Cargo.lock that
      # the next --locked step then reads and finds consistent, so the gate passes and
      # the drift ships.
      - name: Lockfile is consistent and complete
        run: cargo metadata --locked --offline --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy, warnings are errors
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Schema gates
        run: cargo run --locked -p fathom-schema --bin fathom-schema-check
