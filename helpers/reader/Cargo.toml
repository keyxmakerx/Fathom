# The device reader (ADR-0082 §4.3; owner's answers 2026-11-02: r76-device-reading question 1 A,
# r87-reader-packages A, A and all three ticks).
#
# Its own workspace and its own Cargo.lock, so the SNMP and SSH packages it will carry never enter
# Fathom's lock, its gates or its server image: the server holds no network-capable device crate
# (ADR-0032 item 5). It builds only when an operator switches the compose `reader` profile on, and
# answers the server over one Unix socket (README.md here).
#
# SNMPv3 is Fathom's own encoder on RustCrypto pieces (r87 question 1 A): HMAC with SHA-1 or
# SHA-2, AES-128 in CFB mode, and the operating system's random source for the AES salt.
# SSH is russh on ring, with the redaction gate run here before any output leaves (ADR-0082 §4.2).
[workspace]

[package]
name = "fathom-reader"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# The version the Passbolt helper already records.
serde_json = "=1.0.154"
# SNMPv3's USM (RFC 3414, RFC 7860) and its privacy (RFC 3826). The versions measured for r87.
hmac = "=0.13.0"
sha1 = "=0.11.0"
sha2 = "=0.11.1"
aes = "=0.9.3"
cfb-mode = "=0.9.1"
getrandom = "=0.4.3"
# SSH (r87 question 2 A): russh 0.65.0 on ring, able to check RSA host keys; no compression,
# no aws-lc-rs. tokio is the runtime russh already brings; the reader runs one current-thread
# runtime per SSH job.
russh = { version = "=0.65.0", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time"] }
# The redaction gate (ADR-0082 §4.2): Fathom's own crate, by path, with no external dependency
# (crates/fathom-ingest/Cargo.toml), so it adds nothing to this lockfile's closure.
fathom-ingest = { path = "../../crates/fathom-ingest" }

[profile.release]
panic = "abort"
