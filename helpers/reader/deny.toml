# cargo-deny for the device reader's own lockfile (ADR-0082 §4.3). The same policy as the
# workspace's deny.toml, which carries the reasoning for each section; what differs is written here
# with its reason. Run from the repository root by scripts/gate-reader.sh.
#
# The owner approved the reader's packages on sign-off card r87-reader-packages, 2026-11-02:
# Fathom's own SNMPv3 encoder on RustCrypto pieces, russh 0.65.0 on ring with RSA host keys, the
# rsa advisory, two release candidates and the measured size. The SNMPv3 part adds the RustCrypto
# pieces, with their records; russh arrives with SSH. No advisory is ignored yet and ring is still
# denied here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[[bans.deny]]
name = "proc-macro1"
reason = "The typosquat used in the August 2026 crates.io attack (RUSTSEC-2026-0260)."
[[bans.deny]]
name = "openssl-sys"
reason = "C7, as in the workspace's deny.toml."
[[bans.deny]]
name = "native-tls"
reason = "C7, as in the workspace's deny.toml."
[[bans.deny]]
name = "aws-lc-sys"
reason = "C7, as in the workspace's deny.toml. The owner chose ring for SSH (r87-reader-packages, question 2 A), not aws-lc-rs."
[[bans.deny]]
name = "ring"
reason = "C7. Allowed in this reader under russh only once SSH arrives (r87-reader-packages, question 2 A); that part replaces this line with a wrapper rule. Until then nothing here may take it."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
