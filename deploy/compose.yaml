# compose.yaml — WO-11 §4 deliverable 7, following `43` §5.4.
#
# WHAT THIS IS AND IS NOT. It brings up the WO-11 skeleton: PostgreSQL, the
# server, and Caddy terminating TLS in front. There are no accounts, no tenants
# and no data — WO-11 §6 G8 forbids any table but the migrations table until
# ADR-0040's key boundary is decided.
#
# `43` §5.4 was written for `fathom-sync`, the zero-knowledge blob service that
# the 2026-08-18 pivot replaced (`49`). Its SHAPE is carried over line for line
# and its variables are not, because they described a different program.
#
# THE LINES THAT ARE DECISIONS RATHER THAN BOILERPLATE, per `43` §5.4's table:
#
#   image: ...@sha256:   never a tag. The digest is the artifact; the tag is a
#                        pointer (`35` §7.4). Digests read 2026-09-03.
#   read_only: true      the ROOT filesystem. The server writes exactly one
#                        path, and it is a volume of its own -- see THE
#                        BOOTSTRAP TOKEN VOLUME below. This line said "the
#                        server writes nothing" until 2026-09-14, which was
#                        true when it was written and stopped being true when
#                        the operator console landed.
#   cap_drop: [ALL]      it binds a port above 1024 and opens a socket. Nothing
#                        else.
#   no-new-privileges    a setuid binary in the image could not gain anything;
#                        there is no shell to run one from either.
#   user: 65532          distroless's nonroot.
#   tmpfs /tmp noexec    nothing in /tmp is ever executed.
#   healthcheck: the binary
#                        distroless has no shell and no curl (`43` §5.4).
#   logging caps         `43` §6.12 — logs are a metadata store, and an uncapped
#                        one grows forever.
#
# THE DATABASE ROLE, added 2026-09-12 (`docs/REBUILD-PLAN.md` Phase 2
# §"Operational foundations" item 4). `POSTGRES_USER` on the `db` service
# below is the postgres image's bootstrap role, and PostgreSQL ALWAYS makes
# that role a superuser regardless of the name given it -- a superuser
# bypasses row-level security unconditionally, `FORCE` or not
# (`crates/fathom-server/migrations/0002_identity_and_scope.sql`). So the
# server must never connect as `fathom_bootstrap`, for either role below.
# `deploy/init-db/10-app-role.sh` runs once, as that bootstrap role, purely to
# create the `fathom` role the server migrates as -- deliberately NOT a
# superuser, and owner of its own database rather than granted piecemeal
# privileges (see that script's own comment for why ownership is what lets it
# run migrations). `fathom_server::rls::assert_rls_binds` refuses to start at
# all if either connected role turns out to be a superuser or carry
# BYPASSRLS, so this cannot silently regress to the bootstrap role again.
#
# TWO DATABASE ROLES, NOT ONE, ADDED 2026-09-12
# (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0). Until this, `fathom`
# owned every table, ran the migrations, held `CREATEROLE` -- AND served
# every request; a runtime injection could reshape the schema or mint a
# role. Now the SERVER connects as `fathom_app` (`DATABASE_URL`, data
# privileges only -- created `NOLOGIN` by
# `crates/fathom-server/migrations/0006_runtime_role.sql`, then logged into
# by the server itself, see below) for every request it answers, and holds
# `fathom`'s migration credential (`FATHOM_MIGRATE_DATABASE_URL`) only around
# the migration step at startup, never for the connections that serve a
# request afterwards.
#
# NEITHER DATABASE PASSWORD IS IN THIS FILE, added 2026-09-12
# (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1 and §1.4). Whoever writes a
# compose file holds the Docker socket, and is therefore a host-level
# attacker -- so a credential typed here proves nothing about what a lesser
# credential can reach. `deploy/init-db/10-app-role.sh` generates BOTH at
# first start into the `keys` volume, beside where the master key will live,
# and the server reads them through `FATHOM_DB_PASSWORD_FILE` (the runtime
# role, `fathom_app`) and `FATHOM_MIGRATE_DB_PASSWORD_FILE` (the migration
# role, `fathom`). What remains in this file is the BOOTSTRAP superuser's
# password, which is what it has to be: the postgres image needs it to
# initialise the cluster at all, and it is the credential the server must
# never use, for either role.
#
# THE BOOTSTRAP TOKEN VOLUME, ADDED 2026-09-14, BECAUSE THIS FILE COULD NOT
# START AT ALL.
#
# `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §6.3: a first start mints the first
# operator and one single-use enrolment token, and writes that token to a file
# for a human to read -- "whoever can read that volume is the legitimate
# installer". It is the only way into a new deployment.
#
# The server used to derive that file's path from `FATHOM_MASTER_KEY`, so it
# landed in the `keys` volume -- which is mounted READ-ONLY here, for the good
# reason stated on the mount itself. So a first start in this stack wrote a
# bearer token into a read-only filesystem, failed, and exited; and because
# the operator row had already committed, the next start found a bootstrapped
# deployment and never tried again. The stack could not be brought up, and the
# failure was not recoverable by restarting it.
#
# Two changes, and both are needed:
#
#   1. `FATHOM_BOOTSTRAP_TOKEN_FILE` (new) names the path, so the DEPLOYMENT
#      chooses it rather than the server deriving it. It points at `bootstrap`
#      below -- a volume of its own, writable, holding one short-lived file.
#      **The `keys` volume stays read-only and is untouched by this**: the two
#      secrets have different lifetimes and different readers, and the token
#      is deleted by hand within the hour while the master key is the thing
#      the whole deployment rests on.
#   2. `FATHOM_OPERATOR_NOTICE_ADDRESS` is set, because the bootstrap refuses
#      without it and this file did not set it -- so even with (1) fixed, a
#      first start still would not complete.
#
# AND THE WAY BACK IF THE TOKEN IS LOST. `fathom-server
# reissue-bootstrap-token`, run in this container, mints a fresh one into the
# same file -- but ONLY while no operator key has ever been enrolled. After
# enrolment it refuses, and it has to: a re-issue that still worked would let
# anyone who can run a command on this host mint themselves an operator
# session without ever holding a key this deployment has seen. After that the
# way back is another operator, or a restore.
#
#     docker compose run --rm server reissue-bootstrap-token
#
# AND THE ONE THAT MATTERS MOST HERE: **the server is not published to the
# host.** Only Caddy is. `49` §6 keeps C7 — no C or C++ in the shipped closure —
# only because TLS terminates in front of the binary; a server reachable
# directly would be a plaintext HTTP endpoint on the network, and it would work,
# which is how that kind of mistake survives.

name: fathom

services:
  db:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    # NOT published to the host. Nothing outside this network talks to the
    # database, which is also what lets the driver run without TLS.
    expose:
      - "5432"
    environment:
      # The BOOTSTRAP role. PostgreSQL always makes this one a superuser --
      # see the file header. Named `fathom_bootstrap`, not `fathom`, so
      # nothing here reads like it is safe for the server to connect as.
      # Nothing outside `deploy/init-db/` ever uses it again after the first
      # startup that creates the volume.
      POSTGRES_USER: fathom_bootstrap
      POSTGRES_DB: fathom_bootstrap
      # Compose reads these from the environment or a .env file. Neither has
      # a default: a default database password is a password everyone has.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # THERE IS NO FATHOM_DB_PASSWORD HERE ANY MORE, AND ITS ABSENCE IS THE
      # POINT. `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1: whoever writes
      # this file holds the Docker socket and is therefore a host-level
      # attacker, so a password typed here proves nothing about what any
      # other credential can reach. §1.4: the application's own database
      # password is generated at first start, by
      # `deploy/init-db/10-app-role.sh`, into the key volume mounted below --
      # never into this file and never into the environment.
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. PostgreSQL 18's
      # image changed this: a single mount one level up puts the data in a
      # version-named subdirectory, so `pg_upgrade --link` can see both versions
      # without crossing a mount boundary. Mounting the old path against an 18
      # image starts, refuses, and reports an incompatible data directory --
      # found 2026-09-03 by running this file rather than reading it.
      - db:/var/lib/postgresql
      # The key volume. `deploy/init-db/10-app-role.sh` generates both the
      # migration role's and the runtime role's passwords into it at first
      # start, and it is where `master.key` will live once
      # `docs/OPEN-QUESTIONS.md` A1 is answered. Read-write here because this
      # is the container that writes it; read-only on `server`, which only
      # reads it.
      - keys:/var/lib/fathom/keys
      # Runs once, only against a freshly created (empty) data directory --
      # the image's own entrypoint convention. See the file header and the
      # script itself for what it creates and why.
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The bootstrap role/db, not `fathom` -- they exist the instant
      # PostgreSQL itself is up, before `deploy/init-db/10-app-role.sh` has
      # necessarily run, so checking them can never race the app role's own
      # creation.
      test: ["CMD-SHELL", "pg_isready -U fathom_bootstrap -d fathom_bootstrap"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # In a real deployment this is a digest, exactly like the two above:
    #   image: ghcr.io/<org>/fathom-server@sha256:<64 hex>
    # `build:` is here so the stack can be brought up from a clean checkout
    # before any image has been published.
    image: fathom-server:wo-11
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      # 0.0.0.0 INSIDE the container, which is reachable only from this
      # network. The BINARY's default is loopback, deliberately, so that a
      # server started outside a container cannot serve the world by accident.
      FATHOM_BIND: "0.0.0.0:8080"
      # `fathom_app` -- the RUNTIME role, data privileges only, no ownership,
      # no DDL, no `CREATEROLE`. This is what every request is served
      # through. `fathom-server` itself refuses to start if the role it
      # connects as turns out to be a superuser or carry BYPASSRLS
      # (`src/rls.rs`), so a compose file that pointed this back at the
      # bootstrap role, or at the migration role below, would fail loudly at
      # startup rather than silently ship broken tenant isolation again.
      # NO PASSWORD IN THIS URL -- see §1.4 and the `db` service's comment.
      # The password comes from the key volume, by way of the variable below.
      DATABASE_URL: "postgres://fathom_app@db:5432/fathom"
      # The file `deploy/init-db/10-app-role.sh` generated at first start.
      # `fathom-server` refuses to start if this is set and the file cannot
      # be read: a silent fall back to a password from somewhere else is how
      # the credential this design moves out of the environment creeps back
      # into it.
      FATHOM_DB_PASSWORD_FILE: "/var/lib/fathom/keys/db_app.pw"
      # `fathom` -- the MIGRATION role: owns the schema, holds `CREATEROLE`,
      # used once at startup to apply outstanding migrations and to provision
      # `fathom_app`'s login (`src/db.rs::provision_runtime_login`), then not
      # held. `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0's other half of
      # the split: taking `CREATEROLE` and table ownership off the role above
      # is only real if nothing that serves a request ever holds this one.
      FATHOM_MIGRATE_DATABASE_URL: "postgres://fathom@db:5432/fathom"
      FATHOM_MIGRATE_DB_PASSWORD_FILE: "/var/lib/fathom/keys/db_migrate.pw"
      # Where the first operator's enrolment token is written, on a first
      # start and by `reissue-bootstrap-token`. See THE BOOTSTRAP TOKEN VOLUME
      # in the header for why this is not inside the key volume. The path must
      # match the mount below and the `ENV` in `deploy/Dockerfile`; all three
      # say it so that no single one of them is load-bearing.
      FATHOM_BOOTSTRAP_TOKEN_FILE: "/var/lib/fathom/bootstrap/first-operator-token"
      # THE ADDRESS OPERATOR NOTICES GO TO -- admin design §5.5's "a settings
      # change was requested" among them -- and the address the first operator
      # is created against. **Set it before the first start and you cannot set
      # it afterwards**: it is recorded once, into `site_install`, where no
      # role can update it (`migrations/0015_operator_console.sql` §C withholds
      # the privilege and raises in a trigger). §6.2 pins an organisation's
      # enrolment claim to it, which is what stops an operator reseating an
      # organisation through a channel they control -- and that pin is worth
      # nothing if the address is one nobody chose.
      #
      # THE BINARY HAS NO DEFAULT FOR THIS AND MUST NOT: a deployment that
      # bootstrapped against a guessed address would have an operator nobody
      # can reach, permanently, with no way to correct it short of destroying
      # the database.
      #
      # **So this file does not invent one either.** Read from the environment
      # or a `.env` file, same shape and same reasoning as POSTGRES_PASSWORD
      # above: a placeholder here would be an address that gets written into a
      # write-once row by every deployment that did not read this comment, and
      # the failure would not surface until somebody needed a notice. This
      # refuses at `docker compose up`, before anything has been created.
      FATHOM_OPERATOR_NOTICE_ADDRESS: ${FATHOM_OPERATOR_NOTICE_ADDRESS:?set FATHOM_OPERATOR_NOTICE_ADDRESS to the address operator notices should go to; it is recorded once, at first start, and cannot be changed afterwards}
      FATHOM_LOG: "info"
      FATHOM_HEALTH_TIMEOUT_MS: "2000"
      FATHOM_DB_POOL_SIZE: "8"
    volumes:
      # Read-only: the server reads the generated database password and, later,
      # the master key. It writes neither. **Unchanged, and deliberately so** --
      # the fix for the first-start failure was to stop writing here, not to
      # make this writable.
      - keys:/var/lib/fathom/keys:ro
      # Writable, and the only writable path this container has besides /tmp.
      # One file lives here, for about as long as it takes an operator to read
      # it. `deploy/Dockerfile` creates this directory owned by 65532 so that
      # Docker seeds the fresh volume with that ownership -- a named volume
      # whose mount point does not exist in the image is created root-owned,
      # and this container does not run as root.
      - bootstrap:/var/lib/fathom/bootstrap
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      # distroless has no shell and no curl. The binary is its own health check.
      test: ["CMD", "/fathom-server", "healthcheck", "--addr", "127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${FATHOM_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  db:
  # Holds both database roles' generated passwords -- the migration role's
  # and the runtime role's -- and will hold the master key. Anything that can
  # read this volume is a tier-3 attacker in
  # `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1's terms: if you copy it off
  # the machine, you have copied all three.
  keys:
  # One short-lived file: the first operator's enrolment token (§6.3), written
  # at first start and by `reissue-bootstrap-token`, mode 0400, and meant to be
  # deleted by hand once it has been redeemed. **Separate from `keys` on
  # purpose.** It is a bearer secret for as long as it exists, so it is not in
  # the world-readable places; but it is also the one thing in this deployment
  # the server has to WRITE, and the key volume is read-only to the server by
  # design. Two volumes is what keeps both of those true at once.
  bootstrap:
  caddy_data:
  caddy_config:
