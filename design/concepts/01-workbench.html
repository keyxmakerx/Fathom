<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fathom — concept 01 · the workbench</title>

<!-- I1a. The static-concept floor. `form-action 'none'` is not optional: a form
     submission is a navigation, not a fetch, and connect-src does not cover it
     (34 §2.3). connect-src 'none' is the assertion X0.8 makes over final bytes. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; connect-src 'none'; img-src data:; font-src data:; form-action 'none'; base-uri 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; child-src 'none'; manifest-src 'none'">
<meta name="referrer" content="no-referrer">

<!-- The one external file, relative, local. 51 §14: link the tokens, declare nothing. -->
<link rel="stylesheet" href="../tokens.css">

<style>
/* ==========================================================================
   CONCEPT 01 — THE WORKBENCH
   Zero hex, zero px font-size, zero duration, zero radius, zero shadow,
   zero transition. Every value is a token from design/tokens.css.

   Component CSS marked [54] is reused from design/prototype/finder-states.html,
   which transcribed 54 §6 (legend) and §12 (finder). It is known to render.

   The two literal px values in this file are `1100px` and `860px` in media
   queries — 52 §2.3's stated split threshold and tokens' --bp-cols. A media
   query cannot read a custom property; neither is a colour, a font size or a
   duration.
   ========================================================================== */

html, body { height: 100%; }
body { overflow: hidden; }

/* --- the sheet ---------------------------------------------------- 52 §2.2 */
.bench {
  display: grid;
  grid-template-rows: auto auto auto minmax(0, 1fr) auto;
  height: 100vh;
  border-top: var(--rule-mast) solid var(--ink);   /* the 3px masthead rule */
}

/* --- masthead ----------------------------------------------------------- */
.mast {
  padding: var(--s2) var(--s4) var(--s1);
  border-bottom: var(--rule-hair) solid var(--ink);
}
.mast-top { display: flex; align-items: baseline; justify-content: space-between;
            gap: var(--s4); flex-wrap: wrap; }
.mast h1 { margin: 0; font-size: var(--t-title); line-height: var(--lh-title);
           letter-spacing: var(--track-mast); text-transform: uppercase; }
.mast .sub { font-size: var(--t-micro); line-height: var(--lh-micro);
             color: var(--muted); letter-spacing: var(--track-label);
             text-transform: uppercase; }
.mast .ribbon { font-size: var(--t-micro); line-height: var(--lh-micro);
                color: var(--muted); }
/* the ribbon's fragments are links, not controls: no border, no box. */
.mast .ribbon button { background: none; border: 0; padding: 0; cursor: pointer;
                       color: var(--muted); font-size: var(--t-micro);
                       text-decoration: underline; text-underline-offset: 2px; }
.mast .ribbon button:hover { color: var(--ink); }
.mast .imperative { font-size: var(--t-tab); line-height: var(--lh-micro);
                    font-weight: 700; letter-spacing: var(--track-head);
                    text-transform: uppercase; margin-top: var(--s1); }

/* the card's margin tab. lowercase, always. 51 §7.7 */
.tab { font-size: var(--t-tab); line-height: var(--lh-micro); color: var(--muted);
       text-transform: lowercase; }
.tab-row { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap; }

/* the grain dial — a margin tab, not a setting. 52 §4.3 / 15 §4 */
.grain { display: flex; gap: var(--s2); align-items: baseline; }
.grain button { background: none; border: 0; padding: 0 var(--s1); cursor: pointer;
                font-size: var(--t-tab); line-height: var(--lh-micro);
                color: var(--muted); text-transform: lowercase; }
.grain button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }

/* --- risk legend. Required chrome, never collapsed. 54 §6 / V17 --- [54] -- */
.legend { display: flex; flex-wrap: wrap; gap: var(--s4);
          margin: 0; padding: var(--s1) var(--s4); list-style: none;
          background: var(--page);
          border-bottom: var(--rule-hair) solid var(--hairline); }
.legend-item { display: flex; align-items: center; gap: var(--s2);
               font-size: var(--t-micro); line-height: var(--lh-micro);
               font-weight: 700; letter-spacing: var(--track-legend);
               text-transform: uppercase;
               border-left: var(--rule-accent) solid; padding-left: var(--s2); }
.r-safe    { color: var(--safe);    background: var(--safe-wash);    border-left-color: var(--safe); }
.r-caution { color: var(--caution); background: var(--caution-wash); border-left-color: var(--caution); }
.r-danger  { color: var(--danger);  background: var(--danger-wash);  border-left-color: var(--danger); }

/* --- view band. Words and counts, never a colour. 52 §9.3 --------------- */
.band { display: flex; flex-wrap: wrap; gap: var(--s4);
        padding: var(--s1) var(--s4);
        border-bottom: var(--rule-hair) solid var(--hairline); }
.band button { background: none; border: 0; padding: 0; cursor: pointer;
               font-size: var(--t-tab); line-height: var(--lh-micro);
               color: var(--muted); text-transform: lowercase;
               min-height: var(--row-min); display: flex; align-items: center; }
.band button[aria-selected="true"] { color: var(--ink); }
.band .count { font-variant-numeric: var(--num-tabular); }
.band .changed { font-weight: 700; color: var(--ink); }

/* --- the body: two regions, edge to edge, 1px between ------------------- */
.body { display: grid; grid-template-columns: 62fr 38fr; min-height: 0; }
.body[data-pinned="false"] { grid-template-columns: 1fr; }
.canvas { min-width: 0; min-height: 0; overflow: auto; padding: var(--s3) var(--s4) var(--s6); }
.estate { min-width: 0; min-height: 0; overflow: auto;
          border-left: var(--rule-hair) solid var(--ink);
          padding: var(--s2) var(--s3) var(--s6); background: var(--surface-2); }
@media (max-width: 1100px) {
  .body, .body[data-pinned="true"] { grid-template-columns: 1fr; }
  .estate { display: none; }
}

/* --- footer: the one feedback channel. No toasts. 52 §9 ---------------- */
.foot { display: flex; gap: var(--s4); align-items: center; flex-wrap: wrap;
        padding: var(--s1) var(--s4);
        border-top: var(--rule-hair) solid var(--ink);
        font-size: var(--t-tab); line-height: var(--lh-micro); color: var(--muted); }
.foot .folio { text-transform: uppercase; letter-spacing: var(--track-label); color: var(--ink); }
.foot .msg { flex: 1; min-width: 0; }
.foot .msg:not(:empty) { color: var(--ink); }
.foot button { background: none; border: var(--rule-hair) solid var(--hairline);
               color: var(--muted); cursor: pointer; padding: 0 var(--s2);
               font-size: var(--t-tab); text-transform: lowercase; }
.foot .nav { background: none; border: 0; color: var(--muted); cursor: pointer;
             font-size: var(--t-tab); text-transform: uppercase;
             letter-spacing: var(--track-label); padding: 0; }

/* --- section furniture -------------------------------------------------- */
.head { display: flex; justify-content: space-between; align-items: baseline;
        gap: var(--s4); flex-wrap: wrap;
        border-bottom: var(--rule-hair) solid var(--ink);
        padding-bottom: var(--s1); margin: var(--s3) 0 var(--s2); }
.head:first-child { margin-top: 0; }
.head h2 { margin: 0; font-size: var(--t-head); font-weight: 700;
           letter-spacing: var(--track-head); text-transform: uppercase; }
.bay { border-bottom: var(--rule-hair) solid var(--hairline); padding-bottom: var(--s3);
       margin-bottom: var(--s3); }
.bay:last-child { border-bottom: 0; }
.bay-head { display: flex; justify-content: space-between; align-items: baseline;
            gap: var(--s3); font-size: var(--t-micro); line-height: var(--lh-micro);
            font-weight: 700; letter-spacing: var(--track-head);
            text-transform: uppercase; margin-bottom: var(--s2); }
.prose { max-width: var(--measure); font-size: var(--t-small); margin: var(--s1) 0; }
.muted { color: var(--muted); }

/* the note — 4px left accent bar on a wash. Never a box, never an icon. */
.note { border-left: var(--rule-accent) solid var(--ink);
        background: var(--surface-2); padding: var(--s2) var(--s3);
        margin: var(--s3) 0; font-size: var(--t-small); }
.note-label { font-size: var(--t-micro); font-weight: 700;
              letter-spacing: var(--track-head); text-transform: uppercase; }
.note.seam { border-left-color: var(--muted); background: var(--surface); }

/* two-column hairline table — the ERROR DECODER. No vertical rules. */
.kv { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.kv th, .kv td { text-align: left; vertical-align: top;
                 padding: var(--s1) var(--s3) var(--s1) 0;
                 border-bottom: var(--rule-hair) solid var(--hairline); }
.kv th { width: 30%; font-family: var(--mono); font-size: var(--t-mono);
         font-weight: 400; }
.kv .col-head { font-family: var(--sans); font-size: var(--t-micro);
                font-weight: 700; letter-spacing: var(--track-label);
                text-transform: uppercase; color: var(--muted); }

/* --- risk ink. Reserved-colour selectors only. 51 §3.3 ---------- [54] --- */
.hit-risk { font-size: var(--t-tab); font-weight: 700;
            letter-spacing: var(--track-legend); text-transform: uppercase;
            white-space: nowrap; }
.hit-risk.safe    { color: var(--safe); }
.hit-risk.caution { color: var(--caution); }
.hit-risk.danger  { color: var(--danger); }
.risk-mark { font-family: var(--mono); font-size: var(--t-micro); font-weight: 700; }
.risk-mark.safe    { color: var(--safe); }
.risk-mark.caution { color: var(--caution); }
.risk-mark.danger  { color: var(--danger); }

/* --- selection: three tiers, all neutrals. 52 §5.2 --------------------- */
.sel-primary { background: var(--surface); }
.sel-related { background: var(--surface-2); }
.sel-dim     { color: var(--muted); }
.gutter { font-family: var(--mono); font-size: var(--t-micro); color: var(--muted);
          display: inline-block; min-width: var(--gutter-num); text-align: right;
          padding-right: var(--s2); white-space: nowrap;
          font-variant-numeric: var(--num-tabular); }

/* --- finder ------------------------------------------------------ [54] -- */
.finder-input-row { display: flex; align-items: stretch;
                    border: var(--rule-hair) solid var(--hairline); }
.finder-key { display: flex; align-items: center; flex: none;
              font-family: var(--mono); font-size: var(--t-micro);
              letter-spacing: 0.06em; color: var(--muted);
              padding: 0 var(--s3); border-right: var(--rule-hair) solid var(--hairline); }
.finder-q { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink);
            font-family: var(--mono); font-size: var(--t-mast);
            padding: var(--s2) var(--s3); outline: none; }
.finder-q::placeholder { color: var(--muted); }
.finder-q:focus-visible { outline: none; background: var(--surface); }
.finder-input-row:has(.finder-q:focus-visible) { border-bottom: var(--focus-width) solid var(--ink); }
.finder-meta { display: flex; align-items: center; flex: none; padding: 0 var(--s3);
               font-size: var(--t-micro); color: var(--muted);
               letter-spacing: var(--track-label); text-transform: uppercase;
               font-variant-numeric: var(--num-tabular); }

.rows { list-style: none; margin: 0; padding: 0; }
.row { display: block; width: 100%; text-align: left; background: none;
       border: 0; border-bottom: var(--rule-hair) solid var(--hairline);
       padding: var(--s2) var(--s3) var(--s2) 0; cursor: pointer;
       min-height: var(--row-min); font: inherit; color: inherit; }
.row:hover { background: var(--surface-2); }
.row.sel-primary { background: var(--surface); }
.row-cmd { display: flex; align-items: baseline; gap: var(--s3);
           font-family: var(--mono); font-size: var(--t-mono); }
.row-cmd .txt { flex: 1; min-width: 0; }
.row-ans { display: block; color: var(--muted); font-size: var(--t-small); }
.row-read { display: block; font-size: var(--t-small); margin-top: var(--s1);
            padding-left: var(--s3);
            border-left: var(--rule-hair) solid var(--hairline); }
.expand { padding: var(--s2) var(--s3) var(--s3) var(--gutter-num);
          border-bottom: var(--rule-hair) solid var(--hairline);
          background: var(--surface-2); }
.block-label { font-size: var(--t-micro); font-weight: 700;
               letter-spacing: var(--track-head); text-transform: uppercase;
               color: var(--muted); margin: var(--s3) 0 var(--s1); }
.stamp { font-family: var(--mono); font-size: var(--t-tab); color: var(--muted); }

/* --- config ------------------------------------------------------------- */
.cfg { border-left: var(--rule-accent) solid var(--ink); background: var(--surface); }
.cfg-line { display: grid; grid-template-columns: calc(var(--gutter-num) + var(--s3)) 1fr auto;
            gap: var(--s2); width: 100%; text-align: left; background: none;
            border: 0; border-bottom: var(--rule-hair) solid var(--hairline);
            padding: var(--s1) var(--s3) var(--s1) 0; cursor: pointer;
            font-family: var(--mono); font-size: var(--t-mono);
            line-height: var(--lh-step); color: inherit; min-height: var(--row-min); }
.cfg-line:hover { background: var(--surface-2); }
.cfg-line.sel-primary { background: var(--page); }
.cfg-text { white-space: pre-wrap; word-break: break-word; }
.cfg-note { background: var(--page); padding: var(--s2) var(--s3);
            border-bottom: var(--rule-hair) solid var(--hairline);
            font-family: var(--mono); font-size: var(--t-tab); color: var(--muted); }
.cfg-mode { display: flex; gap: var(--s3); }
.cfg-mode button { background: none; border: 0; cursor: pointer; padding: 0;
                   font-size: var(--t-tab); color: var(--muted); text-transform: lowercase; }
.cfg-mode button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }

/* --- findings: severity is a 4px left bar in four tones. 52 §3.5.1 ------ */
.finding { border-left: var(--rule-accent) solid transparent;
           border-bottom: var(--rule-hair) solid var(--hairline);
           padding: var(--s2) var(--s3); }
.sev-high { border-left-color: var(--ink); }
.sev-med  { border-left-color: var(--muted); }
.sev-low  { border-left-color: var(--hairline); }
.sev-info { border-left-color: transparent; }
.st-pending    { border-left-style: var(--rule-style-pending); }
.st-suppressed { border-left-color: transparent;
                 border-left-style: solid;
                 background-image: var(--hatch);
                 background-size: var(--rule-accent) 100%;
                 background-repeat: no-repeat; color: var(--muted); }
.st-suppressed .f-title { text-decoration: line-through; }
.f-grid { display: grid; grid-template-columns: minmax(0, 30%) minmax(0, 1fr);
          gap: var(--s1) var(--s4); }
.f-key { font-family: var(--mono); font-size: var(--t-mono); word-break: break-word; }
.f-title { font-size: var(--t-body); font-weight: 700; }
.f-line { font-size: var(--t-small); margin-top: var(--s1); }
.f-label { font-size: var(--t-micro); font-weight: 700; letter-spacing: var(--track-label);
           text-transform: uppercase; color: var(--muted); }
.f-acts { display: flex; gap: var(--s3); margin-top: var(--s2); flex-wrap: wrap; }
.act { background: var(--page); border: var(--rule-hair) solid var(--hairline);
       color: var(--ink); cursor: pointer; padding: 0 var(--s2);
       min-height: var(--row-min);
       font-size: var(--t-tab); letter-spacing: var(--track-label);
       text-transform: uppercase; }
.act:hover { background: var(--surface); }

/* --- diagram ------------------------------------------------------------ */
.layers { display: flex; gap: var(--s3); flex-wrap: wrap; }
.layers button { background: none; border: 0; cursor: pointer; padding: 0;
                 font-size: var(--t-tab); color: var(--muted); text-transform: lowercase; }
.layers button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
svg.dgm { width: 100%; height: auto; display: block; }
svg.dgm text { font-family: var(--mono); font-size: var(--t-mono); fill: var(--ink); }
svg.dgm text.lbl { font-family: var(--sans); font-size: var(--t-micro);
                   fill: var(--muted); letter-spacing: var(--track-label); }
svg.dgm .box { fill: var(--page); stroke: var(--ink); stroke-width: var(--rule-hair); }
svg.dgm .box.sel-primary { fill: var(--surface); }
svg.dgm .box.sel-related { fill: var(--surface-2); }
svg.dgm .edge { stroke: var(--ink); stroke-width: var(--rule-hair); fill: none; }
svg.dgm .edge.sel-primary { stroke-width: var(--rule-mast); }
svg.dgm g[tabindex]:focus-visible { outline: var(--focus-width) solid var(--focus-colour);
                                    outline-offset: var(--focus-offset-outset); }

/* --- inventory ---------------------------------------------------------- */
.inv { width: 100%; border-collapse: collapse; font-size: var(--t-small); }
.inv th { text-align: left; font-size: var(--t-micro); font-weight: 700;
          letter-spacing: var(--track-label); text-transform: uppercase;
          color: var(--muted); padding: var(--s1) var(--s3) var(--s1) 0;
          border-bottom: var(--rule-hair) solid var(--ink); }
.inv td { text-align: left; vertical-align: top; padding: var(--s1) var(--s3) var(--s1) 0;
          border-bottom: var(--rule-hair) solid var(--hairline); }
.inv tr { cursor: pointer; }
.inv tr:hover td { background: var(--surface-2); }
.inv .mono { font-family: var(--mono); font-size: var(--t-mono); }
.inv .opinion { white-space: nowrap; font-variant-numeric: var(--num-tabular); }
.inv-mode { display: flex; gap: var(--s3); }
.inv-mode button { background: none; border: 0; cursor: pointer; padding: 0;
                   font-size: var(--t-tab); color: var(--muted); text-transform: lowercase; }
.inv-mode button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }

/* --- estate rail -------------------------------------------------------- */
.rail-item { display: block; width: 100%; text-align: left; background: none;
             border: 0; border-bottom: var(--rule-hair) solid var(--hairline);
             padding: var(--s1) var(--s2) var(--s1) 0; cursor: pointer;
             font: inherit; color: inherit; min-height: var(--row-min); }
.rail-item:hover { background: var(--page); }
.rail-item.sel-primary { background: var(--surface); }
.rail-item.sel-related { background: var(--page); }
.rail-k { font-family: var(--mono); font-size: var(--t-mono); }
.rail-v { display: block; font-size: var(--t-tab); color: var(--muted); }

/* --- sheets: full-bleed, 1px ink border, page scrim. No shadow. 51 §11 -- */
.scrim { position: fixed; inset: 0; background: var(--page);
         opacity: var(--scrim-opacity); z-index: var(--z-modal); }
.sheet { position: fixed; z-index: var(--z-modal);
         left: 50%; transform: translateX(-50%);
         width: min(var(--sheet-card), calc(100vw - var(--s6)));
         background: var(--page); border: var(--rule-hair) solid var(--ink);
         display: flex; flex-direction: column; }
.sheet[hidden] { display: none; }
.finder-sheet { top: var(--s7); max-height: 60vh; }
.doc-sheet { top: var(--s5); max-height: 82vh; }
.sheet-body { overflow: auto; padding: var(--s3) var(--s4) var(--s5); min-height: 0; }
.sheet-head { flex: none; display: flex; justify-content: space-between;
              align-items: baseline; gap: var(--s4); padding: var(--s2) var(--s4);
              border-bottom: var(--rule-hair) solid var(--ink); }
.sheet-head h2 { margin: 0; font-size: var(--t-mast); font-weight: 700;
                 letter-spacing: var(--track-head); text-transform: uppercase; }
.sheet-foot { flex: none; display: flex; justify-content: space-between; gap: var(--s4);
              padding: var(--s1) var(--s4);
              border-top: var(--rule-hair) solid var(--hairline);
              font-size: var(--t-tab); color: var(--muted); }

/* --- forced colours. 51 §6: severity switches tone → width -------------- */
@media (forced-colors: active) {
  .sev-high { border-left-width: var(--rule-accent); }
  .sev-med  { border-left-width: 2px; }
  .sev-low  { border-left-width: var(--rule-hair); }
  .sev-info { border-left-width: 0; }
  .st-suppressed { background-image: none; border-left-style: dashed; }
}
</style>
</head>
<body>

<div class="bench">

  <header class="mast" id="mast" tabindex="-1">
    <div class="mast-top">
      <h1>Fathom</h1>
      <div class="tab-row">
        <span class="tab" id="mast-tab">read this first</span>
        <div class="grain" role="group" aria-label="Explainer depth — the bench grain">
          <button type="button" data-grain="terse">terse</button>
          <button type="button" data-grain="explained">explained</button>
          <button type="button" data-grain="teaching">teaching</button>
        </div>
      </div>
    </div>
    <div class="sub" id="mast-sub"></div>
    <div class="ribbon" id="mast-ribbon"></div>
    <div class="imperative" id="mast-imp"></div>
  </header>

  <ul class="legend" aria-label="Risk legend">
    <li class="legend-item r-safe">Read-only — safe on production</li>
    <li class="legend-item r-caution">Changes config — needs a commit</li>
    <li class="legend-item r-danger">Disruptive — drops live traffic</li>
  </ul>

  <nav class="band" id="band" role="tablist" aria-label="Views" tabindex="-1"></nav>

  <div class="body" id="body" data-pinned="true">
    <main class="canvas" id="canvas" role="tabpanel" aria-label="View body" tabindex="-1"></main>
    <aside class="estate" id="estate" aria-label="Estate and seams" tabindex="-1"></aside>
  </div>

  <footer class="foot" id="foot" tabindex="-1">
    <span class="folio" id="folio"></span>
    <button type="button" class="nav" id="nav-prev"></button>
    <button type="button" class="nav" id="nav-next"></button>
    <span class="msg" id="msg" role="status" aria-live="polite"></span>
    <span id="offline-stamp"></span>
    <button type="button" id="btn-keys">? keymap</button>
    <button type="button" id="btn-thesis">thesis</button>
    <button type="button" id="btn-theme">theme</button>
  </footer>

</div>

<div class="scrim" id="scrim" hidden></div>

<div class="sheet finder-sheet" id="finder-sheet" hidden role="dialog" aria-modal="true" aria-label="Command finder">
  <div id="finder-overlay-body"></div>
</div>

<div class="sheet doc-sheet" id="doc-sheet" hidden role="dialog" aria-modal="true" aria-labelledby="doc-title">
  <div class="sheet-head">
    <h2 id="doc-title">Sheet</h2>
    <span class="tab">esc closes</span>
  </div>
  <div class="sheet-body" id="doc-body"></div>
  <div class="sheet-foot">
    <span>a sheet is a ground, not a shadow — 51 §11</span>
    <button type="button" class="act" id="doc-close">Close</button>
  </div>
</div>

<script>

 { id:'junos-srx/flow.tcp-mss.set-ipsec', cmd:['set security flow tcp-mss ipsec-vpn mss 1360'],

var FINDINGS = [
 { id:'ipsec.pfs.absent', ver:'2.1.0', pack:'fathom.ipsec 0.1.0', sev:'high', state:'active',
   cat:'security', conf:'definite', node:'ipsec-pol', nodeLabel:'IpsecPolicy IPSEC-POL', order:1,
   title:'Perfect Forward Secrecy is not configured',
   why:'Without PFS, Phase 2 keys derive from Phase 1 key material. One compromised IKE SA secret unlocks every data key derived under it, including traffic somebody recorded off the wire months ago.',
   symptom:'PFS on one side and absent on the other fails Phase 2 while Phase 1 stays up — the classic “IKE looks fine but the tunnel keeps dropping”. The log shows <span class="m-caps">NO_PROPOSAL_CHOSEN</span> on the Phase 2 exchange, not Phase 1. Under IKEv2 the first child SA is keyed from the IKE SA and installs regardless, so the failure surfaces at the first <span class="m-caps">CREATE_CHILD_SA</span> rekey — up to <code>lifetime-seconds</code> after the change.',
   remediation:['set security ipsec policy IPSEC-POL \\','  perfect-forward-secrecy keys group14'],
   remediationRisk:'ChangesConfig',
   acceptable:'Interoperating with a peer whose platform cannot offer PFS at all — some older appliances and a small number of cloud VPN services. Compensate with a shorter Phase 2 lifetime so a compromised IKE SA exposes less recorded traffic, and record the peer and the date in the change ticket.',
   sources:['RFC 7296 §1.3','RFC 8247 §2.4','card srx-ipsec side 2 · PERFECT FORWARD SECRECY'],
   explain:{
     terse:'PFS not set — Phase 2 keys derive from Phase 1.',
     explained:'<code>perfect-forward-secrecy keys &lt;group&gt;</code> on the IPsec policy makes each Phase 2 negotiation run its own Diffie-Hellman exchange. Without it every child key under this IKE SA falls with the IKE SA. Check the peer sets the same group — not merely a compatible one.',
     teaching:'With PFS, each Phase 2 negotiation runs a fresh Diffie-Hellman exchange, so the key is mathematically independent of Phase 1 and of every previous Phase 2 key. Breaking one yields exactly one rekey interval of traffic and nothing on either side of it. That is the “forward” in forward secrecy: today’s break cannot read yesterday’s capture. Three things bite. The group must be identical at both ends, not merely compatible. PFS on one side and absent on the other fails Phase 2 while Phase 1 stays up, which is the most misread symptom in IPsec. And the PFS group need not equal the Phase 1 <code>dh-group</code>, but matching them removes a whole class of confusion. Cost is one extra DH exponentiation per SA per rekey — irrelevant unless hundreds of tunnels rekey together. Turn it on.'} },

 { id:'zone.host-inbound.ike-missing', ver:'1.3.0', pack:'fathom.ipsec 0.1.0', sev:'high',

   sources:['card srx-ipsec side 1 · THE FIVE PLUMBING PIECES','card srx-ipsec side 4 · THINGS THAT BITE'],
   explain:{

     explained:'<code>external-interface</code> is the WAN unit the IKE packets leave by, not <code>st0</code>. The zone that unit sits in must permit inbound IKE, or the box drops the peer’s IKE before processing it.',

 { id:'tunnel.st0.zone-unbound', ver:'1.1.0', pack:'fathom.ipsec 0.1.0', sev:'high', state:'active',
   cat:'correctness', conf:'definite', node:'st0-0', nodeLabel:'LogicalUnit st0.0', order:3,

   explain:{
     terse:'<code>st0</code> unit is in no security zone.',
     explained:'<code>set security zones security-zone VPN interfaces st0.0</code> puts the tunnel interface in a zone so a policy can reference it. Without it there is no zone pair to write a policy for, and the SRX has nowhere to send the packet.',
     teaching:'The SA proves crypto, not reachability. Phase 1 and Phase 2 can both be perfect while the tunnel passes nothing, and the split between “the crypto worked” and “the packet got somewhere” is the most useful diagnostic boundary on an SRX. Four plumbing pieces produce this same silent symptom: no tunnel interface, no zone on it, nothing routed at it, and no policy for the zone pair. All four read UP and pass zero packets. Only the missing host-inbound IKE fails loudly, and it fails at Phase 1 instead. So when the SAs are clean and traffic is not flowing, stop reading proposals.'} },

 { id:'mtu.mss-clamp.absent', ver:'1.2.0', pack:'fathom.ipsec 0.1.0', sev:'med', state:'active',

    if (e.cmd.join(' ').toLowerCase().indexOf(t) >= 0) s += 3;
    e.aka.forEach(function (a) { if (a.toLowerCase().indexOf(t) >= 0) s += 4; });
    if (e.answers.toLowerCase().indexOf(t) >= 0) s += 2;
    e.tags.forEach(function (g) { if (g.indexOf(t) >= 0) s += 1; });
    if (e.id.toLowerCase().indexOf(t) >= 0) s += 1;
  });
  return s;
}
function ranked(q) {
  var all = ENTRIES.map(function (e) { return { e:e, s:score(e, q) }; })
                   .filter(function (r) { return !q || r.s > 0; });
  /* the cutoff (16 §3.6). A weak partial match is not a result — it is noise
     with a score. Deterministic: a fixed fraction of the top score, never a
     fixed count and never a relevance threshold that drifts with the corpus. */
  var top = all.reduce(function (m, r) { return Math.max(m, r.s); }, 0);
  var out = q ? all.filter(function (r) { return r.s >= top * 0.55; }) : all;
  /* deterministic: score desc, risk prior (Disruptive last — a safety control,
     not a relevance signal), weight desc, id asc. Never recency. */
  var prior = { ReadOnly:0, ChangesConfig:1, Disruptive:2 };
  out.sort(function (a, b) {
    return (b.s - a.s) || (prior[a.e.risk] - prior[b.e.risk]) ||
           (b.e.weight - a.e.weight) || (a.e.id < b.e.id ? -1 : 1);
  });
  return out.map(function (r) { return r.e; });
}

function finderRow(e, i, scope) {

    h += '<div class="f-acts">';
    h += '<button type="button" class="act" data-act="copy" data-id="' + esc(e.id) + '">⏎ copy</button>';

function renderFinder() {

       'rules carrying <code>platforms</code> and <code>versions</code> predicates, a <code>fex</code> condition, ' +

  return h;
}

function dgmNode(id) { for (var i = 0; i < DGM.length; i++) if (DGM[i].id === id) return DGM[i]; return null; }

function renderDiagram() {

         'data-act="dgm" data-node="' + n.id + '" data-i="' + i + '" ' +
         'aria-label="' + esc(n.t + ' ' + n.s) + '" style="cursor:pointer">' +
         '<rect class="box ' + t + '" x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '"></rect>' +
         '<text x="' + (n.x + 8) + '" y="' + (n.y + 18) + '">' + (t === 'sel-primary' ? '▸' : '') + esc(n.t) + '</text>' +
         '<text class="lbl" x="' + (n.x + 8) + '" y="' + (n.y + 34) + '">' + esc(n.s) + '</text></g>';
  });
  h += '</svg>';
  h += '<div class="note"><span class="note-label">A design tool, not a source of truth</span>' +
       '<div class="prose">SRX-B is marked <code>parsed 2026-07-24</code>; everything else is hand-entered on the ' +
       'same date. Nothing on this screen is live, nothing polls, and nothing here is current — ' +
       'it is a document. ADR-0006 cuts this view to an SVG export for v1, which is a real cost: it removes the ' +
       'product’s only demonstrable surface.</div></div>';
  h += '<div class="note seam"><span class="note-label">This is where a new layer plugs in — M10</span>' +
       '<div class="prose">A new diagram layer is <code>⌥L</code> and a tag in the schema. New functionality lands ' +
       'as a mode of an existing view, a layer that opens inside all of them, a new inventory kind or a new rule ' +
       'pack — <b>never as a seventh tab</b>. The precedent is already set twice: <code>verify(diff(graph))</code> ' +
       'became config·change set, and <code>explain(node, depth)</code> became the grain.</div></div>';
  return h;
}

/* ==========================================================================
   VIEW 6 — INVENTORY.  table(graph), two kinds.
     estate   — the fixture, with the opinions column and population rules.
     artifact — table(artifact). The offline-provenance surface, and an
                example of M10: a new inventory KIND, not a seventh view.
   ========================================================================== */
/* The rightmost column is not a field — it is the per-row finding aggregate.
   A Device row rolls up its closure, because a device whose gateway has three
   high findings does not have zero. Sorting by it sorts worst-severity first. */
function opinionFor(id) {
  var e = ESTATE.filter(function (x) { return x.id === id; })[0];
  var scope = [id];
  if (e && e.kind === 'Device') scope = scope.concat(CLOSURE[id] || []);
  var hi = 0, me = 0;
  FINDINGS.forEach(function (f) {
    if (scope.indexOf(f.node) < 0 || findingState(f) !== 'active') return;
    if (f.sev === 'high') hi++; else me++;
  });
  if (!hi && !me) return '—';
  return (hi ? hi + ' high' : '') + (hi && me ? ' · ' : '') + (me ? me + ' med' : '');
}

function renderInventory() {
  var h = '';
  h += '<div class="head"><h2>Inventory · ' + (state.invMode === 'estate' ? 'table(graph)' : 'table(artifact)') + '</h2>' +
       '<div class="inv-mode" role="group" aria-label="Inventory kind">' +
       '<button type="button" data-act="inv-mode" data-m="estate" aria-pressed="' + (state.invMode === 'estate') + '">estate</button>' +
       '<button type="button" data-act="inv-mode" data-m="artifact" aria-pressed="' + (state.invMode !== 'estate') + '">artifact</button>' +
       '</div></div>';

  if (state.invMode === 'estate') {
    h += '<div class="tab-row"><span class="tab">fixture · not corpus data</span>' +
         '<span class="tab">columns are generated from <code>schema.yaml</code>, not hand-written</span>' +
         '<span class="tab">the rightmost column is not a field</span></div>';
    h += '<table class="inv"><thead><tr><th>Kind</th><th>Name</th><th>Site</th>' +
         '<th>Detail</th><th>Provenance</th><th>Findings</th></tr></thead><tbody>';
    ESTATE.forEach(function (e, i) {
      var t = tier(e.id);
      h += '<tr class="' + t + '" data-act="inv-row" data-node="' + e.id + '" data-i="' + i +
           '" tabindex="' + (state.cursor.inventory === i ? '0' : '-1') + '">' +
           '<td class="mono">' + (t === 'sel-primary' ? '▸ ' : '') + esc(e.kind) + '</td>' +
           '<td class="mono">' + esc(e.name) + '</td><td>' + esc(e.site) + '</td>' +
           '<td>' + e.detail + '</td><td class="muted">' + esc(e.prov) + '</td>' +
           '<td class="opinion">' + opinionFor(e.id) + '</td></tr>';
    });
    h += '</tbody></table>';

    h += '<div class="note"><span class="note-label">Two SRX devices in DC-EAST, no cluster</span>' +
         '<div class="prose">SRX-A carries <code>reth0.0</code>, and a <code>reth</code> exists only on a chassis ' +
         'cluster. SRX-C is the same model at the same site. <b>Nothing here says they are a cluster</b> — ' +
         'Fathom is guessing from two facts, and it is telling you which two.</div>' +
         '<div class="f-acts"><button type="button" class="act" data-act="pop" data-v="model">model it</button>' +
         '<button type="button" class="act" data-act="pop" data-v="not">not a cluster</button></div></div>';

    h += '<div class="note"><span class="note-label">This estate is a fixture</span>' +
         '<div class="prose">No inventory fixture ships in the corpus. This table is derived from the worked ' +
         'topology in <code>.context/field-card-srx-ipsec.txt</code> — hub and spoke, <code>reth0.0</code>, ' +
         '<code>st0.0</code> at <code>10.255.0.1/30</code>, <code>GW-B</code> at <code>203.0.113.10</code>, ' +
         '<code>TS1 10.1.0.0/16 ↔ 10.2.0.0/16</code>, zones TRUST / VPN / WAN, policy <code>TO-B</code>. ' +
         'Every command, answer, risk band, rule and explainer elsewhere on this page is corpus. ' +
         'This one table is not, and presenting invented inventory as corpus data is the one dishonesty ' +
         'this design system has no device for.</div></div>';

    h += '<div class="note seam"><span class="note-label">This is where a new node kind plugs in — M7</span>' +
         '<div class="prose"><code>schema.yaml</code> is a build input consumed by six subsystems. A new node kind ' +
         'gives you new inventory columns, new diagram nodes, new rule targets and new explainer subjects at once, ' +
         'with no UI code. Every schema enum has a generated <code>Unknown(token)</code> arm, so an unrecognised ' +
         'vendor value renders rather than crashing.</div></div>';
  } else {
    h += '<div class="tab-row"><span class="tab">no sockets, ever</span>' +
         '<span class="tab">the rightmost column is where each claim is checked</span>' +
         '<span class="tab">this is an inventory kind, not a seventh view</span></div>';
    h += '<table class="kv"><thead><tr><th class="col-head">Fact</th>' +
         '<td class="col-head">What it says</td><td class="col-head">Checked by</td></tr></thead><tbody>';
    ARTIFACT.forEach(function (r) {
      h += '<tr><th>' + esc(r[0]) + '</th><td>' + r[1] + '</td><td class="muted">' + esc(r[2]) + '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="note"><span class="note-label">Why this is a table and not a badge</span>' +
         '<div class="prose">A shield, a lock or a green tick would assert trust and be uncheckable. ' +
         'A table states each claim, in the card’s own two-column decoder shape, next to the thing that ' +
         'enforces it — so a sceptical reader can go and verify it. Green in particular is unavailable: ' +
         '<code>--safe</code> means <b>read-only, safe on production</b> and nothing else, forever. ' +
         'Reusing it for “offline” would be the single most visible failure this concept could make.</div></div>';
  }
  return h;
}

/* ==========================================================================
   THE ESTATE COLUMN.  Always present ≥1100px. Three bays: the estate, the
   loaded rule packs, and the bench's own seams. A workbench shows its fixtures.
   ========================================================================== */
function renderEstate() {
  var h = '';
  h += '<div class="bay"><div class="bay-head"><span>Estate</span><span class="tab">fixture · not corpus data</span></div>';
  ESTATE.forEach(function (e) {
    var t = tier(e.id);
    h += '<button type="button" class="rail-item ' + t + '" data-act="rail" data-node="' + e.id + '">' +
         '<span class="rail-k">' + (t === 'sel-primary' ? '▸ ' : '') + esc(e.name) + '</span>' +
         '<span class="rail-v">' + esc(e.kind) + ' · ' + opinionFor(e.id) + '</span></button>';
  });
  h += '</div>';

  h += '<div class="bay"><div class="bay-head"><span>Rule packs</span><span class="tab">signed, versioned, scoped</span></div>';
  PACKS.forEach(function (p) {
    h += '<div class="rail-item" style="cursor:default"><span class="rail-k">' + esc(p.id) + ' ' + esc(p.version) + '</span>' +
         '<span class="rail-v">' + p.rules + ' rules · ' + esc(p.signer) + '</span>' +
         '<span class="rail-v">' + esc(p.reviewed) + '</span></div>';
  });
  h += '<div class="note seam" style="margin:var(--s2) 0 0"><span class="note-label">This is where a new rule pack plugs in</span>' +
       '<div class="prose">Drop a signed pack in and MPLS, BGP or NAT findings appear on rows that had none ' +
       'yesterday. No code. The trust store is scoped — yes for who, not for what — and there is no ' +
       'trust-on-first-use.</div></div></div>';

  h += '<div class="bay"><div class="bay-head"><span>The bench itself</span><span class="tab">seams, drawn</span></div>';
  h += '<div class="prose muted" style="font-size:var(--t-tab)">The view band, the footer, <code>⌥1</code>–<code>⌥6</code> ' +
       'and <code>⌥←</code>/<code>⌥→</code> are all generated from one array. A view is three functions:</div>';
  h += '<table class="kv" style="margin-top:var(--s2)"><tbody>' +
       '<tr><th>primary</th><td>(sel, g) → ElementId?</td></tr>' +
       '<tr><th>resolve</th><td>(sel) → ViewHighlight — pure, never mutates</td></tr>' +
       '<tr><th>select_at</th><td>(hit) → Selection?</td></tr></tbody></table>';
  h += '<div class="prose muted" style="font-size:var(--t-tab);margin-top:var(--s2)">Registered now: ' +
       VIEWS.map(function (v) { return '<code>' + v.id + '</code>'; }).join(' · ') +
       '. The core never knows a view exists. A view that needs a fourth function is holding private state, ' +
       'and the review question is “why”.</div>';
  h += '<div class="note seam" style="margin:var(--s2) 0 0"><span class="note-label">And the cap that keeps it honest</span>' +
       '<div class="prose">The render layer is capped at 800 lines with CI failing above it. Not because 800 is ' +
       'magic, but because the failure mode is gradual and a number is the only thing that makes it visible. ' +
       'The 801st line becomes a design conversation.</div></div></div>';
  return h;
}


/* ==========================================================================
   THE SHELL.  Furniture that does not move; one region that does.
   The sheet never scrolls. The canvas and the estate column each scroll
   inside themselves, which is what makes "a view switch never scrolls the
   previous view" implementable rather than aspirational.
   ========================================================================== */
function ribbonText() {
  var a = state.sel.anchor;
  if (!a) return '';
  var parts = ['selected: ' + elLabel(a)];
  var c = selCount('config'); parts.push(c ? c + ' lines in config' : 'no lines in config');
  var f = selCount('findings'); parts.push(f ? f + ' findings' : 'no findings');
  parts.push(dgmNode(a) && state.layers[dgmNode(a).layer] ? '1 node in diagram' : 'not in this diagram layer');
  parts.push('facet ' + state.sel.facet);
  return parts.map(function (p, i) {
    return i === 0 ? esc(p)
      : '<button type="button" class="nav" style="text-transform:none;letter-spacing:0" data-act="ribbon" data-p="' +
        esc(p) + '">' + esc(p) + '</button>';
  }).join(' · ');
}

function renderBand() {
  return VIEWS.map(function (v, i) {
    var cur = v.id === state.view;
    return '<button type="button" role="tab" data-act="view" data-v="' + v.id + '" aria-selected="' + cur +
           '" tabindex="' + (cur ? '0' : '-1') + '">' + (cur ? '▸' : '') +
           '<span class="count' + (state.changed[v.id] && !cur ? ' changed' : '') + '">' + esc(val(v.tab())) +
           '</span></button>';
  }).join('');
}

function render() {
  var v = curView();
  /* remember where each view was, restore where it was. 52 §3.8 rule 2. */
  $('#mast-tab').textContent = val(v.margin);
  $('#mast-sub').innerHTML = 'SRX-A · workspace <span class="m">dc-east</span> · junos-srx 21.4R3 · corpus 0.1.0 · <b>unverified</b>';
  $('#mast-ribbon').innerHTML = ribbonText();
  $('#mast-imp').textContent = val(v.imperative);
  $('#band').innerHTML = renderBand();
  $('#body').setAttribute('data-pinned', String(state.pinned));
  $('#canvas').innerHTML = v.render();
  $('#estate').innerHTML = renderEstate();

  var i = viewIdx();
  $('#folio').textContent = 'VIEW ' + (i + 1) + ' OF 6 — ' + v.label.toUpperCase();
  $('#nav-prev').textContent = i > 0 ? '⌥← ' + VIEWS[i - 1].label.toUpperCase() : '';
  $('#nav-next').textContent = i < 5 ? VIEWS[i + 1].label.toUpperCase() + ' ⌥→' : '';
  $('#nav-prev').hidden = i === 0;
  $('#nav-next').hidden = i === 5;
  $('#msg').textContent = state.msg;
  $('#offline-stamp').innerHTML = 'offline artifact · <span class="m">connect-src \'none\'</span> · 2 wasm imports';
  Array.prototype.forEach.call(document.querySelectorAll('.grain [data-grain]'), function (b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-grain') === state.grain));
  });
  if (state.overlay === 'finder') $('#finder-overlay-body').innerHTML = overlayFinder();
  if (state.scroll[state.view] != null) $('#canvas').scrollTop = state.scroll[state.view];
}

function overlayFinder() {
  return '<div class="sheet-head"><h2>Finder</h2><span class="tab">ten times a day is not a modal — ' +
         'the masthead and the legend stay visible</span></div>' +
         '<div class="sheet-body">' + finderMarkup('overlay') + '</div>' +
         '<div class="sheet-foot"><span>junos-srx · corpus 0.1.0 · unverified</span>' +
         '<span>↑↓ move · ⏎ copy · → expand · esc closes</span></div>';
}

function setView(id) {
  if (id === state.view) return;
  state.scroll[state.view] = $('#canvas').scrollTop;
  state.view = id;
  state.changed[id] = false;
  say('');
  render();
  $('#canvas').focus();
}

/* --- overlays: full-bleed sheets on --page with a --page scrim ---------- */
function openSheet(kind) {
  state.overlay = kind;
  $('#scrim').hidden = false;
  if (kind === 'finder') {
    $('#finder-sheet').hidden = false;
    $('#finder-overlay-body').innerHTML = overlayFinder();
    var q = $('#q-overlay'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  } else {
    $('#doc-sheet').hidden = false;
    $('#doc-title').textContent = kind === 'keys' ? 'Keymap' : 'Thesis — concept 01, the workbench';
    $('#doc-body').innerHTML = kind === 'keys' ? KEYMAP_HTML : THESIS_HTML;
    $('#doc-close').focus();
  }
}
function closeSheet() {
  state.overlay = null;
  $('#scrim').hidden = true;
  $('#finder-sheet').hidden = true;
  $('#doc-sheet').hidden = true;
  $('#canvas').focus();
}

/* ==========================================================================
   ACTIONS.  Every verb is reachable by pointer AND by key. A binding with no
   visible affordance is a feature only the author has.
   ========================================================================== */
function toggleExpand(k) { if (state.expanded[k]) { delete state.expanded[k]; delete state.blockGrain[k]; } else state.expanded[k] = true; }

function doFix(id) {
  state.cfgMode = 'changeset';
  state.changed.config = true;
  setView('config');
  say('change set from ' + id + ' — commit confirmed 5 is line 1, rollback is last');
  render();
}
function armRule(r) { state.armed[r] = true; state.changed.findings = true; }

function actOn(el) {
  var a = el.getAttribute('data-act');
  if (!a) return false;
  var node = el.getAttribute('data-node');
  switch (a) {
    case 'view': setView(el.getAttribute('data-v')); return true;
    case 'ribbon': {
      var p = el.getAttribute('data-p') || '';
      if (p.indexOf('config') >= 0) setView('config');
      else if (p.indexOf('findings') >= 0) setView('findings');
      else if (p.indexOf('diagram') >= 0) setView('diagram');
      else say('facet ' + state.sel.facet + ' — narrowing is lossy, so the facet is carried, not inferred');
      render(); return true;
    }
    case 'finder-row': {
      var k = el.getAttribute('data-k');
      state.cursor.finder = +el.getAttribute('data-i');
      if (node) select(node, 'Element', 'finder');
      toggleExpand(k); render(); return true;
    }
    case 'cfg-line': {
      state.cursor.config = +el.getAttribute('data-i');
      select(node, 'Line', 'config');
      toggleExpand(el.getAttribute('data-k'));
      say('selection is over the graph, never over the rendering — this line’s source_node is ' + node);
      render(); return true;
    }
    case 'f-row': {
      state.cursor.findings = +el.getAttribute('data-i');
      select(node, 'Finding', 'findings');
      toggleExpand(el.getAttribute('data-k')); render(); return true;
    }
    case 'dgm': {
      state.cursor.diagram = +el.getAttribute('data-i');
      select(node, 'Element', 'diagram');
      say('the diagram’s emit closure is highlighted in config — ⌥3');
      state.changed.config = true; render(); return true;
    }
    case 'inv-row': {
      state.cursor.inventory = +el.getAttribute('data-i');
      select(node, 'Element', 'inventory'); render(); return true;
    }
    case 'rail': select(node, 'Element', 'inventory'); render(); return true;
    case 'to-findings': if (node) select(node, 'Finding', 'findings'); setView('findings'); return true;
    case 'to-inventory': if (node) select(node, 'Element', 'inventory'); state.invMode = 'estate'; setView('inventory'); return true;
    case 'to-walk': setView('walkthrough'); say('w — the task that builds this'); render(); return true;
    case 'scoped-finder': state.query = 'ike'; openSheet('finder'); say('Ctrl+K scoped to this line’s platform and phase'); render(); return true;
    case 'copy': say('copied · ' + el.getAttribute('data-id') + ' — paste it into your own terminal; Fathom never touches the box'); render(); return true;
    case 'fix': doFix(el.getAttribute('data-id')); return true;
    case 'suppress': state.suppressed[el.getAttribute('data-id')] = true; say('suppressed — a state on a separate channel, still counted in the band'); render(); return true;
    case 'unsuppress': delete state.suppressed[el.getAttribute('data-id')]; say('unsuppressed'); render(); return true;
    case 'cfg-mode': state.cfgMode = el.getAttribute('data-m'); render(); return true;
    case 'inv-mode': state.invMode = el.getAttribute('data-m'); render(); return true;
    case 'layer': { var l = el.getAttribute('data-l'); state.layers[l] = !state.layers[l]; render(); return true; }
    case 'pop':
      if (el.getAttribute('data-v') === 'model') { say('a Cluster node would be created and the two devices re-parented — the observation becomes a fact with provenance'); }
      else { say('recorded: not a cluster. The observation is closed and will not re-fire'); }
      render(); return true;
    case 'wt-choice': {
      var n = +el.getAttribute('data-n'), v = el.getAttribute('data-v');
      var step = WALK.steps.filter(function (s) { return s.n === n; })[0];
      var ch = step.choices.filter(function (c) { return c.v === v; })[0];
      state.cursor.walkthrough = +el.getAttribute('data-i');
      if (!ch.ok) { say('refused · ' + ch.refusal); render(); return true; }
      state.wtAnswers[n] = v;
      step.arms.forEach(armRule);
      state.changed.config = true;
      say('written to the graph · ' + step.writes + (step.arms.length ? ' · armed ' + step.arms.join(', ') : ''));
      render(); return true;
    }
    case 'wt-prev': state.wtCursor = Math.max(0, state.wtCursor - 1); state.cursor.walkthrough = 0; render(); return true;
    case 'wt-next': state.wtCursor = Math.min(WALK.steps.length - 1, state.wtCursor + 1); state.cursor.walkthrough = 0; render(); return true;
  }
  if (el.hasAttribute('data-grain')) { state.grain = el.getAttribute('data-grain'); say('grain · ' + state.grain + ' — the whole bench regrades at once'); render(); return true; }
  if (el.hasAttribute('data-bgrain')) { state.blockGrain[el.getAttribute('data-bgrain')] = el.getAttribute('data-d'); render(); return true; }
  return false;
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act],[data-grain],[data-bgrain]');
  if (el && actOn(el)) { ev.preventDefault(); return; }
  if (ev.target.closest('#btn-keys')) { openSheet('keys'); return; }
  if (ev.target.closest('#btn-thesis')) { openSheet('thesis'); return; }
  if (ev.target.closest('#doc-close') || ev.target.closest('#scrim')) { closeSheet(); return; }
  if (ev.target.closest('#nav-prev')) { setView(VIEWS[Math.max(0, viewIdx() - 1)].id); return; }
  if (ev.target.closest('#nav-next')) { setView(VIEWS[Math.min(5, viewIdx() + 1)].id); return; }
  if (ev.target.closest('#btn-theme')) {
    var r = document.documentElement;
    var cur = r.getAttribute('data-theme');
    r.setAttribute('data-theme', cur === 'dark' ? 'light' : cur === 'light' ? 'dark' : 'dark');
    say('theme · ' + r.getAttribute('data-theme') + ' — dark is derived, not inverted, and it is already in tokens.css');
    render();
  }
}, false);

document.addEventListener('input', function (ev) {
  if (!ev.target.classList.contains('finder-q')) return;
  state.query = ev.target.value;
  var scope = ev.target.id === 'q-overlay' ? 'overlay' : 'canvas';
  state.cursor.finder = 0;
  if (scope === 'overlay') { $('#finder-overlay-body').innerHTML = overlayFinder(); }
  else { $('#canvas').innerHTML = renderFinder(); }
  var q = document.getElementById('q-' + scope);
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
});

/* --- the keyboard. Not modal, no mode indicator, no mode errors. -------- */
var LANDMARKS = ['#mast', '#band', '#canvas', '#estate', '#foot'];
function isText(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); }

function moveCursor(d) {
  var v = state.view, sel;
  if (v === 'finder') sel = '.rows .row';
  else if (v === 'walkthrough') sel = '.rows .row';
  else if (v === 'config') sel = '.cfg-line';
  else if (v === 'findings') sel = '[data-act="f-row"]';
  else if (v === 'diagram') sel = 'g[data-act="dgm"]';
  else sel = 'tr[data-act="inv-row"]';
  var els = Array.prototype.slice.call($('#canvas').querySelectorAll(sel));
  if (!els.length) return;
  var n = Math.min(els.length - 1, Math.max(0, state.cursor[v] + d));
  state.cursor[v] = n;
  els.forEach(function (e, i) { e.setAttribute('tabindex', i === n ? '0' : '-1'); });
  els[n].focus();
}

document.addEventListener('keydown', function (ev) {
  var t = ev.target, txt = isText(t);

  if (ev.key === 'Escape') {
    if (state.overlay) { closeSheet(); ev.preventDefault(); return; }
    if (state.sel.anchor) { state.sel = { anchor:null, set:[], facet:'Element', origin:state.view, epoch:state.sel.epoch + 1 }; say('selection cleared'); render(); ev.preventDefault(); }
    return;
  }
  if (ev.key.toLowerCase() === 'k' && (ev.ctrlKey || ev.metaKey)) {
    ev.preventDefault(); if (state.overlay === 'finder') closeSheet(); else openSheet('finder'); return;
  }
  if (ev.altKey && !ev.ctrlKey && !ev.metaKey) {
    var n = parseInt(ev.key, 10);
    if (n >= 1 && n <= 6) { ev.preventDefault(); setView(VIEWS[n - 1].id); return; }
    if (ev.key === 'ArrowLeft')  { ev.preventDefault(); setView(VIEWS[Math.max(0, viewIdx() - 1)].id); return; }
    if (ev.key === 'ArrowRight') { ev.preventDefault(); setView(VIEWS[Math.min(5, viewIdx() + 1)].id); return; }
    if (ev.key.toLowerCase() === 'p') {
      ev.preventDefault();
      if (window.innerWidth < 1100) { say('estate column needs 1100px — nothing is silently inert, so the refusal states its reason'); render(); return; }
      state.pinned = !state.pinned;
      say(state.pinned ? 'estate column pinned — this is the second surface, and it costs you the inspector' : 'estate column unpinned');
      render(); return;
    }
    if (ev.key.toLowerCase() === 'd') { ev.preventDefault(); state.cfgMode = state.cfgMode === 'full' ? 'changeset' : 'full'; setView('config'); render(); return; }
    if (ev.key.toLowerCase() === 'l') { ev.preventDefault(); setView('diagram'); say('⌥L — layers toggle inline, not in a menu'); render(); return; }
    if (ev.key === '\\') { ev.preventDefault(); cycleGrain(); return; }
  }
  if (ev.key === 'F6') {
    ev.preventDefault();
    var idx = LANDMARKS.findIndex(function (s) { return $(s).contains(document.activeElement) || $(s) === document.activeElement; });
    $(LANDMARKS[(idx + 1 + LANDMARKS.length) % LANDMARKS.length]).focus();
    say('landmark: masthead → band → body → estate → footer'); render(); return;
  }
  if (txt) return;   /* single-letter verbs never fire in a text-entry context */

  if (ev.key === 'ArrowDown' || ev.key === 'j') { ev.preventDefault(); moveCursor(1); return; }
  if (ev.key === 'ArrowUp'   || ev.key === 'k') { ev.preventDefault(); moveCursor(-1); return; }
  if (ev.key === 'Enter' || ev.key === ' ') {
    /* A <button> already fires click on Enter/Space. Handling it here as well
       fires the verb twice, which on a toggle is indistinguishable from it not
       working at all. Only non-button targets (the SVG groups) need this. */
    if (t.tagName === 'BUTTON') return;
    var el = t.closest && t.closest('[data-act]');
    if (el) { ev.preventDefault(); actOn(el); }
    return;
  }
  switch (ev.key) {
    case 'v': ev.preventDefault(); cycleGrain(); return;
    case 'e': {
      ev.preventDefault();
      var f = document.activeElement.closest && document.activeElement.closest('[data-k]');
      if (f) { toggleExpand(f.getAttribute('data-k')); say('e — explain, inline, pushing content down. It never overlays the thing it explains'); render(); }
      else say('e explains the focused thing — move to a row first');
      render(); return;
    }
    case 'c': ev.preventDefault(); say('copied — every command here is a thing you paste into your own terminal'); render(); return;
    case 'w': ev.preventDefault(); setView('walkthrough'); return;
    case 'f': {
      ev.preventDefault();
      if (state.view !== 'findings') { say('f produces a change set from a finding — ⌥4'); render(); return; }
      var row = document.activeElement.closest && document.activeElement.closest('[data-act="f-row"]');
      doFix(row ? row.getAttribute('data-id') : 'the focused finding'); return;
    }
    case 's': {
      ev.preventDefault();
      var r2 = document.activeElement.closest && document.activeElement.closest('[data-act="f-row"]');
      if (r2) { state.suppressed[r2.getAttribute('data-id')] = true; say('suppressed — the row stays counted in the band'); render(); }
      return;
    }
    case 'i': ev.preventDefault(); state.invMode = 'estate'; setView('inventory'); return;
    case '?': ev.preventDefault(); openSheet('keys'); return;
  }
});
function cycleGrain() {
  var order = ['terse', 'explained', 'teaching'];
  state.grain = order[(order.indexOf(state.grain) + 1) % 3];
  state.blockGrain = {};
  say('grain · ' + state.grain + ' — one dial, and every region on the bench regrades at once');
  render();
}


/* ==========================================================================
   THE KEYMAP SHEET.  Every action is reachable without a mouse, and every
   action is also reachable without the keymap.
   ========================================================================== */
var KEYMAP_HTML =
 '<table class="kv"><tbody>' +
 '<tr><th>⌥1 … ⌥6</th><td>Go to view 1–6 in the fixed order: finder · walkthrough · config · findings · diagram · inventory. The order never changes, which is what makes it muscle memory. Pointer equivalent: the view band.</td></tr>' +
 '<tr><th>⌥← / ⌥→</th><td>Previous / next view. Does not wrap — wrapping loses your place. Pointer equivalent: the footer names both neighbours.</td></tr>' +
 '<tr><th>Ctrl+K</th><td>The finder overlay, from anywhere, including inside a text field. The masthead and the risk legend stay visible, because the legend is exactly the thing you want visible while looking at a command you are about to run.</td></tr>' +
 '<tr><th>v · ⌥\\</th><td>Cycle the grain: terse · explained · teaching. Pointer equivalent: the margin tab top-right of the masthead, and the one on every open block.</td></tr>' +
 '<tr><th>⌥P</th><td>Pin / unpin the estate column. Refused below 1100px, and the refusal says why in the footer.</td></tr>' +
 '<tr><th>⌥D</th><td>Config change-set mode. Pointer equivalent: the mode tabs in the config view header.</td></tr>' +
 '<tr><th>⌥L</th><td>Diagram layers. They toggle inline, never in a menu.</td></tr>' +
 '<tr><th>j / k · ↑ / ↓</th><td>Move within the current list. Roving tabindex, so Tab moves between components and arrows move within them.</td></tr>' +
 '<tr><th>Enter · Space</th><td>The primary action for what is focused.</td></tr>' +
 '<tr><th>e</th><td>Explain the focused thing, inline, pushing content down. It never overlays the evidence.</td></tr>' +
 '<tr><th>c · w · f · s · i</th><td>copy · walkthrough · fix (produces a change set) · suppress · inspect in inventory.</td></tr>' +
 '<tr><th>F6</th><td>Rotate focus between shell landmarks: masthead → band → body → estate → footer.</td></tr>' +
 '<tr><th>Esc</th><td>Dismiss the innermost thing. With nothing open, clears the selection.</td></tr>' +
 '<tr><th>?</th><td>This sheet. It is a sheet, not a modal: 1px ink border on --page over a --page scrim. A scrim is a ground, not a shadow.</td></tr>' +
 '</tbody></table>' +
 '<div class="note"><span class="note-label">Not bound, deliberately</span><div class="prose">' +
 '<code>⌘1</code>–<code>⌘6</code> (browser tab switching — which is why view switching is <code>⌥</code>), ' +
 '<code>Ctrl+Alt</code>+letter (indistinguishable from <code>AltGr</code>+letter on European layouts), ' +
 '<code>⌘P</code> (printing a config block is a legitimate thing to want, and the browser’s print is the right tool).' +
 '</div></div>';

/* ==========================================================================
   THE THESIS PANEL.  Plain register. The last section is the real one.
   ========================================================================== */
var THESIS_HTML =
 '<div class="note"><span class="note-label">Thesis, one sentence</span><div class="prose">' +
 '<b>A workbench whose fixed regions are not navigation but a permanently-visible estate, rule-pack list and ' +
 'seam register — so that the thing a workbench is good at, muscle memory, is spent on teaching: one grain dial ' +
 'regrades every region on the screen from reference card to lesson and back, without moving anything.</b>' +
 '</div></div>' +

 '<div class="head"><h2>The layout, in three sentences</h2></div><div class="prose">' +
 'The sheet is 52 §2.2 unchanged — 3px rule, masthead, risk legend, view band, body, footer rule — and the body ' +
 'is split 62/38 into a canvas that answers whichever of the six questions you asked, and an estate column that ' +
 'never changes job. The estate column is the <i>pinned second surface</i> of 52 §2.3 with its default flipped ' +
 'to on; it is on the right, not the left, because a left navigation rail is rejected by name in 52 §2.1 and ' +
 'moving the estate there would be that rejected shell wearing a different hat. Nothing in the furniture scales ' +
 'with the workspace: the same ~210px carries two devices or two hundred.</div>' +

 '<div class="head"><h2>What it optimises for, and what it therefore sacrifices</h2></div><div class="prose">' +
 'It optimises for <b>recall over search</b>. Every fact has one address, on every screen, forever: the risk legend ' +
 'is always the fourth band down, the estate is always right, the refusal always appears in the footer. Three ' +
 'things are paid for that. <b>(1) The inspector.</b> 52 §2.3 gives you exactly one second surface, and this ' +
 'concept spends it permanently on the estate — so the explainer drawer and any side-by-side view comparison are ' +
 'gone, and the explainer has to live inline. That is a real loss and the concept does not hide it: press ' +
 '<code>⌥P</code> and watch the canvas take the whole width back. <b>(2) 38% of the horizontal.</b> The canvas is ' +
 '~700px of a 1132px content width, which is under the card’s own two-column geometry, so the config view never ' +
 'renders two columns. <b>(3) Below 1100px there is no estate at all</b> and the concept degrades to a single ' +
 'column — which means the permanently-visible seam register is not, in fact, permanently visible on a small ' +
 'laptop.</div>' +

 '<div class="head"><h2>How it serves teaching</h2></div><div class="prose">' +
 'The three depths are three <i>texts</i>, not three lengths, and 52 §4.3 makes the control a margin tab with a ' +
 'global default plus a per-block override that is forgotten when the block closes. All of that is implemented ' +
 'here. What the workbench adds is that <b>every region reads the same dial at the same time</b>. Press ' +
 '<code>v</code> and the finder row’s prose, the config line’s note, the finding’s body and the walkthrough ' +
 'step’s explanation all regrade together, in place, with nothing moving. At <code>terse</code> the bench is a ' +
 'reference card; at <code>teaching</code> the same screen is a lesson about the same objects. A one-view-at-a-' +
 'time shell cannot show that, because you only ever see one grain of one thing. Two smaller moves reinforce it: ' +
 'findings sort by <i>node emit order</i>, not alphabetically, so reading top to bottom walks Phase 1 before ' +
 'Phase 2 exactly as the card lays it out; and the explainer expands inline, pushing content down, because an ' +
 'explanation that covers its evidence makes you choose between the two and under pressure you take the evidence.' +
 '</div>' +

 '<div class="head"><h2>How it serves inventory and diagramming</h2></div><div class="prose">' +
 'The estate is a table with an opinions column — the rightmost column is not a field, it is the per-row finding ' +
 'aggregate, so you cannot look at the inventory without seeing what the rule engine thinks of each row. Below it, ' +
 'in the note idiom, sit the population rules: two SRX at one site, one carrying a <code>reth</code>, and Fathom ' +
 'saying out loud that it is guessing from two facts and offering to be told otherwise. The diagram is a real SVG ' +
 'with independently-toggled layers, marked provenance and per-node age, and selecting a node highlights its emit ' +
 'closure in config. The estate column keeps the estate visible <i>while you are in the finder</i>, which is the ' +
 'concrete answer to “how does a user move between the two goals”: look a command up, and the machine it applies ' +
 'to is still on screen.</div>' +

 '<div class="head"><h2>Where new functionality plugs in</h2></div><div class="prose">' +
 'Four seams are drawn on the page, each labelled with the words “this is where X plugs in”. ' +
 '<b>The view registry</b> (estate column, bottom bay): one array of objects with ' +
 '<code>primary</code>/<code>resolve</code>/<code>select_at</code> and a renderer, from which the band, the ' +
 'footer, <code>⌥1</code>–<code>⌥6</code> and <code>⌥←</code>/<code>⌥→</code> are all generated — no route ' +
 'table, no framework registration. <b>Rule packs</b> (estate column, middle bay): pack id, version, signer, ' +
 'rule count and review state, permanently visible, with per-finding attribution on every row — drop a signed ' +
 'pack in and MPLS findings appear on rows that had none yesterday. <b>Emitter provenance</b> (config view): ' +
 'every line is an <code>EmittedLine</code> with <code>source_node</code>, <code>source_fields</code>, ' +
 '<code>rules_applied</code>, <code>risk</code> and <code>order_hint</code>, so click-to-learn is a consequence ' +
 'of the architecture rather than a feature to maintain. <b>The schema</b> (inventory): columns are generated, ' +
 'not written. And the constraint that governs all of them is drawn too: new functionality lands as a mode of an ' +
 'existing view, a layer, a new inventory kind or a new pack — <b>never as a seventh tab</b>. The offline ' +
 'provenance surface in this concept is itself an instance of that rule: it is <code>table(artifact)</code>, a ' +
 'second inventory kind, not a seventh view.</div>' +

 '<div class="head"><h2>How you can tell it cannot phone home</h2></div><div class="prose">' +
 'Go to <b>inventory · artifact</b>. It is the card’s two-column decoder table, and each row is a claim plus the ' +
 'thing that enforces it: <code>connect-src \'none\'</code> and <code>form-action \'none\'</code> in this page’s ' +
 'own head; a WASM import section of exactly two entries, neither capable of originating a request, which is what ' +
 'makes the CSP an architectural property rather than a header; zero occurrences of <code>fetch</code>, ' +
 '<code>XMLHttpRequest</code>, <code>WebSocket</code>, <code>EventSource</code> or <code>sendBeacon</code> in one ' +
 'greppable file; one relative stylesheet and no font CDN; corpus as zstd frames inside the artifact, where “lazy” ' +
 'means from local memory. Two rows say <b>not asserted</b> and <b>not built</b> — the 30-minute proxy test and ' +
 'the SHA-256 over final bytes — because this is a concept and printing a plausible hash would be exactly the ' +
 'dishonesty the surface is arguing against. The footer carries a standing reminder. There is no shield, no lock, ' +
 'no tick and above all no green: <code>--safe</code> means <i>read-only, safe on production</i> and nothing else, ' +
 'and reusing it for “offline” would be the single most visible failure this concept could make. The absence of ' +
 'the network is also visible as a hole: there is no status dot, no freshness stamp, no refresh control, no ' +
 'spinner and no live tail anywhere, and that entire band of chrome is simply not backfilled.</div>' +

 '<div class="head"><h2>The strongest argument against this direction</h2></div><div class="prose">' +
 '<b>It is the safe answer, and its central bet may be wrong.</b> The bet is that a permanently-visible estate is ' +
 'worth 38% of the screen. For goal (b) it clearly is. For goal (a) — the goal the owner ranked <i>first</i> — it ' +
 'may not be: the finder is specified to work with <b>no workspace at all</b>, and this layout gives a user with ' +
 'no estate a large empty column next to the one surface they came for, on the exact screen the product opens ' +
 'on. Worse under ADR-0006, which ships v1 as the finder alone with no graph: this concept’s entire right-hand ' +
 'region and four of its six views are 38–54 solo weeks past what is actually being built, so it is a picture of ' +
 'phases 0+1+2+3, not of v1. There are two further costs. It permanently spends the one second surface, so the ' +
 'explainer drawer and side-by-side comparison — both named in 52 §2.3 as the reason the split exists — are not ' +
 'available in this direction at all. And a workbench earns its keep through repetition: a user who opens Fathom ' +
 'twice a month to look up one command never builds the muscle memory the layout is charging them for, and for ' +
 'that user a plainer, taller single column would be better. The honest summary is that this direction optimises ' +
 'for the daily user of a phase-2 product, and neither of those is guaranteed to exist.</div>' +

 '<div class="note seam"><span class="note-label">Two things I changed while building, and why</span><div class="prose">' +
 '<b>The rail moved to the right and stopped being navigation.</b> The starting posture asked for an inventory ' +
 'rail down one side. A left rail is rejected on arithmetic in 52 §2.1 and the rejection is about navigation, not ' +
 'about columns — so the column stayed, moved right to read as 52 §2.3’s second surface, and carries the estate ' +
 'and the seams rather than six words of navigation, which live in the band where they cost nothing. ' +
 '<b>The grain became a bench-wide dial.</b> That is the answer to “find the thing about a workbench that ' +
 'specifically serves teaching”, and it is the one idea here I would keep even if the layout were thrown away.' +
 '</div></div>' +

 '<div class="note"><span class="note-label">One contradiction found in the source</span><div class="prose">' +
 'The transcribed component CSS in <code>design/prototype/finder-states.html</code> sets the depth toggle in ' +
 '<code>text-transform: uppercase</code>. 52 §4.3 says the control is a margin tab, <i>muted lowercase</i>, and ' +
 '51 §7.7 says margin tabs are lowercase always and that the contrast with the letterspaced caps is the point. ' +
 'This page follows the two documents and renders the grain in lowercase; the prototype’s rule looks like a ' +
 'transcription defect and is recorded here rather than silently picked around.</div></div>';

/* --- init ---------------------------------------------------------------- */
select('gw-b', 'Element', 'inventory');
state.changed = { config:true, findings:true };
say('workbench · ⌥1–⌥6 switch view · v regrades the bench · ? for the keymap');
render();

</script>
</body>
</html>
