# A real SNMPv3 agent for the device reader's tests (ADR-0082; CLAUDE.md rule 2). net-snmp's
# snmpd, one read-only user per authentication protocol Fathom offers (SHA-512, SHA-256 and the
# older SHA-1, each with AES-128), and one it refuses (MD5 with DES), which the reader must turn
# away by name. @ADDR@ is the runner's own non-loopback address: the reader refuses loopback.
# Used by CI's `reader` job and helpers/reader/tests/agent.rs; the passwords are test values.
agentAddress udp:@ADDR@:16161
createUser fathom512 SHA-512 "authpassword512" AES "privpassword512"
createUser fathom256 SHA-256 "authpassword256" AES "privpassword256"
createUser fathom1 SHA "authpassword1x" AES "privpassword1x"
createUser fathommd5 MD5 "authpasswordmd5" DES "privpasswordmd5"
rouser fathom512 priv
rouser fathom256 priv
rouser fathom1 priv
rouser fathommd5 priv
sysName fathom-ci
