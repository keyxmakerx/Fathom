# compose.yaml — WO-11 §4 deliverable 7, following `43` §5.4. At the
# repository root since 2026-09-19 so that `docker compose up` here is the
# whole instruction, and self-contained since the same day: the
# key-generation script and the database init script are inline `configs`
# at the bottom, so this file can be pasted into a compose front end on its
# own. `deploy/` keeps the Dockerfile the `build:` sections use.
#
# WHAT THIS IS AND IS NOT. It brings up the WO-11 skeleton: PostgreSQL, the
# server (and, until 2026-09-20, a Caddy in front). There are no accounts, no tenants
# and no data — WO-11 §6 G8 forbids any table but the migrations table until
# ADR-0040's key boundary is decided.
#
# `43` §5.4 was written for `fathom-sync`, the zero-knowledge blob service that
# the 2026-08-18 pivot replaced (`49`). Its SHAPE is carried over line for line
# and its variables are not, because they described a different program.
#
# THE LINES THAT ARE DECISIONS RATHER THAN BOILERPLATE, per `43` §5.4's table:
#
#   image: ...@sha256:   never a tag, for every image somebody else builds. The
#                        digest is the artifact; the tag is a pointer (`35`
#                        §7.4). Digests read 2026-09-03. FATHOM'S OWN IMAGE
#                        IS THE ONE EXCEPTION, since 2026-09-19: it is named
#                        `ghcr.io/keyxmakerx/fathom-server` at the tag
#                        `FATHOM_TAG` (default `latest`), which
#                        `.github/workflows/publish.yml` pushes from every
#                        merge to `main` with provenance attested, after the
#                        same gate floor `ci.yml` runs. `docker compose up -d`
#                        PULLS it; the `build:` beside it is what `--build`
#                        uses to build the same stage from this checkout instead
#                        (compose-spec 05-services.md, read 2026-09-19: with a
#                        build section present, pulling is still the default,
#                        `pull_policy: missing` says so explicitly, and a
#                        `latest` tag is always re-pulled). To freeze a
#                        deployment, set `FATHOM_TAG=sha-<40-hex commit>` in
#                        `.env`; publish.yml pushes that tag beside `latest`.
#   read_only: true      the ROOT filesystem. The server writes exactly one
#                        path, and it is a volume of its own -- see THE
#                        BOOTSTRAP TOKEN VOLUME below. This line said "the
#                        server writes nothing" until 2026-09-14, which was
#                        true when it was written and stopped being true when
#                        the operator console landed.
#   cap_drop: [ALL]      it binds a port above 1024 and opens a socket. Nothing
#                        else.
#   no-new-privileges    a setuid binary in the image could not gain anything;
#                        there is no shell to run one from either.
#   user: 65532          distroless's nonroot.
#   tmpfs /tmp noexec    nothing in /tmp is ever executed.
#   healthcheck: the binary
#                        distroless has no shell and no curl (`43` §5.4).
#   logging caps         `43` §6.12 — logs are a metadata store, and an uncapped
#                        one grows forever.
#
# THE DATABASE ROLE, added 2026-09-12 (`docs/REBUILD-PLAN.md` Phase 2
# §"Operational foundations" item 4). `POSTGRES_USER` on the `db` service
# below is the postgres image's bootstrap role, and PostgreSQL ALWAYS makes
# that role a superuser regardless of the name given it -- a superuser
# bypasses row-level security unconditionally, `FORCE` or not
# (`crates/fathom-server/migrations/0002_identity_and_scope.sql`). So the
# server must never connect as `fathom_bootstrap`, for either role below.
# the `db_init` config below runs once, as that bootstrap role, purely to
# create the `fathom` role the server migrates as -- deliberately NOT a
# superuser, and owner of its own database rather than granted piecemeal
# privileges (see that script's own comment for why ownership is what lets it
# run migrations). `fathom_server::rls::assert_rls_binds` refuses to start at
# all if either connected role turns out to be a superuser or carry
# BYPASSRLS, so this cannot silently regress to the bootstrap role again.
#
# TWO DATABASE ROLES, NOT ONE, ADDED 2026-09-12
# (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0). Until this, `fathom`
# owned every table, ran the migrations, held `CREATEROLE` -- AND served
# every request; a runtime injection could reshape the schema or mint a
# role. Now the SERVER connects as `fathom_app` (`DATABASE_URL`, data
# privileges only -- created `NOLOGIN` by
# `crates/fathom-server/migrations/0006_runtime_role.sql`, then logged into
# by the server itself, see below) for every request it answers, and holds
# `fathom`'s migration credential (`FATHOM_MIGRATE_DATABASE_URL`) only around
# the migration step at startup, never for the connections that serve a
# request afterwards.
#
# NEITHER DATABASE PASSWORD IS IN THIS FILE, added 2026-09-12
# (`docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1 and §1.4). Whoever writes a
# compose file holds the Docker socket, and is therefore a host-level
# attacker -- so a credential typed here proves nothing about what a lesser
# credential can reach. the `db_init` config below generates BOTH at
# first start into the `keys` volume, beside where the master key will live,
# and the server reads them through `FATHOM_DB_PASSWORD_FILE` (the runtime
# role, `fathom_app`) and `FATHOM_MIGRATE_DB_PASSWORD_FILE` (the migration
# role, `fathom`). The BOOTSTRAP superuser's password used to be the one
# that remained in the environment; since 2026-09-19 `keys-init` below
# generates it too, and the postgres image reads it from the volume. It is
# still the credential the server must never use, for either role.
#
# THE BOOTSTRAP TOKEN VOLUME, ADDED 2026-09-14, BECAUSE THIS FILE COULD NOT
# START AT ALL.
#
# `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §6.3: a first start mints the first
# operator and one single-use enrolment token, and writes that token to a file
# for a human to read -- "whoever can read that volume is the legitimate
# installer". It is the only way into a new deployment.
#
# The server used to derive that file's path from `FATHOM_MASTER_KEY`, so it
# landed in the `keys` volume -- which is mounted READ-ONLY here, for the good
# reason stated on the mount itself. So a first start in this stack wrote a
# bearer token into a read-only filesystem, failed, and exited; and because
# the operator row had already committed, the next start found a bootstrapped
# deployment and never tried again. The stack could not be brought up, and the
# failure was not recoverable by restarting it.
#
# Two changes, and both are needed:
#
#   1. `FATHOM_BOOTSTRAP_TOKEN_FILE` (new) names the path, so the DEPLOYMENT
#      chooses it rather than the server deriving it. It points at `bootstrap`
#      below -- a volume of its own, writable, holding one short-lived file.
#      **The `keys` volume stays read-only and is untouched by this**: the two
#      secrets have different lifetimes and different readers, and the token
#      is deleted by hand within the hour while the master key is the thing
#      the whole deployment rests on.
#   2. `FATHOM_OPERATOR_NOTICE_ADDRESS` is set, because the bootstrap refuses
#      without it and this file did not set it -- so even with (1) fixed, a
#      first start still would not complete.
#
# AND THE WAY BACK IF THE TOKEN IS LOST. `fathom-server
# reissue-bootstrap-token`, run in this container, mints a fresh one into the
# same file -- but ONLY while no operator key has ever been enrolled. After
# enrolment it refuses, and it has to: a re-issue that still worked would let
# anyone who can run a command on this host mint themselves an operator
# session without ever holding a key this deployment has seen. After that the
# way back is another operator, or a restore.
#
#     docker compose run --rm server reissue-bootstrap-token
#
# AND THE ONE THAT MATTERS MOST HERE, REVERSED ON 2026-09-20: **the server is
# the one published port.** Until then only a Caddy of our own was published,
# terminating TLS in front of the binary so that `49` §6's C7 (no C or C++ in
# the shipped closure) held without a TLS stack in the server. It still
# holds, the same way: TLS terminates in the operator's own reverse proxy,
# which every other service they run already sits behind. The server speaks
# plain HTTP to that proxy and to nothing else -- see the `ports:` comment on
# the service for what that requires of the deployment.

name: fathom

services:
  # ONE-SHOT, FIRST: THE SECRETS THIS STACK GENERATES FOR ITSELF, added
  # 2026-09-19 because the stack still could not start from a clean checkout.
  #
  # Three things used to be somebody else's job. The two root keys had to be
  # generated BY HAND before the first `compose up` (the server creates them
  # itself when run from source, and cannot here: its key volume is mounted
  # read-only, for the reason on that mount). The two database passwords were
  # generated by the `db_init` config below, which runs as the `postgres`
  # user inside the db container -- into a volume Docker had just created
  # root-owned, so the write it depended on would have been refused. And the
  # bootstrap superuser's password had to be typed into the environment.
  #
  # Now one short-lived container, running as root exactly once per start,
  # generates whatever is missing and sets every owner and mode, and both the
  # database and the server wait for it to finish (`condition:
  # service_completed_successfully`, compose-spec 05-services.md, read
  # 2026-09-19). Nothing is regenerated if it exists: a restart against a
  # volume that already holds keys keeps them, which is the whole point of
  # the volume. The two root keys are 32 raw bytes, owned by the server's
  # uid, mode 0400 -- the server refuses anything looser. The three
  # passwords are 64 hex characters, mode 0444, because the postgres image
  # and the server run as different uids and share no group; the fence is
  # the volume, as the `db_init` config below's header argues.
  #
  # `alpine` is pinned by digest like every other image here (Docker Hub,
  # library/alpine, tag 3.22, read 2026-09-19). It runs as root because it
  # must chown to a uid that is not its own; it holds only the capabilities
  # that needs. `restart: "no"`, quoted, because bare `no` is YAML's false.
  keys-init:
    image: alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    restart: "no"
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    volumes:
      - keys:/keys
    configs:
      - source: keys_init
        target: /keys-init.sh
    command: ["/bin/sh", "/keys-init.sh"]
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  db:
    image: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    restart: unless-stopped
    depends_on:
      keys-init:
        condition: service_completed_successfully
    # NOT published to the host. Nothing outside this network talks to the
    # database, which is also what lets the driver run without TLS.
    expose:
      - "5432"
    environment:
      # The BOOTSTRAP role. PostgreSQL always makes this one a superuser --
      # see the file header. Named `fathom_bootstrap`, not `fathom`, so
      # nothing here reads like it is safe for the server to connect as.
      # Nothing outside the `db_init` config below ever uses it again after the first
      # startup that creates the volume.
      POSTGRES_USER: fathom_bootstrap
      POSTGRES_DB: fathom_bootstrap
      # Compose reads these from the environment or a .env file. Neither has
      # a default: a default database password is a password everyone has.
      # `_FILE`: the postgres image reads the value from a file instead of the
      # environment (docker-library/docs, postgres, "Docker Secrets", read
      # 2026-09-19). `keys-init` generated it; nothing connects as this role.
      POSTGRES_PASSWORD_FILE: /var/lib/fathom/keys/db_bootstrap.pw
      # THERE IS NO FATHOM_DB_PASSWORD HERE ANY MORE, AND ITS ABSENCE IS THE
      # POINT. `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1: whoever writes
      # this file holds the Docker socket and is therefore a host-level
      # attacker, so a password typed here proves nothing about what any
      # other credential can reach. §1.4: the application's own database
      # password is generated at first start, by
      # the `db_init` config below, into the key volume mounted below --
      # never into this file and never into the environment.
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. PostgreSQL 18's
      # image changed this: a single mount one level up puts the data in a
      # version-named subdirectory, so `pg_upgrade --link` can see both versions
      # without crossing a mount boundary. Mounting the old path against an 18
      # image starts, refuses, and reports an incompatible data directory --
      # found 2026-09-03 by running this file rather than reading it.
      - db:/var/lib/postgresql
      # The key volume. `keys-init` above generates every secret in it before
      # this container starts; the `db_init` config below reads the
      # migration role's password back from it, and the image reads the
      # bootstrap password through `POSTGRES_PASSWORD_FILE`. Read-only here
      # since 2026-09-19: nothing in this container writes it any more.
      - keys:/var/lib/fathom/keys:ro
    configs:
      # Runs once, only against a freshly created (empty) data directory --
      # the image's own entrypoint convention. Inline below, under `configs`.
      - source: db_init
        target: /docker-entrypoint-initdb.d/10-app-role.sh
    healthcheck:
      # The bootstrap role/db, not `fathom` -- they exist the instant
      # PostgreSQL itself is up, before the `db_init` config below has
      # necessarily run, so checking them can never race the app role's own
      # creation.
      test: ["CMD-SHELL", "pg_isready -U fathom_bootstrap -d fathom_bootstrap"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      # Named explicitly: an unqualified build picks the LAST stage, and
      # this Dockerfile has intermediate stages (`client-build`, `wasm-build`)
      # that must never silently become the image the day they move. See
      # `deploy/Dockerfile`'s own comment on the `server` stage.
      target: server
    # In a real deployment this is a digest, exactly like the two above:
    #   image: ghcr.io/<org>/fathom-server@sha256:<64 hex>
    # `build:` is here so the stack can be brought up from a clean checkout
    # before any image has been published.
    image: ghcr.io/keyxmakerx/fathom-server:${FATHOM_TAG:-latest}
    pull_policy: missing
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      keys-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    # THE ONE PUBLISHED PORT, since 2026-09-20. Plain HTTP; the operator's
    # reverse proxy in front does HTTPS and sets X-Forwarded-For, like it
    # does for every other service they run (until this date a Caddy of our
    # own did both, and it is gone). Two consequences to know: the browser's
    # WebCrypto, which generates the sign-in key, needs a secure context, so
    # plain HTTP works only on localhost; and `FATHOM_TRUSTED_CLIENT_IP_HEADER`
    # below means the server believes X-Forwarded-For, so this port must be
    # reachable only through that proxy (publish on 127.0.0.1, or on a
    # Docker network the proxy shares) or a client could name its own
    # rate-limit bucket. `FATHOM_PUBLISH_ADDRESS` chooses the interface.
    ports:
      - "${FATHOM_PUBLISH_ADDRESS:-0.0.0.0}:${FATHOM_PORT:-8080}:8080"
    environment:
      # 0.0.0.0 INSIDE the container, which is reachable only from this
      # network. The BINARY's default is loopback, deliberately, so that a
      # server started outside a container cannot serve the world by accident.
      FATHOM_BIND: "0.0.0.0:8080"
      # `fathom_app` -- the RUNTIME role, data privileges only, no ownership,
      # no DDL, no `CREATEROLE`. This is what every request is served
      # through. `fathom-server` itself refuses to start if the role it
      # connects as turns out to be a superuser or carry BYPASSRLS
      # (`src/rls.rs`), so a compose file that pointed this back at the
      # bootstrap role, or at the migration role below, would fail loudly at
      # startup rather than silently ship broken tenant isolation again.
      # NO PASSWORD IN THIS URL -- see §1.4 and the `db` service's comment.
      # The password comes from the key volume, by way of the variable below.
      DATABASE_URL: "postgres://fathom_app@db:5432/fathom"
      # The file the `db_init` config below generated at first start.
      # `fathom-server` refuses to start if this is set and the file cannot
      # be read: a silent fall back to a password from somewhere else is how
      # the credential this design moves out of the environment creeps back
      # into it.
      FATHOM_DB_PASSWORD_FILE: "/var/lib/fathom/keys/db_app.pw"
      # `fathom` -- the MIGRATION role: owns the schema, holds `CREATEROLE`,
      # used once at startup to apply outstanding migrations and to provision
      # `fathom_app`'s login (`src/db.rs::provision_runtime_login`), then not
      # held. `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.0's other half of
      # the split: taking `CREATEROLE` and table ownership off the role above
      # is only real if nothing that serves a request ever holds this one.
      FATHOM_MIGRATE_DATABASE_URL: "postgres://fathom@db:5432/fathom"
      FATHOM_MIGRATE_DB_PASSWORD_FILE: "/var/lib/fathom/keys/db_migrate.pw"
      # Where the first operator's enrolment token is written, on a first
      # start and by `reissue-bootstrap-token`. See THE BOOTSTRAP TOKEN VOLUME
      # in the header for why this is not inside the key volume. The path must
      # match the mount below and the `ENV` in `deploy/Dockerfile`; all three
      # say it so that no single one of them is load-bearing.
      FATHOM_BOOTSTRAP_TOKEN_FILE: "/var/lib/fathom/bootstrap/first-operator-token"
      # THE ADDRESS OPERATOR NOTICES GO TO -- admin design §5.5's "a settings
      # change was requested" among them -- and the address the first operator
      # is created against. **Set it before the first start and you cannot set
      # it afterwards**: it is recorded once, into `site_install`, where no
      # role can update it (`migrations/0015_operator_console.sql` §C withholds
      # the privilege and raises in a trigger). §6.2 pins an organisation's
      # enrolment claim to it, which is what stops an operator reseating an
      # organisation through a channel they control -- and that pin is worth
      # nothing if the address is one nobody chose.
      #
      # THE BINARY HAS NO DEFAULT FOR THIS AND MUST NOT: a deployment that
      # bootstrapped against a guessed address would have an operator nobody
      # can reach, permanently, with no way to correct it short of destroying
      # the database.
      #
      # **So this file does not invent one either.** Read from the environment
      # or a `.env` file, same shape and same reasoning as POSTGRES_PASSWORD
      # above: a placeholder here would be an address that gets written into a
      # write-once row by every deployment that did not read this comment, and
      # the failure would not surface until somebody needed a notice. This
      # refuses at `docker compose up`, before anything has been created.
      FATHOM_OPERATOR_NOTICE_ADDRESS: ${FATHOM_OPERATOR_NOTICE_ADDRESS:?set FATHOM_OPERATOR_NOTICE_ADDRESS to the address operator notices should go to; it is recorded once, at first start, and cannot be changed afterwards}
      FATHOM_LOG: "info"
      FATHOM_HEALTH_TIMEOUT_MS: "2000"
      FATHOM_DB_POOL_SIZE: "8"
      # `src/config.rs`'s own doc on this field, in full: unset means the
      # peer address, right on the open internet and wrong behind a proxy,
      # "because behind a proxy every request arrives from the proxy — so
      # with this unset in that deployment, the source bucket is one bucket
      # for the whole site and a single attacker rate-limits everybody."
      # This stack sits behind the operator's own reverse proxy (since
      # 2026-09-20; a Caddy of our own before that), so it must set this, or
      # every sign-in shares one rate-limit bucket regardless of who made it.
      # **Safe only while that proxy sets this header itself and the port is
      # reachable through nothing else** (the `ports:` comment above): a
      # client that can reach the port directly could pick its own bucket,
      # which is the other failure mode `src/config.rs`'s comment names.
      # `src/api.rs::source_of` reads this header's LAST entry rather than
      # its first, the entry a proxy that appends writes, a second,
      # independent defence against the same client-supplied-header risk.
      FATHOM_TRUSTED_CLIENT_IP_HEADER: "X-Forwarded-For"
    volumes:
      # Read-only: the server reads the generated database password and, later,
      # the master key. It writes neither. **Unchanged, and deliberately so** --
      # the fix for the first-start failure was to stop writing here, not to
      # make this writable.
      - keys:/var/lib/fathom/keys:ro
      # Writable, and the only writable path this container has besides /tmp.
      # One file lives here, for about as long as it takes an operator to read
      # it. `deploy/Dockerfile` creates this directory owned by 65532 so that
      # Docker seeds the fresh volume with that ownership -- a named volume
      # whose mount point does not exist in the image is created root-owned,
      # and this container does not run as root.
      - bootstrap:/var/lib/fathom/bootstrap
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    healthcheck:
      # distroless has no shell and no curl. The binary is its own health check.
      test: ["CMD", "/fathom-server", "healthcheck", "--addr", "127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

# ---------------------------------------------------------------------------
# THE TWO FILES THIS STACK USED TO READ FROM THE CHECKOUT, INLINE SINCE
# 2026-09-19, so that this one file is the whole deployment: paste it into a
# compose front end (Arcane and the like) with the one variable in its
# environment, and nothing else has to exist on the host. Compose writes each
# `content` into the container at `target` (compose-spec 08-configs.md,
# `content`, Compose v2.23.1 and later; read 2026-09-19). Interpolation
# applies to `content`, so every literal `$` below is written `$$`. These
# are the only copies: `deploy/` no longer carries them.
# ---------------------------------------------------------------------------
configs:
  # Run once per start by `keys-init` above, as root, with the `keys` volume
  # at /keys: generates whatever secret is missing and sets every owner and
  # mode; never regenerates a file that exists.
  keys_init:
    content: |
      #!/bin/sh
      # Run once per start by `compose.yaml`'s `keys-init` service, as root, with
      # the `keys` volume at /keys. Generates whatever secret is missing and sets
      # every owner and mode; never regenerates a file that exists. See the
      # service's own comment in `compose.yaml` for why this is a container of its
      # own and what it replaced.
      #
      # The two root keys: 32 raw bytes from the kernel CSPRNG, owned by the
      # server's uid (65532, distroless nonroot), mode 0400 -- the server refuses
      # anything looser (`docs/OPERATING.md`, "Permissions"). The three database
      # passwords: 64 hex characters, mode 0444, because the postgres image and the
      # server run as different uids and share no group; the fence is the volume
      # (the `db_init` config's header, below). `tr -dc` over /dev/urandom is
      # used rather than `od` because it is what BusyBox certainly has.
      set -eu

      d=/keys

      key() {
          if [ ! -s "$$d/$$1" ]; then
              head -c 32 /dev/urandom > "$$d/$$1.new"
              mv "$$d/$$1.new" "$$d/$$1"
              echo "keys-init: generated $$1"
          fi
          chown 65532:65532 "$$d/$$1"
          chmod 0400 "$$d/$$1"
      }

      password() {
          if [ ! -s "$$d/$$1" ]; then
              tr -dc 'a-f0-9' < /dev/urandom | head -c 64 > "$$d/$$1.new"
              printf '\n' >> "$$d/$$1.new"
              mv "$$d/$$1.new" "$$d/$$1"
              echo "keys-init: generated $$1"
          fi
          chown 0:0 "$$d/$$1"
          chmod 0444 "$$d/$$1"
      }

      chmod 0755 "$$d"
      key master.key
      key chain.key
      password db_bootstrap.pw
      password db_migrate.pw
      password db_app.pw
      echo "keys-init: done; back up this volume somewhere your database backups are not"
  # The postgres image's first-start hook: the migration role and database.
  db_init:
    content: |
      #!/bin/sh
      # Creates the MIGRATION role and database `fathom-server` uses to apply
      # migrations, with a password read from the key volume rather than taken
      # from the environment. Delivered to the postgres image as an inline compose
      # `config` at /docker-entrypoint-initdb.d/10-app-role.sh (since 2026-09-19,
      # so that compose.yaml is one pasteable file). The image runs an executable
      # *.sh there and SOURCES a non-executable one, so the body sits in a subshell:
      # `set -eu` cannot leak into the entrypoint, and a failure still exits it.
      #
      # The reasoning this file used to carry in full is in compose.yaml's header
      # (the two database roles, why neither password is typed into the file, why
      # the mode is 0444) and in `crates/fathom-server/migrations/0006_runtime_role.sql`.
      # Two facts that must not be lost: since PostgreSQL 15 a database's `public`
      # schema is owned by `pg_database_owner`, so `OWNER fathom` is what lets the
      # migration role create tables and policies without further grants; and
      # `CREATEROLE` stays because migrations 0005 and 0006 create the operator
      # plane and the runtime role inside the migration chain.
      (
      set -eu

      KEY_DIR=/var/lib/fathom/keys
      MIGRATE_PW_FILE="$$KEY_DIR/db_migrate.pw"

      # Generated by `keys-init` (`compose.yaml`), which runs to completion before
      # this container is started. If it is not here, the stack is being run some
      # other way, and refusing is better than creating a role with no password.
      if [ ! -s "$$MIGRATE_PW_FILE" ]; then
          echo "10-app-role.sh: $$MIGRATE_PW_FILE is missing or empty; keys-init did not run first" >&2
          exit 1
      fi

      FATHOM_MIGRATE_PASSWORD="$$(tr -d '\n' < "$$MIGRATE_PW_FILE")"

      # `psql -v` and a `:'variable'` placeholder, never shell interpolation into
      # the SQL text: the password is 64 hex characters today, and a future change
      # to how it is generated must not be able to turn this into an injection.
      # Only the MIGRATION role is created here -- see the file header for why the
      # runtime role (`fathom_app`) is created inside the migration chain instead,
      # and why its password file exists before any role is attached to it.
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" \
           -v migrate_password="$$FATHOM_MIGRATE_PASSWORD" <<-'EOSQL'
          CREATE ROLE fathom LOGIN PASSWORD :'migrate_password'
              NOSUPERUSER NOCREATEDB CREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE DATABASE fathom OWNER fathom;
      EOSQL
      )
      rc=$$?
      [ "$$rc" -eq 0 ] || exit "$$rc"

volumes:
  db:
  # Holds both database roles' generated passwords -- the migration role's
  # and the runtime role's -- and will hold the master key. Anything that can
  # read this volume is a tier-3 attacker in
  # `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §0.1's terms: if you copy it off
  # the machine, you have copied all three.
  keys:
  # One short-lived file: the first operator's enrolment token (§6.3), written
  # at first start and by `reissue-bootstrap-token`, mode 0400, and meant to be
  # deleted by hand once it has been redeemed. **Separate from `keys` on
  # purpose.** It is a bearer secret for as long as it exists, so it is not in
  # the world-readable places; but it is also the one thing in this deployment
  # the server has to WRITE, and the key volume is read-only to the server by
  # design. Two volumes is what keeps both of those true at once.
  bootstrap:
