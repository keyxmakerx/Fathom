id: ip.address.different-subnet-on-link
rule_version: 1.0.0
status: active
severity: warn
category: correctness
title: "The two ends of a link are in different subnets"
why: >
  Two directly connected interfaces reach each other only if they are in the same subnet. With different subnets each end treats the other as remote and sends to its gateway instead, so the link carries nothing between them.
fix: >
  Put both ends in one subnet, or fix the prefix length on the end that is wrong.
concept: check.ip.link-addressing
acceptable_when: >
  A link that is unnumbered or addressed through another mechanism. Remove the address from both ends.
reviewed_by: "pending: Key Maker"
reviewed_on: 2026-10-02
sources_note: >
  Follows from how a host decides whether a destination is on-link: by comparing it with its own subnet mask (RFC 1122, section 3.3.1.1; located by search, not read).
applies_to:
  kind: Cable
  with:
    a_adr: { via: [{ role: Terminates, where: { end: a } }, { role: Occupies, reverse: true }, HasUnit, HasAddress], card: many }
    b_adr: { via: [{ role: Terminates, where: { end: b } }, { role: Occupies, reverse: true }, HasUnit, HasAddress], card: many }
condition: >
  count(a_adr) == 1 && count(b_adr) == 1 && a_adr.exists(x, b_adr.exists(y, net_of(x.value) != net_of(y.value)))
involves: [a_adr, b_adr]
