- id: mtu.mss-clamp.absent
  rule_version: 1.2.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: medium
  confidence: probable
  category: operability
  tags: [mtu, phase2, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: Device
    where: "has_ipsec_vpn"
    with:
      flow: { via: flow_settings, card: optional }
  on_unset: pending

  condition: >
    flow == null
    || (!has(flow.tcp_mss_ipsec_vpn) && !has(flow.tcp_mss_all_tcp))

  title: "No TCP MSS clamp for tunnel traffic"

  why: >
    IPsec adds roughly 50 to 70 bytes of headers, so a full-size packet entering
    the tunnel must fragment, and firewalls along the path routinely drop
    fragments. Without an MSS clamp the TCP endpoints never learn to send smaller
    segments, because the ICMP that would tell them is filtered somewhere.

  symptom_if_mismatched: >
    Ping works. SSH connects. Then `ls` hangs, or a transfer stalls at 0%. Small
    packets fit and full-size ones vanish. Handshake fine, data stalls is MTU
    until proven otherwise — and it is routinely misdiagnosed as a crypto or
    performance problem because the tunnel is up and the counters move.

  explain:
    terse: "No tcp-mss clamp — full-size packets will vanish in the tunnel."
    explained: >
      `set security flow tcp-mss ipsec-vpn mss 1360` rewrites the MSS in the TCP
      handshake so both ends agree to smaller segments up front. It is surgical,
      it prevents fragmentation before it starts, and it does not depend on ICMP
      getting through. It is TCP-only and does nothing for UDP.
    teaching: >
      There are three fixes and they are not equivalent. MSS clamping rewrites
      the TCP handshake so both ends agree to smaller segments up front —
      surgical, prevents fragmentation before it starts, needs no ICMP, and does
      nothing for UDP. Lowering the tunnel MTU is universal and covers UDP, but
      the box now fragments before encryption, which costs CPU and produces
      fragments that can still be dropped downstream. Clearing the DF bit lets
      the network fragment the encrypted packet rather than drop it — the rescue
      when you control neither endpoint nor the far side, at the cost of
      reassembly at the peer.

      Path MTU Discovery is supposed to make all of this unnecessary: the sender
      sets DF, an oversized packet triggers an ICMP fragmentation-needed back,
      and the sender shrinks. It breaks constantly, because that ICMP is filtered
      somewhere. The sender never learns, and big packets disappear in silence.
      That is exactly why MSS clamping exists.

      Rule of thumb: MSS equals tunnel MTU minus 40 for the IP and TCP headers. A
      1400 MTU clamps to 1360, and many shops use 1350 for margin. Prefer
      `tcp-mss ipsec-vpn`, which clamps only tunnel traffic, over `tcp-mss
      all-tcp`, which hits everything through the box — a far bigger blast radius
      than most people intend.

  acceptable_when: >
    Acceptable where the underlay carries jumbo frames or the path MTU is known
    to leave headroom above 1500 for the encapsulation, and where somebody has
    measured it rather than assumed it — raising the tunnel MTU to 1500 on a
    1500 path does not remove the need for a clamp, it moves the fragmentation
    to the first hop after encapsulation. Also acceptable when the clamp is
    applied upstream on a router or load balancer rather than on this device —
    record where.

  remediation:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "set security flow tcp-mss ipsec-vpn mss {{ suggested_mss | int }}"

  rollback:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "delete security flow tcp-mss ipsec-vpn"

  verify:
    - junos-srx/interface.st0.mtu.show
    - junos-srx/mtu.ping.df-sourced

  next_if_bad:
    - rule: mtu.st0.unset
    - rule: mtu.df-bit.set-on-tunnel
  related:
    - rule: mtu.mss-clamp.all-tcp-used

  sources:
    - { std: "RFC 1191", note: "Path MTU Discovery; ICMP fragmentation needed is Type 3 Code 4" }
    - { std: "RFC 2923", section: "2.1", note: "TCP problems with Path MTU Discovery — the black-hole case" }
    - { card: "srx-ipsec", side: 4, block: "THREE FIXES — KNOW THE DIFFERENCE" }

- id: mtu.mss-clamp.all-tcp-used
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: low
  confidence: definite
  category: operability
  tags: [mtu, blast-radius, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: Device
    with:
      flow: { via: flow_settings, card: one }
  on_unset: skip

  condition: "has(flow.tcp_mss_all_tcp) && !has(flow.tcp_mss_ipsec_vpn)"

  title: "The MSS clamp is applied to all TCP rather than to tunnel traffic"

  why: >
    `all-tcp` hits everything through the box, not only the traffic that needed
    it. Every internet session, every internal server session and every
    management session gets smaller segments, which costs throughput on paths
    that had no MTU problem.

  symptom_if_mismatched: >
    A performance complaint months later with no visible cause, because the
    change was made for a VPN problem and the effect landed everywhere. The
    correlation is findable in the commit history and nowhere else.

  explain:
    terse: "all-tcp is a far bigger blast radius than most people intend."
    explained: >
      Replace with `tcp-mss ipsec-vpn mss <value>`, which clamps only tunnel
      traffic — the clean fix. Keep `all-tcp` only where a deliberate box-wide
      cap is the intent and somebody has written down why.
    teaching: >
      This is a `low` finding because nothing is broken, and it is worth having
      because of how it arrives and how long it survives. It is set during an
      incident, because it is one line and it works, and then nobody narrows it
      because the incident is over and the tunnel is fine.

      The cost is invisible from the tunnel's point of view and shows up
      somewhere else entirely: a backup that takes longer, a file server that
      feels slow, a throughput figure nobody can explain. The commit history is
      the only place the two are connected. If the newest commit lines up with
      when things got slower, you have your answer — correlate before you
      theorise.

      If `all-tcp` is genuinely wanted, the honest configuration has both: the
      `ipsec-vpn` clamp for the tunnel at its own value, and `all-tcp` at a
      deliberately chosen box-wide value, so a reader can tell the two decisions
      apart. Without that split, nothing in the configuration records which
      sessions were meant to be capped and throughput drops where nobody asked.

  acceptable_when: >
    Acceptable where a box-wide clamp is deliberate — an edge device whose every
    path is known to be under 1500, for instance. Record the intent next to the
    statement, because a clamp set during an incident and a clamp set by design
    are the same line of configuration and only one of them should survive.

  remediation:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "set security flow tcp-mss ipsec-vpn mss {{ suggested_mss | int }}"
        - risk: ChangesConfig
          order: 20
          text: "delete security flow tcp-mss all-tcp"

  rollback:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "set security flow tcp-mss all-tcp mss {{ previous_all_tcp_mss | int }}"

  verify:
    - junos-srx/flow.status.show
    - junos-srx/mtu.ping.df-sourced

  next_if_bad:
    - command: junos-srx/system.commit.show
  related:
    - rule: mtu.mss-clamp.absent

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

- id: mtu.st0.unset
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: low
  confidence: probable
  category: operability
  tags: [mtu, plumbing, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: LogicalUnit
    where: "matches(name, /^st0\\.[0-9]+$/)"
    with:
      vpn: { via: bind_interface, reverse: true, card: optional }
  on_unset: pending

  condition: "vpn != null && (known_absent(mtu) || !has(mtu))"

  title: "The tunnel interface has no explicit MTU"

  why: >
    An st0 unit with no MTU statement inherits a default that is almost certainly
    larger than the encrypted path can carry. Every full-size packet then
    fragments or is dropped, and nothing about the configuration says so.

  symptom_if_mismatched: >
    UDP traffic that stalls where TCP does not, because an MSS clamp rescues TCP
    and nothing rescues UDP. Handshake fine and data stalled is MTU until proven
    otherwise, and where the affected application is UDP the clamp will look like
    it is not working.

  explain:
    terse: "No MTU on st0 — UDP has nothing protecting it."
    explained: >
      Set `family inet mtu 1400` on the unit, or a value measured with a sized
      do-not-fragment ping sourced from inside the traffic selector. This is the
      only one of the three fixes that covers UDP.
    teaching: >
      The reason this is separate from the MSS clamp rule is protocol coverage.
      A clamp rewrites the TCP handshake and does nothing for UDP, so an estate
      with a clamp and no tunnel MTU works for everything except the traffic that
      does not negotiate segment sizes — DNS, some voice, some tunnelled
      protocols, anything using QUIC.

      The arithmetic behind 1400 is worth knowing rather than copying. IPsec adds
      a 20-byte outer IP header, an 8-byte ESP header, 8 to 16 of IV, 2 to 255 of
      pad and trailer, 12 to 16 of ICV, and another 8 if NAT-T is active.
      Roughly 50 to 70 bytes, cipher-dependent. From 1500 that leaves about 1430,
      and 1400 is that with headroom. Those figures are the card's own and it
      marks them approximate.

      Without an explicit MTU, oversized UDP datagrams are fragmented or dropped
      and the application stalls with no error anywhere. Confidence is
      `probable` because whether the default MTU is a problem depends on the
      path, which no configuration records.

  acceptable_when: >
    Acceptable where the underlay carries jumbo frames or the path MTU is known
    to leave headroom above 1500 for the encapsulation, and where somebody has
    measured it rather than assumed it. Record the measurement and the date,
    because a path that had headroom last year may not have it after a carrier
    change.

  remediation:
    lines:
      junos-srx:
        # C12: 1400 is a starting point, not a constant — the card marks the
        # overhead figures approximate and cipher-dependent. Prefer a value
        # derived from a measured DF-ping (junos-srx/mtu.ping.df-sourced).
        - risk: ChangesConfig
          order: 10
          text: "set interfaces {{ parent_interface.name | ident }} unit {{ unit_number | int }} family inet mtu 1400"

  rollback:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "delete interfaces {{ parent_interface.name | ident }} unit {{ unit_number | int }} family inet mtu"

  verify:
    - junos-srx/interface.st0.mtu.show
    - junos-srx/mtu.ping.df-sourced

  next_if_bad:
    - command: junos-srx/mtu.ping.df-sourced
    - rule: mtu.df-bit.set-on-tunnel
  related:
    - rule: mtu.mss-clamp.absent

  sources:
    - { card: "srx-ipsec", side: 4, block: "OVERHEAD BUDGET" }
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
  sources_note: >
    Overhead figures are the card's own and are marked approximate there:
    "OVERHEAD FIGURES APPROXIMATE — CIPHER-DEPENDENT". Reproduced with that
    qualification intact rather than presented as exact.

- id: mtu.df-bit.set-on-tunnel
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: low
  confidence: definite
  category: operability
  tags: [mtu, fragmentation, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: IpsecVpn
  on_unset: skip

  condition: "enum_is(df_bit, \"set\")"

  title: "The tunnel forces the DF bit on in the outer header"

  why: >
    `df-bit set` forces DF on regardless of the inner packet, so no device in the
    path may fragment the encrypted packet. Anything over the path MTU is
    dropped, and the ICMP that would say so is filtered on most real paths.

  symptom_if_mismatched: >
    Full-size packets disappear in silence and small ones do not. Identical in
    every respect to the missing-clamp symptom, which means an engineer who has
    already added a clamp and is still seeing stalls will not think to look here.

  explain:
    terse: "set forces DF on. copy is the default; clear is the valve."
    explained: >
      `copy` copies the inner DF and is the default. `clear` clears DF so the
      network may fragment rather than drop. `set` forces DF on, which removes
      the last remaining escape route when a packet is too large for the path.
    teaching: >
      There is a legitimate reason to force DF: it makes Path MTU Discovery work
      end to end, which is the correct behaviour in a network where the ICMP gets
      through. The rule fires anyway because that network is rare, and the
      failure when the assumption is wrong is silent.

      Path MTU Discovery lets endpoints learn the smallest hop by sending DF-set
      packets, and an oversized one should trigger an ICMP fragmentation needed —
      Type 3 Code 4 — back to the sender. It breaks constantly because that ICMP
      is filtered somewhere. The sender never learns to shrink, and big packets
      disappear in silence. That is exactly why MSS clamping exists: it does not
      depend on ICMP getting through.

      If DF is being forced deliberately, verify that the ICMP actually returns
      before relying on it. If it does not, the tunnel is depending on a
      mechanism that is not working and nobody will notice until a large transfer
      stalls.

  acceptable_when: >
    Acceptable where Path MTU Discovery has been verified to work end to end on
    this specific path, and where forcing DF is a deliberate choice to avoid
    fragmentation cost. Record the verification and how it was done — an
    unverified assumption that ICMP returns is the whole failure mode here.

  remediation:
    patch:
      - op: set
        target: self
        field: df_bit
        value: { enum: copy }

  rollback:
    patch:
      - op: set
        target: self
        field: df_bit
        value: { enum: set }

  verify:
    - junos-srx/mtu.ping.df-sourced
    - junos-srx/interface.st0.mtu.show

  next_if_bad:
    - rule: mtu.mss-clamp.absent
    - command: junos-srx/mtu.ping.df-sourced
  related:
    - rule: mtu.st0.unset

  sources:
    - { card: "srx-ipsec", side: 4, block: "THREE FIXES — KNOW THE DIFFERENCE" }
    - { card: "srx-ipsec", side: 4, block: "PMTUD & THE DF BIT" }
    - { std: "RFC 1191", note: "Path MTU Discovery" }

# -----------------------------------------------------------------------------
# TRACEOPTIONS — side 3, "ALWAYS clean up"
# -----------------------------------------------------------------------------

- id: ike.traceoptions.left-enabled
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: low
  confidence: definite
  category: hygiene
  tags: [tracing, cleanup, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: Device
  on_unset: skip

  condition: "has(ike_traceoptions) || has(ipsec_traceoptions)"

  title: "Traceoptions are still enabled on this device"

  why: >
    Traceoptions left on will fill `/var`, which breaks logging and commits both.
    The box then stops being able to tell you what is wrong at exactly the moment
    you need it to, and stops being able to accept the fix.

  symptom_if_mismatched: >
    Weeks later, and looking unrelated: log files stop being written, commits
    start failing for no visible reason, and nobody connects either to a trace
    somebody left on during an incident three Fridays ago. `show system storage`
    is the command that names it.

  explain:
    terse: "Left on, they fill /var. That breaks logging and commits both."
    explained: >
      `delete security ike traceoptions` and `delete security ipsec
      traceoptions`, then `commit`. They are two hierarchies and deleting one
      does not delete the other. A delete without a commit changes nothing at
      all.
    teaching: >
      The teardown is part of the procedure, not a tidy-up. Turn tracing on,
      reproduce the failure, read the file, delete it, commit — and write both
      halves into the change ticket before running the first one, because the
      second half happens under time pressure at the end of an incident when
      everybody wants to go home.

      The asymmetric-cleanup case is the one that actually bites. You remember
      the IKE traceoptions because you read that file. You do not remember the
      IPsec ones because you did not. Make `show configuration security | match
      traceoptions` part of the cleanup rather than trusting your memory of what
      you turned on.

      Without the deletion, the consequence is deferred and appears in a form
      that gives no hint of its cause. That delay is why this is a rule rather
      than a note: nobody who is going to make this mistake is thinking about
      `/var` at the time.

  acceptable_when: >
    Acceptable while an investigation is actually running — tracing you turned on
    an hour ago is doing its job. Suppress it with the incident reference and an
    expected removal date rather than waiving it, so the suppression itself is
    the reminder. A suppression with no date on this rule is the failure mode
    wearing a different hat.

  remediation:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "delete security ike traceoptions"
        - risk: ChangesConfig
          order: 20
          text: "delete security ipsec traceoptions"

  verify:
    - junos-srx/system.storage.show

  next_if_bad:
    - command: junos-srx/system.storage.show
  related:
    - rule: ike.traceoptions.no-file
    - rule: ike.traceoptions.flag-all

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

- id: ike.traceoptions.no-file
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: low
  confidence: definite
  category: hygiene
  tags: [tracing, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: Device
  on_unset: skip

  condition: >
    has(ike_traceoptions)
    && (known_absent(ike_traceoptions_file) || !has(ike_traceoptions_file))

  title: "IKE tracing is enabled with no file, so it lands in kmd"

  why: >
    Without a `file` statement IKE tracing lands in `kmd`, interleaved with every
    other daemon's output. The trace you turned on to answer a question is then
    mixed into the log you were already unable to read.

  symptom_if_mismatched: >
    You turn on tracing, reproduce the failure, and cannot find the output —
    because it is in `kmd` among everything else, with no `ike-trace` file to
    read. Time is lost to the tooling rather than to the problem.

  explain:
    terse: "No file statement — the trace goes to kmd and gets buried."
    explained: >
      `set security ike traceoptions file ike-trace size 5m files 5` gives the
      trace its own file with a bounded size and a rotation count. The size and
      file count are also what stop it filling `/var` before you get back to it.
    teaching: >
      The `size` and `files` arguments matter as much as the filename and are the
      part people leave off. A trace with no bound grows until the filesystem
      does not, and a full `/var` breaks logging and commits both — so the
      failure of an unbounded trace is the same failure as forgetting to delete
      it, arriving faster.

      Five megabytes across five files is a reasonable default for an
      investigation you intend to finish today. If the event you are waiting for
      is rare, raise the count rather than the size, so an old rotation still
      exists when it finally happens.

      Without a dedicated file, the alternative is reading `kmd` filtered by peer
      address, which is a perfectly good technique and is what the verify ladder
      recommends first. If that is what you are going to do anyway, do not turn
      tracing on at all.

  acceptable_when: >
    Acceptable when the intent is genuinely to enrich `kmd` rather than to
    produce a separate capture, and the tracing will be removed in the same
    change window. Record the removal in the ticket, because unbounded tracing
    into a shared log is the harder of the two cleanup failures to notice.

  remediation:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "set security ike traceoptions file ike-trace size 5m files 5"

  verify:
    - junos-srx/log.iketrace.show
    - junos-srx/system.storage.show

  next_if_bad:
    - command: junos-srx/system.storage.show
  related:
    - rule: ike.traceoptions.left-enabled
    - rule: ike.traceoptions.flag-all

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

- id: ike.traceoptions.flag-all
  rule_version: 1.0.0
  status: active
  reviewed_by: "<named reviewer>"
  reviewed_on: 2026-07-28

  severity: medium
  confidence: definite
  category: hygiene
  tags: [tracing, performance, day-two]

  platforms: [junos-srx]
  versions: "*"
  applies_to:
    kind: Device
  on_unset: skip

  condition: >
    has(ike_traceoptions_flags)
    && ike_traceoptions_flags.exists(f, enum_is(f, "all"))

  title: "Tracing is set to flag all"

  why: >
    `flag all` buries the signal and loads the routing engine. The volume makes
    the answer harder to find, and producing it costs control-plane cycles on a
    box that is usually already under pressure when somebody turns tracing on.

  symptom_if_mismatched: >
    Routing engine utilisation rises while you are watching it, so the load you
    are measuring includes the cost of your own measurement. `/var` fills faster
    than `size` and `files` suggest, and the event you wanted is somewhere in a
    file nobody can grep usefully.

  explain:
    terse: "flag all buries the signal and loads the RE. Use flag ike."
    explained: >
      Replace with `flag ike` for Phase 1, or `flag security-associations` under
      the IPsec hierarchy for Phase 2. One flag, chosen for the phase you are
      investigating, is what makes the output readable.
    teaching: >
      Tracing is a sampling decision and `flag all` is a refusal to make it. It
      is the instinctive choice under pressure, which is exactly when its costs
      land hardest.

      The cost is not only disk. The routing engine formats and writes every one
      of those lines while also running the control plane, so a box already
      struggling during an incident struggles more, and the CPU figure you then
      read from `show chassis routing-engine` includes your own tracing. That is
      a genuinely confusing state to diagnose from.

      This is `medium` rather than `low` because it has an operational effect on
      a box in trouble, where the other two traceoptions findings only cost time
      and disk. Decide what you are looking for, trace that, and if it is not
      there, change the flag rather than adding one. Without a narrowed flag,
      `/var` fills faster than the size and file bounds suggest and commits
      start failing.

  acceptable_when: >
    Acceptable on a lab box with no production traffic, and briefly on a
    production box when the phase in which a failure occurs is genuinely unknown
    and a narrower flag has already been tried. Record how long it will stay on,
    and watch routing engine utilisation while it is.

  remediation:
    lines:
      junos-srx:
        - risk: ChangesConfig
          order: 10
          text: "delete security ike traceoptions flag all"
        - risk: ChangesConfig
          order: 20
          text: "set security ike traceoptions flag ike"

  verify:
    - junos-srx/chassis.re.show
    - junos-srx/system.storage.show

  next_if_bad:
    - command: junos-srx/chassis.re.show
  related:
    - rule: ike.traceoptions.left-enabled
    - rule: ike.traceoptions.no-file

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

# =============================================================================
# § SEVERITY — the distribution, and the V25 conflict
# =============================================================================
# Stated rather than adjusted. See G1 at the top of this file.
#
severity_distribution:
  high:   13   # 9 correctness + 2 interop (ipsec.pfs.group-mismatch,
               # ipsec.traffic-selector.not-mirrored) + 2 security
               # (ipsec.pfs.absent, ike.mode.aggressive-with-psk)
  medium: 13
  low:     8
  info:    3
  total:  37
  v25_status: >
    FAILS as written. V25 allows 15% high; this bundle is 35%. Under the
    proposed change (exempt category: correctness from the budget) the bundle
    is 4 high out of 25 non-correctness rules, which is 16% and still fails —
    the exemption alone does not bring the bundle inside the budget (C13,
    ADR-0029). The reviewer must decide before this ships: demote one of the
    four, or argue the budget change in 63 on its merits as an amendment.
    Demoting correctness findings to satisfy a percentage is the wrong
    resolution and is recorded here so that choice is made deliberately.

# =============================================================================
# § DERIVED PREDICATES — what the schema must supply before any of this runs
# =============================================================================
# Every non-builtin used in a `condition` or `where` in this bundle, with what
# it has to compute. Collected here so the schema work is scoped rather than
# discovered rule by rule. See G5.
#
derived_predicates:
  - name: is_cbc(enum)
    returns: bool
    computes: "True for CBC-mode encryption variants. Pure function of the enum."
    used_by: [ike.proposal.cbc-without-hash, ipsec.lifetime.kilobytes-unset-on-busy]

  - name: is_aead(enum)
    returns: bool
    computes: "True for AEAD variants (the GCM family). Pure function of the enum."
    used_by: [ipsec.proposal.gcm-with-hash]

  - name: mirrors(ts_a, ts_b)
    returns: bool
    computes: "a.local == b.remote && a.remote == b.local, as prefixes."
    used_by: [ipsec.traffic-selector.not-mirrored]

  - name: overlaps(prefix_a, prefix_b)
    returns: bool
    computes: "Non-empty intersection of two prefixes."
    used_by: [nat.source-nat-eats-tunnel]

  - name: has_route_to(prefix, unit)
    returns: bool
    computes: >
      A static route or a routing-protocol adjacency whose next hop is `unit`
      and whose destination covers `prefix`. Needs the route table projection,
      not a graph walk.
    used_by: [route.remote-prefix.no-next-hop-st0]

  - name: has_routed_traffic(vpn)
    returns: bool
    computes: "Anything routed at the VPN's bind interface."
    used_by: [ipsec.establish-tunnels.both-passive]
    note: >
      63 §17.5 already carries a VERIFY that this may need a fourth traversal
      hop and therefore a derived-graph pass. Unresolved.

  - name: carries_adjacency(vpn)
    returns: bool
    computes: >
      A routing-protocol adjacency configured over the VPN's bind interface.
      Distinct from has_routed_traffic — a static route is routed traffic and
      is not an adjacency.
    used_by: [ike.dpd.too-slow, ipsec.vpn-monitor.absent-on-adjacency]

  - name: has_policy_between(zone_a, zone_b)
    returns: bool
    computes: "At least one security policy exists for the ordered zone pair."
    used_by: [policy.zone-pair.missing]

  - name: is_no_nat(rule)
    returns: bool
    computes: "A source-NAT rule whose action is off / no-translation."
    used_by: [nat.source-nat-eats-tunnel]

  - name: nat_scope_covers(scope, unit)
    returns: bool
    computes: >
      True when a NatRuleSet from/to scope (zone, interface or
      routing-instance) contains the given logical unit — the unit itself, its
      zone, or its routing instance. The `to` context is resolved after the
      forwarding lookup picks the egress interface, so a rule set scoped `to
      zone UNTRUST` does not cover a unit in zone VPN. Added per R20/C3.
    used_by: [nat.source-nat-eats-tunnel]

  - name: has_ipsec_vpn
    returns: bool
    computes: "Device has at least one IpsecVpn node. Anchor-field predicate."
    used_by: [mtu.mss-clamp.absent]

  - name: nat_detected
    returns: bool
    computes: >
      Runtime evidence that NAT-T is active — remote port 4500 in Phase 1 SA
      output. Requires `requires: [runtime_output]`, which the user supplies by
      pasting command output. The application never reads it from a device.
    used_by: [ike.identity.required-behind-nat, ike.nat-keepalive.longer-than-nat-idle]

  - name: nat_device_udp_idle_timeout
    returns: int
    computes: >
      The translating device's UDP idle timer. `transit_config` evidence — it
      lives on a box Fathom cannot see. Absent, the rule stays pending.
    used_by: [ike.nat-keepalive.longer-than-nat-idle]

  - name: suggest_vpn_zone()
    returns: "Zone or null"
    computes: "A zone on this device that looks like a tunnel zone. May be null."
    used_by: [tunnel.st0.zone-unbound]

  - name: suggested_mss
    returns: int
    computes: >
      Tunnel MTU minus 40, defaulting to 1360 when the tunnel MTU is unset.
      A starting point, not a constant — the card's governing rule for that
      side is "OVERHEAD FIGURES APPROXIMATE — CIPHER-DEPENDENT", so prefer a
      value derived from a measured DF-ping
      (junos-srx/mtu.ping.df-sourced) and label the emitted value as a
      starting point (C12).
    used_by: [mtu.mss-clamp.absent, mtu.mss-clamp.all-tcp-used]

  - name: suggested_keepalive
    returns: int
    computes: "A value below the observed NAT idle timeout. Null without evidence."
    used_by: [ike.nat-keepalive.longer-than-nat-idle]

  - name: previous_value(field)
    returns: any
    computes: "The pre-remediation value, for rollback templates."
    used_by: [ike.dh-group.weak]

# =============================================================================
# § UNRESOLVED REFERENCES — will fail V23 until they exist
# =============================================================================
unresolved_refs:
  - ref: ipsec.pfs.group-weak
    from: "ipsec.pfs.absent supersedes"
    note: >
      Inherited from 63 §17.1's worked example. The rule does not exist in this
      bundle and is not obviously needed — group strength is covered by
      ike.dh-group.weak on the Phase 1 side and there is no equivalent rule for
      the PFS group. Write ipsec.pfs.group-weak (condition:
      perfect_forward_secrecy in [group1, group2, group5, group22, group23,
      group24] — enum members, not integers, per R08). §6.3 of the
      reconciliation and ADR-0029 decide it is not optional: same predicate
      over IpsecPolicy.perfect_forward_secrecy.
  - ref: ike.gateway.external-interface-wrong
    from: "referenced by the command corpus seed, junos-srx/ike.gateway.external-interface.set"
    note: >
      63 §17.2 references it too. Not written here because the condition needs
      evidence Fathom does not have — knowing the external-interface is *wrong*
      requires knowing which WAN unit the peer expects, which is peer_config
      plus a path assumption. Left as a documented gap rather than written
      badly.



