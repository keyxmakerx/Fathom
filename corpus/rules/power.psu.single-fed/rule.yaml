id: power.psu.single-fed
rule_version: 1.0.0
status: active
severity: idea
category: operability
title: "A chassis has two power inlets and only one is cabled"
why: >
  Two power inlets protect the device only when both are connected. With one cabled, the device still stops when that feed fails.
fix: >
  Connect the second supply to a different power circuit, or record the feed if it is already connected.
concept: check.power.redundancy
acceptable_when: >
  A second supply fitted as a cold spare.
reviewed_by: "pending: Key Maker"
reviewed_on: 2026-10-02
sources_note: >
  A design practice, not a standard. Vendor hardware guides say the same for their own chassis; none was located and read for this rule.
applies_to:
  kind: Chassis
  with:
    inlets: { via: [FittedIn, HasPort], card: many }
    cables: { via: [FittedIn, HasPort, ~Terminates], card: many }
condition: >
  count(inlets) >= 2 && count(cables) == 1
involves: [cables]
