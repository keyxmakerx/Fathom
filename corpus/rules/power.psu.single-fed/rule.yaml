id: power.psu.single-fed
rule_version: 1.0.0
status: active
severity: idea
category: operability
title: "A device with two power supplies has only one fed"
why: >
  Two power supplies protect the device only when both are connected. With one fed, the second adds nothing and the device still stops when that one feed fails.
fix: >
  Connect the second supply, ideally to a different power circuit.
concept: check.power.redundancy
acceptable_when: >
  A second supply fitted as a cold spare.
reviewed_by: "pending: Key Maker"
reviewed_on: 2026-10-02
sources_note: >
  A design practice, not a standard. Vendor hardware guides say the same for their own chassis; none was located and read for this rule.
applies_to:
  kind: Chassis
  with:
    inlets: { via: [FittedIn, HasPort], card: many }
    cables: { via: [FittedIn, HasPort, ~Terminates], card: many }
condition: >
  count(inlets) >= 2 && count(cables) == 1
involves: [cables]
