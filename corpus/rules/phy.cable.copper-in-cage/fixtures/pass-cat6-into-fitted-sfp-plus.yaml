# The same lead with a module recorded as fitted.
nodes:
  - { id: d1, kind: Device, set: { hostname: core-sw-01, platform: ios-xe, role: switch } }
  - { id: d1_ch, kind: Chassis, set: { member_index: 0 } }
  - { id: p1, kind: PhysicalPort, set: { label: "Te1/0/1", connector: sfp_plus, service: ethernet, speed_max: 10000000000 }, present: [transceiver] }
  - { id: d2, kind: Device, set: { hostname: dist-sw-02, platform: ios-xe, role: switch } }
  - { id: d2_ch, kind: Chassis, set: { member_index: 0 } }
  - { id: p2, kind: PhysicalPort, set: { label: "ge-0/0/1", connector: rj45, service: ethernet, speed_max: 1000000000 } }
  - { id: c1, kind: Cable, set: { media: cat6 } }
edges:
  - { kind: HasChassis, from: d1, to: d1_ch }
  - { kind: HasPort, from: d1_ch, to: p1 }
  - { kind: HasChassis, from: d2, to: d2_ch }
  - { kind: HasPort, from: d2_ch, to: p2 }
  - { kind: Terminates, from: c1, to: p1, set: { end: a } }
  - { kind: Terminates, from: c1, to: p2, set: { end: b } }
