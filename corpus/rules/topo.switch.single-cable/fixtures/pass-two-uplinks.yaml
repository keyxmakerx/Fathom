# Two leads between the same switches.
nodes:
  - { id: d1, kind: Device, set: { hostname: access-sw-01, platform: junos-ex, role: switch } }
  - { id: d1_ch, kind: Chassis, set: { member_index: 0 } }
  - { id: p1, kind: PhysicalPort, set: { label: "ge-0/0/1", connector: rj45, service: ethernet } }
  - { id: p3, kind: PhysicalPort, set: { label: "ge-0/0/2", connector: rj45, service: ethernet } }
  - { id: d2, kind: Device, set: { hostname: dist-sw-02, platform: junos-ex, role: switch } }
  - { id: d2_ch, kind: Chassis, set: { member_index: 0 } }
  - { id: p2, kind: PhysicalPort, set: { label: "ge-0/0/1", connector: rj45, service: ethernet } }
  - { id: p4, kind: PhysicalPort, set: { label: "ge-0/0/2", connector: rj45, service: ethernet } }
  - { id: c1, kind: Cable, set: { media: cat6 } }
  - { id: c2, kind: Cable, set: { media: cat6 } }
edges:
  - { kind: HasChassis, from: d1, to: d1_ch }
  - { kind: HasPort, from: d1_ch, to: p1 }
  - { kind: HasPort, from: d1_ch, to: p3 }
  - { kind: HasChassis, from: d2, to: d2_ch }
  - { kind: HasPort, from: d2_ch, to: p2 }
  - { kind: HasPort, from: d2_ch, to: p4 }
  - { kind: Terminates, from: c1, to: p1, set: { end: a } }
  - { kind: Terminates, from: c1, to: p2, set: { end: b } }
  - { kind: Terminates, from: c2, to: p3, set: { end: a } }
  - { kind: Terminates, from: c2, to: p4, set: { end: b } }
