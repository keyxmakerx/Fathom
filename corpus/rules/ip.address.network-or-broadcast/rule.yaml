id: ip.address.network-or-broadcast
rule_version: 1.0.0
status: active
severity: warn
category: correctness
title: "An address is the network or broadcast address of its own subnet"
why: >
  The first address of an IPv4 subnet names the network and the last is the broadcast. Most platforms refuse to configure either on an interface, and where one does, it is mistaken for a broadcast. A /31 or /32 has neither.
fix: >
  Use a host address in the subnet, or shorten the prefix so this address is a host.
concept: check.ip.host-address
acceptable_when: >
  None for a /24-style subnet. A /31 point-to-point link (RFC 3021) and a /32 loopback are not flagged.
reviewed_by: "pending: Key Maker"
reviewed_on: 2026-10-02
sources:
  - { publisher: "IETF", doc: "RFC 1122 section 3.2.1.3 (addresses a host may not use) and RFC 3021, 31-bit prefixes (the /31 exception)", url: "https://www.rfc-editor.org/rfc/rfc1122", read_on: 2026-10-02, note: "Located by web search on 2026-10-02; the page could not be opened from this environment (outbound fetch blocked), so the claim rests on the document's known scope and has not been read against it. A person should confirm it." }
applies_to:
  kind: Address
condition: >
  is_network_address(value) || is_broadcast_address(value)
