      When a tunnel fails to authenticate, this is the first thing everyone
      changes and it is usually not the problem. An identity mismatch reads as
      `peer's IKE-ID validation failed` or a bare AUTHENTICATION_FAILED, and
      both are easily misread as a wrong pre-shared key — so the afternoon goes
      into re-typing it on both ends while the actual disagreement is over
      local-identity and remote-identity. Check identity before you re-type the
      PSK. If certificates are in use instead, AUTHENTICATION_FAILED also
      covers an expired chain and clock skew, and NTP is cheaper to check than
      a re-issue.

