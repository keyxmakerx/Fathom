  risk: ReadOnly
  domain: ike
  weight: 1
  tags: [phase1, hub, verify]

  answers: "Which far ends currently have a live session with this box?"
  aka:
    - "who is connected"
    - "list the peers that are up"
    - "which spokes are online"
  concepts:
    - concept:obj.ike-gateway
    - concept:p1.established
    - concept:act.inspect

  read_field: "Remote address list — a peer absent here is not negotiated"
  output_fields:
    - field: "Remote Address"
      means: "Peer with a live Phase 1 session."
      want: any
      join_key: true
      tell: "Absence here is the fastest way to see which spokes are down."

  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/ike.sa.show
  related:
    - junos-srx/ike.sa.show
    - junos-srx/ipsec.inactive-tunnels.show

  guidebook: [guide:ipsec.phase-split]

  explain:
    terse: "A peer roll-call. Fastest read on a hub with many spokes."
    explained: >
      This collapses the Phase 1 view to one line per peer, which on a hub is
      the quickest way to answer "which sites are up right now" without reading
      SA state for every one of them.
    teaching: >
      Use it as a first pass, not as proof. A peer listed here has a live
      Phase 1 session and may still have no working data tunnel, because Phase
      2 fails independently — that split is the whole reason the verify ladder
      has separate rungs for the two phases. The natural pairing is this
      command for who is negotiated and `show security ipsec inactive-tunnels`
      for who is not passing traffic, and the two together give you the shape
      of a hub outage in about four seconds.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }

