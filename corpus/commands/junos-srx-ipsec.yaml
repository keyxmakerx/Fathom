  guidebook: [guide:ipsec.tracing]
  related_rules: [ike.traceoptions.no-file, ike.traceoptions.left-enabled]

  explain:
    terse: "IKE trace to its own file. Delete it afterwards."
    explained: >
      Without a `file` statement IKE tracing lands in `kmd`, mixed with
      everything else. Set a file and a size, add `flag ike`, commit confirmed
      5, reproduce, read it — then delete the traceoptions and commit. Always.
    teaching: >
      Traceoptions are the most useful and the most frequently abandoned tool
      on the box. Three things go wrong with them, in order of frequency.
      Without a file statement the output goes to `kmd`, where it is
      interleaved with every other daemon's story and the thing you wanted is
      unfindable. `flag all` produces so much output that it buries the signal
      and loads the routing engine while doing it — `flag ike` is what you
      want. And traceoptions left on will fill `/var`, which breaks logging and
      commits both, so the box stops being able to tell you what is wrong at
      the exact moment you need it to. Turn it on, reproduce, read it, delete
      it, commit. The teardown is part of the procedure, not a tidy-up.

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

