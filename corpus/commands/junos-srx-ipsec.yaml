# =============================================================================
# SIDE 4 — TEST IT FROM THE BOX
# The card: "size is the ICMP payload. Add 28 for wire size."
# =============================================================================

- id: junos-srx/mtu.ping.df-sized
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "ping {{dest}} do-not-fragment size {{size}} count 3"
  wraps: [4]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: mtu
  weight: 3
  tags: [mtu, fragmentation, day-two]

  answers: "What is the largest payload that survives the whole path?"
  aka:
    - "find the mtu"
    - "test path mtu"
    - "why do big packets disappear"
    - "df bit test"
  concepts:
    - concept:obj.path
    - concept:attr.mtu
    - concept:act.measure
  symptoms:
    - concept:symptom.stalls-under-load
    - concept:symptom.handshake-ok-data-stalls

  read_field: "Loss — 0% means this size fits"
  output_fields:
    - field: "packet loss"
      means: "Whether packets of this size survived the path."
      want: "0%"
      bad:
        - value: "100%"
          means: >
            This size does not fit and DF stopped anything from fragmenting it.
            Halve the difference and try again.

  slots:
    - name: dest
      binds: { kind: Address, field: value }
      accepts: [Ip4, Ip6]
      placeholder: "<remote-host>"
      required: true
    - name: size
      binds: null
      accepts: [Integer]
      placeholder: "<icmp-payload-bytes>"
      required: true
      suggest:
        - { value: 1472, note: "1500 on the wire — standard Ethernet, the first test" }
        - { value: 1372, note: "1400 on the wire — the conventional tunnel clamp" }
        - { value: 1422, note: "1450 on the wire — the midpoint if 1472 fails and 1372 passes" }

  next_if_bad:
    - junos-srx/mtu.ping.df-sourced
    - junos-srx/interface.st0.mtu.show
  related:
    - junos-srx/mtu.ping.df-sourced
    - junos-srx/mtu.ping.rapid
    - junos-srx/flow.tcp-mss.set-ipsec

  guidebook: [guide:mtu.overhead, guide:mtu.three-fixes]
  related_rules: [mtu.mss-clamp.absent, mtu.st0.unset]

  explain:
    terse: "size is the ICMP payload. Add 28 for wire size."
    explained: >
      `size` is the ICMP payload, so add 28 — 20 for IP and 8 for ICMP — to get
      the wire size: 1472 becomes 1500. If 1472 fails and 1372 passes, path MTU
      is around 1400, and you binary-search between them.
    teaching: >
      A bare ping from the SRX tests the SRX's own path, not the tunnel, which
      is why the sourced form exists and why this one is only the first step.
      The symptom that brings people here is specific: ping works, SSH
      connects, then `ls` hangs or a transfer stalls at 0%. Small packets fit
      and full-size ones exceed the tunnel MTU and vanish. Handshake fine, data
      stalls is MTU until proven otherwise. It fails silently because Path MTU
      Discovery depends on an ICMP fragmentation-needed message getting back to
      the sender, and that ICMP is filtered somewhere on almost every real
      path. The sender never learns to shrink. That is exactly why MSS clamping
      exists.

  sources:
    - { card: "srx-ipsec", side: 4, block: "TEST IT FROM THE BOX" }
    - { card: "srx-ipsec", side: 4, block: "THE MTU STORY" }
    - { card: "srx-ipsec", side: 4, block: "PMTUD & THE DF BIT" }
    - { std: "RFC 1191", note: "Path MTU discovery relies on ICMP fragmentation needed" }

- id: junos-srx/mtu.ping.df-sourced
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "ping {{dest}} do-not-fragment size {{size}} count 3 source {{source}} routing-instance {{ri}}"
  wraps: [4, 8]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: mtu
  weight: 2
  tags: [mtu, fragmentation, day-two]

  answers: "What survives the encrypted path, rather than the underlay?"
  aka:
    - "test through the tunnel"
    - "source from the lan side"
    - "measure inside the selector"
    - "why does a bare test not prove anything"
  concepts:
    - concept:obj.path
    - concept:attr.mtu
    - concept:act.measure
  symptoms:
    - concept:symptom.handshake-ok-data-stalls

  read_field: "Loss — 0% at this size means the tunnel carries it"
  output_fields:
    - field: "packet loss"
      means: "Whether packets of this size survived through the tunnel."
      want: "0%"
      bad:
        - value: "100%"
          means: >
            Either the size exceeds the tunnel MTU, or the source is outside
            the traffic selector and the packet never entered the tunnel.

  slots:
    - name: dest
      binds: { kind: Address, field: value }
      accepts: [Ip4]
      placeholder: "<remote-host>"
      required: true
    - name: size
      binds: null
      accepts: [Integer]
      placeholder: "<icmp-payload-bytes>"
      required: true
      suggest:
        - { value: 1372, note: "1400 on the wire — the conventional tunnel clamp" }
        - { value: 1472, note: "1500 on the wire — expect this to fail through a tunnel" }
    - name: source
      binds: { kind: Address, field: value }
      accepts: [Ip4]
      placeholder: "<lan-side-address>"
      required: true
    - name: ri
      binds: { kind: RoutingInstance, field: name }
      accepts: [Identifier]
      placeholder: "<routing-instance>"
      required: false

  next_if_bad:
    - junos-srx/flow.tcp-mss.set-ipsec
    - junos-srx/interface.st0.mtu.set
  related:
    - junos-srx/mtu.ping.df-sized
    - junos-srx/ipsec.vpn.traffic-selector.set
    - junos-srx/interface.st0.mtu.show

  guidebook: [guide:mtu.overhead]
  related_rules: [mtu.mss-clamp.absent, ipsec.traffic-selector.not-mirrored]

  explain:
    terse: "Source from inside the selector or you measured the underlay."
    explained: >
      A bare test from the SRX uses the box's own address, which is usually
      outside the traffic selector, so the packet takes the WAN and never
      enters the tunnel. Source from an address inside the selector, or from
      the LAN interface, to measure the thing you care about.
    teaching: >
      This is the single most common way an MTU investigation produces a
      confidently wrong answer. The bare test passes at 1472 because the
      underlay is a clean 1500, everyone concludes MTU is fine, and the
      transfers keep stalling. The tunnel takes roughly 50 to 70 bytes of
      overhead depending on cipher and whether NAT-T has added its 8, so from
      1500 you have about 1430 left — which is why tunnel MTU is conventionally
      clamped to 1400 for headroom. Test at 1372 sourced from inside the
      selector and you are measuring the path that the application actually
      uses. If the source address is wrong the test fails for a completely
      different reason and looks identical.

  sources:
    - { card: "srx-ipsec", side: 4, block: "TEST IT FROM THE BOX" }
    - { card: "srx-ipsec", side: 4, block: "OVERHEAD BUDGET" }

- id: junos-srx/mtu.ping.rapid
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "ping 10.2.0.1 size 1400 rapid count 50"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: mtu
  weight: 1
  tags: [mtu, loss, day-two]

  answers: "Is the encrypted path losing or reordering under a burst?"
  aka:
    - "test for loss"
    - "burst test"
    - "is the underlay dropping"
    - "check for reordering"
  concepts:
    - concept:obj.path
    - concept:act.measure
  symptoms:
    - concept:symptom.tunnel-flapping

  read_field: "Loss percentage and round-trip spread across 50 probes"
  output_fields:
    - field: "packet loss"
      means: "Proportion of the burst that did not return."
      want: "0%"
      bad:
        - value: "*"
          means: >
            Loss on the underlay is what tears down healthy tunnels through
            DPD, and what drives replay counters up.
    - field: "round-trip min/avg/max"
      means: "Latency spread across the burst."
      want: any
      tell: "A wide max-to-min spread suggests queueing or a path change, not crypto."

  next_if_bad:
    - junos-srx/ipsec.statistics.index
    - junos-srx/interface.wan.errors.show
  related:
    - junos-srx/mtu.ping.df-sized
    - junos-srx/ipsec.statistics.index
    - junos-srx/ike.gateway.dpd.set

  guidebook: [guide:ipsec.counters-and-replay]
  related_rules: [ike.dpd.too-tight]

  explain:
    terse: "Not an MTU test. This one looks for loss under a burst."
    explained: >
      `rapid` sends the probes back to back rather than one per second, which
      is what exposes queueing and per-packet load balancing. `count 50`
      makes a percentage meaningful. There is no `do-not-fragment` here on
      purpose — this is measuring loss, not size.
    teaching: >
      This is the test that connects two things the card treats separately. A
      path that reorders enough to trip anti-replay is a path that drops DPD
      probes, and DPD tearing down a healthy tunnel produces flaps at exactly
      interval times threshold — which reads as a lifetime problem and sends
      people into the proposals. Run this alongside the replay counter. A
      climbing replay count plus visible loss here means the underlay, and the
      fix is not on this box. A climbing replay count with no loss here usually
      means ECMP or per-packet load balancing, which is benign reordering and
      needs nothing done about it at all.

  sources:
    - { card: "srx-ipsec", side: 4, block: "TEST IT FROM THE BOX" }
    - { card: "srx-ipsec", side: 4, block: "REPLAY ERRORS" }
    - { card: "srx-ipsec", side: 3, block: "FLAP PATTERN → CAUSE" }

