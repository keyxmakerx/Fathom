  guidebook: [guide:ike.phase1.identity]
  related_rules: [ike.mode.aggressive-with-psk]

  explain:
    terse: "Replaces address for a peer with no fixed IP."
    explained: >
      `dynamic` replaces `address` for peers with no fixed IP. Under IKEv1 that
      combination also forces aggressive mode, so a dynamic peer with a
      pre-shared key on v1 is exposing its identity on the wire whether you
      wrote `mode aggressive` or not.
    teaching: >
      This statement is where three separate decisions collide. A dynamic peer
      cannot be identified by address, so the identity has to travel; under
      IKEv1 that means aggressive mode, which leaks the identity and is
      offline-crackable. The clean answer is IKEv2, where the identity is
      always protected and no mode statement is involved. The second collision
      is initiation: a peer with no fixed address usually sits behind NAT, and
      `responder-only` is right for that peer and fatal on both ends at once.
      The third is monitoring — a dynamic peer that has not come up yet is
      indistinguishable from a dynamic peer that is broken until something
      initiates.

