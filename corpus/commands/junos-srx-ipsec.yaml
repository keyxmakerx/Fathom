- id: junos-srx/ipsec.sa.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec security-associations"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 2
  tags: [phase2, bring-up, verify]

  answers: "Is the data tunnel installed and carrying traffic?"
  aka:
    - "is the tunnel up"
    - "is the vpn up"
    - "phase 2 status"
    - "p2 state"
    - "is it installed"
  concepts:
    - concept:obj.tunnel
    - concept:obj.ipsec-sa
    - concept:p2.installed
    - concept:act.verify
    - concept:phase.p2

  read_field: "State — want Installed"
  output_fields:
    - field: State
      means: "Phase 2 SA state."
      want: "Installed"
      bad:
        - { value: "*", means: "Anything else is not passing traffic." }
    - field: SPI
      means: "Security Parameter Index, one per direction."
      want: any
      tell: "Two lines per selector is correct, not a duplicate."
    - field: "Gateway"
      means: "Peer address this child SA belongs to."
      want: any
      join_key: true
    - field: Mon
      means: "Whether vpn-monitor is running for this SA."
      want: any
      tell: >
        Without vpn-monitor a route out st0 stays good while traffic
        blackholes.

  supplies: [Index, SPI]
  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/ike.sa.show
  related:
    - junos-srx/ipsec.sa.show-vpn-detail
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/ipsec.statistics.all

  guidebook: [guide:ipsec.phase-split, guide:ipsec.bring-up-order]
  walkthrough: ["walk:junos-srx.s2s-ipsec#verify-p2"]
  related_rules: [ipsec.pfs.absent, tunnel.st0.zone-unbound]

  explain:
    terse: "Step 3 of the ladder. Installed, or it is not passing traffic."
    explained: >
      One line per direction per selector, so two lines for a single-selector
      tunnel is correct and not a duplicate. Installed means the kernel holds
      keys for that selector. It does not mean anything reaches the far end.
    teaching: >
      This is the command the whole card is organised around, and the most
      important thing about it is what it does not prove. The SA proves crypto,
      not reachability. A tunnel can read Installed and pass zero packets when
      `st0` has no zone, no policy, or nothing routed at it — four of the five
      plumbing pieces fail exactly that way. So Installed here moves you off
      the crypto half of the problem and onto the plumbing half, which is
      steps 5 to 8 of the bring-up ladder. If steps 5 to 8 fail while 2 to 4
      are clean, no proposal tweaking will fix it.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 3, block: "READING THE SA OUTPUT" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/ipsec.sa.show-vpn-detail
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec security-associations vpn-name {{vpn}} detail"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 3
  tags: [phase2, bring-up, verify]

  answers: "What are the full parameters of one tunnel, including its bind point?"
  aka:
    - "one tunnel in detail"
    - "which st0 does this vpn use"
    - "lifetimes and spis for one vpn"
    - "check one tunnel"
  concepts:
    - concept:obj.tunnel
    - concept:obj.ipsec-sa
    - concept:p2.installed
    - concept:act.verify
    - concept:phase.p2

  read_field: "State — want Installed"
  output_fields:
    - field: State
      means: "Phase 2 SA state."
      want: "Installed"
      bad:
        - { value: "*", means: "Anything but Installed is not passing traffic." }
    - field: SPI
      means: "Security Parameter Index, one per direction."
      want: any
      tell: "Two lines per selector is correct, not a duplicate."
    - field: Lifetime
      means: "Hard and soft countdown to the next rekey."
      want: any
      tell: "Use it to time a capture around the rekey event."
    - field: "Bind-interface"
      means: "The st0 unit this VPN is bound to."
      want: any
      join_key: true
      tell: >
        The join back to st0. The logs never mention st0, so this is the only
        link between an SA and an interface.
    - field: "Traffic selector"
      means: "The local and remote prefix pair this child SA covers."
      want: any
      tell: >
        Must mirror the peer's. A pair with no mirror is rejected and appears
        in inactive-tunnels rather than here.

  slots:
    - name: vpn
      binds: { kind: IpsecVpn, field: name }
      accepts: [Identifier]
      placeholder: "<vpn-name>"
      required: true

  supplies: [Index, SPI]
  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ipsec.statistics.index
    - junos-srx/interface.st0.terse
    - junos-srx/ipsec.sa.show

  guidebook: [guide:ipsec.phase2.state]
  walkthrough: ["walk:junos-srx.s2s-ipsec#verify"]
  related_rules: [ipsec.pfs.absent, ipsec.traffic-selector.not-mirrored]

  explain:
    terse: "P2 state for one VPN. Want Installed."
    explained: >
      Scoping by `vpn-name` is the difference between reading one tunnel and
      scrolling past forty. `detail` adds the SPIs, the lifetimes and the
      bind-interface — and bind-interface is the only link back to `st0`,
      because the logs never mention `st0` at all.
    teaching: >
      Phase 2 rides inside Phase 1, and the two fail independently. A healthy
      Phase 1 with a dead Phase 2 is the most common shape of a broken tunnel
      and the reason this command exists separately from the IKE one. Installed
      here means the kernel holds a key pair for this selector — it does not
      mean anything is reaching the far end. A tunnel can read Installed and
      pass zero packets when `st0` has no zone, no policy, or nothing routed at
      it. If State is Installed and traffic still is not moving, stop reading
      proposals and go look at the plumbing.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 3, block: "READING THE SA OUTPUT" }
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }

- id: junos-srx/ipsec.inactive-tunnels.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec inactive-tunnels"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 2
  tags: [phase2, diagnose, most-missed]

  answers: "Which tunnels are down, and what reason does the box give?"
  aka:
    - "why is the tunnel down"
    - "tunnel down reason"
    - "what is broken"
    - "which tunnels are not up"
  concepts:
    - concept:obj.tunnel
    - concept:state.down
    - concept:act.diagnose
  symptoms:
    - concept:symptom.tunnel-down
    - concept:symptom.tunnel-flapping

  read_field: "Tunnel Down Reason — often the whole answer"
  output_fields:
    - field: "Tunnel Down Reason"
      means: "The box's own explanation for why this tunnel is not established."
      want: any
      tell: >
        This is the field almost nobody reads. It frequently names the exact
        mismatch and removes the need for any log reading at all.
    - field: "Total inactive tunnels"
      means: "Count of tunnels currently not established."
      want: "0"

  next_if_bad:
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p2
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/ipsec.sa.show
    - junos-srx/ike.sa.show
    - junos-srx/log.kmd.match-peer

  guidebook: [guide:ipsec.phase2.state]
  related_rules: [ipsec.pfs.group-mismatch, ipsec.traffic-selector.not-mirrored, ipsec.establish-tunnels.both-passive]

  explain:
    terse: "Names what is down and why."
    explained: >
      `inactive-tunnels` is the underused one. It names what is down and prints
      a Tunnel Down Reason, which is often the whole answer — before you open a
      single log.
    teaching: >
      The instinct when a tunnel is down is to go to the log. The log is a
      lifecycle narrative and it takes reading. `inactive-tunnels` is a table,
      and the Tunnel Down Reason column is the box telling you what it decided
      and why. Run this before `show log kmd`, every time. If the reason is a
      proposal mismatch you have your answer in one line; if it is empty or
      unhelpful, then go to the log — but you have lost four seconds rather
      than four minutes. It is also the only command that says anything at all
      about a tunnel where neither end ever initiated, because in that case
      nothing was negotiated and nothing failed.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }

- id: junos-srx/ipsec.next-hop-tunnels.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec next-hop-tunnels"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 0
  tags: [phase2, nhtb, hub, verify]

  answers: "On a multipoint tunnel unit, which peer sits behind which next hop?"
  aka:
    - "nhtb table"
    - "next hop tunnel binding"
    - "multipoint st0"
    - "hub and spoke tunnel mapping"
  concepts:
    - concept:obj.st0
    - concept:obj.tunnel
    - concept:act.inspect

  read_field: "Next-hop to VPN mapping — a missing row means nothing resolves"

  next_if_bad:
    - junos-srx/route.remote.show
    - junos-srx/ipsec.sa.show
  related:
    - junos-srx/ipsec.sa.show
    - junos-srx/route.remote.show

  guidebook: [guide:ipsec.route-vs-policy-based]

  explain:
    terse: "NHTB. Only relevant when one st0 unit serves several peers."
    explained: >
      Next-hop tunnel binding is what maps a next-hop address on a multipoint
      `st0` unit to a specific VPN. On a point-to-point tunnel there is nothing
      to map and this output is uninteresting.
    teaching: >
      This is a narrow command with one high-value use: on a hub where several
      spokes share one `st0` unit, a route can resolve to a next hop that has
      no binding, and the packet is then dropped with the SA perfectly healthy.
      That is a fifth way to reach the "tunnel up, zero traffic" symptom and it
      does not appear anywhere else in the diagnostic ladder. If the topology
      is point-to-point, skip this rung entirely rather than reading an empty
      table as evidence of anything.

  sources:
