    terse: "The tail, unfiltered. Use it when you do not know the peer yet."
    explained: >
      Unfiltered is right exactly once: when something has broken and you do
      not yet know which peer it was. After that, filter by peer address,
      because on a box with several tunnels the interleaving makes a single
      negotiation impossible to follow.
    teaching: >
      Two practical notes. First, the daemon writes a lifecycle narrative, so
      the useful reading is the sequence rather than any single line — a failed
      negotiation has a beginning that tells you what was proposed and an end
      that tells you what was rejected, and the end without the beginning is
      half the story. Second, if this file is empty or stops abruptly, check
      `show system storage`. A full `/var` breaks logging and commits both, and
      the most common cause of a full `/var` is traceoptions somebody left on
      during a previous incident.

