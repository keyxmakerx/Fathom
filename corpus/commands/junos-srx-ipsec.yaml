  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ike security-associations index {{id}} detail"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ike
  weight: 1
  tags: [phase1, hub, verify]

  answers: "What are the full parameters of one specific negotiated channel?"
  aka:
    - "one ike sa by index"
    - "scope to a single peer session"
    - "too many peers to read"
  concepts:
    - concept:obj.ike-sa
    - concept:phase.p1
