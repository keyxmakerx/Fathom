- id: junos-srx/ike.gateway.version.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike gateway GW-B version v2-only"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Pins the protocol version. A peer that only speaks the other version stops
    negotiating entirely at the next attempt. Change both ends in one window.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, day-one, build]

  answers: "How do I pin this to the newer protocol and refuse the old one?"
  aka:
    - "force ikev2"
    - "disable ikev1"
    - "set the ike version"
  concepts:
    - concept:obj.ike-gateway
    - concept:attr.ike-version
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — the negotiated version appears in the SA detail output"

  next_if_bad:
    - junos-srx/ike.sa.show-detail
    - explain:concept:ike.version-choice
  related:
    - junos-srx/ike.policy.mode.set
    - junos-srx/ipsec.vpn.traffic-selector.set

  guidebook: [guide:ike.version-choice]
  related_rules: [ike.mode.aggressive-with-v2, ipsec.lifetime.ikev1-mismatch]

  explain:
    terse: "v2-only. One 4-message exchange, identity always protected."
    explained: >
      IKEv2 is one four-message exchange with identity always protected, many
      traffic selectors instead of one proxy-ID, and liveness built in rather
      than bolted on. `mode` is silently ignored under `v2-only`.
    teaching: >
      The version choice changes what the rest of the config means. Under
      IKEv1, lifetimes are negotiated and the lower value wins; under IKEv2
      they are not negotiated at all and each side rekeys on its own clock, so
      a mismatch is legal and not an error. Under IKEv1 you get one proxy-ID
      pair and a mismatch reads INVALID_ID_INFORMATION; under IKEv2 you get
      many selectors and a mismatch reads TS_UNACCEPTABLE. And because `mode`
      is ignored under `v2-only`, seeing `mode aggressive` in a v2 config means
      nothing — do not chase it. That single fact saves a recurring wasted hour
      in any estate that migrated from v1 and left the statement behind.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "IKEV1 VS IKEV2" }
    - { std: "RFC 7296", section: "1.2", note: "IKE_SA_INIT and IKE_AUTH; IDi and IDr are carried encrypted" }

- id: junos-srx/ike.gateway.dpd.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike gateway GW-B dead-peer-detection always-send interval 10 threshold 3"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes how fast this box declares the peer gone. Set too tight, a
    two-second underlay hiccup tears down a healthy tunnel and traffic stops
    while it renegotiates.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, timers, failover, day-one]

  answers: "How fast does this box notice the far end has gone away?"
  aka:
    - "set dpd"
    - "liveness probes"
    - "how long before failover starts"
    - "keepalive for the tunnel"
  concepts:
    - concept:obj.ike-gateway
    - concept:attr.dpd
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — the failover budget is interval x threshold seconds"

  next_if_bad:
    - explain:symptom:flap-interval-equals-dpd-product
    - junos-srx/ipsec.statistics.index
  related:
    - junos-srx/ipsec.vpn.vpn-monitor.set
    - junos-srx/ike.gateway.nat-keepalive.set

  guidebook: [guide:ike.liveness]
  related_rules: [ike.dpd.too-tight, ike.dpd.too-slow]

  explain:
    terse: "Dead after interval x threshold. Junos defaults to 10 x 5."
    explained: >
      `optimized` probes only when we are sending and hearing nothing back and
      is the default. `probe-idle-tunnel` probes when idle too. `always-send`
      probes every interval regardless, which is what a backup you need to
      trust requires.
    teaching: >
      Time to declare a peer dead is interval times threshold, and the Junos
      default of 10 times 5 is 50 seconds of blackhole before failover even
      starts — longer than most people assume when they leave it alone. Too
      tight and a two-second underlay hiccup tears down a healthy tunnel, and
      you then spend a week debugging self-inflicted flaps. Too loose and
      traffic pours into a dead tunnel. 10 times 3 is a reasonable middle. One
      structural fact people miss: DPD rides the outer IKE session on UDP 500
      or 4500, never st0. Silence on st0 does not mean the tunnel is dead, and
      an idle tunnel with `optimized` set is not being probed at all.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "DEAD PEER DETECTION" }
    - { std: "RFC 3706", note: "Traffic-based method of detecting dead IKE peers" }
    - { std: "RFC 7296", section: "2.4", note: "IKEv2 liveness is part of the protocol" }

