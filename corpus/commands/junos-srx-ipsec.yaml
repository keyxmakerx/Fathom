    - "trace flags"
    - "what to debug"
    - "do not use flag all"
  concepts:
    - concept:obj.trace
    - concept:act.capture
    - concept:phase.p1

  read_field: "No output — reproduce the failure, then read the trace file"

  next_if_bad:
