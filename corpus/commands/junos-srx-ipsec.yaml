- id: junos-srx/ipsec.sa.clear-vpn
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "clear security ipsec security-associations"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: Disruptive
  blast_radius: >
    Tears down every child SA on the box and forces each to renegotiate.
    Traffic stops on every tunnel for the length of one Phase 2 exchange. The
    Phase 1 SAs survive, so recovery is fast.
  reversible: self

  domain: ipsec
  weight: 3
  tags: [phase2, disruptive, rekey]

  answers: "What is the cheapest way to prove a tunnel comes back cleanly?"
  aka:
    - "force a rekey"
    - "bounce the tunnel"
    - "restart phase 2"
    - "make it renegotiate"
  concepts:
    - concept:obj.child-sa
    - concept:act.clear
    - concept:attr.rekey

  read_field: "No output — re-run the Phase 2 listing and watch it reinstall"

  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/ike.sa.clear-peer
    - junos-srx/ipsec.sa.show
    - junos-srx/ipsec.inactive-tunnels.show

  guidebook: [guide:ipsec.clearing-and-rekey]

  explain:
    terse: "Forces a rekey. Phase 1 survives, so recovery is fast."
    explained: >
      Clearing Phase 2 alone forces a rekey and is the cheapest way to prove a
      tunnel comes back cleanly. The IKE SA stays up, so the child SA rebuilds
      inside an already-authenticated channel rather than starting from
      scratch.
    teaching: >
      This is the command to reach for first when a tunnel misbehaves, and it
      is not the one people reach for. The reflex is to clear Phase 1, which
      tears down every child SA under it — on a hub that is every spoke at
      once. Phase 2 rides inside Phase 1, so clearing the child alone tests
      exactly the thing that was probably wrong while leaving the expensive
      part intact. It is also the cleanest way to prove a config change took:
      a change to a proposal, a PFS group or a selector only takes effect at
      the next negotiation, and waiting an hour for a lifetime to expire is not
      a test plan.

  sources:
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }

- id: junos-srx/ike.sa.clear-peer
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "clear security ike security-associations {{peer}}"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: Disruptive
  blast_radius: >
    Tears down the IKE SA with this peer and every child IPsec SA under it. On
    a hub that is every spoke behind this peer at once. Traffic stops until
    each tunnel renegotiates.
  scope_required: [peer]
  reversible: self

  domain: ike
  weight: 2
  tags: [phase1, disruptive, rekey]

  answers: "How do I force the outer channel to rebuild with one far end?"
  aka:
    - "restart the tunnel"
    - "bounce the vpn"
    - "reset phase 1"
    - "rebuild ike with one peer"
  concepts:
    - concept:obj.ike-sa
    - concept:act.clear
    - concept:phase.p1

  read_field: "No output — re-run the Phase 1 listing to confirm it rebuilt"

  slots:
    - name: peer
      binds: { kind: IkeGateway, field: address }
      accepts: [Ip4, Ip6]
      placeholder: "<peer-ip>"
      required: true

  next_if_bad:
    - junos-srx/ike.sa.show
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/ipsec.sa.clear-vpn
    - junos-srx/ike.sa.clear-index
    - junos-srx/ike.sa.clear-all

  guidebook: [guide:ipsec.clearing-and-rekey]

  explain:
    terse: "Rebuilds P1 with one peer. Takes its children with it."
    explained: >
      Always scope by peer or index. Clearing Phase 1 tears down every child SA
      under it, and on a hub that is every spoke at once. Clearing Phase 2
      alone is the cheaper move and proves the same thing.
    teaching: >
      This command is the reflex when a tunnel misbehaves and it is almost
      always the wrong first move. Phase 2 rides inside Phase 1: clearing P2
      forces a rekey and is the cheapest way to prove a tunnel comes back
      cleanly, without touching anything else. Clearing P1 takes every child SA
      with it, and on a hub terminating forty spokes behind one peer address
      that is forty tunnels renegotiating simultaneously — which is also forty
      DH exponentiations landing on the routing engine at once. Reach for the
      Phase 2 clear first. Come here only when Phase 1 itself is the thing you
      doubt.

  sources:
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }

- id: junos-srx/ike.sa.clear-index
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "clear security ike security-associations index {{id}}"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: Disruptive
  blast_radius: >
    Tears down one IKE SA and every child SA under it. Narrower than clearing
    by peer only when a peer holds more than one IKE SA, which happens during
    a rekey overlap.
  scope_required: [id]
  reversible: self

  domain: ike
  weight: 1
  tags: [phase1, disruptive, rekey]

  answers: "How do I tear down exactly the one session I was reading?"
  aka:
    - "clear a specific sa"
    - "remove the stale duplicate session"
    - "kill one ike sa"
  concepts:
    - concept:obj.ike-sa
    - concept:act.clear
    - concept:phase.p1

  read_field: "No output — the index disappears from the Phase 1 listing"

  slots:
    - name: id
      binds: null
      accepts: [Integer]
      placeholder: "<sa-index>"
      required: true

  requires:
    - { slot: id, from: junos-srx/ike.sa.show, field: Index }

  next_if_bad:
    - junos-srx/ike.sa.show
  related:
    - junos-srx/ike.sa.clear-peer
    - junos-srx/ike.sa.show-index-detail

  guidebook: [guide:ipsec.clearing-and-rekey]

  explain:
    terse: "The narrowest scope available. Use it during a rekey overlap."
    explained: >
      During a simultaneous rekey a peer can briefly hold two IKE SAs. Clearing
      by peer takes both; clearing by index takes the one you identified. The
      index is only valid until the SA rebuilds.
    teaching: >
      The reason to prefer index over peer is not usually reach, it is
      precision under a specific condition: rekey collisions. RFC 7296 §2.8.2
      describes simultaneous IKE SA rekeying, where both ends start a rekey at
      once and one of the resulting SAs must be discarded. If you are looking
      at that state and clear by peer, you destroy both and lose the evidence
      along with the problem. There is a race here worth knowing about: if the
      SA rebuilds between reading the index and clearing it, the clear silently
      matches nothing and you conclude the command did not work.

  sources:
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }
    - { std: "RFC 7296", section: "2.8.2", note: "Simultaneous IKE SA rekeying" }

