- id: junos-srx/system.commit-confirmed
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "commit confirmed 5"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Activates the candidate configuration with an automatic rollback timer.
    Everything in the candidate takes effect now, including anything somebody
    else left there — check `show | compare` before running it.
  reversible: commit-confirmed
  paired_teardown: junos-srx/system.commit
  commit_model: junos-commit

  domain: system
  weight: 2
  tags: [bring-up, safety, day-one]

  answers: "How do I apply a change remotely without locking myself out?"
  aka:
    - "safe commit"
    - "rollback if I lose the session"
    - "auto revert"
    - "step one of bring up"
  concepts:
    - concept:obj.commit
    - concept:act.deploy

  read_field: "commit complete — then you have 5 minutes to confirm"

  next_if_bad:
    - junos-srx/system.commit.show
    - junos-srx/ike.sa.show
  related:
    - junos-srx/system.commit
    - junos-srx/system.commit.show

  guidebook: [guide:ipsec.bring-up-order]
  walkthrough: ["walk:junos-srx.s2s-ipsec#commit"]

  explain:
    terse: "Step 1. Always, remotely. The box reverts if you do not confirm."
    explained: >
      The candidate becomes active immediately and reverts automatically after
      five minutes unless a plain `commit` follows. If the change cuts your own
      management path, the box undoes it for you. This is step one of the
      bring-up order for a reason.
    teaching: >
      Every configuration change in this corpus assumes this wrapper. The
      failure it prevents is specific and common: a change to a WAN zone, an
      interface or a policy that severs the session you are working over, after
      which nothing can be undone because nothing can reach the box. Five
      minutes is enough to run the first three rungs of the verify ladder and
      decide. The discipline that goes with it is to confirm deliberately
      rather than reflexively — if the tunnel is not up yet, let it roll back
      and try again rather than confirming a half-working state and losing the
      safety net.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

- id: junos-srx/system.commit
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "commit"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Makes the candidate permanent with no rollback timer. After a
    `commit confirmed`, this is what stops the automatic revert.
  reversible: paired
  paired_teardown: junos-srx/system.commit-confirmed
  commit_model: junos-commit

  domain: system
  weight: 1
  tags: [bring-up, cleanup]

  answers: "How do I make the pending change permanent?"
  aka:
    - "confirm the change"
    - "keep it"
    - "stop the auto revert"
  concepts:
    - concept:obj.commit
    - concept:act.deploy

  read_field: "commit complete — the rollback timer is now cancelled"

  next_if_bad:
    - junos-srx/system.commit.show
  related:
    - junos-srx/system.commit-confirmed
    - junos-srx/ike.traceoptions.delete

  guidebook: [guide:ipsec.bring-up-order]

  explain:
    terse: "Cancels the rollback timer. Also required after every delete."
    explained: >
      Two jobs. It confirms a `commit confirmed` so the change stays, and it is
      the step that makes any `delete` actually happen. A delete without a
      commit changes nothing at all, which is how traceoptions get left
      running.
    teaching: >
      The second job is the one that costs people. Turning tracing off is a two
      step operation — `delete security ike traceoptions` and then `commit` —
      and the delete alone looks like it worked because the CLI accepts it
      without complaint. Traceoptions left running fill `/var`, and a full
      `/var` breaks logging and commits both, so the box stops being able to
      tell you what is wrong at exactly the moment you need it to. The failure
      surfaces a week later and looks unrelated to the incident that caused it.

  sources:
