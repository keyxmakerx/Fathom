    explained: >
      Hardware and environment: power, fans, temperature, failed components. A
      cluster node with a hardware alarm may be failing over intermittently,
      and intermittent failover looks exactly like an intermittent tunnel.
    teaching: >
      The pattern worth internalising is that tunnel symptoms are the
      end of long causal chains, and the box-level commands cut the chain near
      the start. A failing power supply causes a node failover, which causes
      the tunnel to rebuild from the other node with a different source
      address, which causes the peer to reject the identity, which appears in
      your log as AUTHENTICATION_FAILED. Investigating from the log end you
      will re-type the pre-shared key. Investigating from here you will find it
      in one command.

