- id: junos-srx/ipsec.vpn.ipsec-policy.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B ike ipsec-policy IPSEC-POL"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Attaches the Phase 2 policy to this tunnel. Changing it on a live VPN
    changes what is offered at the next rekey and can stop the child SA
    installing.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, object-chain, day-one, build]

  answers: "How does the tunnel pick up its data-plane crypto and PFS?"
  aka:
    - "link vpn to ipsec policy"
    - "attach phase 2 policy"
  concepts:
    - concept:obj.ipsec-vpn
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — a missing name fails the commit, not the tunnel"

  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
  related:
    - junos-srx/ipsec.policy.pfs.set
    - junos-srx/ipsec.vpn.gateway.set

  guidebook: [guide:ipsec.object-chain]

  explain:
    terse: "Six named objects, each referencing the one before it by name."
    explained: >
      This is the last reference in the chain. Junos enforces every one of them
      at commit — a missing policy name fails the commit — but it cannot check
      that the values behind the names are ones the far end will accept.
    teaching: >
      The commit check is the single biggest source of false confidence in a
      Junos VPN build. A configuration that commits cleanly has proved exactly
      one thing: the names resolve. Every failure that costs real time is a
      value the far end will not accept, and that failure waits for
      negotiation. So the bring-up order on side 1 exists precisely because
      commit success tells you nothing about whether the tunnel works — you
      commit confirmed, then you climb the ladder, and you stop at the first
      step that fails.

