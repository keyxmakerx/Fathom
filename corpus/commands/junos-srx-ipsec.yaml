  sources_note: >
    The card names the command and the NHTB acronym and nothing more. The
    multipoint explanation here is general IPsec knowledge, not the card's, and
    the specific output field names are unrecorded because nobody ran it.

- id: junos-srx/interface.st0.terse
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show interfaces st0.0 terse"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: interface
  weight: 3
  tags: [plumbing, bring-up, verify]

  answers: "Is the virtual tunnel endpoint carrying an admin and link state of up?"
  aka:
    - "is st0 up"
    - "tunnel interface state"
    - "step five of bring up"
  concepts:
    - concept:obj.st0
    - concept:state.interface-up
    - concept:act.check-interface

  read_field: "Admin and Link — want up/up"
  output_fields:
    - field: Admin
      means: "Administrative state of the unit."
      want: "up"
      bad:
        - { value: "down", means: "The unit is deactivated or disabled in configuration." }
    - field: Link
      means: "Operational state of the unit."
      want: "up"
      bad:
        - { value: "down", means: "No SA, or vpn-monitor has torn the tunnel down." }
    - field: Local
      means: "The address configured on the unit."
      want: any

  next_if_bad:
    - junos-srx/ipsec.sa.show
    - junos-srx/interface.st0.detail
  related:
    - junos-srx/interface.st0.detail
    - junos-srx/route.remote.show
    - junos-srx/ipsec.vpn.vpn-monitor.set

  guidebook: [guide:ipsec.plumbing, guide:ipsec.bring-up-order]
  related_rules: [tunnel.st0.zone-unbound, ipsec.vpn-monitor.absent-on-adjacency]

  explain:
    terse: "Step 5. Up here proves an SA exists, not that traffic moves."
    explained: >
      A secure tunnel unit has no wire, so its link state tracks the SA rather
      than anything physical. Up with `vpn-monitor` configured means the probe
      is succeeding; up without it means only that an SA exists.
    teaching: >
      The value of this rung is that it splits the crypto half of the problem
      from the plumbing half. Steps 2 to 4 of the bring-up ladder are the
      crypto. Steps 5 to 8 are the plumbing. If this reads up and traffic still
      does not flow, the remaining candidates are the zone, the policy, the
      route and source NAT — and none of them are visible from any IPsec
      command. Without `vpn-monitor`, the interface staying up is nearly
      meaningless as a health signal: a route out `st0` stays good while
      traffic blackholes, which is exactly the failure `vpn-monitor` exists to
      prevent.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }

- id: junos-srx/interface.st0.detail
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show interfaces st0.0 detail"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: interface
  weight: 1
  tags: [plumbing, mtu, verify]

  answers: "What are the byte counters and the configured size limit on the unit?"
  aka:
    - "st0 counters"
    - "tunnel interface detail"
    - "check the tunnel mtu"
  concepts:
    - concept:obj.st0
    - concept:attr.mtu
    - concept:act.inspect

  read_field: "MTU — the logical unit value is the IP MTU"
  output_fields:
    - field: MTU
      means: "The IP MTU of the logical unit."
      want: any
      tell: >
        On SRX the physical MTU includes L2 overhead and the logical-unit MTU
        is the IP MTU. Different numbers for the same link — confirm which
        layer you are reading before comparing against a peer.
    - field: "Input packets"
      means: "Packets received on the unit."
      want: any
      tell: "Flat while output climbs is the one-way shape, seen at the interface."
    - field: "Output packets"
      means: "Packets sent out the unit."
      want: any

  next_if_bad:
    - junos-srx/ipsec.statistics.index
    - junos-srx/mtu.ping.df-sized
  related:
    - junos-srx/interface.st0.terse
    - junos-srx/interface.st0.mtu.show
    - junos-srx/ipsec.statistics.index

  guidebook: [guide:mtu.overhead]
  related_rules: [mtu.st0.unset]

  explain:
    terse: "Counters and MTU on the tunnel unit itself."
    explained: >
      Interface counters and SA counters answer different questions. This one
      counts what the routing layer handed to the unit; `show security ipsec
      statistics` counts what the crypto engine actually encrypted and
      decrypted. A gap between them is informative.
    teaching: >
      The MTU field here is the one to read before any conversation with the
      far end about packet sizes, and the reason is that the same link has two
      different numbers. On SRX the physical MTU includes L2 overhead and the
      logical-unit MTU is the IP MTU. Compare a physical figure on one side
      against a logical figure on the other and the two engineers will disagree
      by fourteen bytes and both be right. Confirm which layer you are reading
      before comparing anything, and state the layer explicitly when you send
      the number to somebody else.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }

- id: junos-srx/route.remote.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show route 10.2.0.0/16"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: route
  weight: 2
  tags: [plumbing, bring-up, verify]

  answers: "Does the far side's prefix resolve, and out which interface?"
  aka:
    - "does it point at the tunnel"
    - "step six of bring up"
    - "is there a path to the remote subnet"
    - "next hop for the remote prefix"
  concepts:
    - concept:obj.route
    - concept:obj.st0
    - concept:act.verify

  read_field: "Next hop — want st0.0, not the default gateway"
  output_fields:
    - field: "Next hop"
      means: "Where this box will send packets for the prefix."
      want: "st0.0"
      bad:
        - value: "*"
          means: >
            Anything else means traffic for the remote prefix is not entering
            the tunnel. A default route swallowing it is the common case.

  slots:
    - name: prefix
      binds: { kind: TrafficSelector, field: remote_ip }
      accepts: [Prefix]
      placeholder: "<remote-prefix>"
      required: true

  next_if_bad:
    - junos-srx/route.static.st0.set
    - junos-srx/flow.session.show
  related:
    - junos-srx/interface.st0.terse
    - junos-srx/route.static.st0.set
    - junos-srx/ipsec.next-hop-tunnels.show

  guidebook: [guide:ipsec.plumbing, guide:ipsec.bring-up-order]
  related_rules: [route.remote-prefix.no-next-hop-st0]

  explain:
    terse: "Step 6. Want st0.0. A default route swallowing it is the classic."
    explained: >
      A route-based tunnel is selected by the routing table, so if this prefix
      does not resolve via the tunnel unit, nothing reaches the tunnel however
      healthy the SAs are. Check the actual next hop, not merely that a route
      exists.
    teaching: >
      The failure this catches is usually not a missing route — it is a route
      that exists and points somewhere else. A default route to the internet
      will happily match the remote prefix if no more specific route was ever
      added, so the packet leaves via the WAN in the clear, gets source-NATed
      on the way out, and never touches the tunnel. Nothing about that shows up
      in any IPsec command: the SAs are Installed, `st0` is up, and the byte
      counters do not move. The interaction with `establish-tunnels on-traffic`
      matters too, because with nothing routed at `st0` the tunnel never even
      attempts to negotiate.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/flow.session.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security flow session"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: flow
  weight: 2
  tags: [plumbing, bring-up, verify]

  answers: "Are real conversations crossing between the two zones right now?"
  aka:
    - "are there real sessions"
    - "step eight of bring up"
    - "is anything actually going through"
    - "who is talking over the tunnel"
  concepts:
    - concept:obj.session
    - concept:dataplane.passing
    - concept:act.verify

  read_field: "Session count and the in/out interface pair"
  output_fields:
    - field: "In"
      means: "Ingress interface and the source and destination of the flow."
      want: any
    - field: "Out"
      means: "Egress interface for the reverse wing."
      want: any
      tell: "Want st0.0 on the wing that should be entering the tunnel."
    - field: "Total sessions"
      means: "Number of sessions currently in the table."
      want: any
      bad:
        - { value: "0", means: "Nothing is crossing. The policy or the route is the next place to look." }

  next_if_bad:
    - junos-srx/policy.zone-pair.match.set
    - junos-srx/route.remote.show
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/route.remote.show
    - junos-srx/ipsec.statistics.index
    - junos-srx/flow.status.show

  guidebook: [guide:ipsec.plumbing, guide:ipsec.bring-up-order]
  related_rules: [policy.zone-pair.missing, nat.source-nat-eats-tunnel]

  explain:
    terse: "Step 8. Real sessions, with the egress interface on each wing."
    explained: >
      This is where the plumbing half of the ladder pays off. A session whose
      egress is `st0.0` proves the policy matched and the route resolved. A
      session whose egress is the WAN unit proves the opposite, and usually
      means a default route or a source NAT rule grabbed it.
    teaching: >
      Read the interface pair before the counts. The single most useful thing
      this output tells you is which way the packet actually went, and the
      failure it exposes most often is source NAT eating tunnel traffic: the
      interface NAT rule for internet-bound traffic also grabs packets routed
      at `st0`, the far end sees the wrong source and rejects the selector, and
      every IPsec command still reads clean. That needs an explicit no-NAT rule
      above it. If there are no sessions at all, the policy or the route is the
      next place to look and the crypto is not.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

