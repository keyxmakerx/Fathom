  aka:
    - "re cpu"
    - "is the box overloaded"
    - "control plane memory"
    - "why is everything slow"
  concepts:
    - concept:obj.device
    - concept:act.diagnose

  read_field: "CPU idle and memory utilisation, over 1 and 5 minutes"
  output_fields:
    - field: "Idle"
      means: "Percentage of routing engine CPU not in use."
      want: any
      bad:
        - value: "0"
          means: >
            A saturated routing engine delays negotiation and DPD processing,
            which produces flaps that look like protocol failures.
    - field: "Memory utilization"
      means: "Routing engine memory in use."
      want: any

  next_if_bad:
    - junos-srx/system.processes.kmd.show
    - junos-srx/ike.traceoptions.delete
  related:
    - junos-srx/system.processes.kmd.show
    - junos-srx/flow.monitoring.fpc.show
    - junos-srx/ike.traceoptions.flag-ike

  guidebook: [guide:ipsec.correlate-first]
  related_rules: [ike.traceoptions.flag-all]

  explain:
    terse: "Control plane load. Negotiation and DPD both live here."
    explained: >
      Phase 1 and Phase 2 negotiation, DPD processing and log writing all run
      on the routing engine. A saturated routing engine delays all three, which
      produces tunnel behaviour indistinguishable from a protocol problem.
    teaching: >
      Two specific causes to check when this is high during a VPN incident.
      First, your own tracing: `flag all` produces enough output that the
      routing engine spends real time formatting and writing it, so the CPU
      figure you are reading may include the cost of watching. Second, a mass
      renegotiation — clearing Phase 1 on a hub tears down every child SA under
      it, and forty simultaneous Diffie-Hellman exponentiations land here at
      once. Both are self-inflicted, both are recent, and both are visible in
      the commit history and your own session scrollback.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }

- id: junos-srx/system.processes.kmd.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show system processes extensive | match kmd"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 0
  tags: [performance, day-two, not-vpn-specific]

  answers: "Is the key management daemon itself consuming or stuck?"
  aka:
    - "kmd cpu"
    - "is the ike daemon busy"
    - "key management process state"
  concepts:
    - concept:obj.device
    - concept:act.diagnose

  read_field: "CPU and state for kmd — a pegged daemon delays every negotiation"

  next_if_bad:
    - junos-srx/chassis.re.show
    - junos-srx/system.storage.show
  related:
    - junos-srx/chassis.re.show
    - junos-srx/log.kmd.last

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "The daemon that does all of this. Rarely the answer, quick to check."
    explained: >
      `kmd` handles IKE negotiation and SA installation. When it is pegged,
      tunnels come up slowly, DPD responses are late, and rekeys collide — all
      of which read as protocol failures from the log end.
    teaching: >
      Reach for this after `show chassis routing-engine` shows load and you
      want to know whose. The realistic causes are scale and self-inflicted
      work: a hub with hundreds of tunnels whose lifetimes have synchronised so
      that they rekey together, or a mass clear that put every tunnel into
      negotiation at the same moment. The structural fix for the first is
      jitter, which Junos already applies by subtracting a random amount from
      the hard lifetime to get the soft one — which is exactly why rekeys drift
      and never land on the same second twice, and why a tunnel estate that
      does rekey together is worth investigating rather than accepting.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 2, block: "LIFETIMES & REKEY" }

- id: junos-srx/system.storage.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show system storage"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 2
  tags: [hygiene, day-two, not-vpn-specific]

  answers: "Is any filesystem full enough to break logging and commits?"
  aka:
    - "is var full"
    - "disk space"
    - "why did the commit fail"
    - "why are logs empty"
  concepts:
    - concept:obj.device
    - concept:act.diagnose

  read_field: "/var capacity — full means no logs and no commits"
  output_fields:
    - field: "Filesystem"
      means: "Mount point."
      want: any
    - field: "Capacity"
      means: "Percentage used."
      want: any
      bad:
        - value: "100%"
          means: >
            A full /var breaks logging and commits both. Traceoptions left
            enabled are the usual cause.

  next_if_bad:
    - junos-srx/ike.traceoptions.delete
    - junos-srx/ipsec.traceoptions.delete
  related:
    - junos-srx/ike.traceoptions.delete
    - junos-srx/ike.traceoptions.file
    - junos-srx/log.kmd.last

  guidebook: [guide:ipsec.tracing]
  related_rules: [ike.traceoptions.left-enabled]

  explain:
    terse: "/var full = no logs. And no commits either."
    explained: >
      Two consequences that arrive together and are rarely connected to each
      other by the person seeing them: log files stop being written, and
      commits start failing. Both look like unrelated faults and both have one
      cause.
    teaching: >
      The chain runs backwards from a symptom nobody associates with IPsec.
      Somebody turned on traceoptions during an incident and did not delete
      them — the delete needs a commit, and the delete alone does nothing.
      Weeks later `/var` fills. Logging stops, so the next incident has no
      evidence. Commits start failing, so the fix cannot be applied. And the
      config diff that would explain it is one statement in a hierarchy nobody
      thinks to check. Run this whenever logs are unexpectedly empty or a
      commit fails for no visible reason, and check both traceoptions
      hierarchies when it is full.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

- id: junos-srx/system.users.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show system users"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 1
  tags: [correlation, day-two, not-vpn-specific]

  answers: "Who else is logged in right now?"
  aka:
    - "is someone else working on this"
    - "who is on the box"
    - "am I fighting another engineer"
  concepts:
    - concept:obj.device
    - concept:act.correlate

  read_field: "Session list — anyone in configuration mode is the story"

  next_if_bad:
    - junos-srx/system.commit.show
  related:
    - junos-srx/system.commit.show
    - junos-srx/system.uptime.show

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "Somebody else may be committing while you are diagnosing."
    explained: >
      A second engineer working the same incident from the other end produces
      symptoms that change while you are measuring them, which is the most
      confusing state an investigation can be in and the easiest to rule out.
    teaching: >
      This costs one command and it prevents a specific and expensive failure:
      two people making changes on one box, each reading the other's effects as
      evidence about their own theory. It also matters for the safety net —
      a `commit confirmed` from one session is rolled back or confirmed
      globally, so somebody else's plain `commit` will silently confirm your
      change and cancel your rollback timer. If anyone else is here, agree who
      holds the box before you touch the configuration.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }

- id: junos-srx/flow.status.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security flow status"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: flow
  weight: 1
  tags: [day-two, not-vpn-specific]

  answers: "Which forwarding mode is this box in, and what is enabled?"
  aka:
    - "packet mode or flow mode"
    - "forwarding mode"
    - "is the box in flow mode"
  concepts:
    - concept:obj.device
    - concept:act.inspect

  read_field: "Forwarding mode — the assumptions behind zones depend on it"

  next_if_bad:
    - junos-srx/flow.session.show
    - junos-srx/flow.monitoring.fpc.show
  related:
    - junos-srx/flow.session.show
    - junos-srx/flow.monitoring.fpc.show

  guidebook: [guide:ipsec.plumbing]

  explain:
    terse: "Confirms the model the rest of the security config assumes."
    explained: >
      Zones, policies and session state all assume flow-based forwarding.
      Reading this once at the start of an investigation confirms that the
      mental model you are applying matches the box in front of you.
    teaching: >
      It is a cheap sanity check with an outsized payoff on an unfamiliar box.
      Every plumbing conclusion on side 1 — the tunnel unit needs a zone, the
      zone pair needs a policy, the session table shows what crossed — rests on
      flow-based behaviour. If the box is not behaving the way the model
      predicts, and everything about the crypto is clean, confirming the
      forwarding mode is faster than re-reading the policy. The same reasoning
      applies to the fact that an SRX is not an MX: IPsec rules that are true
      here are frequently false there, and the hierarchy differs.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

- id: junos-srx/flow.monitoring.fpc.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security monitoring fpc 0"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: flow
  weight: 1
  tags: [performance, day-two, not-vpn-specific]

  answers: "Is the data plane near its processing or session capacity?"
  aka:
    - "data plane cpu"
    - "session count against the limit"
    - "is the box at capacity"
  concepts:
    - concept:obj.device
    - concept:act.diagnose

  read_field: "CPU utilisation and current session count against the maximum"
  output_fields:
    - field: "CPU utilization"
      means: "Data-plane processor load."
      want: any
      tell: >
        Encryption happens here, not on the routing engine. Sustained high
        load with a healthy routing engine points at throughput, not
        negotiation.
    - field: "Current flow session"
      means: "Sessions currently held, against the platform maximum."
      want: any

  next_if_bad:
    - junos-srx/chassis.re.show
    - junos-srx/flow.session.show
  related:
    - junos-srx/chassis.re.show
    - junos-srx/flow.session.show
    - junos-srx/flow.force-ip-reassembly.set

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "The data plane, not the control plane. Encryption lives here."
    explained: >
      Two different processors with two different failure modes. Negotiation,
      DPD and logging are routing-engine work; encryption, decryption and
      session handling are data-plane work. Read both before concluding "the
      box is busy".
    teaching: >
      The distinction changes what you would do about it. A loaded routing
      engine slows tunnel establishment and can cause DPD-driven flaps, and
      the fixes are about reducing control-plane churn — fewer simultaneous
      rekeys, less tracing, scoped clears. A loaded data plane slows traffic
      through established tunnels, and the fixes are about throughput and
      fragmentation — which is where forcing IP reassembly becomes a capacity
      decision rather than a free correctness one. Reading the wrong processor
      sends you to the wrong half of the problem.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }

- id: junos-srx/interface.wan.errors.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show interfaces reth0.0 extensive | match -i error"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: interface
  weight: 1
  tags: [underlay, day-two, not-vpn-specific]

  answers: "Is the underlay port itself dropping or corrupting frames?"
  aka:
    - "interface errors"
    - "crc errors on the wan"
    - "is the physical link clean"
    - "underlay loss"
  concepts:
    - concept:obj.wan-unit
    - concept:act.diagnose
  symptoms:
    - concept:symptom.tunnel-flapping

  read_field: "Any non-zero error counter, and whether it is climbing"
  output_fields:
    - field: "Input errors"
      means: "Frames received with a fault."
      want: "0"
      tell: >
        Climbing input errors explain replay counters, DPD-driven flaps and
        integrity failures at once. Fix this before touching crypto.
    - field: "Output errors"
      means: "Frames this box failed to transmit cleanly."
      want: "0"

  next_if_bad:
    - junos-srx/mtu.ping.rapid
    - junos-srx/chassis.alarms.show
  related:
    - junos-srx/ipsec.statistics.index
    - junos-srx/mtu.ping.rapid
    - junos-srx/chassis.alarms.show

  guidebook: [guide:ipsec.counters-and-replay]
  related_rules: [ike.dpd.too-tight]

  explain:
    terse: "The underlay. A dirty link produces every crypto symptom at once."
    explained: >
      A physical fault on the WAN unit produces ESP integrity failures, replay
      counters, lost DPD probes and irregular flaps — four symptoms that each
      point somewhere else in the protocol and all have one cause underneath
      them.
    teaching: >
      This is the command that resolves the most confusing flap pattern on the
      card: irregular and bursty, with no round-number interval to latch onto.
      Even intervals mean rekey or DPD; irregular means underlay path loss, and
      this is where you confirm it. It also explains a counter-intuitive
      reading elsewhere: ESP authentication failures with traffic still flowing
      usually mean corruption in path rather than a key mismatch, because a
      wrong key fails everything and not some of it. Some-of-it failures are a
      physical-layer story, and the numbers here are where it is written down.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
    - { card: "srx-ipsec", side: 3, block: "STATISTICS & COUNTERS" }
    - { card: "srx-ipsec", side: 3, block: "FLAP PATTERN → CAUSE" }

- id: junos-srx/system.version.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show version"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 2
  tags: [correlation, day-one, not-vpn-specific]

  answers: "Which software train is this box on?"
  aka:
    - "what junos is this"
    - "software release"
    - "which train"
  concepts:
    - concept:obj.device
    - concept:act.inspect

  read_field: "Junos release string — record it, it unlocks version predicates"
  output_fields:
    - field: "Junos"
      means: "The release string, for example 21.4R3-S5.4 or 15.1X49-D240."
      want: any
      join_key: true
      tell: >
        R trains and X trains are different numbering schemes and are not
        ordered against each other within the same major.minor.

  supplies: ["Junos"]
  next_if_bad:
    - junos-srx/system.commit.show
  related:
    - junos-srx/system.uptime.show
    - junos-srx/system.commit.show

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "The cheapest evidence there is, and it unlocks the most checks."
    explained: >
      Syntax and defaults differ meaningfully between Junos trains, so a rule
      or a command entry that is correct on one and wrong on another is worse
      than none. Recording the version is what lets everything else narrow
      itself to the box in front of you.
    teaching: >
      Two things about Junos release strings that catch people. The SRX branch
      line lived in the X trains for years, so `15.1X49-D240` is a real and
      common string that does not fit the ordinary `m.nRb` shape. And an X
      train and an R train at the same major and minor are not comparable —
      `15.1X49-D240` is neither before nor after `15.1R7` in any sense a
      decision should rest on. When recording a version for a change ticket or
      a support case, paste the whole string rather than the part that looks
      like a number.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }
  sources_note: >
    The card names the command only. The release-numbering observations are
    from Fathom's own version-scheme definition in 63-rulepack-spec.md §6.2,
    which itself carries a VERIFY marker about cross-train ordering.

