- id: junos-srx/ipsec.proposal.protocol.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec proposal IPSEC-P2 protocol esp"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Selects the data-plane protocol. Changing an established tunnel from ESP to
    AH stops it carrying encrypted traffic and breaks it entirely through any
    NAT in path.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, crypto, day-one, build]

  answers: "Which data-plane protocol carries the encrypted payload?"
  aka:
    - "esp or ah"
    - "which ip protocol does the tunnel use"
    - "why is ah broken"
  concepts:
    - concept:obj.ipsec-proposal
    - concept:attr.encryption
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — a mismatch shows as NO_PROPOSAL_CHOSEN on Phase 2"

  next_if_bad:
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p2
  related:
    - junos-srx/ipsec.proposal.encryption.set
    - junos-srx/ipsec.policy.pfs.set

  guidebook: [guide:ipsec.object-chain]
  related_rules: [ipsec.proposal.ah-used]

  explain:
    terse: "esp. AH is integrity-only and breaks through NAT."
    explained: >
      ESP is IP protocol 50 and both encrypts and authenticates. AH is
      integrity-only, provides no confidentiality, and covers fields that
      address translation rewrites — so a NAT anywhere in path breaks it and
      there is no traversal workaround.
    teaching: >
      There is essentially one right answer here and the value of knowing why
      is that it stops you trying AH when ESP will not come up. AH protects
      parts of the outer header, which is exactly what a NAT device modifies,
      so AH and NAT are mutually exclusive by construction rather than by
      configuration. RFC 8221 §4 also states that combining ESP with AH is NOT
      RECOMMENDED — it is slower, and the second header costs octets that come
      straight off your usable MTU, which is already the tightest budget in the
      build. If you find AH in an inherited config and the tunnel works, it
      works because there is no NAT in that path today.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { std: "RFC 8221", section: "4", note: "Combining ESP and AH is NOT RECOMMENDED" }

- id: junos-srx/ipsec.proposal.encryption.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec proposal IPSEC-P2 encryption-algorithm aes-256-gcm"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes the data-plane cipher. The current child SA keeps running until it
    rekeys, then fails to install if the peer was not changed in the same
    window.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [phase2, crypto, day-one, build]

  answers: "Which cipher protects the payload once the tunnel is carrying data?"
  aka:
    - "set the data cipher"
    - "aes gcm for the tunnel"
    - "phase 2 encryption"
  concepts:
    - concept:obj.ipsec-proposal
    - concept:attr.encryption
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — a mismatch shows as NO_PROPOSAL_CHOSEN on Phase 2"

  next_if_bad:
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p2
    - junos-srx/ipsec.inactive-tunnels.show
  related:
    - junos-srx/ike.proposal.encryption.set
    - junos-srx/ipsec.policy.pfs.set

  guidebook: [guide:ike.proposal-parameters]
  related_rules: [ipsec.proposal.gcm-with-hash, ipsec.proposal.3des]

  explain:
    terse: "GCM is AEAD — omit authentication-algorithm entirely."
    explained: >
      GCM is AEAD, so there is no separate `authentication-algorithm`. With CBC
      you must set both — a missing hash is a silent proposal mismatch. Setting
      a hash alongside GCM is the mirror mistake and fails the same way, with
      the same unhelpful error.
    teaching: >
      This is the one place where an extra statement is as wrong as a missing
      one, and both fail identically. Junos will commit either. The negotiation
      then reports NO_PROPOSAL_CHOSEN on Phase 2, which sends you to the PFS
      group, the ESP algorithms, and esp-versus-ah — three places, none of
      which name the hash. The habit that prevents it: decide AEAD or CBC once,
      per tunnel, and write the proposal out as a block so the presence or
      absence of the hash is visible at a glance rather than being a statement
      that happens not to be there. RFC 8221 §5 makes both AES-CBC and
      AES-GCM-16 MUST, so a peer that cannot do one can almost always do the
      other.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { std: "RFC 8221", section: "5", note: "ESP encryption algorithm requirement levels" }

- id: junos-srx/ipsec.proposal.lifetime.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec proposal IPSEC-P2 lifetime-seconds 3600"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes how often the child SA rekeys. Takes effect at the next
    negotiation. No traffic effect on its own if the rekey is healthy.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, timers, day-one, build]

  answers: "How often is the data key thrown away and rebuilt?"
  aka:
    - "phase 2 lifetime"
    - "child sa rekey timer"
    - "how often does the tunnel rekey"
  concepts:
    - concept:obj.ipsec-proposal
    - concept:attr.lifetime
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — the hard and soft countdown are in the SA detail output"

  next_if_bad:
    - junos-srx/ipsec.sa.show-vpn-detail
    - explain:symptom:flap-even-interval-round-number
  related:
    - junos-srx/ike.proposal.lifetime.set
    - junos-srx/ipsec.policy.pfs.set

  guidebook: [guide:ipsec.lifetimes]
  related_rules: [ipsec.lifetime.ikev1-mismatch, ipsec.lifetime.kilobytes-unset-on-busy]

  explain:
    terse: "3600 for P2 is conventional. Range 180 to 86400."
    explained: >
      Shorter lifetimes limit how much traffic one key covers, which is the
      compensating control when PFS is not available. There is also
      `lifetime-kilobytes`, which rekeys on volume — a busy tunnel then rekeys
      far more often than the clock suggests.
    teaching: >
      Lifetime is the parameter people reach for when a tunnel flaps, and
      raising it is almost always the wrong move. A tunnel that goes down at
      the lifetime boundary is a rekey collision or a peer refusing the new SA,
      not a timer that needs raising — raising it makes the failure rarer, and
      a rare failure is harder to catch than a frequent one. The diagnostic
      that separates the cases is whether the flap interval is a clean round
      number equal to the lifetime, in which case it is rekey, or equal to the
      DPD interval times threshold, in which case it is liveness. And if flaps
      track throughput rather than time, check `lifetime-kilobytes` first —
      that is a volume trigger wearing a timer's clothes.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 2, block: "LIFETIMES & REKEY" }
    - { card: "srx-ipsec", side: 3, block: "FLAP PATTERN → CAUSE" }

- id: junos-srx/ipsec.policy.pfs.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec policy IPSEC-POL perfect-forward-secrecy keys group14"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Adds a fresh Diffie-Hellman exchange to every Phase 2 negotiation. A peer
    without the identical group rejects Phase 2 from the next rekey onward
    while Phase 1 stays up, so the tunnel appears to drop for no reason.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [phase2, crypto, security, day-one]

  answers: "How do I stop one stolen secret unlocking every recorded session?"
  aka:
    - "turn on pfs"
    - "perfect forward secrecy"
    - "fresh key per phase 2"
    - "forward secrecy group"
  concepts:
    - concept:obj.ipsec-policy
    - concept:attr.pfs
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — a group mismatch reads as INVALID_KE_PAYLOAD"

  next_if_bad:
    - explain:error:junos-srx/INVALID_KE_PAYLOAD
    - junos-srx/ipsec.inactive-tunnels.show
  related:
    - junos-srx/ike.proposal.dh-group.set
    - junos-srx/ipsec.proposal.lifetime.set
    - junos-srx/ipsec.sa.show-vpn-detail

  guidebook: [guide:ipsec.pfs]
  related_rules: [ipsec.pfs.absent, ipsec.pfs.group-mismatch, ipsec.pfs.group-differs-from-p1]

  explain:
    terse: "Fresh DH per Phase 2. Identical both ends, not merely compatible."
    explained: >
      Without PFS the Phase 2 keys derive from Phase 1 key material, so one
      compromised IKE SA secret unlocks every data key under it. With PFS each
      Phase 2 negotiation runs its own Diffie-Hellman exchange and the key is
      independent of Phase 1 and of every previous Phase 2 key.
    teaching: >
      Three rules and a cost. The group must be identical at both ends, not
      merely compatible. PFS on one side and absent on the other fails Phase 2
      while Phase 1 stays up — the classic "IKE looks fine but the tunnel keeps
      dropping", and the most misread symptom in IPsec. The PFS group need not
      equal the Phase 1 `dh-group`, but matching them removes a whole class of
      confusion. The cost is one extra DH exponentiation per SA per rekey,
      which is irrelevant unless hundreds of tunnels rekey together. Turn it
      on. One thing that is not a bug: under IKEv2 the first child SA is always
      keyed from the IKE SA regardless, so a capture of the initial bring-up
      showing no DH exchange is not a misconfiguration.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 2, block: "PERFECT FORWARD SECRECY" }
    - { std: "RFC 7296", section: "1.3", note: "CREATE_CHILD_SA may carry a KE payload for a fresh Diffie-Hellman" }
    - { std: "RFC 8247", section: "2.4", note: "group14 MUST; groups 2 and 5 SHOULD NOT" }

- id: junos-srx/ipsec.policy.proposals.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec policy IPSEC-POL proposals IPSEC-P2"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Attaches the data-plane algorithms to the policy. A name that does not
    exist fails the commit rather than the tunnel.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, object-chain, day-one, build]

  answers: "How do the data-plane algorithms attach to the Phase 2 policy?"
  aka:
    - "link ipsec proposal to policy"
    - "reference the phase 2 proposal"
  concepts:
    - concept:obj.ipsec-policy
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — a missing name fails the commit, not the tunnel"

  next_if_bad:
    - junos-srx/ipsec.sa.show
  related:
    - junos-srx/ipsec.proposal.encryption.set
    - junos-srx/ipsec.vpn.ipsec-policy.set

  guidebook: [guide:ipsec.object-chain]
  related_rules: [ike.proposal-set.used]

  explain:
    terse: "Policy names proposal. PFS lives on the policy, not the proposal."
    explained: >
      The Phase 2 policy owns two things: the proposal list and
      `perfect-forward-secrecy`. That split matters when you are diffing
      against a peer, because PFS is missed when you are comparing proposals line
      by line and it is not in one of them.
    teaching: >
      The object chain exists so that knowing which object owns a knob tells
      you where to look. On Phase 2 that split is unusually load-bearing:
      algorithms and lifetime on the proposal, PFS on the policy, and
      everything about this particular tunnel — gateway, bind interface,
      selectors, establish-tunnels, df-bit, vpn-monitor — on the VPN. So when
      Phase 2 fails with NO_PROPOSAL_CHOSEN, the three things to compare are
      the PFS group on the policy, the ESP algorithms on the proposal, and esp
      versus ah. Two of those are not in the object you were reading.

  sources:
