  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes what this box calls itself in Phase 1. A value the peer is not
    expecting fails authentication at the next negotiation and reads as a key
    problem rather than an identity one.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, identity, nat]

  answers: "What name does this box present when its outer address is not enough?"
  aka:
    - "set my ike id"
    - "identity behind nat"
    - "what do we call ourselves"
  concepts:
    - concept:obj.ike-gateway
    - concept:attr.identity
    - concept:act.configure
