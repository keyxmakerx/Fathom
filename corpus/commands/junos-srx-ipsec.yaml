  guidebook: [guide:ipsec.plumbing]
  related_rules: [zone.host-inbound.ike-missing, ike.gateway.external-interface-wrong]

  explain:
    terse: "The WAN unit IKE leaves by — never st0."
    explained: >
      `external-interface` is the WAN unit the IKE packets leave by, not `st0`.
      Wrong on a multi-homed box means Phase 1 sources from an address the peer
      has never heard of. The zone that owns this unit must also permit inbound
      IKE.
    teaching: >
      This is the statement people set to `st0` because `st0` is the tunnel and
      the tunnel is what they are building. It is backwards: `st0` only exists
      once Phase 2 has installed, and Phase 1 has to happen over the underlay
      to get there. Two failures live on this one line. Point it at the wrong
      WAN unit and the peer sees an unexpected source and drops you. Point it
      at the right WAN unit whose zone has no `host-inbound-traffic
      system-services ike` and the box drops the peer's IKE before the IKE
      process ever sees it — Phase 1 times out with nothing useful in the log,
      because nothing local ever happened. Check the zone before you touch
      crypto.

