             attr.lifetime, attr.pfs, attr.dpd, attr.identity, attr.ike-version,
             attr.establish-tunnels, attr.vpn-monitor, attr.df-bit, attr.mss,
             attr.rekey]
  action:   [act.configure, act.inspect, act.diagnose, act.verify, act.clear,
