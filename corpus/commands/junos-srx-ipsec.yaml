  related_rules: [ike.traceoptions.flag-all]

  explain:
    terse: "flag ike, not flag all. all buries the signal and loads the RE."
    explained: >
      One flag, chosen for the phase you are investigating. `flag all` is the
      instinctive choice under pressure and it is the wrong one: the volume
      makes the answer harder to find and the routing engine pays for producing
      it.
    teaching: >
      There is a general principle here worth carrying to every vendor. Tracing
      is a sampling decision, and turning everything on is a refusal to make
      it. The cost is not only disk. On an SRX the routing engine formats and
      writes every one of those lines while also running the control plane, so
      a box already under pressure during an incident gets more pressure at
      exactly the wrong moment — and the routing engine CPU figure you then
      read from `show chassis routing-engine` includes your own tracing. Decide
      what you are looking for, trace that, and if it is not there, change the
      flag rather than adding one.

