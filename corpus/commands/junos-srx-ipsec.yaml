  cmd: "show log kmd | match {{peer}}"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: log
  weight: 3
  tags: [phase1, phase2, diagnose, day-two]

  answers: "What story does the box tell about this one far end?"
  aka:
    - "read the ike log"
    - "why did it fail"
    - "find my peer in the log"
    - "negotiation history"
  concepts:
    - concept:obj.log
    - concept:act.read-log
  symptoms:
    - concept:symptom.tunnel-flapping
    - concept:symptom.tunnel-down

  read_field: "The last lifecycle event before the failure"

  slots:
    - name: peer
      binds: { kind: IkeGateway, field: address }
      accepts: [Ip4, Ip6]
      placeholder: "<peer-ip>"
      required: true

  next_if_bad:
    - explain:concept:ipsec.error-decoder
    - junos-srx/ike.traceoptions.file
  related:
    - junos-srx/log.kmd.last
    - junos-srx/log.messages.kmd-vpn
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/system.commit.show

  guidebook: [guide:ipsec.reading-the-log]
  related_rules: [zone.host-inbound.ike-missing, ike.identity.mismatch]

  explain:
    terse: "Step 9 of the ladder. Scope by peer or you will read everything."
    explained: >
      A tunnel has no wire — it fails as a lifecycle event, so read the log.
      The peer address is the join key, because nothing in the log mentions
      `st0` and the VPN name appears inconsistently. Filter by the address the
      box sees, which under NAT is not the address you configured.
    teaching: >
      Read this after `show security ipsec inactive-tunnels`, not before. The
      log is a narrative and it takes reading; inactive-tunnels is a table with
      a Tunnel Down Reason column that is often the whole answer. When you do
      come here, the fastest read is the error token, because the decoder maps
      each one to a short list of places to look: NO_PROPOSAL_CHOSEN to the
      four proposal values, INVALID_KE_PAYLOAD to the DH group or PFS keys,
      TS_UNACCEPTABLE to the selectors, AUTHENTICATION_FAILED to the key, the
      chain, the clock or the identity. And note which side reported it — from
      the responder it means what you offered is not in their list; from you,
      the reverse.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }

