- id: junos-srx/ipsec.statistics.all
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec statistics"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 2
  tags: [phase2, counters, verify]

  answers: "Across every tunnel, how much has been encrypted and what failed?"
  aka:
    - "esp errors"
    - "replay errors"
    - "are there integrity failures"
    - "box wide crypto counters"
  concepts:
    - concept:obj.counter
    - concept:dataplane.passing
    - concept:act.inspect

  read_field: "Error block — ESP authentication failures and replay errors"
  output_fields:
    - field: "ESP authentication failures"
      means: "Packets that arrived and failed the integrity check."
      want: "0"
      tell: >
        Failures with traffic still flowing usually means corruption in path,
        not a key mismatch — a wrong key fails everything, not some of it.
    - field: "Replay errors"
      means: "Packets dropped as duplicate or outside the anti-replay window."
      want: any
      tell: >
        A small static count is noise. A climbing count means real reordering
        or loss.
    - field: "Bad headers"
      means: "Malformed packets presented to the crypto engine."
      want: "0"
    - field: "Decryption failures"
      means: "Packets that could not be decrypted at all."
      want: "0"

  next_if_bad:
    - junos-srx/ipsec.statistics.index
    - junos-srx/interface.wan.errors.show
  related:
    - junos-srx/ipsec.statistics.index
    - junos-srx/ipsec.statistics.clear
    - junos-srx/ipsec.sa.show

  guidebook: [guide:ipsec.counters-and-replay]
  related_rules: [ike.dpd.too-tight]

  explain:
    terse: "Box-wide counters. Read the bytes first, then the error block."
    explained: >
      The unscoped form aggregates across tunnels, which makes it good for
      "is anything wrong anywhere" and bad for attributing what you find. Once
      a counter is climbing, scope by index to find out which tunnel owns it.
    teaching: >
      Replay counters are the most misread number in this output. Almost always
      they are benign reordering — ECMP or per-packet load-balancing in the
      underlay, or rekey overlap — and a small static count is noise. A
      climbing count means real reordering or loss, and this is where it
      connects to something else: lost DPD probes on that same path will tear
      the tunnel down. So a rising replay count and a flapping tunnel are the
      same story told twice, and treating them as two separate problems sends
      you looking for a crypto fault that is not there.

  sources:
    - { card: "srx-ipsec", side: 3, block: "STATISTICS & COUNTERS" }
    - { card: "srx-ipsec", side: 4, block: "REPLAY ERRORS" }
    - { std: "RFC 4303", section: "3.4.3", note: "Sequence number verification and the anti-replay window" }

- id: junos-srx/ipsec.statistics.index
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ipsec statistics index {{id}}"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ipsec
  weight: 3
  tags: [phase2, counters, one-way]

  answers: "Is this one tunnel moving bytes in both directions?"
  aka:
    - "is traffic flowing"
    - "packet counters"
    - "is anything coming back"
    - "one way tunnel"
  concepts:
    - concept:obj.counter
    - concept:dataplane.passing
    - concept:act.count
  symptoms:
    - concept:symptom.one-way-traffic

  read_field: "Encrypted vs decrypted bytes — both must climb"
  output_fields:
    - field: "Encrypted bytes"
      means: "Traffic this box has encrypted and sent into the tunnel."
      want: any
      tell: "Climbing while decrypted is flat is the one-way tell."
    - field: "Decrypted bytes"
      means: "Traffic received on this SA and successfully decrypted."
      want: any
      tell: >
        Flat while encrypted climbs means your ESP is leaving and nothing is
        coming back. That is a return-path or far-end problem, not a crypto
        problem. Stop reading proposals.
    - field: "ESP authentication failures"
      means: "Packets that arrived but failed integrity check."
      want: "0"
      tell: >
        Failures with traffic still flowing usually means corruption in path,
        not a key mismatch — a wrong key fails everything, not some of it.
    - field: "Replay errors"
      means: "Packets dropped as duplicate or outside the anti-replay window."
      want: any
      tell: >
        A small static count is noise, almost always ECMP or per-packet
        load-balancing in the underlay. A climbing count means real reordering
        or loss — and lost DPD probes on that same path will tear the tunnel
        down.

  slots:
    - name: id
      binds: null
      accepts: [Integer]
      placeholder: "<sa-index>"
      required: true

  requires:
    - { slot: id, from: junos-srx/ipsec.sa.show, field: Index }

  next_if_bad:
    - junos-srx/interface.st0.terse
    - junos-srx/route.remote.show
    - junos-srx/flow.session.show
  related:
    - junos-srx/ipsec.statistics.all
    - junos-srx/ipsec.sa.show-vpn-detail

  guidebook: [guide:ipsec.counters-and-replay]
  related_rules: [mtu.mss-clamp.absent]

  explain:
    terse: "Byte and packet counters, then the error block."
    explained: >
      Read the byte and packet counters first, then the error block. Encrypted
      climbing with decrypted flat is a return-path problem and no amount of
      proposal tuning will fix it.
    teaching: >
      Counters answer a question the SA state cannot. Installed means the
      kernel holds keys; it says nothing about whether packets are moving. The
      most valuable reading here is asymmetry: encrypted climbing while
      decrypted stays flat means your ESP is leaving and nothing is coming
      back, which points at the return path or the far end and away from crypto
      entirely. Replay errors connect to flapping in a way that is not obvious
      — a path that reorders enough to trip anti-replay is a path that drops
      DPD probes, and DPD tearing down a healthy tunnel looks exactly like a
      crypto failure in the log.

  sources:
    - { card: "srx-ipsec", side: 3, block: "STATISTICS & COUNTERS" }
    - { card: "srx-ipsec", side: 3, block: "THE ONE-WAY TELL" }
    - { card: "srx-ipsec", side: 4, block: "REPLAY ERRORS" }

- id: junos-srx/ipsec.statistics.clear
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "clear security ipsec statistics"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Zeroes every IPsec counter on the box. Anybody watching a counter for a
    trend loses their baseline, and a monitoring system that computes deltas
    records a negative or a spike.
  reversible: none

  domain: ipsec
  weight: 1
  tags: [phase2, counters, day-two]

  answers: "How do I zero the numbers before a controlled test?"
  aka:
    - "reset the counters"
    - "zero the esp errors"
    - "start counting from scratch"
  concepts:
    - concept:obj.counter
    - concept:act.clear

  read_field: "No output — re-read the counters to confirm they are zero"

  next_if_bad:
    - junos-srx/ipsec.statistics.all
  related:
    - junos-srx/ipsec.statistics.all
    - junos-srx/ipsec.statistics.index

  guidebook: [guide:ipsec.counters-and-replay]

  explain:
    terse: "Not read-only. The counters are gone and nothing brings them back."
    explained: >
      Clearing counters is the right move before a controlled test, because a
      delta on a large number is hard to read. It is the wrong move mid-incident
      if anyone else is watching a trend, because there is no way to recover
      what was there.
    teaching: >
      This is the entry that explains why the risk enum has three values rather
      than two. Nothing here changes forwarding and nothing drops a packet, so
      the instinct is to call it read-only — and then somebody clears the
      counters during an incident and the engineer who was watching the replay
      count climb loses the only evidence they had. The test for ReadOnly is
      that running it cannot change state that anything else reads. A counter
      is state that something else reads. Round up, always: a command wrongly
      labelled disruptive costs a moment's hesitation, and one wrongly labelled
      safe costs credibility permanently.

  sources:
    - { card: "srx-ipsec", side: 3, block: "STATISTICS & COUNTERS" }

