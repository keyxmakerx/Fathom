  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Global to every monitored tunnel on the box, not one. Tightening it
    tightens every tunnel at once, and a marginal underlay then tears down
    several healthy tunnels together.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, failover, timers, day-two]

