  guidebook: [guide:ipsec.vpn-monitor]
  related_rules: [ike.dpd.too-tight]

  explain:
    terse: "Global, not per tunnel. Interval x threshold is the budget."
    explained: >
      These are box-wide options, so a change made for one tunnel applies to
      all of them. The arithmetic is the same as DPD: interval times threshold
      is how long a failure takes to be declared, and the same too-tight and
      too-loose trade applies.
    teaching: >
      The reason this statement bites is that it is not where you expect it.
      Everything else about a tunnel lives under `security ipsec vpn <name>`,
      and this one lives one level up and applies to every monitored tunnel on
      the chassis. Somebody tightens it during an incident on one tunnel and
      three other tunnels start flapping on a marginal underlay the following
      week, with no change in their own configuration to explain it. If you
      tighten it, check `show system commit` afterwards against every flap you
      see, because the correlation will be there and it will not be obvious.

  sources:
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

# =============================================================================
# SIDE 1 — THE FIVE PLUMBING PIECES
# The card: "Miss #3 and Phase 1 times out with nothing useful in the log.
# Miss #1, #2, #4 or #5 and the tunnel reads UP while passing zero packets."
# =============================================================================

- id: junos-srx/interface.st0.address.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set interfaces st0 unit 0 family inet address 10.255.0.1/30"
  wraps: [5]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Creates or renumbers the secure tunnel unit. Renumbering a live unit drops
    any adjacency running over it and invalidates static routes pointing at the
    old next hop.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: interface
  weight: 2
  tags: [plumbing, route-based, day-one, build]

  answers: "Plumbing piece one — how does the virtual tunnel endpoint get built?"
  aka:
    - "create st0"
    - "tunnel interface address"
    - "secure tunnel interface"
  concepts:
    - concept:obj.st0
    - concept:act.configure

  read_field: "No output — confirm with the terse interface listing afterwards"

  next_if_bad:
    - junos-srx/interface.st0.terse
  related:
    - junos-srx/zone.st0.bind.set
    - junos-srx/route.static.st0.set
    - junos-srx/ipsec.vpn.bind-interface.set
    - junos-srx/interface.st0.mtu.set

  guidebook: [guide:ipsec.plumbing]
  related_rules: [tunnel.st0.zone-unbound, mtu.st0.unset]

  explain:
    terse: "Piece one of five. A /30 per tunnel is the usual convention."
    explained: >
      A route-based tunnel needs a unit to route at. The address is used for
      the tunnel endpoints themselves — routing protocol adjacencies, and
      pinging the far end of the tunnel rather than through it. Numbering is
      conventional, not required by the crypto.
    teaching: >
      This unit is a virtual interface with no wire, and that fact drives most
      of what is confusing about it. It cannot go down because a cable was
      pulled; it goes down when the SA goes away, or when `vpn-monitor` decides
      the path through it is dead. Nothing in the crypto configuration creates
      it — the `bind-interface` statement attaches a VPN to a unit that must
      already exist. And nothing about it appears in the IKE logs. Of the five
      plumbing pieces, four of them fail the same silent way: the SAs install,
      the interface reads up, and no packet crosses.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/zone.st0.bind.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security zones security-zone VPN interfaces st0.0"
  wraps: [3]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Puts the tunnel unit into a zone so policies can reference it. Moving a
    live unit between zones invalidates every policy written for the old zone
    pair and traffic stops until new ones exist.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: zone
  weight: 2
  tags: [plumbing, most-missed, day-one, build]

  answers: "Plumbing piece two — how does the tunnel unit become policy-addressable?"
  aka:
    - "put st0 in a zone"
    - "tunnel is up but nothing passes"
    - "which zone does the tunnel belong to"
  concepts:
    - concept:obj.zone
    - concept:obj.st0
    - concept:act.configure

  read_field: "No output — a unit in no zone silently permits nothing"

  next_if_bad:
    - junos-srx/policy.zone-pair.permit.set
    - junos-srx/flow.session.show
  related:
    - junos-srx/policy.zone-pair.match.set
    - junos-srx/zone.host-inbound.ike.set
    - junos-srx/interface.st0.address.set

  guidebook: [guide:ipsec.plumbing]
  related_rules: [tunnel.st0.zone-unbound, policy.zone-pair.missing]

  explain:
    terse: "Piece two of five. No zone means no policy pair, so nothing passes."
    explained: >
      A logical unit in no zone cannot be the source or destination of any
      security policy, so nothing is permitted through it. The SAs come up, the
      interface reads up, and the byte counters do not move.
    teaching: >
      The SA proves crypto, not reachability. That sentence is the most useful
      thing on side 4 and this statement is the most common way to prove it.
      Everything you would check to confirm the tunnel is healthy comes back
      clean: Phase 1 up, Phase 2 Installed, `st0.0` up, the route present. The
      packet still has nowhere to go, because there is no zone pair, so there
      is no policy, so the flow module drops it before it reaches the tunnel at
      all. When steps 5 to 8 of the bring-up ladder fail while steps 2 to 4 are
      clean, that is plumbing, not crypto, and no amount of proposal tweaking
      will fix it.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

