    explained: >
      A route-based tunnel is selected by the routing table and can carry
      routing protocols and many selectors. A policy-based tunnel is selected
      by the policy, uses `then permit tunnel ipsec-vpn NAME`, and has no `st0`
      at all. Use route-based for anything new.
    teaching: >
      `Bind-interface` is the only link between an SA and an interface, and it
      matters because the two halves of the system do not talk about each
      other. The logs never mention `st0`; `show interfaces st0.0` never
      mentions the VPN. This statement is the join, and the SA detail output
      prints it, which is why the SA detail output is where you go when you
      need to connect a crypto event to an interface event. Binding the
      interface is also only one of five plumbing pieces: the unit must exist,
      be in a zone, have something routed at it, and have a policy for the zone
      pair. Miss any of those and the tunnel reads UP while passing zero
      packets.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 1, block: "ROUTE-BASED VS POLICY-BASED" }
    - { card: "srx-ipsec", side: 3, block: "READING THE SA OUTPUT" }

- id: junos-srx/ipsec.vpn.establish-tunnels.immediately.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B establish-tunnels immediately"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Pins the tunnel up from commit. Negotiation starts at commit rather than at
    first packet, which puts an immediate DH exponentiation on the routing
    engine for every VPN changed at once.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [phase2, bring-up, failover, most-missed]

  answers: "How do I make the tunnel come up and stay up without waiting?"
  aka:
    - "pin the tunnel up"
    - "stop it cycling when idle"
    - "always on tunnel"
    - "who initiates"
  concepts:
    - concept:obj.ipsec-vpn
    - concept:attr.establish-tunnels
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — confirm Role is not always Responder afterwards"

  next_if_bad:
    - junos-srx/ike.sa.show-detail
    - junos-srx/ipsec.inactive-tunnels.show
  related:
    - junos-srx/ipsec.vpn.establish-tunnels.responder-only.set
    - junos-srx/ipsec.vpn.vpn-monitor.set

  guidebook: [guide:ipsec.establish-tunnels]
  related_rules: [ipsec.establish-tunnels.both-passive, ipsec.vpn-monitor.absent-on-adjacency]

  explain:
    terse: "Pinned up from commit. Use it for anything monitored."
    explained: >
      `on-traffic` is the default and negotiates only when a packet is routed
      at `st0`, so an idle backup cycles in the log by design. `immediately`
      pins it up from commit. Use it for anything monitored, carrying an
      adjacency, or where failover time matters.
    teaching: >
      The default costs you in two ways that go unnoticed. First, a tunnel
      that comes up on first packet has already dropped the first packet, and
      whatever was sending it will retry or fail depending on what it was.
      Second, an idle tunnel under `on-traffic` genuinely cycles in the log,
      which trains people to ignore log entries that look exactly like real
      flaps. The failure this statement prevents outright is both ends passive:
      two `on-traffic` ends with nothing routing traffic in, or two
      `responder-only` ends, means nobody initiates, nothing is misconfigured,
      and the tunnel never comes up. There is no error to find, which is why it
      costs the most hours per occurrence of anything on the card.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/ipsec.vpn.establish-tunnels.responder-only.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B establish-tunnels responder-only"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Stops this end ever initiating. Applied to both ends of one tunnel, nobody
    initiates and the tunnel never comes up again — with no error anywhere.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, bring-up, dynamic-peer]

  answers: "How do I make this end wait and never start the negotiation?"
  aka:
    - "passive tunnel"
    - "never initiate"
    - "peer behind nat starts it"
  concepts:
    - concept:obj.ipsec-vpn
    - concept:attr.establish-tunnels
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — Role will read Responder on every SA afterwards"

  next_if_bad:
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ipsec.vpn.establish-tunnels.immediately.set
    - junos-srx/ike.gateway.dynamic-hostname.set

  guidebook: [guide:ipsec.establish-tunnels]
  related_rules: [ipsec.establish-tunnels.both-responder-only]

  explain:
    terse: "Right for a peer behind NAT. Fatal on both ends at once."
    explained: >
      A peer behind NAT with no fixed address has to be the one that starts,
      because you cannot reach it to initiate. `responder-only` on your side
      says so explicitly. On both ends of one tunnel it is fatal and produces
      no error of any kind.
    teaching: >
      This is a correct and necessary setting that becomes a silent outage the
      moment somebody copies the config to the other end. The failure mode has
      no signature: no negotiation is attempted, so no negotiation fails, so
      the log has nothing to say. Every proposal, key, selector and route on
      both sides can be perfect. `show security ipsec inactive-tunnels` will
      list the tunnel, and the Tunnel Down Reason is the only place the box
      offers any help at all. Before setting it, write down which end is
      expected to initiate and why — that single sentence in the change ticket
      is what makes the next person's diagnosis five minutes instead of a day.

  sources:
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/ipsec.vpn.traffic-selector.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B traffic-selector TS1 local-ip 10.1.0.0/16 remote-ip 10.2.0.0/16"
  wraps: [5]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Defines which prefixes this tunnel proposes. Adding the first one narrows
    the proposal from any-to-any, which the peer may accept where it rejected
    the wide one, or reject where it accepted it.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [phase2, selectors, interop, day-one]

  answers: "Which prefixes does this tunnel offer to carry?"
  aka:
    - "set the proxy id"
    - "which subnets go over the tunnel"
    - "interesting traffic"
    - "selectors"
  concepts:
    - concept:obj.traffic-selector
    - concept:obj.ipsec-vpn
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — one SPI pair per selector appears in the SA output"

  slots:
    - name: local
      binds: { kind: TrafficSelector, field: local_ip }
      accepts: [Prefix]
      placeholder: "<local-prefix>"
      required: true
    - name: remote
      binds: { kind: TrafficSelector, field: remote_ip }
      accepts: [Prefix]
      placeholder: "<remote-prefix>"
      required: true

  next_if_bad:
    - explain:error:junos-srx/TS_UNACCEPTABLE
    - junos-srx/ipsec.inactive-tunnels.show
  related:
    - junos-srx/route.static.st0.set
    - junos-srx/ipsec.sa.show-vpn-detail

  guidebook: [guide:ipsec.selectors]
  related_rules: [ipsec.traffic-selector.absent, ipsec.traffic-selector.not-mirrored]

  explain:
    terse: "Without one, the SRX proposes 0.0.0.0/0 to 0.0.0.0/0."
    explained: >
      With no `traffic-selector` configured the SRX proposes any-to-any. Peers
      that build one SA per subnet pair reject that outright. The selectors
      must mirror: your local is their remote and your remote is your peer's
      local, exactly.
    teaching: >
      The default here is the trap, because it works with some peers and not
      others and nothing tells you which you have. A peer that narrows on
      acceptance will take your 0.0.0.0/0 and hand back the pair it wanted; a
      peer that builds one child SA per configured subnet pair sees a proposal
      it has no entry for and rejects it. Under IKEv2 that reads
      TS_UNACCEPTABLE; under IKEv1 the same disagreement is a proxy-ID mismatch
      and reads INVALID_ID_INFORMATION. Two error strings, one cause. Note also
      that a selector is not a route: configuring the selector does not put
      anything in the routing table, and a tunnel with correct selectors and no
      route at `st0` reads UP and passes nothing.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }
    - { std: "RFC 7296", section: "2.9", note: "Traffic selector negotiation and TS_UNACCEPTABLE" }

- id: junos-srx/ipsec.vpn.df-bit.clear.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B df-bit clear"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Lets the network fragment the encrypted packet instead of dropping it.
    Moves reassembly cost onto the peer, and on a peer that cannot reassemble
    fast enough that becomes a throughput problem rather than a loss problem.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [mtu, fragmentation, rescue, day-two]

  answers: "How do I let the path break up oversized encrypted packets?"
  aka:
    - "clear the df bit"
    - "allow fragmentation"
    - "big packets disappear and I control neither end"
  concepts:
    - concept:obj.ipsec-vpn
    - concept:attr.df-bit
    - concept:act.configure

  read_field: "No output — retest with a do-not-fragment ping at full size"

  next_if_bad:
    - junos-srx/mtu.ping.df-sized
    - junos-srx/flow.tcp-mss.set-ipsec
  related:
    - junos-srx/flow.tcp-mss.set-ipsec
    - junos-srx/interface.st0.mtu.set
    - junos-srx/flow.force-ip-reassembly.set

  guidebook: [guide:mtu.three-fixes]
  related_rules: [mtu.mss-clamp.absent, mtu.df-bit.set-on-tunnel]

  explain:
    terse: "The valve. Costs reassembly at the peer. copy is the default."
    explained: >
      `clear` clears DF in the outer header so the network may fragment the
      encrypted packet rather than drop it. `copy` is the default and copies
      the inner DF. `set` forces DF on. This is the rescue when you control
      neither endpoint nor the far side.
    teaching: >
      Of the three MTU fixes this is the one to reach for last and the one that
      works when the other two cannot. MSS clamping is surgical and needs no
      ICMP, and does nothing for UDP. Lowering the tunnel MTU covers UDP, and
      the box then fragments before encryption, which costs CPU and produces
      fragments that can still be dropped downstream. Clearing DF pushes the
      whole problem into the network and onto the peer's reassembly path, which
      is why it is a valve and not a design. Use it when the traffic is UDP,
      the endpoints are not yours, and packets are vanishing — and then go back
      and fix it properly.

  sources:
    - { card: "srx-ipsec", side: 4, block: "THREE FIXES — KNOW THE DIFFERENCE" }
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }

- id: junos-srx/ipsec.vpn.vpn-monitor.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec vpn VPN-B vpn-monitor source-interface reth1.0 destination-ip 10.2.0.1"
  wraps: [5]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Makes the tunnel tear itself down when the probe fails, taking `st0` with
    it. A probe target that does not answer ICMP from inside the selector will
    flap a healthy tunnel continuously.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ipsec
  weight: 2
  tags: [phase2, failover, operability, day-two]

  answers: "How do I make a dead tunnel actually look dead to the routing table?"
  aka:
    - "vpn monitor"
    - "make st0 go down when the tunnel is broken"
    - "failover for a routed tunnel"
    - "probe through the tunnel"
  concepts:
    - concept:obj.ipsec-vpn
    - concept:attr.vpn-monitor
    - concept:act.configure
    - concept:phase.p2

  read_field: "No output — st0.0 should go down when the probe target stops answering"

  slots:
    - name: dest
      binds: { kind: Address, field: value }
      accepts: [Ip4]
      placeholder: "<probe-target>"
      required: true

  next_if_bad:
    - junos-srx/interface.st0.terse
    - junos-srx/ipsec.statistics.index
  related:
    - junos-srx/ipsec.vpn-monitor-options.set
    - junos-srx/ike.gateway.dpd.set
    - junos-srx/ipsec.vpn.establish-tunnels.immediately.set

  guidebook: [guide:ipsec.vpn-monitor]
  related_rules: [ipsec.vpn-monitor.absent-on-adjacency]

  explain:
    terse: "Pings through the tunnel and drops st0 when the probe fails."
    explained: >
      `vpn-monitor` pings through the tunnel and tears the SA down on failure,
      taking `st0` with it — which is what lets a route or adjacency over `st0`
      fail over. The probe target must answer ICMP from inside the traffic
      selector.
    teaching: >
      Without it, a route out `st0` stays good while traffic blackholes.
      That is the whole point: `st0` is a virtual interface and it has no wire
      to lose, so it stays up as long as the SA exists, and the SA can exist
      while nothing gets through. DPD does not help here — DPD rides the outer
      IKE session on UDP 500 or 4500 and tells you the peer's control plane is
      alive, which is a different question from whether the data path works.
      The two failure modes to watch for when enabling it: a probe target that
      does not answer ICMP, and a probe target outside the traffic selector.
      Both flap a healthy tunnel, and both look like a crypto problem in the
      log.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }
    - { card: "srx-ipsec", side: 2, block: "DEAD PEER DETECTION" }

