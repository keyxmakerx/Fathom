- id: junos-srx/ipsec.traceoptions.flag-sa
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ipsec traceoptions flag security-associations"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Traces Phase 2 SA lifecycle events. Same /var exposure as the IKE
    traceoptions, and both must be deleted separately.
  reversible: paired
  paired_teardown: junos-srx/ipsec.traceoptions.delete
  commit_model: junos-commit

  domain: ipsec
  weight: 1
  tags: [phase2, tracing, day-two]

  answers: "How do I capture the child tunnel lifecycle rather than the negotiation?"
  aka:
    - "trace phase 2"
    - "debug the child sa"
    - "why does the tunnel keep reinstalling"
  concepts:
    - concept:obj.trace
    - concept:act.capture
    - concept:phase.p2

  read_field: "No output — reproduce, then read the file you configured"

  next_if_bad:
    - junos-srx/log.iketrace.show
  related:
    - junos-srx/ike.traceoptions.file
    - junos-srx/ipsec.traceoptions.delete

  guidebook: [guide:ipsec.tracing]
  related_rules: [ike.traceoptions.left-enabled]

  explain:
    terse: "The Phase 2 half. Separate hierarchy, separate delete."
    explained: >
      IKE traceoptions and IPsec traceoptions are two hierarchies. Turning on
      one does not turn on the other, and — more importantly — deleting one
      does not delete the other. Both need their own teardown.
    teaching: >
      This is the trace to reach for when Phase 1 is stable and the child SA
      keeps cycling, which is the shape of a selector or PFS mismatch. The
      split between the two hierarchies mirrors the split between the two
      phases, and it is a useful discipline: if `show security ike
      security-associations` is stable across several runs, tracing IKE will
      show you a healthy negotiation repeatedly and tell you nothing. The
      failure mode to guard against is asymmetric cleanup — deleting the IKE
      traceoptions, committing, believing you are done, and leaving this one
      writing to `/var` for a month.

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

