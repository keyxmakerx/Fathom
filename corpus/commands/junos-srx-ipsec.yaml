    terse: "The tool emits the placeholder. You paste the real key."
    explained: >
      Fathom emits `ascii-text "<psk>"` and never the value. The application
      does not accept credentials at all, so the highest-value secret in the
      build never enters it. Paste the real key into your own terminal at the
      moment you commit.
