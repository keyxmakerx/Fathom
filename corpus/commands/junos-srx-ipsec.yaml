    Selects which events are traced. `flag all` in place of `ike` buries the
    signal and loads the routing engine, and on a busy box that is a
    performance change rather than a logging one.
  reversible: paired
  paired_teardown: junos-srx/ike.traceoptions.delete
  commit_model: junos-commit

  domain: ike
