  guidebook: [guide:ipsec.nat-traversal]
  related_rules: [ike.nat-keepalive.longer-than-nat-idle, ike.identity.required-behind-nat]

  explain:
    terse: "Refreshes the NAT mapping. Must beat the NAT device's idle timer."
    explained: >
      Once NAT is detected in Phase 1, both peers move to UDP 4500 and ESP is
      wrapped in UDP. That mapping lives in a device you probably do not
      control, and it expires. This keepalive is what stops it expiring.
    teaching: >
      If the NAT device's UDP idle timer is shorter than this keepalive, the
      mapping dies and the tunnel goes one-way until the next rekey. The
      symptom is specific and nobody attributes it correctly on the first day:
      works, then stops after N minutes of quiet. It comes back on its own,
      which makes it look intermittent rather than deterministic, and it
      correlates with idleness rather than with load — so every theory about
      MTU or throughput is wrong here. The diagnostic is to note the N. If the
      tunnel dies after a consistent quiet interval, you are looking at a NAT
      idle timer and not at anything on either firewall.

  sources:
