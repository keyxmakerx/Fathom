  next_if_bad:
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/ike.sa.show-detail
    - junos-srx/ike.sa.clear-index

  guidebook: [guide:ike.phase1.identity]

  explain:
    terse: "The one you use on a hub, once you already have an index."
    explained: >
      On a box terminating one tunnel this is the same output as `detail`. On a
      hub terminating forty it is the difference between reading one SA and
      scrolling past thirty-nine. Get the index from the unscoped listing
      first.
    teaching: >
      The index is also what you scope a clear by, and that matters more than
      the reading convenience. Clearing Phase 1 tears down every child SA under
      it, so on a hub an unscoped clear is every spoke at once. Reading by
      index and then clearing by the same index is the habit that keeps the
      blast radius equal to the thing you were investigating. Note that the
      index is not stable across a rebuild — if the SA rebuilds between the two
      commands, the index you captured now refers to nothing, and the clear
      quietly does nothing at all.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }

- id: junos-srx/ike.active-peer.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ike active-peer"
  mode: operational
  platform: junos-srx
