  risk: ChangesConfig
  blast_radius: >
    Writes IKE trace output to /var. Left on, it fills /var, which breaks
    logging and commits both. flag all loads the routing engine and buries the
    signal.
  reversible: paired
  paired_teardown: junos-srx/ike.traceoptions.delete
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, tracing, day-two]

  answers: "How do I capture the negotiation to a file of its own?"
  aka:
    - "turn on ike debugging"
    - "capture the negotiation"
    - "debug phase 1"
    - "why does it keep failing"
