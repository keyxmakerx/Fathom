  cmd: "show system uptime"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 1
  tags: [correlation, day-two, not-vpn-specific]

  answers: "When did this box last restart, and when was the last change applied?"
  aka:
    - "did it reboot"
    - "how long has it been up"
    - "last configuration change time"
  concepts:
    - concept:obj.device
    - concept:act.correlate

  read_field: "Last configured — the time the running config was applied"
  output_fields:
    - field: "System booted"
      means: "When the box last started."
      want: any
      tell: "A boot inside the incident window explains everything downstream of it."
    - field: "Last configured"
      means: "When the running configuration was last committed, and by whom."
      want: any
      join_key: true

  next_if_bad:
    - junos-srx/system.commit.show
    - junos-srx/system.alarms.show
  related:
    - junos-srx/system.commit.show
    - junos-srx/chassis.alarms.show

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "Boot time and last commit time, in one line each."
    explained: >
      Two timestamps that between them explain a large fraction of
      "it was working yesterday". A reboot inside the window makes everything
      after it suspect; a last-configured time inside the window points
      straight at the commit history.
    teaching: >
      Worth running even when you are sure nothing rebooted, because a
      redundant chassis cluster failover can look like a reboot from one angle
      and like nothing at all from another. If the box booted recently and
      tunnels have not come back, the candidates narrow immediately:
      `establish-tunnels on-traffic` waiting for a packet that nothing is
      sending, or a peer that is `responder-only` and expecting this box to
      start. Both produce a tunnel that never comes up with no error anywhere,
      and both are invisible unless you know the box restarted.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

