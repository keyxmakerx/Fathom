# =============================================================================
# Fathom command corpus — Junos SRX site-to-site IPsec seed
# =============================================================================
#
# PROVENANCE
#   Every entry in this file is derived from the project owner's own four-side
#   SRX IPsec field card (`.context/field-card-srx-ipsec.txt`). Command text,
#   output-field semantics, diagnostic readings and the `teaching` voice are the
#   card's; where a sentence is the card's, it is cited as
#   `{ card: "srx-ipsec", side: N, block: "…" }` and reproduced rather than
#   paraphrased.
#
#   NOTHING IN THIS FILE HAS BEEN RUN ON A BOX BY ITS AUTHOR.
#   Every entry therefore omits `verified_on` and ships with the `unverified`
#   margin tab (61 §3.1). That is deliberate: 61 §20 states the format's
#   load-bearing assumption is access to the platform, and this seed does not
#   have it. The card's author does. **This file requires expert review by
#   someone with an SRX in front of them before any of it ships**, and the
#   review that matters most is `output_fields` — field labels written from a
#   reference card are right about meaning and unreliable about case and
#   spacing, and the user is matching them by eye.
#
#   `reviewed_by: <named human>` is a placeholder, not a name. Invariant 10 is
#   not satisfied until it is replaced. The build must fail on the literal
#   string `<named human>`.
#
# WHAT THIS FILE IS FOR
#   It is the proof that 61-command-corpus-spec.md is workable against real
#   expert material. 91 entries, drawn from the BRING-UP ORDER ladder (side 1),
#   the VERIFY LADDER, STATISTICS & COUNTERS, CLEARING & RENEGOTIATING and
#   LOGS & TRACEOPTIONS (side 3), TEST IT FROM THE BOX, WHERE TO SET IT and
#   BOX-LEVEL CONTEXT (side 4), and every `set` line on sides 1 and 2.
#
# =============================================================================
# SCHEMA FIT — WHERE THE CARD DID NOT GO IN CLEANLY
# =============================================================================
#
# 61 §2 says one file per entry. This is a bundle. Treat it as a seed-delivery
# format: `fathom-corpus split` writes `entries[i]` to
# `commands/<platform>/<dotted-path>.yaml`, after which §2's rule holds and this
# file is deleted. The bundle exists because 84 entries authored in one pass
# need to be reviewable as one diff. It is not a proposed change to §2.
#
# Seven places where the card's content did not fit the spec as written. Each is
# a defect in the spec, not in the card.
#
#  F1. `id` first segment vs `domain`. 61 §3.3 requires the first dotted segment
#      of the id to equal `domain`. The spec's own worked entry §15.6 is
#      `id: junos-srx/ping.dnf-sized` with `domain: mtu`, which fails its own
#      gate 1. Sibling documents disagree with each other on the same entry:
#      §15.1 references `junos-srx/interface.st0.terse`, §17 references
#      `junos-srx/interfaces.st0.terse.show`, and 63 §17.6 references
#      `junos-srx/interfaces.st0.mtu.show` and `junos-srx/ping.df-bit.sized`.
#      Four spellings, three documents, one command.
#      RESOLVED HERE by one scheme, applied without exception:
#        <domain>.<object>.<verb-or-form>,  first segment == domain, 2–4 segments
#      and a rename map at the end of this file (§ ID-MAP) from every id the
#      sibling documents already reference. Entry ids are stable forever
#      (61 §18), so this must be settled before anything ships, not after.
#
#  F2. `wraps` semantics are undefined. 61 §3.2 says "token indices after which
#      the rendered command breaks", and §15.1 gives `wraps: [5]` for
#      `show security ipsec security-associations vpn-name {{vpn}} detail` — but
#      the card breaks that command after `security-associations`, which is
#      token index 3 zero-based or 4 one-based. Neither reading gives 5.
#      RESOLVED HERE as: **zero-based index of the last token before the
#      break**, matching the card's own line breaks exactly. §15.1's value is
#      wrong under every reading and should be corrected to `[3]`.
#
#  F3. `answers` must share no non-proper-noun token with `cmd` (gate 4). This
#      is a good gate and it is genuinely hard on a corpus where the commands
#      are named after the things they show. `show security flow session` cannot
#      answer a question containing "flow" or "session"; `show system storage`
#      cannot contain "system" or "storage". Every `answers` here is written to
#      pass, and several are worse English than the obvious phrasing as a
#      result. That is the right trade — the gate is what stops an author
#      restating the command — but it should be documented as a cost in §18,
#      because it is currently invisible until you hit it.
#
#  F4. Pipe filters. Side 3 and side 4 use `| match <peer-ip>`, `| last 200`,
#      `| match MTU` and `| match -i error` as part of the command an engineer
#      types. 61 D4 puts filters in a separate `filters/` tree, composed with
#      commands rather than embedded in them. The card does not compose them —
#      `show log kmd | match <peer-ip>` is one thing you type, with one meaning,
#      and splitting it makes the finder return `show log kmd` for "find my
#      peer in the log". RESOLVED HERE by writing the filtered form as its own
#      entry with `mode: operational` and the filter inline, and leaving the
#      `filters/` tree to hold the *explanation* of `| match` as a construct.
#      D4 should be re-decided as "both": filters are composable AND the
#      canonical filtered invocations are entries.
#
#  F5. `mode: pipe-filter` is declared in §3.2 and never used by anything. It is
#      unreachable under F4's resolution. Either D4 changes or the enum value
#      goes.
#
#  F6. Gate 7 (`at most one weight: 3 per (concept, platform)`) is a real gate
#      and it forced real decisions. Ten entries carry `weight: 3` in this file
#      and their concept sets are pairwise disjoint by construction; they are
#      listed in § CANONICALITY at the end. The gate is correct and the cost is
#      that `show security ipsec security-associations` — the command from the
#      card's own ladder — is `weight: 2`, because 61 §15.1 already claimed
#      `weight: 3` for the `vpn-name … detail` form on the same concepts. That
#      is defensible (the detail form is the one you actually read) but it is
#      the kind of decision that should be made once, deliberately, and it is
#      recorded here rather than being an accident of authoring order.
#
#  F7. Config-mode entries and the card's `\` continuations. Side 1's `set`
#      lines wrap mid-statement (`set security ike proposal IKE-P1 \` /
#      `  authentication-method pre-shared-keys`). §3.2's `wraps` handles this,
#      but the card's continuation indent is two spaces and the spec does not
#      say who owns the indent. Assumed here: the renderer, not the corpus.
#
#  F8. The `domain` enum is short by three values and conflates two axes.
#      61 §3.3 lists `ipsec | ike | zone | policy | route | nat | mtu | flow |
#      interface | ha | log | system` and requires the id's first segment to
#      equal it. The card needs `chassis` (`show chassis alarms`, `show chassis
#      routing-engine` — both in BOX-LEVEL CONTEXT, both with no sane home in
#      `system`), and 63 §17.3/§18 already use rule domains `tunnel` and
#      `policy` that the command enum does not carry. `chassis` is used in this
#      bundle and will fail gate 1 until the enum is extended.
#      The deeper problem: `domain` is doing two jobs. Under the first-segment
#      rule, `set security flow tcp-mss ipsec-vpn mss 1360` must be `flow`
#      because that is its configuration hierarchy — but the question it
#      answers is an MTU question, and side 4 files it under THE MTU STORY.
#      Resolved here by letting `domain` mean *hierarchy* and letting `tags`
#      carry *topic*: every MTU-related entry carries `tags: [mtu, …]`
#      regardless of its domain. That works, and it means `domain` is a
#      routing key rather than a subject, which §3.3 does not say.
#
#
#  F9. Two words on the banned-phrase list (61 gate 4, borrowing 63 §11.1) are
#      words the card itself uses in load-bearing sentences.
#      `merely` — *"The group must be identical both ends, not merely
#      compatible"* (side 2). The word is the whole distinction: identical
#      versus would-also-work. Four entries here keep it and will fail gate 4.
#      `seamless` — *"Healthy rekey is seamless"* (side 2). 63 §11.1 already
#      carves an exception for this one inside a quoted excerpt, and the one
#      use here is quoted and attributed accordingly.
#      PROPOSED: extend the documented-exception mechanism to `merely` scoped
#      to the phrase "not merely compatible". The general bans are right — both
#      words are usually hedges — and these two usages are not hedges.
#      Every other occurrence of a banned word has been rewritten out rather
#      than excepted; the exception list must stay two items long.
#
# =============================================================================
# CONVENTIONS USED IN THIS FILE
# =============================================================================
#   risk        ReadOnly | ChangesConfig | Disruptive — exactly three, never
#               a fourth (conventions; card legend, all four sides).
#   addresses   RFC 5737 documentation ranges and RFC 1918, matching the card:
#               203.0.113.10, 198.51.100.5, 10.1.0.0/16, 10.2.0.0/16,
#               10.255.0.1/30, site-b.example.net. Redaction gate 13 passes.
#   names       IKE-P1, IKE-POL, GW-B, IPSEC-P2, IPSEC-POL, VPN-B — the card's.
#   secrets     `<psk>` is emitted as a placeholder and never as a value.
#               Invariant 3.
# =============================================================================

corpus_bundle:
  id: fathom.commands/junos-srx/ipsec
  bundle_version: 0.1.0
  platform: junos-srx
  domains: [ike, ipsec, zone, policy, route, nat, mtu, flow, interface, log, system]
  entry_count: 91
  derived_from:
    card: "srx-ipsec"
    sides: [1, 2, 3, 4]
    note: >
      The owner's four-side SRX IPsec reference card. Mined exhaustively:
      every command printed on the card has an entry, and every entry that is
      not on the card is marked with a `sources_note` saying where it came
      from instead.
  review_status: >
    UNREVIEWED. No entry has been run by its author. Every entry lacks
    verified_on and renders `unverified`. Do not ship without a reviewer who
    has an SRX, and prioritise output_fields in that review.

entries:

# =============================================================================
# SIDE 1 — PHASE 1: PROPOSAL, POLICY, GATEWAY
# =============================================================================

- id: junos-srx/ike.proposal.auth-method.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike proposal IKE-P1 authentication-method pre-shared-keys"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes how this box proves who it is in Phase 1. On an existing gateway
    the next negotiation fails until the peer matches, and the tunnel drops at
    the current SA's lifetime rather than immediately.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, crypto, day-one, build]

  answers: "How does this box prove who it is to the far end?"
  aka:
    - "set the psk auth method"
    - "use a shared secret not certificates"
    - "phase 1 authentication type"
  concepts:
    - concept:obj.ike-proposal
    - concept:attr.auth-method
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — read it back with show configuration security ike"

  next_if_bad:
    - junos-srx/ike.sa.show
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p1
  related:
    - junos-srx/ike.policy.psk.set
    - junos-srx/ike.proposal.dh-group.set
    - junos-srx/ike.proposal.encryption.set

  guidebook: [guide:ike.proposal-parameters]
  walkthrough: ["walk:junos-srx.s2s-ipsec#phase1-proposal"]
  related_rules: [ike.mode.aggressive-with-psk, ike.auth.certificates-without-ntp]

  explain:
    terse: "Pre-shared keys or rsa-signatures. Both ends must agree."
    explained: >
      The two choices are `pre-shared-keys` and `rsa-signatures`. This is one of
      the four values `NO_PROPOSAL_CHOSEN` on Phase 1 sends you to check, along
      with `dh-group`, `encryption-algorithm` and `authentication-algorithm`.
      Read what the peer offered from `show log kmd`.
    teaching: >
      Authentication method is the one proposal parameter that changes the
      shape of the rest of the build rather than only a number in it. With
      pre-shared keys you need a matching secret and, under IKEv1 main mode,
      the peer can only be identified by its address — which is the entire
      reason aggressive mode exists. With rsa-signatures you need a certificate
      chain both ends trust and a clock, because an expired or not-yet-valid
      certificate reads as AUTHENTICATION_FAILED and nobody checks NTP first.
      A mismatch here does not produce a helpful error: the responder has
      nothing in its list that matches what you offered, and reports
      NO_PROPOSAL_CHOSEN with no indication of which field disagreed.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { std: "RFC 2409", section: "5.4", note: "Main mode with a pre-shared key can identify the peer only by address" }

- id: junos-srx/ike.proposal.dh-group.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike proposal IKE-P1 dh-group group14"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes the Phase 1 key exchange group. A peer on a different group
    rejects the exchange with INVALID_KE_PAYLOAD and the tunnel stops
    rebuilding after the current IKE SA expires.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, crypto, day-one, build]

  answers: "Which Diffie-Hellman strength does the first exchange use?"
  aka:
    - "set dh group"
    - "diffie hellman group 14"
    - "phase 1 key exchange strength"
    - "modp 2048"
  concepts:
    - concept:obj.ike-proposal
    - concept:attr.dh-group
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — confirm the negotiated group in the SA detail output"

  next_if_bad:
    - explain:error:junos-srx/INVALID_KE_PAYLOAD
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ipsec.policy.pfs.set
    - junos-srx/ike.proposal.encryption.set

  guidebook: [guide:ike.proposal-parameters]
  related_rules: [ike.dh-group.weak, ipsec.pfs.group-differs-from-p1]

  explain:
    terse: "group14 is the baseline. group2 and group5 are legacy."
    explained: >
      `group14` is 2048-bit MODP and is the sane default. `group19` and
      `group20` are 256- and 384-bit elliptic curve and are faster for the same
      or better strength. `group2` and `group5` are legacy and are what
      `proposal-set standard` will quietly offer you.
    teaching: >
      The group must be identical at both ends, not merely compatible — there
      is no negotiating down to a common denominator here beyond picking a
      whole proposal that already matches. A mismatch fails with
      INVALID_KE_PAYLOAD rather than NO_PROPOSAL_CHOSEN, which is the one error
      string that tells you exactly which knob is wrong, so it is worth knowing
      by sight. RFC 8247 §2.4 lists group14 as MUST and groups 2 and 5 as
      SHOULD NOT; group19 is SHOULD. If you inherit a config running group2,
      the tunnel works and the security margin does not, and the fix is a
      coordinated change with the far end rather than something you can do
      alone.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { std: "RFC 8247", section: "2.4", note: "group14 MUST; group19 SHOULD; groups 2 and 5 SHOULD NOT" }

- id: junos-srx/ike.proposal.integrity.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike proposal IKE-P1 authentication-algorithm sha-256"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes the Phase 1 integrity hash. A peer expecting a different hash
    rejects the whole proposal, and the tunnel stops rebuilding once the
    current IKE SA expires.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, crypto, day-one, build]

  answers: "Which hash protects the first exchange from tampering?"
  aka:
    - "set the phase 1 hash"
    - "sha256 for ike"
    - "integrity algorithm"
  concepts:
    - concept:obj.ike-proposal
    - concept:attr.integrity
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — a mismatch shows as NO_PROPOSAL_CHOSEN on Phase 1"

  next_if_bad:
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p1
  related:
    - junos-srx/ike.proposal.encryption.set
    - junos-srx/ipsec.proposal.encryption.set

  guidebook: [guide:ike.proposal-parameters]
  related_rules: [ike.proposal.cbc-without-hash, ipsec.proposal.gcm-with-hash]

  explain:
    terse: "sha-256 or sha-384. Omit entirely when the cipher is GCM."
    explained: >
      This is the separate integrity algorithm, and it is required whenever the
      cipher is CBC. With an AEAD cipher such as `aes-256-gcm` the cipher does
      integrity itself and this statement must be left out — setting both is a
      different kind of mismatch from omitting one.
    teaching: >
      A missing hash with a CBC cipher is a silent proposal mismatch. Nothing
      warns you at commit, because Junos only enforces that referenced objects
      exist — it cannot know what the far end will accept. The negotiation then
      fails with NO_PROPOSAL_CHOSEN and gives no clue which of the four values
      disagreed. The habit that prevents it is to write proposals out in full,
      every time, rather than relying on defaults or on `proposal-set
      standard`, and to check the four values against the peer's config as a
      block: dh-group, encryption, hash, authentication-method. That is exactly
      the list the error decoder points you at, and it is in that order because
      that is roughly how often each is the culprit.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }

- id: junos-srx/ike.proposal.encryption.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike proposal IKE-P1 encryption-algorithm aes-256-cbc"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes the cipher protecting the Phase 1 exchange. A peer offering only a
    different cipher rejects the proposal outright and the tunnel does not
    rebuild after the current IKE SA expires.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, crypto, day-one, build]

  answers: "Which cipher protects the negotiation itself?"
  aka:
    - "set aes for phase 1"
    - "ike cipher"
    - "stop using 3des"
  concepts:
    - concept:obj.ike-proposal
    - concept:attr.encryption
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — a mismatch shows as NO_PROPOSAL_CHOSEN on Phase 1"

  next_if_bad:
    - explain:error:junos-srx/NO_PROPOSAL_CHOSEN.p1
  related:
    - junos-srx/ike.proposal.integrity.set
    - junos-srx/ike.proposal.dh-group.set

  guidebook: [guide:ike.proposal-parameters]
  related_rules: [ike.proposal.3des, ike.proposal.cbc-without-hash]

  explain:
    terse: "aes-256-gcm, aes-256-cbc or aes-128-cbc. 3des-cbc is legacy."
    explained: >
      With CBC you must also set `authentication-algorithm`. With GCM you must
      not — it is AEAD and does its own integrity. `3des-cbc` still works and
      is SHOULD NOT in RFC 8221 §5; if you find it, it was inherited rather
      than chosen.
    teaching: >
      This value and the integrity value move together, and the pairing is
      where people get caught. CBC needs a separate hash; GCM needs the hash
      absent. Setting a hash alongside GCM is not redundant — it changes
      what you are offering, and a peer configured the correct way will not
      match it. Neither error tells you this. NO_PROPOSAL_CHOSEN from the
      responder means what you offered is not in their list; from you, the
      reverse. The role in `show security ike security-associations` tells you
      whose config to open, and that is a faster route to the answer than
      reading the proposals line by line.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { std: "RFC 8221", section: "5", note: "ENCR_3DES is SHOULD NOT; ENCR_AES_CBC and ENCR_AES_GCM_16 are MUST" }

- id: junos-srx/ike.proposal.lifetime.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike proposal IKE-P1 lifetime-seconds 28800"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes how often the IKE SA is rebuilt. Takes effect at the next
    negotiation, not at commit. No traffic effect on its own.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 1
  tags: [phase1, timers, day-one, build]

  answers: "How long does the outer secure channel live before it is rebuilt?"
  aka:
    - "phase 1 lifetime"
    - "ike sa rekey timer"
    - "how often does p1 rekey"
  concepts:
    - concept:obj.ike-proposal
    - concept:attr.lifetime
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — the countdown is in the SA detail output"

  next_if_bad:
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ipsec.proposal.lifetime.set

  guidebook: [guide:ipsec.lifetimes]
  related_rules: [ipsec.lifetime.ikev1-mismatch]

  explain:
    terse: "P1 28800 is conventional. Both ends default to 3600."
    explained: >
      The range is 180 to 86400 seconds and the default is 3600 for both
      phases. 28800 for Phase 1 and 3600 for Phase 2 is the conventional pair.
      Under IKEv1 the two ends negotiate and the lower value wins; under IKEv2
      each side rekeys on its own clock.
    teaching: >
      Junos rekeys on a soft lifetime shortly before the hard one expires, so
      there is no gap, and the soft value is the hard value minus a random
      jitter — which is why rekeys drift and never land on the same second
      twice. In the card's words, "Healthy rekey is seamless" — the SA index
      changes and traffic does not stop. A tunnel that goes down at the lifetime boundary is a rekey
      collision or a peer refusing the new SA, not a timer that needs raising,
      and raising it only makes the failure rarer and harder to catch. Under
      IKEv2 a mismatch between the two ends is legal and not an error — the
      shorter side drives the rekey.

  sources:
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }
    - { card: "srx-ipsec", side: 2, block: "LIFETIMES & REKEY" }

- id: junos-srx/ike.policy.proposals.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike policy IKE-POL proposals IKE-P1"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Points the policy at a named proposal. A name that does not exist fails the
    commit rather than the negotiation, so this one is caught before it can
    hurt anything.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 1
  tags: [phase1, object-chain, day-one, build]

  answers: "How do I attach the crypto parameters to the Phase 1 policy?"
  aka:
    - "link proposal to policy"
    - "reference the ike proposal"
  concepts:
    - concept:obj.ike-policy
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — a missing name fails the commit, not the tunnel"

  next_if_bad:
    - junos-srx/ike.sa.show
  related:
    - junos-srx/ike.proposal.dh-group.set
    - junos-srx/ike.gateway.policy.set
    - junos-srx/ike.policy.mode.set

  guidebook: [guide:ipsec.object-chain]
  related_rules: [ike.proposal-set.used]

  explain:
    terse: "The policy names the proposal. Junos checks the name at commit."
    explained: >
      Junos builds a VPN from six named objects, each referencing the one
      before it by name, and enforces those references at commit — a missing
      policy name fails the commit. What it cannot catch is a name that exists
      but holds values the far end will not accept.
    teaching: >
      This statement is the join between the two halves of Phase 1: the
      proposal holds the algorithms, the policy holds the mode and the key, and
      the gateway holds the peer. Knowing which object owns a knob tells you
      where to look, which is most of the value of the object chain. The commit
      check gives false confidence — a config that commits cleanly proves only
      that the names resolve, and the failure that actually costs you time
      waits for negotiation and shows up as NO_PROPOSAL_CHOSEN with nothing
      local to read. `proposal-set standard` also satisfies this slot and saves
      typing, and you then cannot see what you offered without the vendor docs.
      Write proposals out.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE OBJECT CHAIN" }
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 2, block: "PROPOSAL PARAMETERS" }

