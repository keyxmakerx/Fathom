    explained: >
      Unlike traceoptions, `monitor` writes nothing to disk and leaves nothing
      behind. Forgetting to stop it costs you a noisy session and nothing else,
      which is why it is a safer default for a live look than turning tracing
      on.
    teaching: >
      Worth stating explicitly because the two look like the same tool and are
      not. `monitor` streams an existing log to your terminal and stops when
      you say so or when you disconnect. Traceoptions change the configuration,
      generate new output, and keep doing it after everyone has gone home —
      which is how `/var` fills, and a full `/var` breaks logging and commits
      both. If a live look answers the question, you never need to touch
      traceoptions at all, and that is the cheaper path in every sense.

