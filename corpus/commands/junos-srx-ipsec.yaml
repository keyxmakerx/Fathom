    terse: "tail -f for kmd. Pair it with a scoped Phase 2 clear."
    explained: >
      The natural pairing is to start this, then clear the Phase 2 SA for one
      tunnel, and watch the whole negotiation happen in front of you. That
      turns a log-archaeology problem into a live observation, which is far
      faster to read.
    teaching: >
      The reason this is more useful than reading the file afterwards is
      ordering. In a static log, several tunnels' negotiations interleave and
      you reconstruct which line belongs to which. Watching one negotiation you
      triggered yourself, you know exactly which events are yours. It is
      ReadOnly — it starts no tracing and writes no file — which is what
      distinguishes it from traceoptions, and it is the right first step
      before deciding whether traceoptions are needed at all. Stop it
      explicitly when done; it keeps writing to your session otherwise.

  sources:
    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

