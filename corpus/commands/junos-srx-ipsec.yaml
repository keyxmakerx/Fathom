      The zone that owns the WAN unit must permit inbound IKE, or the box drops
      the peer's IKE before the IKE process ever sees it. Phase 1 then times
      out with nothing useful in the log, because nothing local ever happened.
      Check this before touching crypto.
    teaching: >
      This is the highest-value line in the whole build, because it is the one
      failure whose symptom points nowhere. Miss piece three and Phase 1 times
      out with nothing useful in the log. Miss pieces one, two, four or five
      and the tunnel reads UP while passing zero packets. Those are two
      completely different investigations, and knowing which you are in halves
      the search space immediately. The error decoder lists four causes for a
      Phase 1 timeout with no response: host-inbound ike, an upstream ACL, the
      peer address, and NAT. Three of them are somebody else's box. This one is
      yours, it is one line, and it is the cheapest of the four to rule out.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/route.static.st0.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set routing-options static route 10.2.0.0/16 next-hop st0.0"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Points a remote prefix at the tunnel unit. If that prefix is currently
    reached another way, this diverts it — and if the tunnel is not passing
    traffic, it blackholes it.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: route
  weight: 2
  tags: [plumbing, route-based, day-one, build]

  answers: "Plumbing piece four — how does the far side's prefix reach the tunnel?"
  aka:
    - "route the remote subnet down the tunnel"
    - "static route to st0"
    - "nothing is being sent into the tunnel"
  concepts:
    - concept:obj.route
    - concept:obj.st0
    - concept:act.configure

  read_field: "No output — verify the prefix resolves via st0 afterwards"

  next_if_bad:
    - junos-srx/route.remote.show
    - junos-srx/flow.session.show
  related:
    - junos-srx/route.remote.show
    - junos-srx/ipsec.vpn.traffic-selector.set
    - junos-srx/zone.st0.bind.set

  guidebook: [guide:ipsec.plumbing]
  related_rules: [route.remote-prefix.no-next-hop-st0]

  explain:
    terse: "Piece four of five. A selector is not a route."
    explained: >
      Configuring a traffic selector tells the peer which prefixes this tunnel
      carries. It does not put anything in the routing table. A route-based
      tunnel is selected by the routing table, so without this the packet is
      never handed to `st0` in the first place.
    teaching: >
      The reason this gets missed is that the selector and the route contain
      the same prefixes, so writing one feels like writing both. They do
      different jobs at different layers: the selector is a negotiation
      parameter that the peer checks, and the route is a forwarding decision
      that only this box makes. A tunnel with correct selectors and no route
      installs perfectly and carries nothing. It also interacts with
      `establish-tunnels on-traffic`, which negotiates only when a packet is
      routed at `st0` — so with no route, the default setting means the tunnel
      never even attempts to come up, and there is nothing in the log to say
      why.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 3, block: "FAKE FLAPS" }

- id: junos-srx/policy.zone-pair.match.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security policies from-zone TRUST to-zone VPN policy TO-B match source-address any destination-address any application any"
  wraps: [4, 8, 10]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Defines what a zone-pair rule matches. `any/any/any` is the widest possible
    match and should be narrowed before it reaches production — a permit built
    on it allows every protocol between the two zones.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: policy
  weight: 2
  tags: [plumbing, day-one, build]

  answers: "Plumbing piece five, part one — what does the rule for this pair match?"
  aka:
    - "write the policy for the tunnel"
    - "allow trust to vpn"
    - "zone pair rule"
  concepts:
    - concept:obj.security-policy
    - concept:obj.zone
    - concept:act.configure

  read_field: "No output — a match with no then clause permits nothing"

  next_if_bad:
    - junos-srx/policy.zone-pair.permit.set
    - junos-srx/flow.session.show
  related:
    - junos-srx/policy.zone-pair.permit.set
    - junos-srx/zone.st0.bind.set

  guidebook: [guide:ipsec.plumbing]
  related_rules: [policy.zone-pair.missing]

  explain:
    terse: "Piece five of five, and it is needed in each direction."
    explained: >
      A zone-pair policy is directional. `from-zone TRUST to-zone VPN` permits
      traffic that way only; return traffic on an established session is
      handled by the flow table, but a session initiated from the far side
      needs its own policy in the other direction.
    teaching: >
      Two mistakes live here. The first is writing only one direction and
      expecting the tunnel to be symmetric — it is not, and a tunnel that works
      for outbound sessions and silently drops inbound ones is one of the
      harder things to diagnose because half the tests pass. The second is
      `any/any/any`, which is what the card prints because it is the shortest
      thing that works, and which nobody should leave in place. Narrow it to
      the address objects and applications the tunnel actually exists for. The
      policy is the last of five plumbing pieces, and like the other three
      silent ones its failure reads as a healthy tunnel with no traffic.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

- id: junos-srx/policy.zone-pair.permit.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security policies from-zone TRUST to-zone VPN policy TO-B then permit"
  wraps: [4, 8]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Turns a match into an allow. Combined with an `any/any/any` match this
    permits everything between the two zones in that direction.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: policy
  weight: 1
  tags: [plumbing, day-one, build]

  answers: "Plumbing piece five, part two — how is the matched traffic allowed?"
  aka:
    - "permit the tunnel traffic"
    - "then permit"
  concepts:
    - concept:obj.security-policy
    - concept:act.configure

  read_field: "No output — confirm with the session table under real traffic"

  next_if_bad:
    - junos-srx/flow.session.show
  related:
    - junos-srx/policy.zone-pair.match.set
    - junos-srx/policy.policy-based-vpn.set

  guidebook: [guide:ipsec.plumbing]
  related_rules: [policy.zone-pair.missing]

  explain:
    terse: "Route-based ends here. Policy-based adds tunnel ipsec-vpn NAME."
    explained: >
      On a route-based tunnel the policy is an ordinary permit and the tunnel
      is selected by the routing table. On a policy-based tunnel the same
      statement carries `tunnel ipsec-vpn NAME` and the policy itself selects
      the tunnel, with no `st0` involved at all.
    teaching: >
      The difference between the two designs is visible in exactly this one
      statement, which is why it is worth reading carefully in an inherited
      config. A `then permit` with no tunnel clause and an `st0` elsewhere is
      route-based. A `then permit tunnel ipsec-vpn NAME` and no `st0` anywhere
      is policy-based, and everything you know about routing over the tunnel,
      running an adjacency across it, or having more than one selector pair
      does not apply. Policy-based is legacy — use route-based for anything
      new — but you will inherit it, and misreading which one you are looking
      at sends you hunting for a tunnel interface that was never supposed to
      exist.

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 1, block: "ROUTE-BASED VS POLICY-BASED" }

- id: junos-srx/policy.policy-based-vpn.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security policies from-zone TRUST to-zone UNTRUST policy TO-B then permit tunnel ipsec-vpn VPN-B"
  wraps: [4, 8, 10]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Selects a tunnel from within a policy rather than from the routing table.
    On a box already running route-based tunnels this introduces a second,
    incompatible model for how traffic reaches a peer.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: policy
  weight: 0
  tags: [legacy, policy-based]

  answers: "How does the legacy design pick a tunnel without a virtual interface?"
  aka:
    - "policy based vpn"
    - "no st0 in this config"
    - "legacy tunnel style"
  concepts:
    - concept:obj.security-policy
    - concept:obj.ipsec-vpn
    - concept:act.configure

  read_field: "No output — a policy-based VPN has no st0 to check at all"

  next_if_bad:
    - junos-srx/ipsec.sa.show
    - junos-srx/flow.session.show
  related:
    - junos-srx/policy.zone-pair.permit.set
    - junos-srx/ipsec.vpn.bind-interface.set

  guidebook: [guide:ipsec.route-vs-policy-based]

  explain:
    terse: "Legacy. One selector pair, no st0, no routing protocol over it."
    explained: >
      A policy-based tunnel is selected by the policy rather than by the
      routing table. It supports one selector pair per policy, cannot carry a
      routing protocol, and has no tunnel interface. Use route-based for
      anything new.
    teaching: >
      The reason to have an entry for a legacy construct is that you will meet
      it in somebody else's config and misread it. The tell is the absence of
      `st0` combined with `tunnel ipsec-vpn` in a policy — and the consequence
      is that half the diagnostic ladder does not apply. There is no
      `show interfaces st0.0`, nothing to route at, no `vpn-monitor` taking an
      interface down, and no way to run an adjacency across it. Everything from
      Phase 1 and Phase 2 upward is identical; everything about how traffic
      gets selected is different. Do not try to convert it in place during an
      incident.

  sources:
    - { card: "srx-ipsec", side: 1, block: "ROUTE-BASED VS POLICY-BASED" }

