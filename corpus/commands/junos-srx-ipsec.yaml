    - { card: "srx-ipsec", side: 3, block: "LOGS & TRACEOPTIONS" }

- id: junos-srx/ike.sa.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ike security-associations"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ike
  weight: 2
  tags: [phase1, bring-up, verify]

  answers: "Is the outer negotiated channel up with the far end?"
  aka:
    - "is phase 1 up"
    - "is ike up"
    - "did the peers authenticate"
    - "p1 state"
  concepts:
    - concept:obj.ike-sa
    - concept:p1.established
    - concept:act.verify
    - concept:phase.p1

  read_field: "State — want UP, and one row per peer"
  output_fields:
    - field: Index
      means: "Phase 1 SA identifier."
      want: any
      tell: "Same index a minute later = stable. New index = it rebuilt."
    - field: "Remote Address"
      means: "The peer as this box sees it."
      want: any
      join_key: true
      tell: >
        The join key across all output is VPN name plus peer IP, never st0.
        An address that does not match the source you actually see means NAT
        in path.
    - field: State
      means: "Phase 1 SA state."
      want: "UP"
      bad:
        - { value: "*", means: "Anything else means the peers have not finished authenticating." }
    - field: Mode
      means: "The exchange used — main, aggressive, or IKEv2."
      want: any
      tell: "Under v2-only, a mode statement in the config is ignored entirely."

  supplies: [Index]
  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/log.kmd.match-peer
    - explain:symptom:p1-timeout-nothing-in-log
  related:
    - junos-srx/ike.sa.show-detail
    - junos-srx/ike.active-peer.show
    - junos-srx/ipsec.sa.show

  guidebook: [guide:ipsec.phase-split, guide:ipsec.bring-up-order]
  walkthrough: ["walk:junos-srx.s2s-ipsec#verify-p1"]
  related_rules: [zone.host-inbound.ike-missing, ike.identity.mismatch]

  explain:
    terse: "Step 2 of the ladder. One row per peer. Want UP."
    explained: >
      This answers exactly one question: did the two peers authenticate and
      build the outer channel. It says nothing about whether any data tunnel
      exists inside it, which is a separate command and a separate failure
      mode.
    teaching: >
      Phase 2 rides inside Phase 1. Phase 1 can be perfectly healthy while
      Phase 2 fails forever — that split is the most useful diagnostic fact
      there is, and it is the reason these are two commands rather than one.
      If this is clean, stop suspecting the pre-shared key, the peer address,
      the WAN zone and the DH group, because all four of those had to be right
      for this to be up. If it is empty or cycling, none of the Phase 2
      parameters matter yet. Read the Index across two runs: the same index a
      minute later means stable, and a new index means it rebuilt, which is a
      different problem from never coming up.

  sources:
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 3, block: "READING THE SA OUTPUT" }

- id: junos-srx/ike.sa.show-detail
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show security ike security-associations detail"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: ike
  weight: 3
  tags: [phase1, nat-t, identity, verify]

  answers: "Which side started it, and is address translation in the path?"
  aka:
    - "is nat-t active"
    - "which side initiated"
    - "phase 1 parameters"
    - "what did we actually negotiate"
    - "port 4500"
  concepts:
    - concept:obj.ike-sa
    - concept:p1.established
    - concept:phase.p1
    - concept:attr.nat-traversal
    - concept:act.inspect

  read_field: "Port — 4500 means NAT-T is active"
  output_fields:
    - field: Role
      means: "Whether this box initiated or responded."
      want: any
      tell: >
        Always Responder means your side never initiates — check
        establish-tunnels and the route at st0.
    - field: Port
      means: "Remote IKE port."
      want: any
      tell: >
        500 direct, 4500 = NAT-T in path. NAT-T wraps ESP in UDP and costs
        8 bytes, which becomes an MTU problem later.
    - field: "Local Identity"
      means: "What this box called itself."
      want: any
      tell: "Must equal the peer's configured remote-identity, exactly."
    - field: "Remote Identity"
      means: "What the peer called itself."
      want: any
      tell: >
        A mismatch reads as IKE-ID validation failed or a bare
        AUTHENTICATION_FAILED — check this before you re-type the PSK.
    - field: Lifetime
      means: "Countdown to the Phase 1 rekey."
      want: any
      tell: "Use it to time a capture around the rekey event."

  supplies: [Index]
  next_if_bad:
    - junos-srx/ipsec.inactive-tunnels.show
    - junos-srx/log.kmd.match-peer
    - explain:error:junos-srx/IKE-ID-VALIDATION-FAILED
  related:
    - junos-srx/ike.sa.show
    - junos-srx/ike.sa.show-index-detail
    - junos-srx/ike.gateway.nat-keepalive.set

  guidebook: [guide:ike.phase1.identity, guide:ipsec.nat-traversal]
  related_rules: [ike.identity.mismatch, ike.identity.required-behind-nat, mtu.mss-clamp.absent]

  explain:
    terse: "Where Role, Port and both identities live. 4500 means NAT."
    explained: >
      `detail` adds the three fields you cannot get any other way: Role, which
      tells you whose config to open when a proposal is rejected; Port, which
      tells you whether NAT is in path; and the two identities, which are what
      an authentication failure is usually actually about.
    teaching: >
      ESP is IP protocol 50 with no ports, so a NAT device doing PAT cannot
      track it. IKE detects NAT during Phase 1 and both peers move to UDP 4500,
      wrapping ESP in UDP. Nothing announces this — the port in this output is
      the only tell. It matters twice. It costs 8 bytes of payload, which comes
      straight off an already tight MTU budget. And if the NAT device's UDP
      idle timer is shorter than the keepalive, the mapping dies and the tunnel
      goes one-way until the next rekey, with the symptom "works, then stops
      after N minutes of quiet". Nobody attributes that to a NAT timer on the
      first day.

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE VERIFY LADDER" }
    - { card: "srx-ipsec", side: 3, block: "READING THE SA OUTPUT" }
    - { card: "srx-ipsec", side: 2, block: "NAT TRAVERSAL" }

