- id: junos-srx/system.commit.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show system commit"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: system
  weight: 3
  tags: [correlation, day-two, run-this-first, not-vpn-specific]

  answers: "Who changed what on this box, and when?"
  aka:
    - "what changed"
    - "did somebody touch this box"
    - "change history"
    - "correlate the outage with a change"
  concepts:
    - concept:obj.commit
    - concept:act.correlate
  symptoms:
    - concept:symptom.tunnel-flapping
    - concept:symptom.tunnel-down

  read_field: "Newest timestamp — compare it against the first flap"
  output_fields:
    - field: "0"
      means: "The most recent commit, with timestamp and user."
      want: any
      join_key: true
      tell: >
        If the newest commit lines up with the first flap in kmd, you have your
        answer and it is not PFS.
    - field: "user"
      means: "Who committed."
      want: any
      tell: "Cross-check against show system users if the change was not yours."

  supplies: ["0"]
  next_if_bad:
    - junos-srx/log.messages.kmd-vpn
    - junos-srx/system.uptime.show
  related:
    - junos-srx/log.messages.kmd-vpn
    - junos-srx/system.users.show
    - junos-srx/system.uptime.show

  guidebook: [guide:ipsec.correlate-first]

  explain:
    terse: "Run this first. Correlate before you theorise."
    explained: >
      Before any crypto investigation, get the timestamp of the newest commit
      and the timestamp of the first flap. If they line up, the problem is a
      change and the search space collapses from the whole protocol to one
      configuration diff.
    teaching: >
      This is the highest-yield read-only command on the card and it has
      nothing to do with IPsec. The reason it works is that the alternative —
      reasoning forward from symptoms to causes — has an enormous search space,
      and correlation has a tiny one. If the newest commit lines up with the
      first flap in `kmd`, you have your answer and it is not PFS. If it does
      not, you have eliminated the most likely cause in four seconds and can
      proceed to the ladder with a clear conscience. Pair it with `show system
      uptime` for the reboot case and `show system users` for the "somebody
      else is in here right now" case, both of which produce symptoms that look
      exactly like protocol failures.

  sources:
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

- id: junos-srx/system.uptime.show
  entry_version: 1.0.0
  status: active
