- id: junos-srx/interface.st0.mtu.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set interfaces st0 unit 0 family inet mtu 1400"
  wraps: [5]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Lowers the size the tunnel unit will pass without fragmenting. The box now
    fragments before encryption, which costs CPU on a busy tunnel, and those
    fragments can still be dropped downstream.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: interface
  weight: 2
  tags: [mtu, fragmentation, day-two]

  answers: "Fix two of three — how do I shrink what the tunnel accepts?"
  aka:
    - "lower the tunnel mtu"
    - "set mtu on st0"
    - "fix for udp as well as tcp"
  concepts:
    - concept:obj.st0
    - concept:attr.mtu
    - concept:act.configure

  read_field: "No output — read it back from the logical unit, not the physical"

  next_if_bad:
    - junos-srx/mtu.ping.df-sourced
    - junos-srx/flow.tcp-mss.set-ipsec
  related:
    - junos-srx/flow.tcp-mss.set-ipsec
    - junos-srx/ipsec.vpn.df-bit.clear.set
    - junos-srx/interface.st0.mtu.show

  guidebook: [guide:mtu.three-fixes]
  related_rules: [mtu.st0.unset, mtu.mss-clamp.absent]

  explain:
    terse: "Universal, covers UDP, and the box fragments before encryption."
    explained: >
      Lowering the tunnel MTU is the only one of the three fixes that helps
      UDP. The cost is that fragmentation now happens on this box, before
      encryption — which uses CPU, and produces fragments that firewalls
      downstream still routinely drop.
    teaching: >
      1400 is the conventional value and the arithmetic behind it is worth
      knowing rather than copying. IPsec adds a new outer IP header of 20
      bytes, an ESP header with SPI and sequence of 8, an IV of 8 to 16, pad
      and trailer and next-header of 2 to 255, an ICV of 12 to 16, and another
      8 if NAT-T has moved you to UDP 4500. Roughly 50 to 70 bytes,
      cipher-dependent. From 1500 that leaves about 1430, and 1400 is that with
      headroom. Those figures are the card's own and it marks them approximate.
      Do not treat 1400 as a constant — measure with a sized do-not-fragment
      test sourced from inside the selector.

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
    - { card: "srx-ipsec", side: 4, block: "OVERHEAD BUDGET" }
    - { card: "srx-ipsec", side: 4, block: "THREE FIXES — KNOW THE DIFFERENCE" }
  sources_note: >
    Overhead figures are the card's own and are marked approximate there:
    "OVERHEAD FIGURES APPROXIMATE — CIPHER-DEPENDENT". Reproduced with that
    qualification intact.

- id: junos-srx/flow.tcp-mss.set-ipsec
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security flow tcp-mss ipsec-vpn mss 1360"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Rewrites the MSS option in TCP handshakes for tunnel traffic only. Existing
    sessions keep their negotiated MSS until they are rebuilt, so the effect is
    not immediate on long-lived connections.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: flow
  weight: 3
  tags: [mtu, preferred-fix, day-two]

  answers: "Fix one of three — how do both ends agree to smaller segments up front?"
  aka:
    - "clamp the mss"
    - "fix stalling transfers"
    - "mss for the tunnel only"
    - "tcp handshake rewrite"
  concepts:
    - concept:attr.mss
    - concept:obj.tcp-handshake
    - concept:act.clamp

  read_field: "No output — retest with a full-size transfer, not with ping"

  slots:
    - name: mss
      binds: null
      accepts: [Integer]
      placeholder: "<mss-bytes>"
      required: true
      suggest:
        - { value: 1360, note: "1400 tunnel MTU minus 40 for IP and TCP" }
        - { value: 1350, note: "the same with margin, which many shops prefer" }

  next_if_bad:
    - junos-srx/mtu.ping.df-sourced
    - junos-srx/interface.st0.mtu.set
  related:
    - junos-srx/flow.tcp-mss.set-all-tcp
    - junos-srx/interface.st0.mtu.set
    - junos-srx/ipsec.vpn.df-bit.clear.set

  guidebook: [guide:mtu.three-fixes]
  related_rules: [mtu.mss-clamp.absent, mtu.mss-clamp.all-tcp-used]

  explain:
    terse: "The preferred fix. Surgical, needs no ICMP, does nothing for UDP."
    explained: >
      Clamping rewrites the TCP handshake so both ends agree to smaller
      segments before any data moves. It prevents fragmentation before it
      starts and does not depend on ICMP getting through, which is the whole
      reason it exists. It is TCP-only.
    teaching: >
      Rule of thumb: MSS equals tunnel MTU minus 40, for the IP and TCP
      headers. A 1400 MTU means clamp 1360, and many shops use 1350 for margin.
      Prefer `tcp-mss ipsec-vpn`, which clamps only tunnel traffic, over
      `tcp-mss all-tcp`, which hits everything through the box — a far bigger
      blast radius than most people intend. The reason this is the preferred
      fix rather than one of three equals is Path MTU Discovery's failure mode:
      PMTUD lets endpoints learn the smallest hop by sending DF-set packets and
      relies on an ICMP fragmentation-needed coming back, and that ICMP is
      filtered somewhere on almost every path. The sender never learns to
      shrink and big packets disappear in silence. Clamping does not depend on
      ICMP at all.

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
    - { card: "srx-ipsec", side: 4, block: "THREE FIXES — KNOW THE DIFFERENCE" }
    - { card: "srx-ipsec", side: 4, block: "PMTUD & THE DF BIT" }
    - { std: "RFC 2923", section: "2.1", note: "Path MTU discovery black holes" }

- id: junos-srx/flow.tcp-mss.set-all-tcp
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security flow tcp-mss all-tcp mss 1350"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Clamps every TCP session through the box, tunnelled or not. Internet
    browsing, internal server traffic and management sessions all get smaller
    segments, which costs throughput on paths that never needed it.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: flow
  weight: 1
  tags: [mtu, blast-radius, day-two]

  answers: "What is the wide version of the segment rewrite, and why avoid it?"
  aka:
    - "clamp everything"
    - "global mss"
    - "why is browsing slow after the vpn change"
  concepts:
    - concept:attr.mss
    - concept:obj.device
    - concept:act.clamp

  read_field: "No output — the effect reaches every TCP session on the box"

  next_if_bad:
    - junos-srx/flow.tcp-mss.set-ipsec
    - junos-srx/flow.status.show
  related:
    - junos-srx/flow.tcp-mss.set-ipsec
    - junos-srx/system.commit.show

  guidebook: [guide:mtu.three-fixes]
  related_rules: [mtu.mss-clamp.all-tcp-used]

  explain:
    terse: "Hits everything through the box. Prefer the ipsec-vpn form."
    explained: >
      `tcp-mss ipsec-vpn` clamps only tunnel traffic — the clean fix. `all-tcp`
      hits everything through the box, a far bigger blast radius than most
      people intend, and the effect on non-tunnel paths is invisible until
      somebody measures throughput.
    teaching: >
      This entry exists mainly so that somebody who finds it in an inherited
      config understands what it is doing. It is set during an incident,
      because it is one line and it works, and then it stays — and six months
      later an unrelated performance complaint has a cause nobody can find,
      because every TCP session on the box has been quietly capped. The
      correlation is findable with `show system commit`: if the newest commit
      lines up with when things got slower, you have your answer. Correlate
      before you theorise. If you must set it during an incident, write the
      follow-up to narrow it into the same ticket.

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
    - { card: "srx-ipsec", side: 4, block: "BOX-LEVEL CONTEXT" }

- id: junos-srx/flow.force-ip-reassembly.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security flow force-ip-reassembly"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Makes the box reassemble fragmented packets before processing them, on
    every flow. That is memory and CPU on the data plane, and on a box already
    near its session or CPU limits it is a capacity change.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: flow
  weight: 0
  tags: [mtu, fragmentation, day-two]

  answers: "How do I make the box put fragmented packets back together first?"
  aka:
    - "reassemble fragments"
    - "handle fragmented traffic"
  concepts:
    - concept:obj.device
    - concept:attr.mtu
    - concept:act.configure

  read_field: "No output — watch data-plane CPU afterwards, not the tunnel"

  next_if_bad:
    - junos-srx/flow.monitoring.fpc.show
    - junos-srx/chassis.re.show
  related:
    - junos-srx/ipsec.vpn.df-bit.clear.set
    - junos-srx/flow.monitoring.fpc.show

  guidebook: [guide:mtu.three-fixes]

  explain:
    terse: "Last resort. Trades a correctness problem for a capacity one."
    explained: >
      Reach for this only when fragments must be handled and the fragmentation
      cannot be prevented. It moves work onto the data plane for every flow,
      not only the tunnelled ones, so measure before and after rather than
      assuming it is free.
    teaching: >
      The card lists this among the places to set MTU-related behaviour without
      recommending it, and that restraint is the right reading. The three real
      fixes are ordered by how surgical they are: clamp the MSS, lower the
      tunnel MTU, clear the DF bit. This is downstream of all three and it
      addresses a symptom rather than a cause — you are now paying to
      reassemble packets that should never have been fragmented. If you find
      yourself here, go back and check whether the clamp is actually applied to
      the traffic you care about, because an `ipsec-vpn` clamp does nothing for
      UDP and nothing for traffic that is not entering the tunnel.

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }
  sources_note: >
    The card names the statement in the WHERE TO SET IT block and does not
    explain it. The trade-off described here is general SRX flow-module
    behaviour and is not the card's; treat the capacity claim as unverified.

- id: junos-srx/interface.st0.mtu.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show interfaces st0.0 | match MTU"
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: interface
  weight: 2
  tags: [mtu, verify, day-two]

  answers: "What size limit is actually configured on the tunnel unit?"
  aka:
    - "check the tunnel mtu"
    - "read the mtu on st0"
    - "what is the current limit"
  concepts:
    - concept:obj.st0
    - concept:attr.mtu
    - concept:act.verify

  read_field: "MTU — this is the IP MTU of the logical unit"
  output_fields:
    - field: MTU
      means: "The IP MTU of the logical unit."
      want: any
      tell: >
        The logical-unit MTU is the IP MTU; the physical MTU includes L2
        overhead. Different numbers for the same link.

  next_if_bad:
    - junos-srx/interface.st0.mtu.set
    - junos-srx/mtu.ping.df-sourced
  related:
    - junos-srx/interface.wan.mtu.show
    - junos-srx/interface.st0.mtu.set
    - junos-srx/flow.tcp-mss.set-ipsec

  guidebook: [guide:mtu.overhead]
  related_rules: [mtu.st0.unset]

  explain:
    terse: "The logical unit MTU is the IP MTU. Confirm the layer first."
    explained: >
      Read this before comparing numbers with the far end. On SRX the physical
      MTU includes L2 overhead and the logical-unit MTU is the IP MTU, so the
      same link has two legitimate figures that differ.
    teaching: >
      This is a two-second command that prevents a recurring class of wasted
      conversation. Two engineers compare MTU across a tunnel, one reads the
      physical figure and one reads the logical, they disagree by a small fixed
      amount, and an hour goes into a discrepancy that is not one. State the
      layer whenever you send the number. The other habit worth having: a
      tunnel unit with no explicit MTU inherits a default that is almost
      certainly larger than the tunnel can carry, so absence here is a finding
      rather than a neutral fact.

  sources:
    - { card: "srx-ipsec", side: 4, block: "WHERE TO SET IT" }

- id: junos-srx/interface.wan.mtu.show
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "show interfaces reth0.0 extensive | match MTU"
  wraps: [3]
  mode: operational
  platform: junos-srx
  versions: "*"

  risk: ReadOnly
  domain: interface
  weight: 1
  tags: [mtu, verify, day-two]

  answers: "What size limit does the underlay port carry?"
  aka:
    - "wan mtu"
    - "physical interface mtu"
    - "underlay packet limit"
  concepts:
    - concept:obj.wan-unit
    - concept:attr.mtu
    - concept:act.verify

  read_field: "MTU — the physical figure includes L2 overhead"
  output_fields:
    - field: MTU
      means: "Interface MTU, physical or logical depending on the block you read."
      want: any
      tell: >
        On SRX the physical MTU includes L2 overhead; the logical-unit MTU is
        the IP MTU. Confirm which layer you are reading before comparing
        against a peer.

  next_if_bad:
    - junos-srx/mtu.ping.df-sized
  related:
    - junos-srx/interface.st0.mtu.show
    - junos-srx/interface.wan.errors.show

  guidebook: [guide:mtu.overhead]

  explain:
    terse: "The underlay figure. Subtract the overhead to get the tunnel budget."
    explained: >
      Whatever this reads is the ceiling. IPsec takes roughly 50 to 70 bytes
      out of it, cipher-dependent, plus 8 more if NAT-T is active — and what is
      left is the largest packet the tunnel can carry without fragmenting.
    teaching: >
      Two things to look for beyond the number. First, whether the underlay is
      actually 1500: on some carrier services it is not, and everyone's
      arithmetic downstream is then wrong by the same amount. Second, whether
      NAT-T is active on this tunnel, which you read from the remote port in
      the Phase 1 SA detail — 4500 means ESP is wrapped in UDP and 8 more bytes
      are gone. Neither of those shows up in the tunnel unit's own
      configuration, so the tunnel MTU somebody set six months ago may have
      been right then and wrong since the path changed.

