  guidebook: [guide:ipsec.reading-the-log]

  explain:
    terse: "Transitions, not negotiation detail. Good for a timeline."
    explained: >
      `kmd` carries the negotiation detail; `messages` carries the summary
      transitions with timestamps that line up against everything else on the
      box. For building a timeline of a flap, this is the better source.
    teaching: >
      Correlate before you theorise. The single highest-yield move in a flap
      investigation is to put three timelines side by side: the transitions
      here, the commit history from `show system commit`, and the interval
      between flaps. If the newest commit lines up with the first flap, you
      have your answer and it is not PFS. If the interval is a clean round
      number, it is a lifetime or a DPD product. If it is irregular and bursty,
      it is underlay loss. That triage takes about a minute and it eliminates
      most of the wrong investigations before they start.

