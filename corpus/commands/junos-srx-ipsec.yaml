    terse: "The unscoped form. It exists, and it is almost never what you want."
    explained: >
      This entry is reachable by typing the command, not by asking a question
      like "restart the tunnel" — that question returns the scoped forms. The
      unscoped command is real and engineers occasionally need it, and hiding
      it would make the tool a liar.
    teaching: >
      Always scope by peer or index. The reason this is stated as an
      instruction rather than a suggestion is the hub case: one command, forty
      spokes down, forty simultaneous renegotiations, and a routing engine
      doing forty Diffie-Hellman exponentiations while also trying to run the
      control plane. Somebody who has only ever run this on a two-tunnel branch
      box has no reason to expect any of that. The legitimate uses are narrow:
      a box with a single peer, or a deliberate estate-wide rebuild inside a
      change window with everybody told in advance.

  sources:
    - { card: "srx-ipsec", side: 3, block: "CLEARING & RENEGOTIATING" }

