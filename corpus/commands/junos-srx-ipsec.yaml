  read_field: "No output — a mismatch reads as IKE-ID validation failed"

  next_if_bad:
    - explain:error:junos-srx/IKE-ID-VALIDATION-FAILED
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ike.gateway.remote-identity.set
    - junos-srx/ike.gateway.dynamic-hostname.set
    - junos-srx/ike.policy.psk.set

  guidebook: [guide:ike.phase1.identity]
  related_rules: [ike.identity.mismatch, ike.identity.required-behind-nat]

  explain:
    terse: "Needed when your outer source IP is not what the peer expects."
    explained: >
      Set this when the peer cannot identify you by your outer source address:
      behind NAT, on a dynamic address, with certificate authentication, or
      when the peer expects an FQDN or an email-style ID. The peer's
      `remote-identity` must match it exactly.
    teaching: >
      Identity is the single most misdiagnosed thing in IPsec, and the reason
      is that the error looks like a key error. A mismatch reads as `peer's
      IKE-ID validation failed` or a bare AUTHENTICATION_FAILED — easily
      misread as a wrong pre-shared key. Check identity before you re-type the
      PSK. The case that produces it most often is NAT: your outer source
      address is rewritten in flight, the peer's `remote-identity` is set to
      the address it expected to see, and the two no longer agree even though
      nothing about the key changed. Setting `local-identity` explicitly makes
      the value independent of what the path does to your packets.

  sources:
