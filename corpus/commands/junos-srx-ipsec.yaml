- id: junos-srx/ike.policy.mode.set
  entry_version: 1.0.0
  status: active
  reviewed_by: <named human>
  reviewed_on: 2026-07-28

  cmd: "set security ike policy IKE-POL mode main"
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes the IKEv1 exchange shape. Ignored entirely under `version v2-only`,
    so on a v2 gateway this statement changes nothing at all.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 1
  tags: [phase1, ikev1, legacy]

  answers: "Six messages with the identity hidden, or three with it in clear?"
  aka:
    - "main mode vs aggressive"
    - "set aggressive mode"
    - "hide the identity in phase 1"
  concepts:
    - concept:obj.ike-policy
    - concept:attr.ike-version
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — under v2-only this statement is silently ignored"

  next_if_bad:
    - explain:concept:ike.version-choice
  related:
    - junos-srx/ike.gateway.version.set
    - junos-srx/ike.gateway.dynamic-hostname.set

  guidebook: [guide:ike.version-choice]
  related_rules: [ike.mode.aggressive-with-psk, ike.mode.aggressive-with-v2]

  explain:
    terse: "IKEv1 only. Main is 6 messages, aggressive is 3 and leaks the ID."
    explained: >
      Aggressive mode exists almost solely for a pre-shared key with a dynamic
      peer address, because main mode with a PSK must identify the peer by
      address. It leaks the identity and is offline-crackable. On v2 you never
      need it.
    teaching: >
      Two things about this statement are worth holding on to. The first is
      why aggressive mode exists at all: RFC 2409 §5.4 makes main mode with a
      pre-shared key identify the peer only by address, because the initiator
      must compute its hash before it has processed the responder's identity.
      A peer with no fixed address cannot be identified that way, so aggressive
      mode moves the identity into the first message in the clear — which is
      also what makes it offline-crackable. The second is that `mode` is
      silently ignored under `version v2-only`. Seeing `mode aggressive` in a
      v2 config means nothing, and chasing it wastes an hour that belongs to
      the actual mismatch.

  sources:
    - { card: "srx-ipsec", side: 2, block: "IKEV1 VS IKEV2" }
    - { std: "RFC 2409", section: "5.4", note: "Main mode with a pre-shared key identifies the peer by address; aggressive mode does not" }

