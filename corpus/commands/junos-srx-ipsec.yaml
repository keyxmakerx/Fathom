    Changes how often this box refreshes the NAT mapping. Too long and the
    mapping expires during a quiet period, which takes the tunnel one-way
    until the next rekey.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 1
  tags: [phase1, nat-t, timers]

  answers: "How do I stop the address translation entry expiring when idle?"
  aka:
    - "nat keepalive"
    - "tunnel dies after a quiet period"
    - "udp 4500 mapping times out"
  concepts:
    - concept:obj.ike-gateway
    - concept:attr.nat-traversal
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — confirm NAT-T is active first, via remote port 4500"

  next_if_bad:
    - explain:symptom:works-then-stops-after-quiet
    - junos-srx/ike.sa.show-detail
  related:
    - junos-srx/ike.sa.show-detail
