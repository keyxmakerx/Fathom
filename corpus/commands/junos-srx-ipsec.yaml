# =============================================================================
# § CANONICALITY — the ten weight: 3 entries and their concept sets
# =============================================================================
# Gate 7: at most one weight: 3 per (concept, platform). These ten are pairwise
# disjoint by construction. Everything else in the bundle is weight 2 or lower.
# Adding an eleventh requires checking against this table, which is why it is
# written down rather than derived.
#
canonicality:
  - { entry: "junos-srx/ipsec.sa.show-vpn-detail", concepts: [obj.tunnel, obj.ipsec-sa, p2.installed, act.verify, phase.p2] }
  - { entry: "junos-srx/ike.sa.show-detail",       concepts: [obj.ike-sa, p1.established, phase.p1, attr.nat-traversal, act.inspect] }
  - { entry: "junos-srx/system.commit.show",       concepts: [obj.commit, act.correlate] }
  - { entry: "junos-srx/mtu.ping.df-sized",        concepts: [obj.path, attr.mtu, act.measure] }
  - { entry: "junos-srx/ipsec.statistics.index",   concepts: [obj.counter, dataplane.passing, act.count] }
  - { entry: "junos-srx/ike.traceoptions.delete",  concepts: [obj.trace, act.clean-up] }
  - { entry: "junos-srx/log.kmd.match-peer",       concepts: [obj.log, act.read-log] }
  - { entry: "junos-srx/ipsec.sa.clear-vpn",       concepts: [obj.child-sa, act.clear, attr.rekey] }
  - { entry: "junos-srx/flow.tcp-mss.set-ipsec",   concepts: [attr.mss, obj.tcp-handshake, act.clamp] }
  - { entry: "junos-srx/interface.st0.terse",      concepts: [obj.st0, state.interface-up, act.check-interface] }
  - { entry: "junos-srx/zone.host-inbound.ike.set", concepts: [obj.zone, obj.wan-unit, act.configure, phase.p1] }

# NOTE — the last row breaks the disjointness claim above: `phase.p1` is also on
# `ike.sa.show-detail`, and `act.configure` is on most of the config entries.
# It is left in deliberately and flagged rather than silently demoted, because
# `set … host-inbound-traffic system-services ike` genuinely is the canonical
# answer to "why is the peer's negotiation being dropped" and side 4 says so:
# "Check this before touching crypto." Gate 7 will fail this bundle on
# (phase.p1, junos-srx) and (act.configure, junos-srx), and the resolution is a
# review decision, not an authoring one. Recorded here so the reviewer makes it
# rather than inherits it.

# =============================================================================
