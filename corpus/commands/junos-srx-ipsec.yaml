  cmd: "set security ike gateway GW-B remote-identity inet 203.0.113.10"
  wraps: [4]
  mode: configuration
  platform: junos-srx
  versions: "*"

  risk: ChangesConfig
  blast_radius: >
    Changes what this box will accept the far end calling itself. Wrong, and
    every negotiation is rejected at the identity check with no key involved.
  reversible: commit-confirmed
  commit_model: junos-commit

  domain: ike
  weight: 2
  tags: [phase1, identity, nat]

  answers: "What name will this box accept from the far end?"
  aka:
    - "set the peer identity"
    - "expected remote id"
    - "peer says its name is different"
  concepts:
    - concept:obj.ike-gateway
    - concept:attr.identity
    - concept:act.configure
    - concept:phase.p1

  read_field: "No output — a mismatch reads as IKE-ID validation failed"

  next_if_bad:
    - explain:error:junos-srx/IKE-ID-VALIDATION-FAILED
    - junos-srx/log.kmd.match-peer
  related:
    - junos-srx/ike.gateway.local-identity.set
    - junos-srx/ike.gateway.address.set

  guidebook: [guide:ike.phase1.identity]
  related_rules: [ike.identity.mismatch]

  explain:
    terse: "Must equal the peer's local-identity, byte for byte."
    explained: >
      This is the mirror of the peer's `local-identity`. The two are compared
      as values, not resolved as names, so an FQDN here must be the exact
      string the peer sends and not merely an address that resolves to the same
      host.
    teaching: >
      The pair of identity statements is symmetric and the failure is not.
      Getting `local-identity` wrong breaks you at the far end, where you
      cannot see the log; getting `remote-identity` wrong breaks the peer at
      your end, where you can. So when a tunnel authenticates in one direction
      of blame and not the other, the role in `show security ike
      security-associations` tells you which config to open. The rule that
      saves the most time is stated once and applies here: a bare
      AUTHENTICATION_FAILED covers PSK, certificate chain, clock skew and
      identity. Rule out identity and the clock before you touch the key,
      because those two are free to check and the key is not.

  sources:
    - { card: "srx-ipsec", side: 2, block: "PEER IDENTITY" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }

