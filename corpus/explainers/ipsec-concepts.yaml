- id: explain:symptom:p1-timeout-nothing-in-log
  class: symptom
  subject: { path: p1-timeout-nothing-in-log }
  title: "Phase 1 times out and the log says nothing"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "most-missed"

  terse: "Nothing comes up, and there is nothing local to read."

  explained: >
    Four causes, and three of them are somebody else's box: missing host-inbound
    ike on the WAN zone, an upstream ACL, a wrong peer address, and NAT. Check
    the one that is yours first — it is one line and the cheapest of the four to
    rule out.

  teaching:
    body: >
      This is the only plumbing failure that fails loudly, and it still points
      nowhere. Miss host-inbound ike and Phase 1 times out with nothing useful
      in the log — the box drops the peer's IKE before processing it, so nothing
      local ever happened and there is nothing to write down.

      Contrast that with the other four plumbing pieces. Miss the tunnel
      interface, the zone binding, the route or the policy, and the tunnel reads
      UP while passing zero packets. Two completely different investigations,
      and this symptom tells you which one you are in.

      The four candidates, in the order they are worth checking: host-inbound
      ike on the zone that owns the external interface, because it is yours and
      it is one line. Then the peer address. Then NAT in path, which you can
      infer from the peer address not matching the source you actually see. Then
      an upstream ACL, which needs somebody else.

      Check this before you touch crypto.

    breaks_if_wrong: >
      Every crypto parameter is untestable until Phase 1 completes, so time
      spent comparing proposals is wasted regardless of whether they match.
      Nothing negotiates, so nothing can disagree.

    misdiagnosed_as: >
      A proposal mismatch. The absence of a log entry reads as "the negotiation
      failed silently", and people start changing dh-groups on a box the peer's
      packets never reached.

  links:
    - { rel: caused_by,  to: "explain:concept:ipsec.plumbing" }
    - { rel: see_also,   to: "explain:concept:ipsec.error-decoder" }
    - { rel: see_also,   to: "explain:concept:ipsec.nat-traversal" }

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

  terminal: true

- id: explain:symptom:up-but-zero-traffic
  class: symptom
  subject: { path: up-but-zero-traffic }
  title: "Tunnel UP, zero traffic"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "most-missed"

  terse: "Tunnel UP, zero traffic. The SA proves crypto, not reachability."

  explained: >
    st0 has no zone, no policy, or nothing routed at it — or source NAT is
    rewriting the packets on the way out. Four plumbing pieces and one NAT rule
    produce this identical symptom, and none of them are visible from any IPsec
    command.

  teaching:
    body: >
      The SA proves crypto, not reachability. Phase 1 and Phase 2 can both be
      perfect while the tunnel passes nothing, and every command in the crypto
      half of the ladder will tell you the tunnel is healthy.

      Five candidates. No tunnel interface. The interface in no zone. Nothing
      routed at it. No policy for the zone pair, in the direction being tried.
      Or an interface source-NAT rule grabbing packets routed at st0, so the far
      end sees the wrong source and rejects the selector.

      The commands that separate them, in order: `show interfaces st0.0 terse`,
      `show route <remote-prefix>`, then `show security flow session`. The
      session table is the one that resolves it — no sessions at all points at
      the policy or the route, and sessions whose egress is the WAN rather than
      st0 point at the route or at NAT.

      Steps 5 to 8 of the bring-up ladder failing while 2 to 4 are clean is
      plumbing, not crypto — no proposal tweaking will fix it.

    breaks_if_wrong: >
      Reading this as a crypto problem sends the whole investigation into
      proposals, PFS groups and pre-shared keys, none of which can be wrong when
      the SA is Installed. Hours go into the half of the configuration that has
      already proved itself.

    misdiagnosed_as: >
      A selector mismatch, because the selector is the thing in the crypto
      configuration that mentions traffic. The selectors are fine — nothing is
      being handed to the tunnel for them to select.

  links:
    - { rel: caused_by, to: "explain:concept:ipsec.plumbing" }
    - { rel: see_also,  to: "explain:concept:ipsec.bring-up-order" }
    - { rel: see_also,  to: "explain:concept:ipsec.one-way-tell" }

  sources:
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }
    - { card: "srx-ipsec", side: 1, block: "THE FIVE PLUMBING PIECES" }
    - { card: "srx-ipsec", side: 1, block: "BRING-UP ORDER" }

  terminal: true

- id: explain:symptom:handshake-ok-data-stalls
  class: symptom
  subject: { path: handshake-ok-data-stalls }
  title: "Ping works, then transfers stall"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "DF ping"

  terse: "Ping works. SSH connects. Then ls hangs."

  explained: >
    Small packets fit; full-size ones exceed the tunnel MTU and vanish. Handshake
    fine, data stalls is MTU until proven otherwise. Test it with a sized
    do-not-fragment ping sourced from inside the traffic selector before
    escalating anywhere.

  teaching:
    body: >
      The shape of this symptom is what makes it diagnostic. Connectivity tests
      pass because they use small packets. Session establishment passes because
      handshakes are small. The first full-size segment disappears, and TCP
      retransmits it forever at the same size.

      IPsec adds roughly 50 to 70 bytes of headers, cipher-dependent, plus 8
      more if NAT-T has moved the tunnel to UDP 4500. From 1500 that leaves
      about 1430, which is why tunnel MTU is conventionally clamped to 1400.

      Path MTU Discovery is supposed to prevent all of this and it does not,
      because the ICMP fragmentation-needed that would tell the sender to shrink
      is filtered somewhere on almost every real path. The sender never learns,
      and big packets disappear in silence.

      Measure it: `ping <dest> do-not-fragment size 1472` for 1500 on the wire.
      If 1472 fails and 1372 passes, path MTU is around 1400 and you
      binary-search between them. Source from inside the traffic selector or you
      have measured the underlay.

    breaks_if_wrong: >
      The ticket goes to the application team, who find nothing, and comes back.
      Meanwhile every bulk transfer over the tunnel fails and every diagnostic
      anybody runs — ping, SSH, a small file — passes.

    misdiagnosed_as: >
      An application or file-server problem, then a performance problem, then a
      carrier problem. The tunnel is declared healthy at every stage, and it is
      healthy.

  links:
    - { rel: caused_by, to: "explain:concept:mtu.overhead" }
    - { rel: see_also,  to: "explain:concept:mtu.three-fixes" }
    - { rel: see_also,  to: "explain:concept:mtu.pmtud-and-df" }

  sources:
    - { card: "srx-ipsec", side: 4, block: "THE MTU STORY" }
    - { card: "srx-ipsec", side: 4, block: "TEST IT FROM THE BOX" }

  terminal: true

- id: explain:symptom:encrypted-climbing-decrypted-flat
  class: symptom
  subject: { path: encrypted-climbing-decrypted-flat }
  title: "Encrypted climbing, decrypted flat"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "up-ness"

  terse: "Encrypted climbing, decrypted flat. Nothing is coming back."

  explained: >
    Your ESP is leaving and nothing is returning. That is a return-path or
    far-end problem, not a crypto problem. Stop reading proposals — crypto that
    is wrong fails symmetrically, and this is not symmetric.

  teaching:
    body: >
      The asymmetry is the entire diagnostic. A wrong key, a wrong proposal or a
      wrong PFS group prevents the SA installing at all, or prevents decryption
      in both directions. Traffic leaving with nothing returning means the SAs
      are correct and something else is wrong.

      What is left: a missing return route at the far end, a policy that exists
      in one direction only, a source-NAT rule rewriting your source so the peer
      replies to an address that cannot come back, or a far-end device that is
      dropping the traffic after decryption.

      Source NAT is the one worth checking on your own box first, because it is
      yours. The interface NAT rule for internet-bound traffic also grabs
      packets routed at st0 — the far end sees the wrong source and rejects the
      selector, and it needs an explicit no-NAT rule above it.

      The related counter reading: ESP authentication failures with traffic
      still flowing usually means corruption in path, not a key mismatch. A
      wrong key fails everything, not some of it.

    breaks_if_wrong: >
      Reading this as crypto means changing proposals on a tunnel whose crypto
      is provably correct, and the change breaks the working direction as well
      as failing to fix the broken one.

    misdiagnosed_as: >
      A proposal or key mismatch, because the tunnel is not working and that is
      where tunnels usually fail. The counters rule it out before any
      configuration is opened.

  links:
    - { rel: caused_by, to: "explain:concept:ipsec.one-way-tell" }
    - { rel: see_also,  to: "explain:symptom:up-but-zero-traffic" }

  sources:
    - { card: "srx-ipsec", side: 3, block: "THE ONE-WAY TELL" }
    - { card: "srx-ipsec", side: 4, block: "THINGS THAT BITE" }

  terminal: true

- id: explain:symptom:works-then-stops-after-quiet
  class: symptom
  subject: { path: works-then-stops-after-quiet }
  title: "Works, then stops after N minutes of quiet"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "why it exists"

  terse: "Dies after a quiet period. Recovers at the next rekey."

  explained: >
    The NAT device's UDP idle timer is shorter than the keepalive, so the
    mapping dies and the tunnel goes one-way until the next rekey. It correlates
    with idleness rather than with load, which rules out every throughput theory
    immediately.

  teaching:
    body: >
      Note the N. A tunnel that dies after a consistent quiet interval and comes
      back on its own is a NAT idle timer, not a crypto problem and not a
      firewall policy.

      ESP is IP protocol 50 with no ports, so a device doing port translation
      cannot track it. IKE detects NAT during Phase 1 and both peers move to UDP
      4500, wrapping ESP in UDP. That UDP flow is now a state entry in a device
      you probably do not control.

      If that device's idle timer is shorter than `nat-keepalive`, the mapping is
      reaped during a quiet period. Return traffic then has no translation to
      arrive through, and the tunnel is one-way until the next rekey rebuilds the
      flow.

      Confirm NAT-T is actually in play first: remote port 4500 in the Phase 1
      SA detail. If the port is 500 there is no mapping to expire and this is
      not your symptom.

    breaks_if_wrong: >
      The tunnel recovers by itself, so the outage is intermittent and
      self-healing, which is the hardest shape to get anybody to investigate. It
      is also invisible during business hours on a busy tunnel and appears
      overnight or at weekends.

    misdiagnosed_as: >
      An intermittent circuit. It recovers without intervention, so the ticket
      goes to the carrier, and the carrier's tests find a clean link because the
      link is clean.

  links:
    - { rel: caused_by, to: "explain:concept:ipsec.nat-traversal" }
    - { rel: see_also,  to: "explain:concept:ike.liveness" }

  sources:
    - { card: "srx-ipsec", side: 2, block: "NAT TRAVERSAL" }

  terminal: true

