- id: explain:symptom:flap-only-when-idle
  class: symptom
  subject: { path: flap-only-when-idle }
  title: "Cycles only when the tunnel is idle"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
