  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "what the log means"
  terse: "It only appears in the log when nothing is using it."
  explained: >
    `establish-tunnels on-traffic`, by design. The default negotiates only when
    a packet is routed at st0, so an idle backup cycles in the log and comes up
    the first time something uses it. Set `immediately` for anything monitored.
