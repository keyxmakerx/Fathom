- id: explain:symptom:flap-only-under-load
  class: symptom
  subject: { path: flap-only-under-load }
  title: "Drops only under load"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "what the log means"
  terse: "Fine when quiet, drops when busy."
  explained: >
    MTU, or `lifetime-kilobytes`. If flaps track throughput rather than time,
    check the volume-based lifetime first — a volume trigger looks exactly like
    an erratic timer. If sessions stall rather than the tunnel dropping, it is
