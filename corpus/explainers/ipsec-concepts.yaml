- id: explain:symptom:esp-auth-failures-traffic-flowing
  class: symptom
  subject: { path: esp-auth-failures-traffic-flowing }
  title: "Integrity failures while traffic still flows"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "up-ness"

  terse: "Some packets fail integrity. Most get through."

  explained: >
    Corruption in path, not a key mismatch — a wrong key fails everything, not
    some of it. Partial failure is a physical-layer story, so check the WAN
    interface error counters before anything in the crypto configuration.

  teaching:
    body: >
      The reasoning here is short and it eliminates a whole investigation.
      Integrity checking is deterministic: if the key is wrong, every packet
      fails. A counter that rises while traffic continues to flow means most
      packets are verifying correctly, which means the key is right.

      What is left is corruption between the two ends — a marginal link, a
      failing optic, a device rewriting something it should not.

      The counter to read alongside it is replay. Both rise on a path that is
      damaging or reordering packets, and both connect to a third symptom:
      lost DPD probes on that same path tear the tunnel down, which then looks
      like a crypto failure in the log.

      One physical problem, three counters, three different-looking symptoms.
      Check the underlay before you check anything else.

    breaks_if_wrong: >
      Reading a partial integrity failure as a key mismatch means coordinating a
      key change with the far end for a tunnel whose key is provably correct,
      and the change costs a maintenance window and fixes nothing.

    misdiagnosed_as: >
      A key mismatch, because the counter has the word authentication in it and
      authentication is where keys live. The partiality is the tell and it is
      what people skip past.

  links:
    - { rel: caused_by, to: "explain:concept:ipsec.one-way-tell" }
    - { rel: see_also,  to: "explain:concept:ipsec.replay-window" }

  sources:
    - { card: "srx-ipsec", side: 3, block: "STATISTICS & COUNTERS" }
    - { card: "srx-ipsec", side: 4, block: "REPLAY ERRORS" }

  terminal: true


