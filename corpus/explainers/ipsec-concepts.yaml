- id: explain:error:junos-srx/IKE-ID-VALIDATION-FAILED
  class: error
  subject: { platform: junos-srx, verbatim: "IKE-ID validation failed" }
  verbatim: "IKE-ID validation failed"
  title: "peer's IKE-ID validation failed"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "most-missed"

  note:
    level: caution
    text: >
      The id is a slug. The string this box prints is in `verbatim` and it is
      what you grep for — it contains spaces and mixed case and is not an
      all-caps token like the rest of the decoder. See E1 at the top of this
      file.

  terse: "local-identity against remote-identity. Not the key."

  explained: >
    The specific form of an authentication failure. It names the field: what
    this end called itself is not what the far end was configured to accept, or
    the reverse. Compare the two strings byte for byte before changing anything
    else.

  teaching:
    body: >
      When the box gives you this string rather than a bare
      AUTHENTICATION_FAILED, it has already done the narrowing for you. The
      credential is not the problem. The identity is.

      The values are compared, not resolved. An FQDN identity is the literal
      string the peer sends, not an address that resolves to the same host, and
      an inet identity is the value configured rather than the address observed
      on the wire.

      The commonest origin is NAT. Your outer source address is rewritten in
      flight, the peer's remote-identity was set to the address it expected to
      see, and the two no longer agree — with nothing about the key having
      changed and nothing in your configuration having moved.

      Which end reports it tells you which pair is wrong. Getting local-identity
      wrong breaks you at the far end, where you cannot see the log. Getting
      remote-identity wrong breaks the peer at your end, where you can.

    breaks_if_wrong: >
      Phase 1 never completes and there is no Phase 2 to look at, so every
      Phase 2 parameter is untestable. Behind NAT the failure can appear months
      after a working build, when a translation changes and no local
      configuration has moved.

    misdiagnosed_as: >
      A wrong pre-shared key, despite the string naming the identity. The word
      "validation" reads as generic authentication, and the PSK is the reflex.
      Check identity before you re-type the PSK.

  links:
    - { rel: prerequisite, to: "explain:concept:ike.peer-identity" }
    - { rel: see_also,     to: "explain:error:junos-srx/AUTHENTICATION_FAILED" }
    - { rel: see_also,     to: "explain:concept:ipsec.nat-traversal" }

  sources:
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { card: "srx-ipsec", side: 2, block: "PEER IDENTITY" }
  sources_note: >
    The exact bytes in `verbatim` are the card's transcription of the log
    string. Not observed on a box for this corpus. Gate P14 must check it
    against a real capture before shipping — a typo here is invisible to a
    reviewer and fatal to a grep.

  terminal: true

- id: explain:error:junos-srx/INVALID_SPI
  class: error
  subject: { platform: junos-srx, verbatim: "INVALID_SPI" }
  verbatim: "INVALID_SPI"
  title: "Bad SPI / INVALID_SPI"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "what the log means"

  terse: "ESP arriving for an SA we no longer hold."

  explained: >
    Brief after a flap is normal — the peer is still sending under the old SA
    while this end has moved on. Persistent means rekey out of step, where one
    side keeps installing new SAs the other is not following.

  teaching:
    body: >
      An SPI identifies a specific security association. Receiving ESP under an
      SPI this box no longer holds means the sender's view of the SA state is
      ahead of or behind this end's.

      Brief bursts after a flap are expected and mean nothing. The peer was
      mid-transmission when the SA went away, those packets arrive, and there is
      nothing to decrypt them with.

      Persistent counts are a different story: rekey out of step. One side is
      installing new SAs on a schedule the other is not following, which happens
      when lifetimes disagree in a way that matters, when a rekey collision
      leaves both ends holding different survivors, or when one end clears SAs
      the other keeps using.

      The reading discipline is duration, not magnitude. A large count that
      stopped is a flap you already know about. A small count that keeps rising
      is a live problem.

    breaks_if_wrong: >
      Persistent SPI errors mean traffic is being dropped continuously in one
      direction while the SA output looks healthy on both ends, because each end
      holds a valid SA — the two are not the same one.

    misdiagnosed_as: >
      An attack or corruption. An unrecognised SPI reads as an injected packet,
      and the investigation goes to the wire rather than to the rekey schedule.

  links:
    - { rel: prerequisite, to: "explain:concept:ipsec.error-decoder" }
    - { rel: see_also,     to: "explain:concept:ipsec.lifetimes-and-rekey" }
    - { rel: see_also,     to: "explain:concept:ipsec.replay-window" }

  sources:
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { std: "RFC 4303", section: "2.1", note: "Security Parameters Index" }

  terminal: true

