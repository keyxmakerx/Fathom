# =============================================================================
# Fathom explainer corpus — IPsec concepts, errors and symptoms
# =============================================================================
#
# PROVENANCE
#   Every entry is derived from the project owner's four-side SRX IPsec field
#   card (`.context/field-card-srx-ipsec.txt`). Teaching depth is, in most
#   entries, a **rearrangement of the card rather than a rewrite of it** —
#   which is the strongest available evidence for 15-explainer-corpus.md §4.4's
#   claim that the card is already written at Teaching depth and that Terse and
#   Explained are the two depths somebody has to produce.
#
#   REQUIRES EXPERT REVIEW BEFORE SHIPPING. `reviewed_by` and
#   `voice_reviewed_by` are placeholders; invariant 10 is not satisfied until a
#   named human replaces them, and 15 §7.2 stage 4 requires the voice review to
#   be a separate pass by a separate person. No entry carries
#   `grounding: observed`, because nobody on this side of the corpus has run
#   anything on a box — every entry is `derived` or `documented`, and
#   `verified_against` is therefore absent throughout.
#
# =============================================================================
# SCHEMA FIT — WHERE THE CARD DID NOT GO IN CLEANLY
# =============================================================================
#
# 15 §6.1 says one file per entry under `explain/<class>/`. This is a bundle;
# `fathom-explain split` writes `entries[i]` to
# `explain/<class>/<subject>.yaml`. Not a proposed change to §6.1.
#
#  E1. **The `error` id grammar cannot express the card's most valuable error
#      string.** §2.4 gives `error := platform "/" TOKEN [ "." qualifier ]`, and
#      §2.3 requires the token to be byte-identical to device output. The card's
#      ERROR DECODER contains `IKE-ID validation failed` — mixed case, spaces,
#      no underscores. It is not a TOKEN and it is the single most
#      misdiagnosed string on the card.
#      RESOLVED HERE by giving the entry a slug id
#      (`explain:error:junos-srx/IKE-ID-VALIDATION-FAILED`) plus a **new
#      required `verbatim` field** carrying the exact bytes. The slug is what
#      you type; `verbatim` is what you grep for, and gate P14 should check
#      `verbatim`, not the id.
#      **PROPOSED CHANGE to 15 §2.4 and §6.2:** add `verbatim` as required for
#      `class: error`, and relax the id subject to a slug derived from it.
#
#  E2. **The ERROR DECODER table mixes two classes and the schema is right to
#      separate them.** Six of its eight rows are log tokens. Two are not:
#      "Phase-1 timeout, no response" is a *condition you observe*, not a string
#      the box prints, and "Bad SPI / INVALID_SPI" is one of each. Filing the
#      first as an `error` would put a phrase in the error registry that no grep
#      will ever match. It is `explain:symptom:p1-timeout-nothing-in-log` here.
#      The card can mix them because a human reads the left column as "what you
#      have". A retrieval index cannot.
#
#  E3. **Terse's 6–16 word floor is wrong for the `symptom` class.** §4.1 sets
#      6–16 words and §2.3 says a symptom's terse is written as an observation
#      rather than a statement. The card's own observations are shorter than the
#      floor: *"Tunnel UP, zero traffic"* is four words and is perfect. Padding
#      it to six damages it.
#      **PROPOSED:** floor of 3 words for `class: symptom`, 6 elsewhere. Several
#      symptom entries here sit at 5–7 words and the shortest are the best ones.
#
#  E4. **Two card blocks are tables, not prose, and Teaching depth cannot be a
#      rearrangement of them.** ERROR DECODER and FLAP PATTERN → CAUSE are
#      two-column lookup tables — the design language names that shape as the
#      model for every diagnostic view. Their `teaching.body` in
#      `explain:concept:ipsec.error-decoder` and
#      `explain:concept:ipsec.flap-patterns` is **synthesised**, not lifted, and
#      those two entries are the only places in this bundle where that is true.
#      They are flagged with `grounding: derived` and a `sources_note`, and they
#      are the two entries a reviewer should read hardest.
#
#  E5. **`subject` map shapes are unspecified for `concept`, `symptom` and
#      `error`.** §6.2 requires `subject` to be a "class-dependent map" and only
#      §4.4 shows one, for `field`. Shapes assumed here, and they need
#      ratifying:
#        concept: { path: <dotted> }
#        symptom: { path: <dotted> }
#        error:   { platform: <id>, verbatim: <exact bytes>, qualifier: <p1|p2|v1|v2> }
#
#  E6. **`explains_part_of` must not cycle (G5) and the card's own structure
#      does.** PFS explains part of the phase split; the phase split's most
#      useful statement is about Phase 2 failing while Phase 1 holds, which is
#      what PFS does. Resolved by making `ipsec.phase-split` a `prerequisite` of
#      almost everything and never a child of anything — it is the root, and it
#      is `terminal: true`. Every traversal in this bundle reaches a terminal in
#      at most two hops.
#
#
#  E7. **`merely` is on the banned-phrase list and the card's most-quoted
#      sentence needs it.** 63 §11.1's list, which 15 §9.3 inherits, bans
#      `merely`; the card writes *"The group must be identical both ends, not
#      merely compatible"* (side 2). Two entries here keep it —
#      `explain:concept:ipsec.pfs` and
#      `explain:error:junos-srx/INVALID_KE_PAYLOAD` — and will fail gate P3.
#      Same proposed fix as the rule-pack seed's G7: extend the documented
#      exception mechanism (which already exists for `seamless`) to `merely`,
#      scoped to the phrase "not merely compatible". Every other occurrence in
#      this bundle was rewritten out rather than excepted.
#
# =============================================================================

corpus_bundle:
  id: fathom.explain/ipsec
  bundle_version: 0.1.0
  entry_count: 41
  classes_used: [concept, error, symptom]
  derived_from:
    card: "srx-ipsec"
    sides: [1, 2, 3, 4]
  review_status: >
    UNREVIEWED. Placeholders for reviewed_by and voice_reviewed_by. No entry is
    grounding: observed. The two synthesised entries (error-decoder,
    flap-patterns) need the hardest review.

entries:

# =============================================================================
# CONCEPTS — the root
# =============================================================================

- id: explain:concept:ipsec.phase-split
  class: concept
  subject: { path: ipsec.phase-split }
  title: "Two phases, two jobs"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]     # the split is protocol, not vendor
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "read this first"

  terse: "Phase 2 rides inside Phase 1. They fail independently."

  explained: >
    IKE negotiates on UDP 500, or 4500 through NAT, and builds one secure
    channel. Inside it, Phase 2 negotiates the data tunnel and its traffic
    selectors. ESP then carries the data as IP protocol 50. Read the two with
    two separate commands, always.

  teaching:
    body: >
      Phase 1 authenticates the peers and builds one secure channel, the IKE SA.
      Phase 2 runs inside that channel and negotiates the data tunnel and its
      traffic selectors, the IPsec SA. IKE is the negotiation; IPsec is the
      encrypted tunnel that carries data.

      Phase 2 rides inside Phase 1. Phase 1 can be perfectly healthy while Phase
      2 fails forever — that split is the most useful diagnostic fact there is.

      It is useful because of how much it eliminates. If Phase 1 is up, the peer
      address is right, the WAN zone admits IKE, the pre-shared key or
      certificate matched, the Phase 1 proposal matched, and the identities
      agreed. All of that is settled, and none of it needs checking again. What
      remains is the Phase 2 proposal, the PFS group, the selectors, and
      everything downstream of the crypto: the zone, the route, the policy.

      That is why the verify ladder has separate rungs for the two phases and
      why every diagnostic on the card starts by establishing which half you are
      in.

    breaks_if_wrong: >
      Treating the two as one thing sends you back over settled ground. A tunnel
      with healthy Phase 1 and a dead Phase 2 gets its pre-shared key re-typed,
      its peer address rechecked and its WAN zone reviewed, none of which can
      possibly be wrong, while the selector mismatch that is actually breaking
      it goes unexamined.

    misdiagnosed_as: >
      A key or connectivity problem. Phase 1 is where authentication lives, so
      "the tunnel is down" reads as "the peers cannot agree", and the afternoon
      goes into credentials that already worked.

  links:
    - { rel: see_also, to: "explain:concept:ipsec.object-chain" }
    - { rel: see_also, to: "explain:concept:ipsec.bring-up-order" }
    - { rel: causes,   to: "explain:symptom:flap-p2-cycles-p1-solid" }

  sources:
    - { card: "srx-ipsec", side: 1, block: "TWO PHASES, TWO JOBS" }
    - { std: "RFC 7296", section: "1.2", note: "IKE_SA_INIT then IKE_AUTH; the initial exchanges" }
    - { std: "RFC 7296", section: "1.3", note: "CREATE_CHILD_SA — child SAs are created inside the IKE SA" }

  terminal: true

- id: explain:concept:ipsec.object-chain
  class: concept
  subject: { path: ipsec.object-chain }
  title: "The object chain"
  entry_version: 1.0.0
  status: active
  platforms: [junos-srx]
  versions: "*"
  grounding: derived
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "why it exists"

  terse: "Six named objects. Knowing which owns a knob says where to look."

  explained: >
    Phase 1 runs ike proposal to ike policy to ike gateway. Phase 2 runs ipsec
    proposal to ipsec policy to ipsec vpn, and the vpn joins back to the
    gateway. Each references the one before it by name, and Junos checks those
    names at commit.

  teaching:
    body: >
      Junos builds a VPN from six named objects, each referencing the one before
      it by name. Knowing which object owns a knob tells you where to look.

      Phase 1: the proposal holds the algorithms, dh-group and lifetime. The
      policy holds the mode and the pre-shared key. The gateway holds the peer
      address, the external interface, the version, dead-peer-detection and the
      identities.

      Phase 2: the proposal holds protocol, algorithms and lifetime. The policy
      holds perfect-forward-secrecy. The vpn holds the gateway reference, the
      ipsec-policy reference, bind-interface, traffic-selector,
      establish-tunnels, df-bit and vpn-monitor.

      Junos enforces these references at commit — a missing policy name fails
      the commit. What it cannot catch is a name that exists but holds values
      the far end will not accept. That failure waits for negotiation.

      The practical use is triage. INVALID_KE_PAYLOAD is a dh-group question, so
      open the proposal. A flap on a round-number interval is a
      dead-peer-detection question, so open the gateway. A tunnel up with no
      traffic is not in this hierarchy at all.

    breaks_if_wrong: >
      Without the map you open the whole `security ike` and `security ipsec`
      hierarchies and read them top to bottom, which turns a five-minute
      question into an afternoon and makes it likely you miss the one statement
      that is absent rather than wrong.

    misdiagnosed_as: >
      A syntax problem. A configuration that commits cleanly feels validated, so
      when negotiation fails people re-read the syntax rather than comparing
      values against the peer.

  links:
    - { rel: prerequisite, to: "explain:concept:ipsec.phase-split" }
    - { rel: see_also,     to: "explain:concept:ipsec.plumbing" }
    - { rel: see_also,     to: "explain:concept:ipsec.error-decoder" }

  sources:
    - { card: "srx-ipsec", side: 1, block: "THE OBJECT CHAIN" }
    - { card: "srx-ipsec", side: 1, block: "PHASE 1 — PROPOSAL, POLICY, GATEWAY" }
    - { card: "srx-ipsec", side: 1, block: "PHASE 2 — PROPOSAL, POLICY, VPN" }

  terminal: true

- id: explain:concept:ipsec.pfs
  class: concept
  subject: { path: ipsec.pfs }
  title: "Perfect forward secrecy"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "most-missed"

  terse: "Fresh DH per Phase 2. Identical both ends, not merely compatible."

  explained: >
    Without PFS the Phase 2 keys derive from Phase 1 key material, so one
    compromised IKE SA secret unlocks every data key under it. With PFS each
    Phase 2 negotiation runs its own Diffie-Hellman exchange. Set the same group
    both ends and confirm it in the SA detail output.

  teaching:
    body: >
      Without PFS, the Phase 2 keys are derived from the Phase 1 key material.
      One compromised IKE SA secret unlocks every data key derived under it —
      including traffic somebody recorded off the wire months ago.

      With PFS, each Phase 2 negotiation runs its own fresh Diffie-Hellman
      exchange. The key is mathematically independent of Phase 1 and of every
      previous Phase 2 key, so breaking one yields exactly one rekey interval of
      traffic and nothing either side of it. That is the "forward" in forward
      secrecy: today's break cannot read yesterday's capture.

      Three rules. The group must be identical both ends, not merely compatible.
      PFS on one side and absent on the other fails Phase 2 while Phase 1 stays
      up. And the PFS group need not equal the Phase 1 dh-group, though matching
      them removes a whole class of confusion.

      Cost is one extra DH exponentiation per SA per rekey — irrelevant unless
      hundreds of tunnels rekey together. Turn it on.

    breaks_if_wrong: >
      PFS configured on one side and absent on the other fails Phase 2 while
      Phase 1 stays up and stays up. A group mismatch — group14 against group19 —
      fails the same way and reports INVALID_KE_PAYLOAD rather than
      NO_PROPOSAL_CHOSEN.

    misdiagnosed_as: >
      A wrong pre-shared key. Phase 1 is clean, so the key is the next suspect
      and the afternoon goes into re-typing it on both ends. The key is fine.
      Check Phase 2 before you touch Phase 1.

    rules_out: >
      Under IKEv2 the first child SA is always keyed from the IKE SA regardless;
      PFS applies to later child rekeys. A capture of the initial bring-up
      showing no DH exchange is not a misconfiguration and is not evidence that
      PFS is off.

  links:
    - { rel: prerequisite,   to: "explain:concept:ipsec.phase-split" }
    - { rel: see_also,       to: "explain:concept:ipsec.lifetimes-and-rekey" }
    - { rel: causes,         to: "explain:symptom:flap-p2-cycles-p1-solid" }
    - { rel: next_if_bad,    to: "explain:error:junos-srx/INVALID_KE_PAYLOAD" }

  sources:
    - { std: "RFC 7296", section: "1.3", note: "CREATE_CHILD_SA may carry a KE payload for a fresh Diffie-Hellman" }
    - { std: "RFC 8247", section: "2.4", note: "group14 MUST; group19 SHOULD; groups 2 and 5 SHOULD NOT" }
    - { card: "srx-ipsec", side: 2, block: "PERFECT FORWARD SECRECY" }

  terminal: true

- id: explain:concept:ipsec.lifetimes-and-rekey
  class: concept
  subject: { path: ipsec.lifetimes-and-rekey }
  title: "Lifetimes and rekey"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "why it exists"

  terse: "Rekey is invisible when healthy. A drop at the boundary is a collision."

  explained: >
    Junos rekeys on a soft lifetime shortly before the hard one expires, so
    there is no gap. Soft is hard minus a random jitter, which is why rekeys
    drift and never land on the same second twice. Conventional values are
    28800 for Phase 1 and 3600 for Phase 2.

  teaching:
    body: >
      Under IKEv1 lifetimes are negotiated and the lower value wins. Under IKEv2
      they are not negotiated at all — each side rekeys on its own clock and the
      shorter side drives it, so a mismatch is legal and not an error. There is
      also lifetime-kilobytes, which rekeys on volume, so a busy tunnel rekeys
      far more often than the clock suggests.

      In the card's words, "Healthy rekey is seamless" — the SA index changes
      and traffic does not stop. A tunnel that goes down at the lifetime
      boundary is a rekey collision or a peer refusing the new SA, not a timer
      that needs raising.

      That last sentence is the whole point of this entry. Raising the lifetime
      is the instinctive response and it makes the failure rarer rather than
      absent, and a rare failure is harder to catch than a frequent one.

      If flaps track throughput rather than time, check lifetime-kilobytes
      first: a volume trigger looks exactly like an erratic timer, and the two
      are diagnosed completely differently.

    breaks_if_wrong: >
      A rekey collision drops the tunnel at a clean interval equal to the
      lifetime, and raising the lifetime moves the outage further apart rather
      than removing it. Under IKEv1 a negotiated mismatch means the number in
      your configuration is not the interval you are actually seeing.

    misdiagnosed_as: >
      A timer that is set too aggressively. The flap lands on a round number, so
      the number gets raised, the failure recurs less often, and everybody
      concludes the change partly worked.

  links:
    - { rel: prerequisite, to: "explain:concept:ipsec.phase-split" }
    - { rel: see_also,     to: "explain:concept:ike.version-choice" }
    - { rel: causes,       to: "explain:symptom:flap-even-interval-round-number" }
    - { rel: causes,       to: "explain:symptom:flap-only-under-load" }

  sources:
    - { card: "srx-ipsec", side: 2, block: "LIFETIMES & REKEY" }
    - { card: "srx-ipsec", side: 3, block: "FLAP PATTERN → CAUSE" }
    - { std: "RFC 7296", section: "2.8", note: "Rekeying" }
    - { std: "RFC 7296", section: "2.8.2", note: "Simultaneous IKE SA rekeying — the collision case" }

  terminal: true

- id: explain:concept:ike.version-choice
  class: concept
  subject: { path: ike.version-choice }
  title: "IKEv1 versus IKEv2"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "why it exists"

  terse: "v2 protects identity, has many selectors, and needs no mode."

  explained: >
    IKEv1 is main mode in six messages or aggressive in three, with one
    proxy-ID pair and DPD bolted on. IKEv2 is one four-message exchange with
    identity always protected, many traffic selectors, and liveness built in.
    Under v2-only the mode statement is silently ignored.

  teaching:
    body: >
      The version changes what the rest of the configuration means, which is why
      it is worth settling before anything else.

      Lifetimes: negotiated under v1 with the lower value winning; not
      negotiated at all under v2, where each side rekeys on its own clock.

      Selectors: one proxy-ID pair under v1, and a mismatch reads
      INVALID_ID_INFORMATION. Many selectors under v2, and a mismatch reads
      TS_UNACCEPTABLE. Two error strings for one cause, and which you get tells
      you which version you are on.

      Identity: in the clear under aggressive mode, always protected under v2.
      Aggressive mode exists almost solely for a pre-shared key with a dynamic
      peer IP, because main mode with a PSK must identify the peer by address.
      It leaks the identity and is offline-crackable. On v2 you never need it.

      And the one that saves the most wasted time: mode is silently ignored
      under v2-only. Seeing mode aggressive in a v2 config means nothing — do
      not chase it.

    breaks_if_wrong: >
      A peer pinned to v2-only against a peer that speaks only v1 never
      negotiates, and the failure looks like an unreachable peer rather than a
      version disagreement. Under v1, a dynamic peer with a pre-shared key is
      forced into aggressive mode whether anybody wrote the statement or not.

    misdiagnosed_as: >
      A security finding that is not there. `mode aggressive` left over from a
      v1 migration reads as an identity exposure on a v2 gateway, and an hour
      goes into an exposure that does not exist.

  links:
    - { rel: prerequisite, to: "explain:concept:ipsec.phase-split" }
    - { rel: see_also,     to: "explain:concept:ike.peer-identity" }
    - { rel: see_also,     to: "explain:concept:ipsec.lifetimes-and-rekey" }
    - { rel: contrasts_with, to: "explain:error:junos-srx/TS_UNACCEPTABLE" }

  sources:
    - { card: "srx-ipsec", side: 2, block: "IKEV1 VS IKEV2" }
    - { std: "RFC 2409", section: "5.4", note: "Main mode with a pre-shared key identifies the peer by address" }
    - { std: "RFC 7296", section: "1.2", note: "IKEv2 initial exchanges; IDi and IDr are encrypted" }

  terminal: true

- id: explain:concept:ike.peer-identity
  class: concept
  subject: { path: ike.peer-identity }
  title: "Peer identity"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "most-missed"

  terse: "Check identity before you re-type the PSK."

  explained: >
    Identity statements are needed when the peer cannot identify you by your
    outer source IP: behind NAT, on a dynamic address, with certificate
    authentication, or against a peer expecting an FQDN or email-style ID. Your
    local-identity must equal the peer's remote-identity, exactly.

  teaching:
    body: >
      By default an IKE peer identifies itself by its address, and that works
      until something rewrites the address or the peer expects a different kind
      of name. Then you need local-identity and remote-identity, set as a
      matching pair across the two boxes.

      The values are compared, not resolved. An FQDN identity is the literal
      string the peer sends, not an address that resolves to the same host.

      `dynamic hostname` replaces `address` for peers with no fixed IP. Under
      IKEv1 that combination also forces aggressive mode, so a dynamic peer with
      a pre-shared key on v1 exposes its identity whether or not anybody wrote
      `mode aggressive`.

      The reason this concept matters more than its size suggests is the error
      it produces. A mismatch reads as `peer's IKE-ID validation failed` or a
      bare AUTHENTICATION_FAILED — easily misread as a wrong pre-shared key.
      Check identity before you re-type the PSK.

    breaks_if_wrong: >
      Phase 1 never completes, so there is no Phase 2 to examine and every
      Phase 2 parameter is irrelevant. Behind NAT the failure can appear months
      after the build, when a translation changes and no local configuration has
      moved at all.

    misdiagnosed_as: >
      A wrong pre-shared key, then a broken certificate chain. Both are
      expensive to change and neither is the problem. Identity and clock skew are
      free to check and produce the same error string.

  links:
    - { rel: prerequisite,  to: "explain:concept:ipsec.phase-split" }
    - { rel: see_also,      to: "explain:concept:ipsec.nat-traversal" }
    - { rel: see_also,      to: "explain:concept:ike.version-choice" }
    - { rel: next_if_bad,   to: "explain:error:junos-srx/IKE-ID-VALIDATION-FAILED" }
    - { rel: next_if_bad,   to: "explain:error:junos-srx/AUTHENTICATION_FAILED" }

  sources:
    - { card: "srx-ipsec", side: 2, block: "PEER IDENTITY" }
    - { card: "srx-ipsec", side: 3, block: "ERROR DECODER" }
    - { std: "RFC 7296", section: "1.2", note: "IDi and IDr are asserted in IKE_AUTH" }

  terminal: true

- id: explain:concept:ike.liveness
  class: concept
  subject: { path: ike.liveness }
  title: "Dead peer detection"
  entry_version: 1.0.0
  status: active
  platforms: ["*"]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-07-28
  voice_reviewed_by: <named human>
  tab: "up-ness"

  terse: "Dead after interval times threshold. Junos defaults to 10 by 5."

  explained: >
    `optimized` probes only when we are sending and hearing nothing back, and is
    the default. `probe-idle-tunnel` probes when idle too. `always-send` probes
    every interval regardless, which is what a backup you need to trust
    requires. Ten by three is a reasonable middle.

  teaching:
    body: >
      Time to declare a peer dead is interval times threshold. Junos defaults to
      10 times 5, which is 50 seconds of blackhole before failover even starts —
      longer than most people assume when they leave it alone.

      Too tight and a two-second underlay hiccup tears down a healthy tunnel,
      and you then spend a week debugging self-inflicted flaps. Too loose and
      traffic pours into a dead tunnel. Ten times three is a reasonable middle.

      One structural fact that catches people: DPD rides the outer IKE session
      on UDP 500 or 4500, never st0. Silence on st0 does not mean the tunnel is
      dead, and an idle tunnel with `optimized` set is not being probed at all —
      which means an idle backup's state is unknown until the moment you need
      it.

      DPD and vpn-monitor answer different questions. DPD says the peer's
      control plane is alive. vpn-monitor sends traffic through the tunnel and
      says the data path works. A peer whose IKE is healthy while its forwarding
      is broken satisfies the first and fails the second.

    breaks_if_wrong: >
      Set too tight, packet loss on the underlay tears down tunnels that were
      working, at a clean interval equal to interval times threshold. Set too
      loose, traffic disappears into a dead peer for the better part of a minute
      before anything fails over.

    misdiagnosed_as: >
      A crypto or peer problem. The flap interval is a clean round number, so it
      reads as a lifetime mismatch, and a week goes into proposals and timers
      while the actual cause is loss in the underlay.

  links:
    - { rel: prerequisite,   to: "explain:concept:ipsec.phase-split" }
    - { rel: causes,         to: "explain:symptom:flap-interval-equals-dpd-product" }
    - { rel: see_also,       to: "explain:concept:ipsec.replay-window" }
    - { rel: contrasts_with, to: "explain:concept:ipsec.one-way-tell" }

  sources:
    - { card: "srx-ipsec", side: 2, block: "DEAD PEER DETECTION" }
