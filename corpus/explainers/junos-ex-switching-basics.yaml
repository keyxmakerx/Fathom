entries:

- id: explain:concept:junos-ex.switching-basics
  class: concept
  subject: { path: junos-ex.switching-basics }
  title: "How a Junos EX switching config is structured, and why nothing takes effect until commit"
  entry_version: 1.0.0
  status: active
  platforms: [junos-ex]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-09-19
  voice_reviewed_by: <named human>
  tab: "read this first"

  terse: >
    Junos EX switches use the same hierarchical, commit-based Junos CLI as
    every other Junos platform. VLANs are declared once under `vlans`, then
    each port is put in one under `interfaces … family ethernet-switching`.

  explained: >
    A Junos EX switch runs the same Junos OS every other Juniper platform
    does, so its configuration is a single hierarchical tree (`[edit
    system]`, `[edit vlans]`, `[edit interfaces]`, …) edited as a candidate
    and only applied — atomically, all or nothing — on `commit`. What makes
    an EX config specifically a SWITCHING config, rather than a router's or
    a firewall's, is two things: VLANs are named once under `[edit vlans]`
    with a `vlan-id`, and a port joins one under `[edit interfaces
    interface-name unit logical-unit-number family ethernet-switching]` via
    `interface-mode` (access or trunk) and `vlan members`.

  teaching:
    body: >
      Three things explain most of what a config paste from a Junos EX
      switch looks like.

      First, a VLAN's NAME and its membership are declared in two different
      places, and both are needed. `set vlans staff vlan-id 10` creates the
      VLAN and its numeric id; it says nothing yet about which ports carry
      it. A port joins by name, under the port's own unit: `set interfaces
      ge-0/0/1 unit 0 family ethernet-switching vlan members staff`. A VLAN
      with no port lines pointing at it is configured but carries no
      traffic; a port line naming a VLAN that was never declared under
      `vlans` is a dangling reference, not an error the device necessarily
      rejects outright.

      Second, `interface-mode` sets the port's whole behaviour and is
      separate from which VLANs it carries. `interface-mode access` means
      the port speaks one untagged VLAN; `interface-mode trunk` means it can
      carry several, tagged, each named by its own `vlan members` line under
      the same unit. Because these are two different statements, a trunk
      port typically shows one `interface-mode trunk` line followed by
      several `vlan members` lines — reading only the `vlan members` lines
      without the `interface-mode` line above them loses whether the port is
      trunking at all.

      Third, and unlike some other vendors' switches, NOTHING takes effect
      by being typed. Every `set` line edits a CANDIDATE configuration; the
      device validates the whole candidate as one unit and only replaces the
      running configuration with it on `commit`, which is also the point at
      which a syntactically-plausible but semantically-broken candidate (a
      trunk port referencing a VLAN that doesn't exist, for instance) is
      still accepted by Junos's own validation — Junos checks syntax and
      cross-references it understands, not every operational assumption. A
      config paste taken mid-edit, before a `commit`, describes a candidate
      that may never have gone live.

    breaks_if_wrong: >
      Treating `vlan members` as sufficient on its own, without checking for
      an `interface-mode` line on the same unit, misreads an access port as
      untrunked when it may not be (or vice versa). Assuming every `set`
      line in a paste was live traffic-carrying configuration, without
      knowing whether a `commit` happened after it, overstates confidence in
      what the device was actually doing when the paste was taken.

    misdiagnosed_as: >
      "The VLAN is configured but traffic isn't passing" often reads as a
      spanning-tree or trunk-negotiation problem. Frequently it is neither:
      the VLAN exists under `[edit vlans]` but no port's `vlan members` line
      names it, or a trunk port's `interface-mode` was never set to `trunk`
      so it is still in its access default and rejects the tagged traffic
      entirely.

  sources:
