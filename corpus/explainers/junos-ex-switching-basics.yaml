#   - Juniper Networks, "Enhanced Layer 2 Software (ELS)" and "Configuring
#     VLANs for EX Series Switches" — search synthesis, read 2026-09-19: EX
#     switches run Junos OS with the ELS command set (`interface-mode`,
#     `family ethernet-switching`), distinct from the older, deprecated
#     `port-mode`/bridge-domain syntax of pre-ELS switches; VLANs are
#     declared once under `[edit vlans]` with a name and `vlan-id`, then
#     ports are put in that VLAN under `[edit interfaces]`, not under the
#     VLAN stanza itself.
#   - Juniper Networks, "Understanding Bridging and VLANs on Switches" and
#     "interface-mode" CLI reference — search synthesis, read 2026-09-19: a
#     port's `family ethernet-switching interface-mode` is `access` (one
#     untagged VLAN) or `trunk` (several, carried tagged, selected by `vlan
#     members`); this is a per-UNIT statement and is independent of how many
#     `vlan members` lines follow it.
#   - Juniper Networks, "commit" and "rollback" CLI reference pages, and the
#     "Junos OS CLI User Guide" — search synthesis, read 2026-09-19: nothing
#     typed at the Junos CLI takes effect until `commit`; the device
#     validates the whole candidate configuration first and refuses the
#     commit as one unit if any part is invalid, and `rollback 0` (or
#     exiting configuration mode without committing) discards the edit
#     entirely. This "no line takes effect on its own" model is the
#     opposite of the line-by-line-live model `corpus/explainers/
