    - { vendor: "Juniper Networks", doc: "interface-mode (CLI reference)", url: "https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/interface-mode-edit-interfaces.html", read_on: "2026-09-19", note: "search synthesis — direct fetch blocked, see file header" }
