# corpus/explainers/linux-debian-basics.yaml — orientation for Debian,
# written in the manner of corpus/explainers/linux-family-basics.yaml (read
# first) and corpus/explainers/arista-eos-basics.yaml (full field convention).
#
# `reviewed_by`/`voice_reviewed_by: <named human>` are placeholders (invariant
# 10): unreviewed until a named human vouches for it.
#
# SOURCES — read 2026-09-19:
#   - `manpages.debian.org/stretch/apt/apt.8.en.html` (Debian's own manpage
#     mirror) and `wiki.debian.org/AptCLI` — `apt install`, `apt remove`,
#     `apt search`, `apt update` (refresh package indexes), `apt upgrade`
#     (install available upgrades, never removing a package), `apt
#     full-upgrade` (the `apt-get dist-upgrade` equivalent: may remove a
#     package if that is what completing the upgrade requires).
#   - `wiki.debian.org/DebianReleases` and `www.debian.org/releases/` —
#     Debian's release life cycle: roughly three years of full support from
#     the Debian security team followed by roughly two years of Debian LTS
#     (a separate team, covering a narrower package set), five years total;
#     a released version continues to receive periodic "point releases"
#     bundling accumulated updates during the full-support window.
#   - `wiki.debian.org/NetworkConfiguration` and `wiki.debian.org/
#     NetworkManager` — three configuration paths coexist: `ifupdown`
#     (`/etc/network/interfaces`) is Debian's traditional default and is
#     what a standard (non-desktop-task) installation still configures;
#     NetworkManager is the default for the Desktop/Laptop installer task
#     and, since Debian 6 "Squeeze", explicitly does not manage an interface
#     already defined in `/etc/network/interfaces`; systemd-networkd is
#     available, configured under `/etc/systemd/network/`, and is documented
#     as an alternative rather than any install task's default.
#   - `www.debian.org/doc/manuals/debian-reference/ch02.en.html` — dpkg/apt
#     relationship: apt is the front end, dpkg the underlying package tool.
#
# WHAT THIS ENTRY DOES NOT CLAIM: it does not recommend a desktop
# environment, panel, or specific configuration front end.
entries:

- id: explain:concept:linux-debian.basics
  class: concept
  subject: { path: linux-debian.basics }
  title: "Debian: apt, point releases inside a five-year cycle, and three coexisting network configuration paths"
  entry_version: 1.0.0
  status: active
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-09-19
  voice_reviewed_by: <named human>
  tab: "read this first"

  terse: >
    Debian releases on a roughly two-year cycle, each supported about five
    years total (full support, then a separate LTS team). `apt` is the
    package manager; a standard install still configures the network with
    `ifupdown` by default, though NetworkManager and systemd-networkd are
    both real, documented alternatives.

  explained: >
    A Debian "stable" release (`bookworm`, `trixie`, …) is a fixed point a
    person can rely on: packages inside it change only for security and
    stability fixes, bundled periodically as point releases, until the next
    stable release replaces it. `apt` is the day-to-day front end over the
    lower-level `dpkg` package tool. Network configuration is where Debian
    is least uniform of the distributions in this bundle: a plain
    (non-desktop) install still configures `ifupdown`
    (`/etc/network/interfaces`) by default, but the Desktop/Laptop installer
    task installs NetworkManager instead, and systemd-networkd is available
    as a third, manually chosen option — three real paths, not one with two
    theoretical alternatives.

  teaching:
    body: >
      Package management: `apt search <term>` searches package
      descriptions; `apt install <pkg>` installs; `apt remove <pkg>`
      removes a package's files but keeps its configuration, `apt purge
      <pkg>` removes the configuration too — a real distinction worth
      reading correctly, not a recommendation of either. Updating the whole
      system is two steps: `apt update` refreshes the package indexes from
      the configured sources, then `apt upgrade` installs available
      upgrades without removing anything; `apt full-upgrade` does the same
      but will remove an installed package if that is what the upgrade as a
      whole requires (dependency changes across a stable-release boundary,
      most commonly).

      Release model: roughly a two-year cadence between stable releases;
      each is fully supported (security team) for about three years, then
      handed to the separate Debian LTS team for about two more years
      covering a narrower package set — five years total, but by two
      different teams with different scope, not one five-year guarantee.

      Network configuration: check `/etc/network/interfaces` first (the
      traditional default, read with `ifquery --list` or simply by
      reading the file) — if it defines an interface, ifupdown owns it and
      NetworkManager will not touch that interface even if installed
      alongside it. If NetworkManager is present, `nmcli device status`
      shows what it manages. If systemd-networkd is enabled, `networkctl
      status` shows its view; its own configuration lives under
      `/etc/systemd/network/`.

      Service manager: systemd (`systemctl`, `journalctl`), the same as
      described in this bundle's family entry.

      Logs: `journalctl`, plus `/var/log/` for anything still logging the
      traditional way (a service that has not adopted the systemd journal
      as its only sink).

    breaks_if_wrong: >
      Assuming NetworkManager controls an interface because it is
      installed, when `ifupdown` already defines that interface in
      `/etc/network/interfaces`, is the most Debian-specific miss — the two
      can coexist on one box, each managing different interfaces, and
      NetworkManager will silently leave an ifupdown-defined interface
      alone rather than fight over it.

    misdiagnosed_as: >
      "NetworkManager isn't working" when the real state is "this interface
      was never NetworkManager's to manage" — checking
      `/etc/network/interfaces` for the interface name first avoids
      chasing a NetworkManager bug that does not exist.

  sources:
    - { vendor: "Debian", doc: "apt(8) manual page", url: "https://manpages.debian.org/stretch/apt/apt.8.en.html", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Debian", doc: "Debian Wiki — AptCLI", url: "https://wiki.debian.org/AptCLI", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Debian", doc: "Debian Wiki — DebianReleases", url: "https://wiki.debian.org/DebianReleases", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Debian", doc: "Debian -- Debian Releases", url: "https://www.debian.org/releases/", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Debian", doc: "Debian Wiki — NetworkConfiguration", url: "https://wiki.debian.org/NetworkConfiguration", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Debian", doc: "Debian Wiki — NetworkManager", url: "https://wiki.debian.org/NetworkManager", read_on: "2026-09-19", note: "direct read" }

  terminal: true
