# corpus/explainers/linux-arch-basics.yaml — orientation for Arch Linux,
# written in the manner of corpus/explainers/arista-eos-basics.yaml (see
# that file's header for the full field-by-field convention) and
# corpus/explainers/linux-family-basics.yaml (read first).
#
# `reviewed_by`/`voice_reviewed_by: <named human>` are placeholders (invariant
# 10): unreviewed until a named human vouches for it.
#
# SOURCES — read 2026-09-19, direct reads of the Arch Wiki (`wiki.archlinux.org`)
# and the Arch manual pages (`man.archlinux.org`), both primary/vendor
# documentation, not third-party guides:
#   - `wiki.archlinux.org/title/Pacman` — pacman's operations: `-S` sync/
#     install, `-R` remove, `-Q` query the local database, `-Syu` refreshes
#     the local package database (`-y`) and upgrades every out-of-date
#     package (`-u`) in one sync (`-S`); `-Ss` searches the sync databases,
#     `-Qs` searches installed packages.
#   - `wiki.archlinux.org/title/Network_configuration` — Arch ships no single
#     default network manager: systemd-networkd, NetworkManager, netctl,
#     dhcpcd and iwd are all supported and the wiki page presents them as
#     alternatives, with the advice to run only one DHCP client or manager
#     on an interface at a time.
#   - `man.archlinux.org/man/systemd-networkd.8.en` and
#     `wiki.archlinux.org/title/Systemd-networkd` — systemd-networkd is
#     started/enabled as `systemd-networkd.service`; `networkctl status`
#     shows its active state.
#   - `wiki.archlinux.org/title/Netctl` — netctl profiles live under
#     `/etc/netctl/`, with example profiles under `/etc/netctl/examples/`.
#   - `wiki.archlinux.org/title/Systemd/Journal` — the systemd journal is
#     read with `journalctl`; persistent storage under `/var/log/journal/`
#     is opt-in (create the directory), otherwise the journal is volatile
#     under `/run/log/journal/` and lost at reboot — the same behaviour
#     documented distribution-independently by SUSE's own journalctl guide,
#     corroborating the claim across two independent vendor sources.
#   - Arch's own front page and Wikipedia's "Arch Linux" article (search
#     synthesis, corroborating each other): Arch is a rolling-release
#     distribution with no fixed release versions or support windows —
#     there is nothing to "upgrade between", only continuous package
#     updates via pacman.
#
# WHAT THIS ENTRY DOES NOT CLAIM: it does not recommend AUR helpers, desktop
# environments, or any third-party tool. `pacman` and the officially
# documented alternatives above are the platform's own tools.
entries:

- id: explain:concept:linux-arch.basics
  class: concept
  subject: { path: linux-arch.basics }
  title: "Arch Linux: pacman, rolling release, and reading the active network config"
  entry_version: 1.0.0
  status: active
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-09-19
  voice_reviewed_by: <named human>
  tab: "read this first"

  terse: >
    Arch Linux is rolling-release: there are no versioned releases to
    support, only continuously updated packages via `pacman`. Arch installs
    with no default network manager — check which of several the box
    actually runs before assuming one.

  explained: >
    Arch Linux has no numbered releases and no support windows in the sense
    Debian, Fedora or Ubuntu have them — it is a rolling-release
    distribution, and `pacman -Syu` (sync the package database, then
    upgrade) is both "install today's updates" and the closest thing Arch
    has to a release upgrade. The one place Arch is deliberately
    unopinionated is network configuration: the installation guide and wiki
    document systemd-networkd, NetworkManager, netctl and dhcpcd as
    co-equal, supported options, and a minimal Arch install has none of them
    configured until the person installing it chooses one.

  teaching:
    body: >
      Package management: `pacman -S <pkg>` installs; `pacman -R <pkg>`
      removes; `pacman -Ss <term>` searches the sync (repository) databases,
      `pacman -Qs <term>` searches what is already installed; `pacman -Syu`
      updates the whole system — refreshing the package database and
      upgrading every outdated package in one operation, which the wiki
      recommends running together rather than separately to avoid a
      "partial upgrade" (mixing old and new library versions).

      Because there is no default network manager, reading a live box
      starts with asking which one is running, not assuming: `systemctl
      status systemd-networkd NetworkManager` shows which (if either) is
      active; `networkctl status` reads systemd-networkd's own view if it
      is; netctl profiles, if used, live under `/etc/netctl/`.

      Service manager: systemd, the same `systemctl`/`journalctl` pair used
      elsewhere in this bundle's family entry. Logs: `journalctl`, reading
      from `/run/log/journal/` unless persistent storage has been opted
      into at `/var/log/journal/` (the wiki's own systemd/Journal page).

    breaks_if_wrong: >
      Assuming Arch has "a" default network manager the way Ubuntu or
      Fedora does is the most common miss — two Arch installs, set up by
      different people, can legitimately run different tools with no
      misconfiguration on either side. Treating `pacman -Syu` as safe to run
      partially (only `-Sy`, refreshing the database without upgrading) is
      the second: the wiki documents this as the cause of partial-upgrade
      breakage, because newly indexed packages may depend on library
      versions the system has not yet received.

    misdiagnosed_as: >
      "Arch broke my network on update" is more often "no network manager
      was ever configured, or two are fighting over the same interface" —
      Arch's minimalism means nothing manages an interface unless something
      was explicitly enabled to, unlike distributions that configure one by
      default at install.

  sources:
    - { vendor: "Arch Linux", doc: "ArchWiki — pacman", url: "https://wiki.archlinux.org/title/Pacman", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Arch Linux", doc: "ArchWiki — Network configuration", url: "https://wiki.archlinux.org/title/Network_configuration", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Arch Linux", doc: "ArchWiki — systemd-networkd", url: "https://wiki.archlinux.org/title/Systemd-networkd", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Arch Linux", doc: "ArchWiki — netctl", url: "https://wiki.archlinux.org/title/Netctl", read_on: "2026-09-19", note: "direct read" }
    - { vendor: "Arch Linux", doc: "ArchWiki — systemd/Journal", url: "https://wiki.archlinux.org/title/Systemd/Journal", read_on: "2026-09-19", note: "direct read; corroborated independently by SUSE's journalctl administration guide for the persistent-vs-volatile behaviour" }

  terminal: true
