    - { vendor: "networkjutsu.com (third-party blog, not Ubiquiti)", doc: "EdgeOS CLI — show configuration vs. show configuration commands", url: "https://networkjutsu.com/edgeos-cli-introduction/", read_on: "2026-09-19", note: "search synthesis — direct fetch blocked; full trail in corpus/dict/README-ubiquiti.md; the show-configuration/show-configuration-commands distinction rests on this blog alone, not on a Ubiquiti-published source" }
