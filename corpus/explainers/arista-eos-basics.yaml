    - { vendor: "Arista Networks", doc: "EOS User Manual — Command Line Interface", url: "https://www.arista.com/en/um-eos/eos-command-line-interface", read_on: "2026-09-19", note: "search synthesis — direct fetch blocked, see file header" }
