entries:

- id: explain:concept:arista.eos-basics
  class: concept
  subject: { path: arista.eos-basics }
  title: "What EOS is, and how its configuration is structured"
  entry_version: 1.0.0
  status: active
  platforms: [eos]
  versions: "*"
  grounding: documented
  reviewed_by: <named human>
  reviewed_on: 2026-09-19
  voice_reviewed_by: <named human>
  tab: "read this first"

  terse: >
    EOS is Arista's switch operating system: a Cisco-IOS-shaped CLI over a
    Linux base. `show running-config` shows it; `write memory` saves it.

  explained: >
    Arista Extensible Operating System (EOS) is the software every Arista
    switch runs. Under the CLI sits a single Linux kernel, with each switch
    function — routing, the CLI itself, SNMP, and so on — running as its own
    process and sharing state through a central database (Sysdb) rather than
    through one monolithic program. None of that is visible from the CLI,
    which is deliberately shaped like traditional Cisco IOS: `enable` for
    privileged mode, `configure terminal` for configuration mode, then a
    sub-mode per object being configured (`interface Ethernet1`, `vlan 10`).
    The active configuration is read with `show running-config` and made to
    survive a reboot with `write memory`.

  teaching:
    body: >
      Three things explain most of what a config paste from an Arista switch
      looks like.

      First, the CLI is intentionally close to Cisco IOS's, not because EOS
      is built on IOS — it is a different operating system entirely — but
      because Arista designed the command syntax to be familiar to anyone who
      already knew IOS. So a running-config reads as blocks: a bare command
      line (`interface Ethernet1`) opens a sub-mode, and the indented lines
      under it (`description`, `switchport mode trunk`, `ip address …`)
      configure that one object. `!` on its own line separates blocks. This
      is the shape a person copies out of a terminal session, prompt and all.

      Second, `show running-config` and `show startup-config` are two
      different files and it matters which one a change lands in. Typing a
      command changes the running configuration immediately — the switch
      is live from that keystroke — but a reload reads only the startup
      configuration. `write memory` (or, equivalently, `copy running-config
      startup-config`) is what copies the first into the second; a change
      made and never saved this way is gone at the next reload. `show
      running-config all` is the same file with every value EOS is applying
      by default made explicit, which the plain form leaves out because the
      operator never typed it.

      Third, EOS's own interface names are short and typed, not free text:
      `Ethernet1` is a front-panel port, `Management1` is the dedicated
      out-of-band management port, `Port-Channel1` is a LAG, `Vlan10` is a
      switch virtual interface for VLAN 10. Reading a config a level at a
      time — which object is this block about, and which of these four
      shapes is its name — is most of what makes an unfamiliar EOS paste
      legible.

    breaks_if_wrong: >
      Reading a running-config as flat, unstructured lines — rather than as
      nested blocks under the command that opened them — loses which
      sub-command belongs to which interface or VLAN, especially once two
      objects are configured back to back with only a bare `!` between them.
      Assuming a typed command took effect permanently, without a `write
      memory`, is the other common miss: the box looks correctly configured
      until the next reload discards everything since the last save.

    misdiagnosed_as: >
      "The switch reverted my change" reads as a switch bug or a second
      administrator's conflicting edit. Usually it is neither: the change
      was made to the running configuration only, never saved to startup,
      and a reload (scheduled, crash, or power event) restored the last
      saved state exactly as designed.

  sources:
