#   read: techspecs.ui.com/unifi/switching/usw-48-poe) — the Standard tier,
#   chosen over the Pro/Pro-Max/Enterprise 48-port switches for the same
#   reason `usw-24-poe.yaml`'s header gives for its own model: the one a
#   home or small estate is most likely to run, matching the brief this
#   file was written against. Content established via web search synthesis:
#   48 x 1GbE RJ45 ports (32 of them PoE+ capable) and 4 x 1G SFP ports;
#   total PoE budget 195W; 1U rack-mount. Corroborated by the combined
#   legacy "UniFi Switch Datasheet" (US-24/US-48, title read) describing the
