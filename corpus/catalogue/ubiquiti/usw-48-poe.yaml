# WHAT IS NOT INDEPENDENTLY CONFIRMED, AND THE CONSERVATIVE READING USED:
#
#   No photograph of the exact left-to-right port order or rear-panel layout
#   was read (same egress block). `layout: paired_columns` on the 48-port
#   RJ45 bank and `layout: single_row` on the 4-port SFP bank follow this
#   catalogue's own established convention (see
