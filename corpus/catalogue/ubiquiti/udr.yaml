# corpus/catalogue/ubiquiti/udr.yaml — UniFi Dream Router, a cylindrical desktop
# gateway with WiFi. rack_units: 1 is NOMINAL (desktop gear, field is required).
# Read 2026-10-10: https://techspecs.ui.com/unifi/cloud-gateways/udr
# Port list as read: "1 GbE RJ45" 5 (2 PoE) (1G/100M/10M); "Default WAN Ports:
# (1) GbE RJ45"; "Max. WAN Port Count: 1"; PoE out budget 40W, 15.4W per port;
# MicroSD slot; power is internal AC (no psu_slots). Read as 4 LAN (2 of them
# PoE out) + 1 WAN; the page does not say which ports are PoE.
# NOT CONFIRMED: face (ports are on the cylinder's side/base; recorded on rear,
# per the catalogue's side-face rule), order, and layout (no photo).
# The format requires a `front` faceplate; an empty one (port_count: 0) is declared,
# as in tripplite/srshelf2p1u.yaml.
vendor: ubiquiti
model: UDR
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Ubiquiti, UniFi Dream Router tech specs
    (https://techspecs.ui.com/unifi/cloud-gateways/udr), read 2026-10-10.
    5x GbE RJ45 (2 PoE out), one the WAN; cylindrical desktop. Face and layout
    not confirmed by a photo.
  read_on: "2026-10-10"
faceplates:
  - face: front
    port_count: 0
    port_groups: []
  - face: rear
    port_count: 5
    port_groups:
      - { kind: "RJ45", role: access, layout: single_row, count: 4, start_number: 1 }
      - { kind: "RJ45", role: uplink, layout: single_row, count: 1, start_number: 5 }
