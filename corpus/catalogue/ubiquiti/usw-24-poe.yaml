# corpus/catalogue/ubiquiti/usw-24-poe.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs); see that file
# for the format's rules.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# Direct fetch of ui.com and dl.ui.com was blocked (`EGRESS_BLOCKED`) on
# 2026-09-19 — see `corpus/catalogue/ubiquiti/udm-se.yaml`'s header, same
# session, for what was tried. What follows is web-search synthesis,
# corroborated across independent listings, read 2026-09-19 (CLAUDE.md
# rule 1).
#
#   Ubiquiti's own "UniFi Standard 24 PoE — Tech Specs" page (title/URL
#   read: techspecs.ui.com/unifi/switching/usw-24-poe) for the model this
#   file is named after (USW-24-PoE, the "Standard" tier — chosen over the
#   Pro/Enterprise 24-port switches as the one a home or small estate is
#   most likely to run, matching the brief this file was written against).
#   Content established via web search synthesis: 24 x 1GbE RJ45 ports (16
#   of them PoE+ capable) and 2 x 1G SFP ports; total PoE budget 95W;
#   switching capacity 52 Gbps; 1U rack-mount, 442 x 200 x 44 mm
#   (17.4 x 7.9 x 1.7"). Corroborated by dl.ubnt.com's own datasheet
#   filename (`usw-24_ds.pdf`, title read, not fetched) and by the older
#   combined "UniFi Switch Datasheet" (US-24/US-48, title read) describing
#   the same 24+2 port split for the product line's 24-port members.
#
# WHAT IS NOT INDEPENDENTLY CONFIRMED, AND THE CONSERVATIVE READING USED:
#
#   No photograph of the exact left-to-right port order or rear-panel layout
#   was read (same egress block). `layout: paired_columns` on the 24-port
#   RJ45 bank and `layout: single_row` on the 2-port SFP bank follow this
#   catalogue's own established convention (see
#   `corpus/catalogue/arista/720xp-48zc2.yaml`'s header for the identical
#   reasoning). No management or console port is recorded: UniFi's Standard-
#   tier switches are controller-managed with no stated out-of-band
#   management jack or serial console in any source read, and a single
#   uncorroborated mention is not enough to record one (conventions
#   §*Currency*'s two-source rule, applied the same way
#   `udm-se.yaml`'s header applies it to that model's management port).
#
#   THE TWO REAR/UPLINK PORTS ARE NAMED `SFP+` BELOW BUT ARE NOT SFP+ METAL:
#   every source read says "2 x 1G SFP ports" — 1000BASE-X cages, not the
#   10G SFP+ cages the EX4300's uplink module genuinely carries. This
#   catalogue's `PortKind` enum has exactly `Rj45, SfpPlus, QsfpPlus, Lc,
#   C14, C13, NemaP5_15R, NemaP5_15P` (`crates/fathom-corpus/src/
#   catalogue.rs`) — no plain, non-Plus `Sfp` member exists yet, the same
#   kind of gap this reader's own module doc records for `QsfpPlus` before
#   that kind was added. Recording these as `SfpPlus` overstates what the
#   port accepts (a 1G-only cage will not link at 10G); recorded here
#   anyway, flagged, because the alternative — inventing a ninth `PortKind`
#   as a one-file side effect of an engine contribution — is a bigger
#   unreviewed change than one accurately-caveated model file. A ninth
#   `PortKind` (`Sfp`, non-Plus) is future work, argued in the open like
#   every other change to this reader, not a guess this file should make
#   silently.
#
#   The internal AC power supply's inlet is not independently confirmed as
#   field-replaceable or hot-swappable by any source read; this switch tier
#   is recorded with NO `psu_slots` entry at all, the same convention
#   `corpus/catalogue/panduit/` and `corpus/catalogue/apc/`'s passive
#   models use for "no inlet this format can name" (module doc on
#   `PsuSlot`) — an internal, non-user-serviceable AC supply is not a slot
#   a rear elevation draws, unlike the EX4300's or 7050X3's external
#   hot-swap PSU bays.
vendor: ubiquiti
model: USW-24-PoE
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Ubiquiti, "UniFi Standard 24 PoE — Tech Specs"
    (techspecs.ui.com/unifi/switching/usw-24-poe), title/URL read; body not
    fetchable (direct fetch of ui.com blocked, see file header) — read via
    web-search synthesis on 2026-09-19, corroborated by dl.ubnt.com's own
    datasheet filename (usw-24_ds.pdf) and by the combined legacy
    US-24/US-48 UniFi Switch Datasheet describing the same port split, both
    title-read the same session. 24x RJ45 (16 PoE+) + 2x SFP, 1U, 95W PoE
    budget. Port layout is this catalogue's own conservative convention, not
    confirmed by a photograph — see the file header.
  read_on: "2026-09-19"
faceplates:
  - face: front
    port_count: 26
    port_groups:
      - { kind: "RJ45", role: access, layout: paired_columns, count: 24, start_number: 1 }
      - { kind: "SFP+", role: uplink, layout: single_row, count: 2, start_number: 1 }
