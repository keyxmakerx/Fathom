# corpus/catalogue/apc/ap7920b.yaml — read by fathom-corpus's `catalogue`
# module (crates/fathom-corpus/src/catalogue.rs), which see for the format's
# rules: unknown keys refused, positions and numbering are a pattern the
# reader expands, never coordinates this file states outright.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# same convention as corpus/catalogue/juniper/ex4300-48p.yaml).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# This environment's network egress is blocked for every vendor and reseller
# domain tried on 2026-09-16, including apc.com and se.com directly (`curl`
# through the configured proxy and this session's WebFetch tool both returned
# EGRESS_BLOCKED on the CONNECT). Schneider Electric/APC's own product pages
# could therefore not be fetched and read verbatim, which CLAUDE.md rule 1
# asks to be stated plainly rather than papered over. What follows is the
# best available evidence given that constraint, and no further: web search
# results dated 2026-09-16 that named and summarised APC's own product page
# and Schneider Electric's own product page, corroborated across independent
# reseller listings (Exxact, SabrePC, Anixter-adjacent, Server Room
# Environments, broadbandbuyer, apcguard, networkdevicesinc) that all agree
# on the same outlet count, connector types and physical form factor — the
# same method, for the same reason, as ex4300-48p.yaml's header.
#
#   APC (Schneider Electric), product page for AP7920B, "APC NetShelter
#   Switched Rack PDU, 1U, 1PH, 2.3kW 230V 10A or 2.5kW 208V 12A, 8 C13
#   outlets, C14 cord" — apc.com/us/en/product/AP7920B/ and the identical
#   Schneider Electric US/AU product pages — content established via web
#   search synthesis, read 2026-09-16 (see note above): 8 IEC 60320 C13
#   outlets, one permanently-attached power cord terminating in a C14 plug
#   (not a removable inlet socket on the unit itself — see below), 1U,
#   "horizontal" mount.
#
#   Multiple independent reseller listings (networkdevicesinc.com,
#   broadbandbuyer.com, apcguard.com, Amazon, SabrePC, Exxact,
#   serverroomenvironments.co.uk), same date, corroborating: "8-Way 1U
#   Horizontal ... Switched PDU ... C13 Outlets; C14 Plug" — a single row of
#   8 C13 outlets, confirming the layout below.
#
# WHY THIS MODEL AND NOT A "BASIC" ONE: the search also surfaced APC's
# Basic-branded 1U C13 PDUs (AP7516X900, "13 C13 outlets") but their
# datasheets did not resolve a confirmed input-connector/layout detail this
# session could corroborate independently; AP7920B's outlet count, connector
# types and 1U horizontal single-row layout are corroborated across seven
# independent sources above, so it is the better-evidenced choice even though
# it carries switched-outlet electronics the catalogue format has no field
# for and does not need one for (ports and rack units are all this format
# records).
#
# NO `psu_slots` DECLARED, ON PURPOSE — RE-CHECKED 2026-09-16 AGAINST
# ADR-0050 §3/§4's positioned-slot format (`psu_slots`, replacing the former
# `psu_inlets: { kind, count }`): every source above still describes the
# unit's upstream connection as a permanently-attached "C14 cord", not a
# removable C14 inlet socket on the chassis — there is no connector on the
# unit itself for a technician to plug or unplug at the PDU end, only a wire
# disappearing into the housing. There is therefore no slot to name: a
# `psu_slots` entry needs a vendor-printed slot name and a position on a
# face (`crates/fathom-corpus/src/catalogue.rs`'s `PsuSlot`), and this unit
# has neither, only a captive wire. `psu_slots` is empty rather than
# inventing a slot the sources never describe, exactly the same "no removable
# socket, nothing to name" reasoning the old `psu_inlets` header stated for
# the count-based format. This is also this catalogue's example of a device
# that draws power but is not a PSU-slot-bearing device in the format's
# sense — distinct from a genuinely passive panel (see
# corpus/catalogue/panduit/), which has no faceplate here because a PDU is
# not one; it is the far end of the same "Power" lens (UI-SPEC).
vendor: apc
model: AP7920B
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    APC (Schneider Electric), product page for AP7920B, "APC NetShelter
    Switched Rack PDU, 1U, 1PH, 2.3kW 230V 10A or 2.5kW 208V 12A, 8 C13
    outlets, C14 cord" (apc.com/us/en/product/AP7920B/, mirrored verbatim at
    se.com/us/en/product/AP7920B/ and se.com/au/en/product/AP7920B/), for the
    outlet count, connector type and 1U form factor; corroborated by
    independent reseller listings (networkdevicesinc.com, broadbandbuyer.com,
    apcguard.com, Exxact, SabrePC, Server Room Environments) describing the
    same unit as "8-Way 1U Horizontal" with "C13 Outlets; C14 Plug" for the
    single-row layout — all read via web search synthesis on 2026-09-16
    because this environment's network egress blocked a direct fetch of
    apc.com and se.com (see the file header for what was tried).
  read_on: "2026-09-16"
faceplates:
  - face: front
    port_count: 8
    port_groups:
      - { kind: "C13", role: access, layout: single_row, count: 8, start_number: 1 }
