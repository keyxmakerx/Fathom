# corpus/catalogue/juniper/ex4300-48p.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs), which see for
# the format's rules: unknown keys refused, positions and numbering are a
# pattern the reader expands, never coordinates this file states outright.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# same convention as `corpus/dict/junos-srx/*.yaml`).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# This environment's network egress is blocked for every external domain
# tried on 2026-09-14, including juniper.net itself, every reseller mirror,
# web.archive.org and en.wikipedia.org (each attempt returned
# EGRESS_BLOCKED; `curl` through the configured proxy returned a 403 on the
# CONNECT to juniper.net). Juniper's own hardware guide could therefore not
# be fetched and read verbatim, which CLAUDE.md rule 1 asks to be stated
# plainly rather than papered over. What follows is the best available
# evidence given that constraint, and no further: web search results dated
# 2026-09-14 that named and summarised Juniper's own documentation pages,
# corroborated across independent listings.
#
# RE-CHECKED 2026-09-16 (ADR-0050's `psu_slots` migration and the
# management/console re-read the ADR calls for): the same egress block is
# still in effect. Direct `WebFetch` was tried against
# juniper.net/documentation/us/en/hardware/ex4300/topics/topic-map/
# ex4300-chassis.html, the mirrored PDF at people.ucsc.edu/~warner/ex4300.pdf,
# a second mirror at gzhls.at, and manualslib.com's hosted copy of the
# hardware manual — every one returned EGRESS_BLOCKED on the CONNECT. Only
# the web-search tool (not a direct fetch) was reachable, so what follows is
# search-result synthesis, not a verbatim read, exactly as on 2026-09-14.
#
#   Juniper Networks, "EX4300 System Overview", EX4300 Switch Hardware
#   Guide, juniper.net/documentation/us/en/hardware/ex4300/topics/topic-map/
#   ex4300-system-overview.html — content established via web search
#   synthesis, read 2026-09-14 (see note above): "48 built-in 10/100/
#   1000BASE-T Ethernet network ports with Power over Ethernet (PoE+), and
#   four built-in quad small form-factor pluggable plus (QSFP+) ports".
#
#   Juniper Networks, "EX4300 Power System" / "EX4300 Chassis", same guide,
#   .../ex4300-power-system.html and .../ex4300-chassis.html — read the same
#   way, same date: a pair of hot-swappable, field-replaceable AC power
#   supplies (350 W / 715 W / 1100 W options), rear-accessible.
#
#   The EX-UM-4X4SFP uplink module (a 4-port 1GbE/10GbE SFP+ module for the
#   24- and 48-port EX4300 models) — same method, same date. This is
#   OPTIONAL hardware, not part of the base chassis; it is included here
#   because it is what the approved design board draws and uses (next).
#
#   design/rebuild/Faceplate.dc.html (this repository, the approved design
#   board) — read directly, not searched. Its "core-01" EX4300-48P drawing
#   is where the actual per-port NUMBERING and LAYOUT below come from, since
#   no search result described the physical arrangement:
#     * the 48-port RJ45 bank is numbered 0-47 (0-based), the top row
#       carrying the LOWER number of each column pair (0, 2, 4, ... on top;
#       1, 3, 5, ... below) — `Layout::PairedColumns` with `start_number: 0`;
#       a visible gap sits after every twelfth port;
#     * its 4-port SFP+ uplink bank is labelled `xe-0, xe-1, xe-2, xe-3` top-
#       left, top-right, bottom-left, bottom-right — row-major, i.e.
#       `Layout::PairedRows`;
#     * its rear QSFP+ pair is drawn side by side in one row (`et-0/1/0`,
#       `et-0/1/1`) — `Layout::SingleRow`.
#
# TWO DELIBERATE DIVERGENCES FROM THE DESIGN BOARD, BOTH IN FAVOUR OF THE
# BETTER-CORROBORATED REAL-HARDWARE CLAIM OVER THE MOCKUP'S ILLUSTRATION:
#   1. The board draws only 2 rear QSFP+ ports; the corroborated spec above
#      says 4 are built in. This file ships 4 — the mockup drew fewer only
#      because covering the real number of models was not its purpose.
#   2. (Not a divergence any more — corrected 2026-09-14.) This file used to
#      model the rear built-in ports as `SFP+`, the nearest of UI-SPEC's four
#      drawn glyphs, because QSFP+ was not one of them. That was backwards:
#      the catalogue is the estate-of-record and is true first, the screen
#      catches up. The rear ports below are real QSFP+ cages and are now
#      recorded as `QSFP+` — a fifth `PortKind` the reader now names for
#      exactly this reason. UI-SPEC has no glyph for it yet; that is a
#      drawing-layer gap, tracked there, not a reason to misname the metal
#      here. The front EX-UM-4X4SFP uplink module genuinely is SFP+ (a
#      1GbE/10GbE SFP+ module, not QSFP+) and stays `SFP+` below.
#
# `me0` (MANAGEMENT) AND `con` (CONSOLE) — ADDED 2026-09-16, NO LONGER LEFT
# OUT: this file used to leave both out because the format had no way to
# express a named, non-numbered port; ADR-0050 §5 names this as the whole
# reason the rear view exists, and the format now carries `role: management`
# / `role: console` groups with `names:` instead of `count`. Two independent
# web searches, both read 2026-09-16 (direct fetch blocked as above), agree:
#
#   Juniper Networks, "Connecting the EX4300 to External Devices" and
#   "EX4300 Chassis" (juniper.net/documentation/us/en/hardware/ex4300/...) —
#   search-result synthesis, read 2026-09-16: "A dedicated rear panel RJ-45
#   port is available for out-of-band management" (the `me0` interface);
#   "The console port on the rear panel of the switch connects to a laptop
#   or PC by using the RJ-45 to DB-9 serial port adapter. Additionally, a
#   mini-USB port on the front panel can be used..."; "By default, the RJ-45
#   port is set as an active console port and the Mini-USB Type-B port is
#   the passive console port." Both the RJ-45 management port and the
#   RJ-45 console port are therefore recorded below as `rear`, RJ45, one
#   named port each (`me0`, `con`) — the vendor's own words, read off the
#   design board's existing labelling (kept from the pre-2026-09-16 version
#   of this file, which already named them `me0` and `con` while leaving
#   them out of the parsed data).
#
#   The FRONT-panel Mini-USB Type-B console port is real (same sources
#   above) but is NOT recorded here: this format's `PortKind` has no
#   Mini-USB member (`crates/fathom-corpus/src/catalogue.rs`'s six kinds are
#   RJ45, SFP+, QSFP+, LC, C14, C13), and it is documented as the *passive*
#   of the pair, the RJ-45 rear port being active by default. Adding a
#   seventh `PortKind` for one secondary port on one model is future work,
#   argued in the open like every other change to this reader, not a guess
#   this file should make silently.
#
# `psu_slots` — ADR-0050 §3/§4's positioned-inlet format, replacing the old
# `psu_inlets: { kind: C14, count: 2 }`. Slot NAMES: a third search, read
# 2026-09-16 (same blocked-egress caveat), found "the EX4300 switch power
# system uses PSU0 and PSU1 as the slot name labels for power supplies, as
# evidenced by the system power budget formula: PSU0(W) + PSU1(W)" on
# Juniper's own "EX4300 Power System" page — the vendor's own words, per
# ADR-0050 §3. FACE and HOT-SWAP: confirmed by the same page and
# "Maintaining the EX4300 Power System" (read the same way, same date): the
# supplies are "hot-removable and hot-insertable field-replaceable units
# (FRUs)... installed in the rear panel", removable without powering off the
# switch. POSITION: "The power supply slots are at the right end of the rear
# panel on 24-port and 48-port switches" (same source) — this file records
# both slots in a single row at that end, PSU0 at column 0 and PSU1 at
# column 1; WHICH of the two sits physically left of the other within that
# pair is NOT independently confirmed by any source read (no photo, no
# diagram), so this is the same conservative "assign columns in the order
# the file lists them" reading this file already uses for banks with no
# stated left/right evidence (see the LAYOUT reasoning on the sibling
# Panduit panels for the same conservative-reading rule stated once).
#
# NOTE ON `psu_inlets`'s FORMER `kind: C14` FIELD: ADR-0050 §3 and the
# `PsuSlot` struct it produced (`crates/fathom-corpus/src/catalogue.rs`)
# record a slot's name, hot-swap flag, face and position — not a connector
# kind. This is a deliberate format change (ADR-0050 §3, §5's
# "Consequences"), not an omission: a PSU bay is a field-replaceable-unit
# slot, not a port with a glyph, so the C14 connector fact this file used to
# carry has no field to live in any more.
vendor: juniper
model: EX4300-48P
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Juniper Networks, "EX4300 System Overview" and "EX4300 Power System",
    EX4300 Switch Hardware Guide
    (juniper.net/documentation/us/en/hardware/ex4300/), for the 48 RJ45 +
    4 QSFP+ + dual hot-swap PSU counts; the EX-UM-4X4SFP uplink module
    description for the optional 4-port SFP+ front uplink bank; all read via
    web search synthesis on 2026-09-14 because this environment's network
    egress blocked a direct fetch of juniper.net (see the file header for
    what was tried). Port NUMBERING and LAYOUT read directly off this
    repository's approved design board, design/rebuild/Faceplate.dc.html
    ("core-01"). The rear built-in ports are recorded as the catalogue's
    QSFP+ kind, which is what they are; the front EX-UM-4X4SFP module is
    recorded as SFP+, which is what it is. See the file header for the one
    remaining deliberate divergence from the board (4 rear ports, not 2).
    RE-READ 2026-09-16 for ADR-0050's rear-elevation format: "Connecting the
    EX4300 to External Devices" and "EX4300 Chassis" for the rear-panel
    RJ-45 management port (`me0`) and rear-panel RJ-45 console port (`con`,
    active by default over the front Mini-USB port, which this format has
    no connector kind for and so does not record); "EX4300 Power System"
    and "Maintaining the EX4300 Power System" for the `PSU0`/`PSU1` slot
    names, rear face and hot-swap FRU status, and the "right end of the rear
    panel" position claim. All read via web search synthesis on 2026-09-16;
    direct fetch of juniper.net, a UCSC-hosted mirror PDF, a second mirror
    and manualslib.com's hosted manual all returned EGRESS_BLOCKED (see the
    file header). The left/right ORDER of PSU0 versus PSU1 within their
    shared end of the panel is not independently confirmed by any source
    read; this file assigns them columns 0 and 1 in listing order, the same
    conservative-reading rule used elsewhere in this catalogue for an
    arrangement no photo or diagram confirms.
  read_on: "2026-09-16"
faceplates:
  - face: front
    port_count: 52
    port_groups:
      - { kind: "RJ45", role: access, layout: paired_columns, count: 48, start_number: 0 }
      - { kind: "SFP+", role: uplink, layout: paired_rows, count: 4, start_number: 0 }
  - face: rear
    port_count: 6
    port_groups:
      - { kind: "QSFP+", role: uplink, layout: single_row, count: 4, start_number: 0 }
      - { kind: "RJ45", role: management, layout: single_row, names: [me0] }
      - { kind: "RJ45", role: console, layout: single_row, names: [con] }
psu_slots:
  - { name: "PSU0", hot_swap: true, face: rear, position: { row: single, column: 0 } }
  - { name: "PSU1", hot_swap: true, face: rear, position: { row: single, column: 1 } }
