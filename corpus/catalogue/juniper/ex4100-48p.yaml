# corpus/catalogue/juniper/ex4100-48p.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs), which see for
# the format's rules.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
#
# WHERE EVERY NUMBER BELOW CAME FROM. Direct fetch of juniper.net is blocked
# in this environment (checked 2026-09-19, same EGRESS_BLOCKED failure the
# sibling EX2300-48P file's header records for the same date). What follows
# is web-search-result synthesis of Juniper's own documentation, each claim
# corroborated across at least two independent search queries returning the
# same official page.
#
#   Juniper Networks, "EX4100 System Overview" / EX4100 datasheet
#   (juniper.net/documentation/us/en/hardware/ex4100/), searched 2026-09-19:
#   "48 x 1GbE PoE+ access ports, delivering up to 30 W per port with an
#   overall total 1440 W of PoE power budget (using two power supplies).
#   Additionally, each EX4100 model offers 4 x 1/10GbE small form-factor
#   pluggable plus transceiver (SFP+) fixed uplink ports." A second,
#   independent search confirmed the uplinks are FRONT-PANEL: "These 4 x
#   1GE/10GE SFP+ uplink ports are located on the front panel," referencing
#   the hardware guide's own Figure 12 for the front-panel component layout.
#
#   CORRECTION, 2026-09-19, same session: the paragraph above is a partial
#   read. The EX4100 also carries a SECOND, separate front-panel uplink bank:
#   4 x 10/25GbE SFP28 ports, default-provisioned as Virtual Chassis ports
#   (VCPs) but reconfigurable as network/uplink ports (a per-model option, not
#   present on every EX4100 SKU). Independent confirmation, since
#   juniper.net's own port-naming page could not be fetched directly
#   (EGRESS_BLOCKED, checked 2026-09-19): (1) NetBox community
#   devicetype-library's EX4100-48P.yaml (raw.githubusercontent.com/
#   netbox-community/devicetype-library, fetched 2026-09-19, its own
#   `comments:` field cites this same Juniper datasheet URL) lists both banks
#   by interface name — `et-0/1/0`..`et-0/1/3` at 25gbase-x-sfp28 and
#   `xe-0/2/0`..`xe-0/2/3` at 10gbase-x-sfpp — eight uplink-capable ports at
#   two distinct FPC/PIC addresses, not one four-port bank; (2) two
#   independent retail listings (harddiskdirect.com and orangehardwares.com,
#   both searched 2026-09-19) each describe the EX4100-48P identically as "48
#   x ports PoE 10/100/1000Base-T + 4 x 10GbE uplink ports + 4 x 25GbE
#   stacking/uplink ports." All three agree: 48 access + 4 SFP+ (10G) + 4
#   SFP28 (10/25G) = 56 ports total, not 52.
#
#   NUMBERING/LAYOUT: no design board exists for this model in this
#   repository. The 48-port bank is recorded 0-based, `paired_columns`, even
#   numbers on top, per the same "Port Speed on EX Series Switches" vendor
#   page `ex2300-48p.yaml`'s header quotes in full (a general EX-series
#   statement, not model-specific, read the same way on 2026-09-19). The
#   4-port SFP+ uplink bank's physical arrangement (`single_row`) is NOT
#   confirmed by any photo or diagram read in this session, same caveat as
#   the sibling EX2300-48P file.
#
#   CONSOLE AND MANAGEMENT — Juniper Networks, "EX4100 Chassis" and "Connect
#   the EX4100 Switch to External Devices," read via search synthesis
#   2026-09-19: "The console port is labeled CON on the rear panel of the
#   switch and uses an RJ-45 connector," and, independently, "The RJ-45
#   management port is labeled MGMT on the rear panel." A front-panel RS232-
#   to-USB-Type-C console port is also documented but is NOT recorded here —
#   this format's `PortKind` has no USB-C member, the same reasoning
#   `ex4300-48p.yaml` and `ex2300-48p.yaml` already state for their own
#   secondary console connectors.
#
#   POWER — Juniper Networks, "EX4100 Power System" and "Maintain the EX4100
#   Power System," read via search synthesis 2026-09-19, corroborated across
#   two independent queries: "the power supply slots are numbered 0 and 1,"
#   confirming `PSU0`/`PSU1`; "power supplies are fully redundant,
#   load-sharing, hot-removable and hot-insertable field-replaceable units
#   (FRUs)... you can remove and replace the power supplies without powering
#   off the switch." "EX4100-48P uses the 920W AC AFO (Airflow Out) PSU."
#   Slot FACE and left/right ORDER within the rear panel are not
#   independently confirmed by any photo read; this file assigns PSU0/PSU1 to
#   columns 0/1 of a single rear row, the same conservative listing-order
#   convention `ex4300-48p.yaml`'s header states once for the same
#   unconfirmed detail on its own PSU pair.
vendor: juniper
model: EX4100-48P
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Juniper Networks, "EX4100 System Overview" and the EX4100-48P datasheet
    (juniper.net/documentation/us/en/hardware/ex4100/), for the 48 x 1GbE
    PoE+ port count and the 4 x 1/10GbE SFP+ front-panel uplink count;
    corroborated by NetBox community devicetype-library's EX4100-48P.yaml and
    two independent retail listings (harddiskdirect.com, orangehardwares.com,
    both searched 2026-09-19) for the second front-panel bank, 4 x 10/25GbE
    SFP28 (VCP-default, reconfigurable as uplink) — see file header
    "CORRECTION" note for the full reconciliation; "Port Speed on EX Series
    Switches" for the 0-based, even-row-on-top numbering rule (the same
    general EX-series statement ex2300-48p.yaml cites); "EX4100 Chassis" and
    "Connect the EX4100 Switch to External Devices" for the rear-panel CON
    and MGMT RJ-45 ports; "EX4100 Power System" and "Maintain the EX4100
    Power System" for the PSU0/PSU1 slot names, hot-swap FRU status and the
    920W AC AFO PSU. All read via web search synthesis on 2026-09-19 because
    this environment's network egress blocks a direct fetch of juniper.net
    (see file header). Both uplink banks' physical layout and PSU0/PSU1
    left-right order are NOT independently confirmed — see file header.
  read_on: "2026-09-19"
faceplates:
  - face: front
    port_count: 56
    port_groups:
      - { kind: "RJ45", role: access, layout: paired_columns, count: 48, start_number: 0 }
      - { kind: "SFP+", role: uplink, layout: single_row, count: 4, start_number: 0 }
      # Second uplink bank: 4 x 10/25GbE SFP28, VCP-default and
      # reconfigurable as network uplinks (see file header "CORRECTION").
      # This format has no SFP28 `PortKind` (catalogue.rs's eight kinds stop
      # at `SFP+`/`QSFP+`); SFP28 is the same physical SFP cage as SFP+ at a
      # higher signalling rate, so it is recorded as kind `SFP+` here rather
      # than invented as a ninth kind for a difference the drawing layer does
      # not distinguish either.
      - { kind: "SFP+", role: uplink, layout: single_row, count: 4, start_number: 4 }
  - face: rear
    port_count: 2
    port_groups:
      - { kind: "RJ45", role: management, layout: single_row, names: [MGMT] }
      - { kind: "RJ45", role: console, layout: single_row, names: [CON] }
psu_slots:
  - { name: "PSU0", hot_swap: true, face: rear, position: { row: single, column: 0 } }
  - { name: "PSU1", hot_swap: true, face: rear, position: { row: single, column: 1 } }
