# corpus/catalogue/juniper/ex2300-48p.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs), which see for
# the format's rules.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# same convention as every other file in this directory).
#
# WHERE EVERY NUMBER BELOW CAME FROM. This environment's network egress
# blocks juniper.net on direct fetch (checked 2026-09-19: `WebFetch` against
# juniper.net/documentation/us/en/hardware/ex2300/topics/topic-map/
# ex2300-system-overview.html returned EGRESS_BLOCKED on the CONNECT, the
# same failure mode `corpus/catalogue/juniper/ex4300-48p.yaml`'s header
# records for 2026-09-14 and 2026-09-16). What follows is web-search-result
# synthesis of Juniper's own documentation pages, not a verbatim read, with
# every claim below corroborated across at least two independent search
# queries returning the same official page, per CLAUDE.md rule 1's fallback.
#
#   Juniper Networks, "EX2300 System Overview" and product datasheet pages
#   (juniper.net/documentation/us/en/hardware/ex2300/), searched 2026-09-19:
#   the EX2300-48P is 48 built-in 10/100/1000BASE-T ports with PoE/PoE+, plus
#   four built-in 1GbE/10GbE SFP/SFP+ uplink ports — "flexible 4x1GbE
#   SFP/10GbE SFP+ uplinks". All four uplinks are FRONT-PANEL (the vendor's
#   own phrase, corroborated twice: "four fixed front-panel 1GbE/10GbE uplink
#   ports with pluggable optics").
#
#   Juniper Networks, "Port Speed on EX Series Switches"
#   (juniper.net/documentation/us/en/software/junos/interfaces-ethernet-
#   switches/topics/topic-map/port-speed-ex-switches.html) — read via search
#   synthesis 2026-09-19, quoted: "built-in network ports are numbered from
#   left to right. On models that have two rows of ports, the ports on the
#   top row start with 0 followed by the remaining even-numbered ports, and
#   the ports on the bottom row start with 1 followed by the remaining
#   odd-numbered ports." This is the same 0-based, even-on-top rule
#   `ex4300-48p.yaml` reads off its design board; here it is the vendor's own
#   general EX-series statement, so `PairedColumns` / `start_number: 0` is
#   used directly rather than inferred from a mockup.
#
#   LAYOUT of the 4-port uplink bank is NOT confirmed by any photo or diagram
#   read in this session — no design board exists for this model (unlike
#   EX4300's `design/rebuild/Faceplate.dc.html`). Recorded as `single_row`,
#   the simpler and more commonly photographed arrangement for a compact 1U
#   access switch's uplink block, immediately right of the main RJ45 bank.
#   Flagged here for correction if a vendor photo is read later.
#
#   Juniper Networks, "Connecting the EX2300 to External Devices" and
#   "EX2300 Chassis" — read via search synthesis 2026-09-19, corroborated
#   across three independent queries: "EX2300 switches except the EX2300-C
#   switch and EX2300-24MP and EX2300-48MP models have the management port
#   on the rear panel" (the EX2300-48P is none of those exceptions), and "you
#   should connect the cable to the port labeled MGMT on the rear panel".
#   The console: "EX2200-C, EX2300, EX2300-C, EX3400, EX4300, and EX4550
#   switches, except EX2300-24MP and EX2300-48MP models, have two console
#   ports: an RJ-45 console port and a Mini-USB Type-B console port"; "The
#   console port is labeled CON, CONSOLE, or CON1 on the device" — recorded
#   as `CON`, the shortest and most consistently repeated of those three
#   spellings, on the rear panel per "Both the RJ-45 console port and USB
#   port are located on the rear panel of the EX2300 switch" (a separate,
#   independent search, same date). The Mini-USB console alternative is real
#   but not recorded, for the same reason `ex4300-48p.yaml` does not record
#   EX4300's front Mini-USB port: this format's `PortKind` has no Mini-USB
#   member, and the RJ-45 is documented as the active-by-default port on the
#   sibling EX4300 hardware; no EX2300-specific default-active statement was
#   read, so this is carried by analogy to the same vendor family, not proof
#   for this model specifically.
#
#   POWER — Juniper Networks, "EX2300 Power System" — read via search
#   synthesis 2026-09-19, corroborated across two independent queries: "The
#   power supply in EX2300 switches is built in along the rear panel of the
#   chassis, with an AC power cord inlet or DC power terminals on the rear
#   panel". Neither search surfaced a PSU0/PSU1 slot-naming statement or a
#   Redundant Power System (RPS) option for the 48-port PoE model, unlike the
#   EX4300 and EX4100 below, so this is recorded as ONE fixed,
#   non-field-replaceable inlet (`hot_swap: false`) rather than a pair of
#   swappable slots — the conservative reading when the vendor's own
#   corroborated wording is "built in" and no FRU/hot-swap language was
#   found for this specific model.
vendor: juniper
model: EX2300-48P
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Juniper Networks, "EX2300 System Overview" and the EX2300-48P datasheet
    (juniper.net/documentation/us/en/hardware/ex2300/), for the 48
    10/100/1000BASE-T PoE+ port count and the 4x SFP/SFP+ front-panel uplink
    count; "Port Speed on EX Series Switches" for the 0-based, even-row-on-top
    numbering rule; "Connecting the EX2300 to External Devices" and "EX2300
    Chassis" for the rear-panel MGMT and CON RJ-45 ports; "EX2300 Power
    System" for the single built-in, non-field-replaceable power supply. All
    read via web search synthesis on 2026-09-19 because this environment's
    network egress blocks a direct fetch of juniper.net (see file header).
    The uplink bank's physical layout (single_row) and the console/Mini-USB
    default-active behaviour are NOT independently confirmed for this exact
    model — see file header for what is and is not established.
  read_on: "2026-09-19"
faceplates:
  - face: front
    port_count: 52
    port_groups:
      - { kind: "RJ45", role: access, layout: paired_columns, count: 48, start_number: 0 }
      - { kind: "SFP+", role: uplink, layout: single_row, count: 4, start_number: 0 }
  - face: rear
    port_count: 2
    port_groups:
      - { kind: "RJ45", role: management, layout: single_row, names: [MGMT] }
      - { kind: "RJ45", role: console, layout: single_row, names: [CON] }
psu_slots:
  - { name: "PSU", hot_swap: false, face: rear, position: { row: single, column: 0 } }
