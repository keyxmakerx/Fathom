# corpus/catalogue/arista/720xp-48zc2.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs); see that file
# for the format's rules (unknown keys refused, numbering/layout are a
# pattern the reader expands, never literal coordinates).
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# the same convention `corpus/catalogue/juniper/ex4300-48p.yaml` uses).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# This environment's network egress blocked every attempt to fetch
# arista.com directly on 2026-09-19 (`WebFetch` returned `EGRESS_BLOCKED` for
# arista.com, cdw.com, manuals.plus and alldatasheet.com in turn), so
# Arista's own datasheet and quick-start-guide PDFs could not be read
# verbatim — the same constraint `corpus/catalogue/juniper/ex4300-48p.yaml`'s
# header records for juniper.net, met the same way: web-search synthesis,
# corroborated across independent listings, read 2026-09-19, and stated
# plainly rather than papered over (CLAUDE.md rule 1).
#
#   Arista Networks, "CCS-720XP Campus Switches" datasheet (title and URL
#   only: arista.com/assets/data/pdf/Datasheets/CCS-720XP-Datasheet.pdf) and
#   the switch's CDW listing (cdw.com, product 6480356, "Arista Cognitive
#   Campus POE Leaf 720XP-48ZC2 - switch - 48 ports - managed") — two
#   independent listings, both read via search synthesis 2026-09-19: the
#   CCS-720XP-48ZC2 carries 40 RJ45 mGig ports (100M-2.5G, PoE+ 30W) plus 8
#   RJ45 mGig ports (100M-5G, PoE+ 60W) — 48 access ports total — and 4x25G
#   SFP28 plus 2x100G QSFP28 uplinks, in a 1RU chassis. The two access
#   densities are recorded below as ONE 48-port RJ45 group: no source read
#   describes them as physically separate banks, only as two PoE budgets
#   within one 48-port row, and the catalogue's `PortGroup` has no field for
#   PoE wattage to distinguish them by anyway (module doc: a group is what a
#   plate's ports are, not their power budget).
#
#   Arista's own Quick Start Guide pages for the "720XP and 722XPM Series
#   1RU" family (arista.com/en/qsg-720xp-series-1ru/720xp-series-1ru-rear-panel
#   and .../720xp-series-1ru-cabling-the-switch), read via search synthesis
#   2026-09-19: the rear panel carries a console (serial) port over RJ-45
#   ("connects to a PC with the RJ-45 to DB-9 serial adapter cable"), a
#   10/100/1000 Ethernet management port over RJ-45, and a USB port "used for
#   software or configuration updates". The switch "operates with two
#   installed power supplies" — PSU1 and PSU2, rear, hot-swappable field-
#   replaceable units, per the same guide and corroborated independently by
#   the CDW listing above (dual PSU, hot-swap).
#
# WHAT IS NOT INDEPENDENTLY CONFIRMED, AND THE CONSERVATIVE READING USED:
#
#   No photograph or diagram of the 720XP-48ZC2's physical port arrangement
#   was read (every mirror that might have shown one returned
#   EGRESS_BLOCKED). `layout: paired_columns` on the 48-port bank follows
#   this catalogue's own convention (`Faceplate::ports`'s doc: "the rule is
#   about which number of the pair is lower, not about the literal word
#   odd") and the near-universal fixed-switch convention `ex4300-48p.yaml`
#   already relies on for the same reason — not a claim this specific box's
#   silkscreen was seen. The two uplink groups (4x25G, 2x100G) are recorded
#   `single_row`, the smallest-bank default this catalogue already uses for
#   the EX4300's rear QSFP+ pair, absent any source describing a different
#   arrangement. PSU1/PSU2's left/right order is likewise assigned by
#   listing order, the same conservative rule `ex4300-48p.yaml`'s own header
#   states for its own PSU pair.
#
#   The console and management port software names (`Console`, `Management1`)
#   are EOS's own interface-naming convention for the management Ethernet
#   port — "Management1 is a dedicated out-of-band management port" per a
#   second, independent read of Arista's EOS Interface Configuration manual
#   pages (arista.com/en/um-eos/eos-interface-configuration), search
#   synthesis, read 2026-09-19 — not the chassis silkscreen text, which no
#   source read here states. `Console` is not a logical EOS interface at
#   all (unlike `Management1`) and is recorded as the vendor's own plain word
#   for the port, the same convention `ex4300-48p.yaml` used for `con`.
#
#   The front-panel USB port some 720XP variants carry is not recorded here:
#   `PortKind` has no USB member (`crates/fathom-corpus/src/catalogue.rs`'s
#   eight kinds), the same gap `ex4300-48p.yaml`'s header names for its own
#   Mini-USB port, argued in the open like any other change to this reader
#   rather than guessed around here.
vendor: arista
model: CCS-720XP-48ZC2
rack_units: 1
reviewed_by: <named human>
source:
  cite: >
    Arista Networks, "CCS-720XP Campus Switches" datasheet (title/URL read;
    body not fetchable — see file header) and CDW's listing of the same SKU
    (cdw.com product 6480356), for the 48 RJ45 mGig access ports (40x
    100M-2.5G PoE+ 30W, 8x 100M-5G PoE+ 60W) and 4x25G SFP28 + 2x100G QSFP28
    uplinks; Arista's "720XP and 722XPM Series 1RU" Quick Start Guide pages
    (rear-panel and cabling topics) for the rear console (RJ-45), rear
    Ethernet management port (RJ-45) and dual hot-swap PSU1/PSU2; Arista's
    EOS Interface Configuration manual for the `Management1` interface name.
    All read via web-search synthesis on 2026-09-19 because this
    environment's network egress blocked a direct fetch of arista.com, cdw.com,
    manuals.plus and alldatasheet.com in turn (see file header for what was
    tried). The 48-port access bank's paired-columns layout, the two uplink
    groups' single-row layout, and PSU1/PSU2's left-right order are this
    catalogue's own conservative convention, not independently confirmed by
    a photograph or diagram — see the file header's "not independently
    confirmed" section.
  read_on: "2026-09-19"
faceplates:
  - face: front
    port_count: 54
    port_groups:
      - { kind: "RJ45", role: access, layout: paired_columns, count: 48, start_number: 1 }
      - { kind: "SFP+", role: uplink, layout: single_row, count: 4, start_number: 1 }
      - { kind: "QSFP+", role: uplink, layout: single_row, count: 2, start_number: 1 }
  - face: rear
    port_count: 2
    port_groups:
      - { kind: "RJ45", role: management, layout: single_row, names: [Management1] }
      - { kind: "RJ45", role: console, layout: single_row, names: [Console] }
psu_slots:
  - { name: "PSU1", hot_swap: true, face: rear, position: { row: single, column: 0 } }
  - { name: "PSU2", hot_swap: true, face: rear, position: { row: single, column: 1 } }
