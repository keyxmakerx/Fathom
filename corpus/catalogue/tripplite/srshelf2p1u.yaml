# corpus/catalogue/tripplite/srshelf2p1u.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs), which see for
# the format's rules: unknown keys refused, positions and numbering are a
# pattern the reader expands, never coordinates this file states outright.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# same convention as corpus/catalogue/juniper/ex4300-48p.yaml).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# This environment's network egress is blocked for every domain tried on
# 2026-09-18 — startech.com, tripplite.eaton.com, navepoint.com,
# www.blackbox.com, www.kendallhoward.com, panduit.com, apc.com and even
# en.wikipedia.org all returned EGRESS_BLOCKED on the CONNECT, for both
# `curl` through the configured proxy and this session's WebFetch tool — the
# same wall corpus/catalogue/apc/ap7920b.yaml and corpus/catalogue/panduit/
# hit on 2026-09-16. The vendor's own product page could therefore not be
# fetched and read verbatim, which CLAUDE.md rule 1 asks to be stated plainly
# rather than papered over. What follows is the best available evidence given
# that constraint, and no further: web search results dated 2026-09-18 that
# named and quoted Eaton/Tripp Lite's own product page and support page for
# SRSHELF2P1U, corroborated across seven independent, mutually-unaffiliated
# listings (Graybar, CDW, DigiKey, Office Depot, Newark, Dell, Amazon) that
# all agree on the same model number, port-free construction, U height,
# weight capacity and depth — the same method, for the same reason, as
# ex4300-48p.yaml's and ap7920b.yaml's headers.
#
#   Eaton/Tripp Lite, product page for SRSHELF2P1U, "SmartRack 1U Cantilever
#   Fixed Shelf (40 lbs / 18.1 kgs capacity; 12-in. / 305 mm Deep)" —
#   tripplite.eaton.com/smartrack-1u-cantilever-fixed-shelf-40-lb-18-kg-
#   capacity-12-in-305-mm-depth~SRSHELF2P1U, mirrored at
#   tripplite.eaton.com/support/SRSHELF2P1U and eaton.com's own SKU page
#   (eaton.com/us/en-us/skuPage.SRSHELF2P1U.html) — content established via
#   web search synthesis, read 2026-09-18 (see note above): 1U, cantilever
#   (front-mount, no rear support), cold-rolled steel, vented, black,
#   fixed (not sliding/telescoping), 40 lb / 18.1 kg capacity, 12 in / 305 mm
#   deep, mounts to a 2-post or 4-post rack with included hardware. No port,
#   jack or connector of any kind is named anywhere in the listing — it is a
#   mechanical shelf, nothing else.
#
#   Corroborated by seven independent reseller/distributor listings dated the
#   same search (Graybar, CDW, DigiKey, Office Depot, Newark, Dell, Amazon),
#   all quoting the identical "40 lbs / 18.1 kgs capacity; 12-in. / 305 mm
#   Deep" spec and SRSHELF2P1U model number.
#
# NO PORTS, NO PSU_SLOTS, ON PURPOSE — a passive mechanical shelf has
# neither: ADR-0051 §1 names exactly this class, a shelf that "occupies units
# like anything else" and holds equipment placed on it by a `sits-on` edge,
# not one wired through it. The format still requires a `front` faceplate to
# exist (`CatalogueGate::MissingFrontFace`), so one is declared here with
# `port_count: 0` and an empty `port_groups: []` — the closed-format way of
# saying "this plate carries nothing", the same reasoning `psu_slots`'s
# absence already carries for panduit's and apc's passive entries, applied to
# the one field this model cannot omit outright.
#
# `form: shelf` — new this file (ADR-0051 §1's `PassiveNode.form` gaining
# `shelf`/`outlet`; see `crates/fathom-corpus/src/catalogue.rs`'s `ModelForm`
# doc comment): with no ports and no slots, nothing else in this file could
# say what kind of passive this is, which is exactly the gap `form` closes.
vendor: tripplite
model: SRSHELF2P1U
rack_units: 1
form: shelf
reviewed_by: <named human>
source:
  cite: >
    Eaton/Tripp Lite, product page for SRSHELF2P1U, "SmartRack 1U Cantilever
    Fixed Shelf (40 lbs / 18.1 kgs capacity; 12-in. / 305 mm Deep)"
    (tripplite.eaton.com/smartrack-1u-cantilever-fixed-shelf-40-lb-18-kg-
    capacity-12-in-305-mm-depth~SRSHELF2P1U, mirrored at
    tripplite.eaton.com/support/SRSHELF2P1U and eaton.com/us/en-us/
    skuPage.SRSHELF2P1U.html), for the 1U height, cantilever/fixed/vented
    construction and lack of any port or connector; corroborated by
    independent listings (Graybar, CDW, DigiKey, Office Depot, Newark, Dell,
    Amazon) quoting the identical model number, capacity and depth — all read
    via web search synthesis on 2026-09-18 because this environment's network
    egress blocked a direct fetch of every vendor domain tried (see the file
    header for what was tried).
  read_on: "2026-09-18"
faceplates:
  - face: front
    port_count: 0
    port_groups: []
