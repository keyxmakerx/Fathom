# corpus/catalogue/cyberpower/pr1500lcdrt2u.yaml — read by fathom-corpus's
# `catalogue` module (crates/fathom-corpus/src/catalogue.rs), which see for
# the format's rules: unknown keys refused, positions and numbering are a
# pattern the reader expands, never coordinates this file states outright.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10,
# same convention as corpus/catalogue/juniper/ex4300-48p.yaml).
#
# WHERE EVERY NUMBER BELOW CAME FROM.
#
# This environment's network egress is blocked for every domain tried on
# 2026-09-18, including cyberpowersystems.com and apc.com directly (`curl`
# through the configured proxy and this session's WebFetch tool both returned
# EGRESS_BLOCKED on the CONNECT — see corpus/catalogue/tripplite/
# srshelf2p1u.yaml's header for the full list of domains tried that same
# session). CyberPower's own product page could therefore not be fetched and
# read verbatim, which CLAUDE.md rule 1 asks to be stated plainly rather than
# papered over. What follows is the best available evidence given that
# constraint, and no further: web search results dated 2026-09-18 that named
# and quoted CyberPower's own product page and datasheet PDF for
# PR1500LCDRT2U, corroborated across independent listings — the same method,
# for the same reason, as ap7920b.yaml's header.
#
# WHY THIS MODEL AND NOT A PLAIN "TOWER-ONLY" ONE: both APC's SMT1500 and
# CyberPower's own PR1500LCD (no "RT2U" suffix) are tower-only chassis with
# no stated rack-unit height anywhere in their own listings — a genuine
# CLAUDE.md rule 1 dead end for this format's mandatory `rack_units` field
# (see the field's own note below). PR1500LCDRT2U is the same electrical
# unit in CyberPower's "rack/tower convertible" chassis: it ships as a tower
# by default and converts to rack mount with included ears, and CyberPower's
# own material states its height as "2U" / "2 RU" directly, which is what
# this entry's `rack_units` rests on — an established fact, not a guess.
#
#   CyberPower, product page for PR1500LCDRT2U, Smart App Sinewave UPS series
#   (cyberpowersystems.com/product/ups/smart-app-sinewave/pr1500lcdrt2u/) —
#   content established via web search synthesis, read 2026-09-18 (see note
#   above): 1500 VA / 1000 W, line-interactive, 2U / 2 RU rack/tower
#   convertible chassis, integrated LCD panel. Output: eight (8) battery-and-
#   surge-protected NEMA 5-15R receptacles (four of them additionally marked
#   "fail-safe" for critical loads — a load-priority distinction this format
#   has no field for and does not need one for, same reasoning
#   ap7920b.yaml's header gives for AP7920B's switched-outlet electronics).
#   Input: NEMA 5-15P plug on a permanently-attached (captive) cord, per the
#   datasheet's own "Input Connections" table, not a removable inlet socket
#   on the chassis. Rear connections also include a serial port, a USB
#   Type-B port, and an "Ethernet RJ45 / Phone RJ11 combo jack" (a
#   DATA-LINE SURGE-PROTECTION passthrough for a network or phone cable
#   routed through the UPS — CyberPower's own material describes it as
#   "Data Line Protection", not as a monitoring/management interface) and a
#   coax passthrough.
#
#   Corroborated by independent listings and mirrors dated the same search
#   (B&H Photo, Newegg, networkcamerastore.com, a CyberPower datasheet PDF
#   mirrored at lit.stromquist.com), all agreeing on the 2U rack/tower
#   convertible chassis, 8x NEMA 5-15R output, NEMA 5-15P captive input cord,
#   and the RJ45/RJ11 combo jack's data-line (not management) role.
#
# NO MANAGEMENT RJ45 DECLARED — COULD NOT ESTABLISH ONE, STATED PLAINLY
# (CLAUDE.md rule 1, and this task's own instruction to stop on a model
# rather than guess). This model's rear panel does carry one RJ45-shaped
# jack, but every source read names it a data-line SURGE PROTECTOR for a
# phone/network cable passing physically through the UPS, not a monitoring
# or management interface — true SNMP/HTTP out-of-band management on this
# chassis needs an optional RMCARD201 accessory card (an accessory this
# format does not model, the same "accessory slot, not a port" reasoning
# `psu_slots`'s own module doc gives for a hot-swap bay with nothing seated
# in it). Declaring the data-line jack as `role: management` would misname
# what it does; this entry omits it rather than doing that.
#
# NO `psu_slots` DECLARED, ON PURPOSE — every source above describes the
# input as a permanently-attached cord ending in a NEMA 5-15P plug, not a
# removable inlet socket on the unit. There is no slot to name: a
# `psu_slots` entry needs a vendor-printed slot name and a position on a
# face (`crates/fathom-corpus/src/catalogue.rs`'s `PsuSlot`), and this unit
# has neither, only a captive cord — the identical reasoning
# corpus/catalogue/apc/ap7920b.yaml's header states for its own captive C14
# cord, mains-plug flavoured instead of IEC-flavoured.
#
# `form` IS NOT SET on this entry, on purpose: this is an active device with
# real faceplates and a real `rack_units`, exactly the shape `ModelForm`'s
# own doc comment says needs no `form` at all (a rack switch, a patch panel
# or a PDU is fully described by its faceplates already) — the field exists
# for shelves and outlet boxes, not for this.
#
# THE OUTLETS ARE DECLARED ON THE REAR FACE, THE FRONT FACE CARRIES NONE:
# every UPS in this vendor's own photography and every corroborating listing
# shows the outlet bank, input cord and data connections on the unit's rear
# panel; the front carries the LCD display and control buttons, no ports.
# The format requires a `front` faceplate to exist
# (`CatalogueGate::MissingFrontFace`), so one is declared here with
# `port_count: 0` and an empty `port_groups: []` — the same closed-format
# convention corpus/catalogue/tripplite/srshelf2p1u.yaml's header explains
# for a plate that carries nothing.
vendor: cyberpower
model: PR1500LCDRT2U
rack_units: 2
reviewed_by: <named human>
source:
  cite: >
    CyberPower, product page for PR1500LCDRT2U, Smart App Sinewave UPS series
    (cyberpowersystems.com/product/ups/smart-app-sinewave/pr1500lcdrt2u/),
    for the 2U rack/tower convertible chassis, 8x NEMA 5-15R output and
    captive NEMA 5-15P input cord; corroborated by independent listings and a
    mirrored datasheet PDF (B&H Photo, Newegg, networkcamerastore.com,
    lit.stromquist.com) describing the same unit, including its rear
    "Ethernet RJ45 / Phone RJ11 combo jack" being documented as a data-line
    surge-protection passthrough rather than a management interface — all
    read via web search synthesis on 2026-09-18 because this environment's
    network egress blocked a direct fetch of cyberpowersystems.com (see the
    file header for what was tried).
  read_on: "2026-09-18"
faceplates:
  - face: front
    port_count: 0
    port_groups: []
  - face: rear
    port_count: 8
    port_groups:
      - { kind: "nema_5_15r", role: access, layout: single_row, count: 8, start_number: 1 }
