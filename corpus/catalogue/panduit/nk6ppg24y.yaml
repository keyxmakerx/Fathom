# the format's "passive panel" expression, and a patch panel is genuinely
# unpowered hardware — ADR-0037 §5's `PassiveNode` names exactly this class,
# *"hardware with ports and no configuration"*, and a `PatchPanel` is one of
# its named forms. Omitting the field (`psu_slots` defaults to an empty list
