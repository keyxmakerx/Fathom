# corpus/dict/linux-host/interfaces.yaml -- what a Linux host prints about its
# own interfaces: `ip addr`, `ip -d link`, and their `-o` one-line forms.
# Path shape: [ <interface name>, <attribute word>, <value> ] as
# crates/fathom-ingest/src/iproute.rs synthesises it from real bytes of the
# paste. Sources and the full trail: corpus/dict/README-linux-host.md.
#
# An address is bound under a keyless LogicalUnit with index 0, as RouterOS's
# is: Linux puts an address on the interface itself and has no unit number,
# and the schema owns Address by LogicalUnit (README-linux-host.md, "Units").
platform: linux-host
source: { cite: "iproute2 manual pages ip-address(8), ip-link(8) (man7.org) and the kernel's operstates document (docs.kernel.org); see corpus/dict/README-linux-host.md", read_on: "2026-10-16" }
reviewed_by: <named human>
entries:
  # `2: eth0: <…> …` -- the record header names the interface.
  - id: linux-host/link
    path: ["$i"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
    versions: "*"
    reviewed_by: <named human>

  # `<…,UP,…>`: IFF_UP, "Interface is admin up" (kernel operstates document).
  # Its absence is not read as admin down: a header with no flags shown says
  # nothing either way.
  - id: linux-host/link.up
    path: ["$i", UP]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: admin_up, const_bool: true } ] }
    versions: "*"
    reviewed_by: <named human>

  # `vlan protocol 802.1Q id 10` under `ip -d link`: an interface of its own
  # name, and the VLAN it carries.
  - id: linux-host/link.vlan.id
    path: ["$i", vlan, id, "$v"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: Vlan, key: "$i", fields: [ { field: name, from: "$i", scalar: Identifier }, { field: vlan_id, from: "$v", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: linux-host/addr.inet
    path: ["$i", inet, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: linux-host/addr.inet6
    path: ["$i", inet6, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress } ] }
    versions: "*"
    reviewed_by: <named human>

  # `root@fw1:~# ip -d addr` -- a shell prompt pasted with the output names
  # the host. iproute.rs only shapes a host that opens with a letter.
  - id: linux-host/prompt.host
    path: ["@", "$h"]
    binds:
      nodes:
        - { as: n0, kind: Device, fields: [ { field: hostname, from: "$h", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>
