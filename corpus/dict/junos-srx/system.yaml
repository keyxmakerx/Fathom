# corpus/dict/junos-srx/system.yaml — WO-03 §4.7 entries 1-7 and 39.
#
# Seven of these eight entries exist to feed the redaction gate, not the
# binder: `14` §9.1's fourth structural property is that the set of `secret:`
# entries IS the redaction catalogue, so a stanza Fathom does not model still
# has to be catalogued here or its credential reaches the store.
#
# `reviewed_by: <named human>` is a placeholder, not a name. Invariant 10 is
# not satisfied until a named SRX-competent human replaces every one of them
# (WO-03 §10 item 9).
platform: junos-srx
entries:
  - id: junos-srx/system.host-name
    path: [system, host-name, "$h"]
    binds:
      nodes:
        - { as: n0, kind: Device, fields: [ { field: hostname, from: "$h", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  # Verified against Juniper's CLI reference on 2026-08-10 rather than recalled
  # (ADR-0034 §5). "domain-name (System)" — Syntax: `domain-name domain-name ;`
  # Hierarchy Level: `[edit system]`. Options: "Name of the domain… The length
  # of the domain name cannot exceed 255 characters." Introduced before Junos
  # OS 7.4, so `versions: "*"` is the correct predicate and not a shrug.
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/domain-name-edit-system.html
  - id: junos-srx/system.domain-name
    path: [system, domain-name, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Device, fields: [ { field: domain_name, from: "$d", scalar: Fqdn } ] }
    versions: "*"
    reviewed_by: <named human>

  # ---- added 2026-08-15 by the branch-coverage widening ----
  #
  # `time-zone` — verified against Juniper's CLI reference on 2026-08-15
  # (ADR-0034). "time-zone" — Syntax: `time-zone (GMT hour-offset |
  # time-zone);` Hierarchy Level: `[edit system]`. Default: UTC. The option
  # list is the tzdb continent/city set (`America/New_York`, `Europe/London`,
  # …), which is what `TzName` validates.
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/time-zone-edit-system.html
  #
  # `GMT <hour-offset>` is NOT carried: it is two tokens where the tzdb form
  # is one, `TzName` is a tzdb identifier and not an offset, and there is no
  # schema field for an offset. Such a line stays residue.
  #
  # The `Device` node is the implicit node 0; declaring it gives
  # `SystemSettings` its containment owner (`HasSystemSettings`).
  - id: junos-srx/system.time-zone
    path: [system, time-zone, "$tz"]
    binds:
      nodes:
        - { as: n0, kind: Device }
        - { as: n1, kind: SystemSettings, owner: n0, fields: [ { field: time_zone, from: "$tz", scalar: TzName } ] }
    versions: "*"
    reviewed_by: <named human>

  # `ntp server` — verified against Juniper's CLI reference on 2026-08-15
  # (ADR-0034). "server (NTP)" — Hierarchy Level: `[edit system ntp]`.
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/server-edit-system-ntp.html
  #
  # The schema comment on this kind is the reason it is worth the entry:
  # "In the schema because clock skew kills certificates."
  #
  # Junos also accepts a hostname here; `NtpServer.address` is typed `IpAddr`
  # and nothing in the IR holds an NTP server's name, so a hostname produces a
  # `ValueUnparsed` diagnostic rather than a silently dropped server. The
  # `prefer` and `version` sub-statements are separate lines and are not
  # carried yet.
  #
  # THREE nodes, not two: `HasNtpServer` runs SystemSettings -> NtpServer, not
  # Device -> NtpServer. Owning the server directly off the Device compiled,
  # loaded, and passed every unit test, and then failed in the browser with
  # `NoContainmentEdge { owner: Device, child: NtpServer }` on the first real
  # paste. `crates/fathom-weld/tests/containment.rs` now derives the pairs from
  # the dictionary itself so the next one fails at `cargo test` instead.
  # The unkeyed SystemSettings node coalesces with the one `system time-zone`
  # creates: same kind, same owner, same empty key, so `Builder::upsert`
  # returns the same node.
  - id: junos-srx/system.ntp.server
    path: [system, ntp, server, "$ip"]
    binds:
      nodes:
        - { as: n0, kind: Device }
        - { as: n1, kind: SystemSettings, owner: n0 }
        - { as: n2, kind: NtpServer, owner: n1, key: "$ip", fields: [ { field: address, from: "$ip", scalar: IpAddr } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/system.root-authentication.encrypted-password
    path: [system, root-authentication, encrypted-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/system.root-authentication.plain-text-password
    path: [system, root-authentication, plain-text-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/system.login.user.encrypted-password
    path: [system, login, user, "$u", authentication, encrypted-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/system.login.user.plain-text-password
    path: [system, login, user, "$u", authentication, plain-text-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/system.tacplus-server.secret
    path: [system, tacplus-server, "$ip", secret, "$v"]
    secret: { label: tacacs-key }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/snmp.community
    path: [snmp, community, "$name"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/snmp.trap-group
    path: [snmp, trap-group, "$g"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>
