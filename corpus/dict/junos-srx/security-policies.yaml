# corpus/dict/junos-srx/security-policies.yaml — `set security policies
# from-zone X to-zone Y policy NAME …`.
#
# Read off Juniper's CLI reference page "policies (Security)" on
# **2026-08-15** (ADR-0034 — the source AND the date; the URL is already cited
# by `docs/60-content/66-junos-coverage-measurement.md` §10's own table,
# reused here rather than re-derived):
#
#   https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/security-edit-policies.html
#
#   policies {
#       from-zone zone-name to-zone zone-name {
#           policy policy-name {
#               match { source-address address; destination-address address;
#                       application application; }
#               then { permit; deny; reject; }
#           }
#       }
#   }
#
#   Hierarchy Level: [edit security policies]
#
# Confirmed by the guided-setup worked example this project already sourced
# and dated (`docs/60-content/66-junos-coverage-measurement.md` §10):
# *Configure Secure Local Branch Connectivity*, which is where
# `tests/fixtures/junos-srx-branch-documented.txt` lines 84-104 come from.
#
# `PolicySet.scope` is the zone pair (schema 0.17, `PolicyScope::ZonePair`): each
# entry below re-asserts it, because a display-set line can name a policy by any
# of its statements and no bare stanza line is ever printed. A zone the paste says
# nothing else about is created with its name, since the policy names it.
# `evaluation` is left unset: the first-match claim wants its own vendor citation.
#
# `PolicySet` is keyed on the zone PAIR (`["$fz", "$tz"]`), not on either zone
# alone: three of the four pairs in the reference fixture share `trust` as the
# source and two share `untrust` as the destination, so a single-zone key
# would silently merge distinct zone-pair policy lists into one, scrambling
# the evaluation order rung 4 exists to show "exactly, not heuristically"
# (`57` §6.3). `schema/schema.yaml`'s own `PolicySet` doc makes the same point:
# "a Junos policy belongs to a zone *pair*, not to a zone."
#
# `SecurityPolicy.ordinal` is assigned once, at first creation, by
# `ordinal_on_create` (`bind.rs`) — never re-derived from a statement's line
# number, because a policy's four lines (bare stanza, two matches, `then`) can
# appear in any order and only one of them is the line that happens to create
# the node.
#
# WHAT STAYS RESIDUE, deliberately:
#   - `match source-address NAME` / `destination-address NAME` bind a MatchSource /
#     MatchDestination edge to the address object or set of that name when the
#     paste defines it (`security-address-book.yaml`); a name defined nowhere in
#     the paste (a zone-scoped book, a predefined name) gets a name-only
#     AddressObject, so the match is never smaller than the device's; the line is residue.
#     The literal `any` binds `match_any_*`.
#   - `match application NAME` binds a MatchApplication edge to an `Application`
#     named NAME, made if the paste does not define it. Predefined names such as
#     `junos-http` therefore exist as name-only applications with no `l4`; their
#     ports are not known from the config. `any` binds `match_any_application`.
#   - `then permit tunnel ipsec-vpn NAME` (`TunnelsVia`, policy-based VPN) and
#     `description`, `deactivate … policy NAME` (`enabled = false`): not exercised
#     by the reference fixture, not bound. A deactivated policy is therefore stored as
#     active (the verb is unsupported): a reader must not trust `enabled` unset.
#   - `then deny` and `then reject` are in the syntax block transcribed above
#     (same page, same date) and bind the same way `then permit` does.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-srx
source: { cite: "Juniper Junos CLI reference, policies (edit security policies)", read_on: "2026-08-15" }
reviewed_by: <named human>
entries:
  # The bare stanza. `14` §7.1: "the second creates the node with no fields."
  # `partial: true` because every entry below extends this same path with a
  # `match` or `then` sub-statement.
  - id: junos-srx/security.policies.policy
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy"]
    partial: true
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.match-source-any
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, source-address, any]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: match_any_source, const_bool: true }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.match-destination-any
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, destination-address, any]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: match_any_destination, const_bool: true }
    versions: "*"
    reviewed_by: <named human>

  # `match application any` (the fixture's `trust-to-untrust`); the field joined its
  # two siblings in schema 0.17.
  - id: junos-srx/security.policies.match-application-any
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, application, any]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: match_any_application, const_bool: true }
    versions: "*"
    reviewed_by: <named human>

  # A name, not `any` (the literal entry above wins). The edge resolves in the paste
  # after all statements are read; an address object and an address set share one
  # namespace on the device, so either kind may answer.
  - id: junos-srx/security.policies.match-source-address
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, source-address, "$a"]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
      edges:
        - { kind: MatchSource, from: rule, to: { by_name: { kind: AddressObject, also: AddressSet, from: "$a" } } }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.match-destination-address
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, destination-address, "$a"]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
      edges:
        - { kind: MatchDestination, from: rule, to: { by_name: { kind: AddressObject, also: AddressSet, from: "$a" } } }
    versions: "*"
    reviewed_by: <named human>

  # One statement per application (a policy lists several). The application node is
  # made by name if the paste defines none; see the residue note above.
  - id: junos-srx/security.policies.match-application
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", match, application, "$app"]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
        - { as: app, kind: Application, key: "$app", fields: [ { field: name, from: "$app", scalar: Identifier } ] }
      edges:
        - { kind: MatchApplication, from: rule, to: { by_name: { kind: Application, from: "$app" } } }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.then-permit
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", then, permit]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: action, const_enum: "PolicyAction.permit" }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.then-deny
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", then, deny]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: action, const_enum: "PolicyAction.deny" }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.policies.then-reject
    path: [security, policies, from-zone, "$fz", to-zone, "$tz", policy, "$policy", then, reject]
    binds:
      nodes:
        - as: set
          kind: PolicySet
          key: ["$fz", "$tz"]
          fields:
            - { field: scope, zone_pair: { from: "$fz", to: "$tz" } }
        - as: rule
          kind: SecurityPolicy
          owner: set
          key: "$policy"
          ordinal_on_create: true
          fields:
            - { field: name, from: "$policy", scalar: Identifier }
            - { field: action, const_enum: "PolicyAction.reject" }
    versions: "*"
    reviewed_by: <named human>
