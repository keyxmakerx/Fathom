# corpus/dict/junos-srx/interfaces.yaml — WO-03 §4.7 entry 38.
#
# `@interface_like` resolves the node kind from the captured interface name:
# the prefix before the first ASCII digit — `st` -> TunnelInterface, `reth` ->
# RethInterface, `ae` -> AggregateInterface, anything else -> Interface.
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-srx
entries:
  - id: junos-srx/interfaces.unit.family-inet-address
    path: [interfaces, "$if", unit, "$u", family, inet, address, "$a"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: families, append_enum: Family.inet } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress }, { field: family, const_enum: AddressFamily.inet } ] }
    versions: "*"
    reviewed_by: <named human>

  # Verified against Juniper's CLI reference on 2026-08-10 rather than recalled
  # (ADR-0034 §5). "description (Interfaces)" — Syntax: `description text ;`
  # Hierarchy Level: `[edit interfaces interface-name ]`,
  # `[edit interfaces interface-name unit logical-unit-number ]`,
  # `[edit logical-systems logical-system-name interfaces …]`.
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/description-edit-interfaces.html
  #
  # TWO entries because Junos accepts it at two levels and they are different
  # facts: one describes the port, one describes the unit. Binding both to the
  # interface would silently move a unit's description up a level, which is the
  # class of quiet wrongness `14`'s refuse-to-guess rule exists to prevent. The
  # logical-systems level is deliberately not carried — WO-03 §4.1 defers
  # logical systems entirely, so such a line stays visible as residue rather
  # than being bound to the wrong device.
  #
  # The lexer strips the quotes and resolves the escapes before this binds, so
  # `description "WAN to ISP"` stores `WAN to ISP` (`14` §5.1).
  - id: junos-srx/interfaces.description
    path: [interfaces, "$if", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/interfaces.unit.description
    path: [interfaces, "$if", unit, "$u", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>

  # ---- added 2026-08-15 by the branch-coverage widening ----
  #
  # `disable` — verified against Juniper's CLI reference on 2026-08-15
  # (ADR-0034). "disable (Interfaces)" — Syntax: `disable;` Hierarchy Level:
  # `[edit interfaces interface-name]`,
  # `[edit interfaces interface-name unit logical-unit-number]`, …
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/disable-edit-interfaces.html
  #
  # The IR stores the POSITIVE (`admin_up`) and Junos writes the NEGATIVE, so
  # the entry asserts `false`. This is the inversion the schema's own field
  # doc predicts — "Junos emits the negative (disable); the emitter owns that
  # inversion" — carried on the read path too, where it belongs: the parser
  # must not hand the store a value spelled the vendor's way.
  #
  # TWO entries, port and unit, for the same reason `description` has two.
  - id: junos-srx/interfaces.disable
    path: [interfaces, "$if", disable]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName }, { field: admin_up, const_bool: false } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/interfaces.unit.disable
    path: [interfaces, "$if", unit, "$u", disable]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: admin_up, const_bool: false } ] }
    versions: "*"
    reviewed_by: <named human>

  # vlan-id (VLAN ID to Be Bound to a Logical Interface). Re-read on the page
  # cited here, 2026-08-15, and quoted from it:
  #   Syntax           vlan-id number | unmatched ;
  #   Hierarchy Level  [edit interfaces interface-name unit logical-unit-number ],
  #                    [edit logical-systems … interfaces … unit … ]
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/vlan-id-edit-interfaces.html
  #
  # An earlier draft of this comment quoted `vlan-id (all | none | number);`
  # and "Hierarchy Level for ELS platforms" beside this URL. Neither is on this
  # page — both come from `vlan-id-edit-vlans-qfx-series.html`, the VLANS-level
  # statement of the same name, which `vlans.yaml` cites. Title and URL from one
  # page, syntax and hierarchy from another: a maintainer checking the recorded
  # evidence at the recorded URL would not have found the quoted words.
  #
  # The special token at THIS hierarchy is `unmatched`, not `all` or `none`.
  # None of the three bind: `LogicalUnit.vlan_id` is a `VlanId` (1..=4094) and
  # no word is one, so each produces a `ValueUnparsed` diagnostic — the unit
  # still binds, the tag does not. Behaviour is unchanged by this correction;
  # only the record is.
  #
  # The page's Options also give the number ranges (1 through 1023 for some
  # PICs, 1 through 4094 for others, 0 reserved for priority tagging). The
  # schema's `VlanId` is the wider of the two, which is the safe direction: a
  # value legal on the device is never refused for want of knowing the PIC.
  - id: junos-srx/interfaces.unit.vlan-id
    path: [interfaces, "$if", unit, "$u", vlan-id, "$v"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: vlan_id, from: "$v", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  # `family ethernet-switching vlan members <vlan>` — the statement that puts
  # a branch access port in a VLAN, and the reason a branch config's LAN was
  # invisible. Read on 2026-08-15 from Juniper's Guided Setup, *Configure
  # Secure Local Branch Connectivity*, which uses it verbatim:
  # `set interfaces ge-0/0/1 unit 0 family ethernet-switching vlan members guests`
  # https://www.juniper.net/documentation/us/en/software/guided-setup/branch-srx-gs/topics/topic-map/step-1-p2-secure_local.html
  #
  # Two facts on one line and both are kept: the unit runs the
  # ethernet-switching family, and it is a member of a named Vlan. The
  # membership is the `VlanMember` edge (LogicalUnit -> Vlan), resolved by
  # name within the fragment and Pending otherwise. The edge's `mode`
  # (access/trunk) is NOT set — Junos states it elsewhere
  # (`interface-mode`/`port-mode`), and guessing it from this line would be
  # exactly the quiet wrongness `14`'s refuse-to-guess rule exists to prevent.
  - id: junos-srx/interfaces.unit.family-ethernet-switching.vlan-members
    path: [interfaces, "$if", unit, "$u", family, ethernet-switching, vlan, members, "$vlan"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: families, append_enum: Family.ethernet_switching } ] }
      edges:
        - { kind: VlanMember, from: n1, to: { by_name: { kind: Vlan, from: "$vlan" } } }
    versions: "*"
    reviewed_by: <named human>
