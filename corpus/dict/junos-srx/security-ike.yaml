# corpus/dict/junos-srx/security-ike.yaml — WO-03 §4.7 entries 8-21, plus the
# three bare-stanza entries added 2026-08-15. See security-ipsec.yaml's header
# for why they exist and why each carries `partial: true`.
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-srx
entries:
  - id: junos-srx/security.ike.proposal
    path: [security, ike, proposal, "$p"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.policy
    path: [security, ike, policy, "$pol"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: IkePolicy, key: "$pol", fields: [ { field: name, from: "$pol", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway
    path: [security, ike, gateway, "$gw"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: IkeGateway, key: "$gw", fields: [ { field: name, from: "$gw", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.proposal.authentication-method
    path: [security, ike, proposal, "$p", authentication-method, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier }, { field: authentication_method, from: "$v", scalar: AuthMethod } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.proposal.dh-group
    path: [security, ike, proposal, "$p", dh-group, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier }, { field: dh_group, from: "$v", scalar: DhGroup } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.proposal.authentication-algorithm
    path: [security, ike, proposal, "$p", authentication-algorithm, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier }, { field: authentication_algorithm, from: "$v", scalar: IntegrityAlgorithm } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.proposal.encryption-algorithm
    path: [security, ike, proposal, "$p", encryption-algorithm, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier }, { field: encryption_algorithm, from: "$v", scalar: EncryptionAlgorithm } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.proposal.lifetime-seconds
    path: [security, ike, proposal, "$p", lifetime-seconds, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeProposal, key: "$p", fields: [ { field: name, from: "$p", scalar: Identifier }, { field: lifetime_seconds, from: "$v", scalar: Seconds } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.policy.proposals
    path: [security, ike, policy, "$pol", proposals, "$prop"]
    binds:
      nodes:
        - { as: n0, kind: IkePolicy, key: "$pol", fields: [ { field: name, from: "$pol", scalar: Identifier } ] }
      edges:
        - { kind: UsesProposal, from: n0, to: { by_name: { kind: IkeProposal, from: "$prop" } }, ordinal_from_position: true }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.policy.mode
    path: [security, ike, policy, "$pol", mode, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkePolicy, key: "$pol", fields: [ { field: name, from: "$pol", scalar: Identifier }, { field: mode, from: "$v", scalar: IkePolicyMode } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.policy.pre-shared-key.ascii
    path: [security, ike, policy, "$pol", pre-shared-key, ascii-text, "$v"]
    secret: { label: psk }
    binds:
      nodes:
        - { as: n0, kind: IkePolicy, key: "$pol", fields: [ { field: name, from: "$pol", scalar: Identifier }, { field: pre_shared_key, secret_placeholder: psk } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.policy.pre-shared-key.hex
    path: [security, ike, policy, "$pol", pre-shared-key, hexadecimal, "$v"]
    secret: { label: psk }
    binds:
      nodes:
        - { as: n0, kind: IkePolicy, key: "$pol", fields: [ { field: name, from: "$pol", scalar: Identifier }, { field: pre_shared_key, secret_placeholder: psk } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway.ike-policy
    path: [security, ike, gateway, "$gw", ike-policy, "$pol"]
    binds:
