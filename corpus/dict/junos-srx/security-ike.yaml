    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway.address
    path: [security, ike, gateway, "$gw", address, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeGateway, key: "$gw", fields: [ { field: name, from: "$gw", scalar: Identifier }, { field: peer, from: "$v", scalar: PeerAddress } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway.external-interface
    path: [security, ike, gateway, "$gw", external-interface, "$unit"]
    binds:
      nodes:
        - { as: n0, kind: IkeGateway, key: "$gw", fields: [ { field: name, from: "$gw", scalar: Identifier } ] }
      edges:
        - { kind: ExternalInterface, from: n0, to: { interface_unit: "$unit" } }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway.version
    path: [security, ike, gateway, "$gw", version, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeGateway, key: "$gw", fields: [ { field: name, from: "$gw", scalar: Identifier }, { field: version, from: "$v", scalar: IkeVersion } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-srx/security.ike.gateway.nat-keepalive
    path: [security, ike, gateway, "$gw", nat-keepalive, "$v"]
    binds:
      nodes:
        - { as: n0, kind: IkeGateway, key: "$gw", fields: [ { field: name, from: "$gw", scalar: Identifier }, { field: nat_keepalive, from: "$v", scalar: Seconds } ] }
    versions: "*"
    reviewed_by: <named human>
