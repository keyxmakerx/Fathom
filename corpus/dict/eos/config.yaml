# corpus/dict/eos/config.yaml -- an Arista EOS `show running-config`.
# Path shape: [ <opener words>, <line words> ] as
# crates/fathom-ingest/src/blockcfg.rs (dialect `EOS`) synthesises it from real
# bytes of the paste. Three things that reader does for EOS and no other:
#   - `interface Vlan10` opens with [interface, Vlan10, Vlan, 10]: the SVI's name
#     split into its two parts, so an entry can tie the SVI to VLAN 10.
#   - `description …` is one value to the end of the line (EOS does not quote it).
#   - `switchport trunk allowed vlan 10,20,30-32` is one statement per VLAN; a
#     range wider than 256 VLANs (`1-4094`) is not read.
# Sources and what is open: corpus/dict/README-eos.md.
platform: eos
source: { cite: "EOS configs generated by Arista's AVD (github.com/aristanetworks/avd, examples/single-dc-l3ls/intended/configs: dc1-leaf1a, dc1-leaf2a, dc1-spine1); see corpus/dict/README-eos.md", read_on: "2026-11-02" }
reviewed_by: <named human>
entries:
  - id: eos/hostname
    path: [hostname, "$h"]
    binds:
      nodes:
        - { as: n0, kind: Device, fields: [ { field: hostname, from: "$h", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  # `vlan 11` opens a VLAN's block. `vlan internal order ascending range …`
  # matches the path too, and binds nothing: `internal` is not a VLAN id.
  - id: eos/vlan
    path: [vlan, "$v"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: Vlan, key: "$v", fields: [ { field: vlan_id, from: "$v", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/vlan.name
    path: [vlan, "$v", name, "$n"]
    binds:
      nodes:
        - { as: n0, kind: Vlan, key: "$v", fields: [ { field: vlan_id, from: "$v", scalar: VlanId }, { field: name, from: "$n", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  # ---- every interface: Ethernet1, Ethernet49/1, Port-Channel5, Loopback0,
  # Management1. `Port-Channel…` is an AggregateInterface (bind.rs
  # `interface_like`).
  - id: eos/interface
    path: [interface, "$i"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/interface.description
    path: [interface, "$i", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/interface.shutdown
    path: [interface, "$i", shutdown]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: admin_up, const_bool: false } ] }
    versions: "*"
    reviewed_by: <named human>

  # AVD prints `no shutdown` on every interface it brings up.
  - id: eos/interface.no-shutdown
    path: [interface, "$i", "no", shutdown]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: admin_up, const_bool: true } ] }
    versions: "*"
    reviewed_by: <named human>

  # `ip address 10.255.255.1/31` on a routed port, a loopback, a routed
  # Port-Channel or Management1. EOS puts the address on the interface itself;
  # the schema owns Address by LogicalUnit, so it goes under a unit with index
  # 0, a stated constant (as routeros/ip.address does).
  - id: eos/interface.ip-address
    path: [interface, "$i", ip, address, "$a"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.inet } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress }, { field: family, const_enum: AddressFamily.inet } ] }
    versions: "*"
    reviewed_by: <named human>

  # `channel-group 3 mode active`: this port is a link of Port-Channel3. The
  # name is the number with `Port-Channel` before it.
  - id: eos/interface.channel-group
    path: [interface, "$i", channel-group, "$n", mode, "$m"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
      edges:
        - { kind: MemberOfAggregate, from: n0, to: { by_name: { kind: AggregateInterface, from: "$n", prefix: Port-Channel } } }
    versions: "*"
    reviewed_by: <named human>

  # ---- VLAN membership. The unit is the same index-0 unit an address uses.
  # A trunk with no `allowed vlan` line carries every VLAN; that is not read
  # (no line says which VLANs exist on the far side), so such a trunk carries
  # none here and the path trace says it could not establish the way.
  - id: eos/interface.switchport.access-vlan
    path: [interface, "$i", switchport, access, vlan, "$v"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.ethernet_switching } ] }
      edges:
        - { kind: VlanMember, from: n1, to: { by_name: { kind: Vlan, from: "$v" } } }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/interface.switchport.trunk-allowed-vlan
    path: [interface, "$i", switchport, trunk, allowed, vlan, "$v"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.ethernet_switching } ] }
      edges:
        - { kind: VlanMember, from: n1, to: { by_name: { kind: Vlan, from: "$v" } } }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/interface.switchport.trunk-native-vlan
    path: [interface, "$i", switchport, trunk, native, vlan, "$v"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.ethernet_switching } ] }
      edges:
        - { kind: VlanMember, from: n1, to: { by_name: { kind: Vlan, from: "$v" } } }
    versions: "*"
    reviewed_by: <named human>

  # ---- SVIs: `interface Vlan11`, read as [interface, Vlan11, Vlan, 11, …].
  # The SVI's unit routes VLAN 11 (L3Interface), the edge the path trace
  # follows from a gateway address to the ports carrying the VLAN.
  - id: eos/svi
    path: [interface, "$i", Vlan, "$v"]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" } ] }
        - { as: n2, kind: Vlan, key: "$v", fields: [ { field: vlan_id, from: "$v", scalar: VlanId } ] }
      edges:
        - { kind: L3Interface, from: n2, to: { node: n1 } }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/svi.description
    path: [interface, "$i", Vlan, "$v", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/svi.shutdown
    path: [interface, "$i", Vlan, "$v", shutdown]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: admin_up, const_bool: false } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/svi.no-shutdown
    path: [interface, "$i", Vlan, "$v", "no", shutdown]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName }, { field: admin_up, const_bool: true } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/svi.ip-address
    path: [interface, "$i", Vlan, "$v", ip, address, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.inet } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress }, { field: family, const_enum: AddressFamily.inet } ] }
        - { as: n3, kind: Vlan, key: "$v", fields: [ { field: vlan_id, from: "$v", scalar: VlanId } ] }
      edges:
        - { kind: L3Interface, from: n3, to: { node: n1 } }
    versions: "*"
    reviewed_by: <named human>

  # `ip address virtual 10.10.11.1/24`: the anycast gateway an MLAG pair (or
  # every leaf) shares. It is the hosts' gateway, so it is read as this SVI's
  # address; two switches holding it is what the path trace then reports.
  - id: eos/svi.ip-address-virtual
    path: [interface, "$i", Vlan, "$v", ip, address, virtual, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" }, { field: families, append_enum: Family.inet } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress }, { field: family, const_enum: AddressFamily.inet } ] }
        - { as: n3, kind: Vlan, key: "$v", fields: [ { field: vlan_id, from: "$v", scalar: VlanId } ] }
      edges:
        - { kind: L3Interface, from: n3, to: { node: n1 } }
    versions: "*"
    reviewed_by: <named human>

  # ---- VRFs. `vrf instance VRF10` is a routing instance, and an interface's
  # `vrf VRF10` puts its unit in it. The path trace keeps each VRF's table
  # apart (sign-off r96, round 2): a flow in VRF10 sees only VRF10's
  # connected and static routes.
  - id: eos/vrf-instance
    path: [vrf, instance, "$n"]
    binds:
      nodes:
        - { as: n0, kind: RoutingInstance, key: "$n", fields: [ { field: name, from: "$n", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/interface.vrf
    path: [interface, "$i", vrf, "$r"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" } ] }
      edges:
        - { kind: InRoutingInstance, from: n1, to: { by_name: { kind: RoutingInstance, from: "$r" } } }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/svi.vrf
    path: [interface, "$i", Vlan, "$v", vrf, "$r"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$i", fields: [ { field: name, from: "$i", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, fields: [ { field: index, const_enum: "u32.0" } ] }
      edges:
        - { kind: InRoutingInstance, from: n1, to: { by_name: { kind: RoutingInstance, from: "$r" } } }
    versions: "*"
    reviewed_by: <named human>

  # ---- static routes in the default table. A route with a distance or a name
  # after the next hop binds, and the line is still residue for what follows.
  # `ip route vrf …` is read by the entries after these: `vrf` is not a prefix,
  # so these bind nothing from such a line.
  - id: eos/ip-route
    path: [ip, route, "$dest", "$nh"]
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance }
        - as: route
          kind: StaticRoute
          owner: ri
          key: "$dest"
          fields:
            - { field: destination, from: "$dest", scalar: IpPrefix }
            - { field: next_hop, next_hop: "$nh" }
    versions: "*"
    reviewed_by: <named human>

  # `ip route 10.99.0.0/16 Null0`: a null route, read as discard.
  - id: eos/ip-route.null0
    path: [ip, route, "$dest", Null0]
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance }
        - as: route
          kind: StaticRoute
          owner: ri
          key: "$dest"
          fields:
            - { field: destination, from: "$dest", scalar: IpPrefix }
            - { field: next_hop, next_hop_const: discard }
    versions: "*"
    reviewed_by: <named human>

  # ---- static routes in a VRF's table (sign-off r96, round 2). AVD writes
  # `ip route vrf MGMT 0.0.0.0/0 172.16.1.1` in every device of its
  # single-dc-l3ls example (dc1-leaf1a.cfg line 250, read 2026-11-02). The route
  # belongs to the routing instance of that name, so the path trace looks it up
  # only for a flow in that VRF.
  - id: eos/ip-route-vrf
    path: [ip, route, vrf, "$r", "$dest", "$nh"]
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance, key: "$r", fields: [ { field: name, from: "$r", scalar: Identifier } ] }
        - as: route
          kind: StaticRoute
          owner: ri
          key: "$dest"
          fields:
            - { field: destination, from: "$dest", scalar: IpPrefix }
            - { field: next_hop, next_hop: "$nh" }
    versions: "*"
    reviewed_by: <named human>

  - id: eos/ip-route-vrf.null0
    path: [ip, route, vrf, "$r", "$dest", Null0]
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance, key: "$r", fields: [ { field: name, from: "$r", scalar: Identifier } ] }
        - as: route
          kind: StaticRoute
          owner: ri
          key: "$dest"
          fields:
            - { field: destination, from: "$dest", scalar: IpPrefix }
            - { field: next_hop, next_hop_const: discard }
    versions: "*"
    reviewed_by: <named human>
