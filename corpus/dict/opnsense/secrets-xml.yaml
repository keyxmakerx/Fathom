# corpus/dict/opnsense/secrets-xml.yaml -- the credentials OPNsense's
# config.xml carries, given their label. Every other value is destroyed anyway
# (config-xml.yaml's header); these entries name what was destroyed.
platform: opnsense
source: { cite: "opnsense/core master: src/etc/config.xml.sample, models/OPNsense/IPsec/IPsec.xml; opnsense/plugins master: net-mgmt/net-snmp models/OPNsense/Netsnmp/General.xml; see corpus/dict/opnsense/README-config-xml.md section 5", read_on: "2026-10-25" }
reviewed_by: <named human>
entries:
  # A bcrypt hash (`$2y$10$...` in config.xml.sample). Destroyed like a password.
  - id: opnsense/xml.system.user.password
    path: [system, user, name, "$u", password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  # IPsec.xml, mount //OPNsense/IPsec: preSharedKeys/preSharedKey/Key.
  - id: opnsense/xml.ipsec.psk
    path: [OPNsense, IPsec, preSharedKeys, preSharedKey, Key, "$v"]
    secret: { label: psk }
    versions: "*"
    reviewed_by: <named human>

  # IPsec.xml: keyPairs/keyPair/privateKey; a key pair is named by its `name`.
  - id: opnsense/xml.ipsec.private-key
    path: [OPNsense, IPsec, keyPairs, keyPair, name, "$n", privateKey, "$v"]
    secret: { label: cert-key }
    versions: "*"
    reviewed_by: <named human>

  # General.xml, mount //OPNsense/netsnmp/general: community.
  - id: opnsense/xml.netsnmp.community
    path: [OPNsense, netsnmp, general, community, "$v"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>
