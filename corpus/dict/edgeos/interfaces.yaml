# corpus/dict/edgeos/interfaces.yaml — read by fathom-ingest's `Dictionary`
# loader. See `corpus/dict/edgeos/system.yaml`'s header for the capture
# shape this whole platform is built against and `corpus/dict/
# README-ubiquiti.md` for the full citation trail; not repeated per file.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
#
# WHAT THIS FILE DOES NOT BIND, AND WHY — READ BEFORE ADDING TO IT.
#
# `set interfaces ethernet <if> address <addr>` (the BASE interface, no
# `vif`) is NOT bound below. Two independent sources, read 2026-09-19 (see
# README-ubiquiti.md), agree EdgeOS attaches an address straight to the
# ethernet interface with no sub-unit number in the statement:
# `set interfaces ethernet eth0 address dhcp`,
# `set interfaces ethernet eth1 address 10.0.10.1/24`.
# `schema/schema.yaml`'s `Address` kind is owned by `LogicalUnit`, never by
# `Interface` directly (`identity: [ owner(LogicalUnit), value ]`), and
# `LogicalUnit.index` is `card: "1", emit: R` — a required number. Junos
# supplies that number in the statement itself (`unit 0`); EdgeOS's base
# interface never does. The dict loader's field-spec grammar
# (`crates/fathom-ingest/src/dict.rs`, `ValueTy`/`FieldSpec`) has `from:`
# (capture a token) and `const_bool`/`const_enum` (a fixed non-numeric
# value) — NO `const_u32` or literal-integer field spec exists, so there is
# no way to write "this LogicalUnit's index is 0" without a captured digit
# to read it from. Binding this line would mean inventing the index rather
# than reading it, which is exactly what CLAUDE.md's refuse-to-guess rule
# forbids. What the core would need: a `const_int`/`const_u32` field-spec
# variant in `dict.rs`'s `load_field`, so a dictionary can state a literal
# default index for a platform whose base interface has no unit concept —
# a small, generic addition (useful for IOS-style dictionaries too, which
# have the identical no-unit-number problem), not attempted here.
#
# The base interface's `description` and `disable` ARE bound below — both
# attach directly to `Interface`, which needs no `LogicalUnit` and no
# invented number.
#
# `vif` (VLAN sub-interface) lines ARE bound, address included: `vif <N>`
# supplies a genuine captured digit, so `LogicalUnit.index` and
# `Vlan`/`LogicalUnit.vlan_id` both read from `$vif` rather than being
# invented. Two independent sources, read 2026-09-19: UISP's "EdgeRouter -
# Create Virtual Interfaces with VLAN IDs" and thetechnicianspot.com's VIF
# how-to, both giving `set interfaces ethernet eth1 vif 10 address
# 10.0.10.1/24` and `set interfaces ethernet eth1 vif 10 description
# <text>` (`switch0` is also a valid parent per the same sources — a
# VLAN-aware switch's own vif — and is bound identically below, sharing the
# `@interface_like`-style capture the Junos dictionary already uses for
# "whichever parent word came first").
#
# `set interfaces ethernet <if> disable` — read 2026-09-19: a UI Community
# thread titled "EdgeRouter 6P - Accidentally disable main LAN interface"
# and multiple independent EdgeRouter configuration guides (justinho.com,
# thehomeofthefuture.com) using `set interfaces ethernet eth2 disable` to
# shut an unused port down, corroborating the bare `disable` keyword — same
# shape as Junos's `disable`. The IR stores the POSITIVE (`admin_up`) and
# the statement is the NEGATIVE, so this entry asserts `false`, the same
# inversion `corpus/dict/junos-srx/interfaces.yaml`'s own `disable` entries
# record.
#
# `pppoe <N> password <secret>` — destroyed, not modelled (secret-only
# entry, same convention as this platform's SNMP and login-password
# entries in `system.yaml`). Two independent sources, read 2026-09-19:
# `EdgeRouter-Stuff/PPPoE.md` (github.com/TimoDJatomika) and a TPG-fibre
# EdgeRouter setup blog (blog.dalanmiller.com), both giving `set interfaces
# ethernet <if> pppoe <N> password <secret>`, and a third independent
# example nesting it under a `vif` first (`set interfaces ethernet eth2 vif
# 10 pppoe 0 password <secret>`) — this file's path therefore captures the
# parent segment generically as `$if` at the `ethernet` level only; the
# `vif`-nested PPPoE form is a second, longer statement this dictionary does
# not yet bind structurally.
#
# CORRECTION, same session, 2026-09-19: an earlier draft of this comment
# claimed the vif-nested form "still redacts on the `ethernet …` prefix
# match the trie walks through on its way there" — that is not what
# happens, and the claim was never actually exercised by a fixture (fixed
# below). Walking `[interfaces, ethernet, "$if", vif, "$vif", pppoe, "$n",
# password, "$v"]` against this entry's path `[interfaces, ethernet, "$if",
# pppoe, "$n", password, "$v"]`: after `$if` binds the interface name, the
# next literal segment this entry expects is `pppoe`, but the statement's
# next real token is `vif` — the two paths diverge one segment in, so
# `Dictionary::lookup` finds no entry at all for this statement, not a
# shorter one. `redact.rs`'s per-statement match is `None =>
# raw_walk(&segs, at)` for that case: with no entry, the CREDENTIAL is still
# destroyed, but by the two-token lookback over the statement's own raw
# tokens finding `password` in `dict::is_secret_word`'s word list — the same
# core-floor net that would catch an entirely unknown platform's password
# line, not this dictionary's structural entry. The vif-nested line is now
# in `crates/fathom-ingest/tests/edgeos.rs`'s capture and asserted gone, so
# this claim is checked rather than merely stated.
platform: edgeos
source: { cite: "Ubiquiti EdgeOS CLI documentation and community sources; see corpus/dict/README-ubiquiti.md for the full citation trail", read_on: "2026-09-19" }
reviewed_by: <named human>
entries:
  - id: edgeos/interfaces.ethernet.description
    path: [interfaces, ethernet, "$if", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.ethernet.disable
    path: [interfaces, ethernet, "$if", disable]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName }, { field: admin_up, const_bool: false } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.ethernet.pppoe.password
    path: [interfaces, ethernet, "$if", pppoe, "$n", password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.ethernet.vif.description
    path: [interfaces, ethernet, "$if", vif, "$vif", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$vif", fields: [ { field: index, from: "$vif", scalar: u32 }, { field: description, from: "$d", scalar: Text }, { field: vlan_id, from: "$vif", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.ethernet.vif.address
    path: [interfaces, ethernet, "$if", vif, "$vif", address, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$vif", fields: [ { field: index, from: "$vif", scalar: u32 }, { field: vlan_id, from: "$vif", scalar: VlanId } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.switch.vif.description
    path: [interfaces, switch, "$if", vif, "$vif", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$vif", fields: [ { field: index, from: "$vif", scalar: u32 }, { field: description, from: "$d", scalar: Text }, { field: vlan_id, from: "$vif", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: edgeos/interfaces.switch.vif.address
    path: [interfaces, switch, "$if", vif, "$vif", address, "$a"]
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$vif", fields: [ { field: index, from: "$vif", scalar: u32 }, { field: vlan_id, from: "$vif", scalar: VlanId } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress } ] }
    versions: "*"
    reviewed_by: <named human>
