# corpus/dict/junos-ex/aggregated-and-irb.yaml — LACP aggregated Ethernet
# and IRB (routed VLAN interface) coverage for the Junos EX switching
# platform. `reviewed_by: <named human>` is a placeholder, not a name
# (invariant 10).
platform: junos-ex
source: { cite: "Juniper Junos CLI reference, lacp (edit interfaces aggregated-ether-options); read via web-search synthesis, direct fetch of juniper.net blocked in this environment", read_on: "2026-09-19" }
reviewed_by: <named human>
entries:
  # ---- aggregated-ether-options: LACP on an ae interface ----
  #
  # `lacp (active | passive)` at `[edit interfaces ae-name
  # aggregated-ether-options lacp]` — read via search synthesis 2026-09-19
  # (direct fetch of juniper.net blocked; see the sibling catalogue files'
  # headers for the same failure this session):
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/lacp-edit-interfaces-aggregated-ethernet-qfx-series.html
  # "lacp { (active | passive); ... }" — the two tokens
  # `AggregateInterface.lacp_mode` is typed against (schema/schema.yaml:
  # `type: enum(lacp_mode)`, generated as `ir_types::LacpMode`, wire key
  # `AggregateInterface.lacp_mode` present in schema/field-keys.yaml).
  #
  # NOT BOUND — A REAL GAP, RECORDED RATHER THAN WORKED AROUND.
  # `crates/fathom-ingest/src/dict.rs`'s `ValueTy` is a closed allowlist (its
  # own `from_name` match), and `LacpMode` is not one of its arms — nor is
  # `InterfaceForm` (needed below for `irb`). Both types already exist,
  # reviewed, in `schema/schema.yaml` and are already generated in
  # `crates/fathom-ir/src/generated/ir_types.rs` (`LacpMode`,
  # `InterfaceForm`, each with its own `from_token`); what is missing is
  # `dict.rs`'s `ValueTy`/`from_name` arm and `bind.rs`'s matching
  # `BoundValue` arm — two or three small, mechanical additions to the
  # SHARED ingest engine, not to this data pack. This session owns
  # `corpus/dict/junos-ex/` and does not touch `crates/fathom-ingest/src/`
  # while four other builders are concurrently working the same tree
  # (harness instruction: touch only what you own). The line stays visible,
  # unbound, in the estate of record — not silently dropped, not guessed
  # onto a wrong field — until that small engine change lands.
  #
  # The membership half of aggregated Ethernet (which physical port joins
  # which `ae`) is NOT affected by this gap and is fully bound below.

  # ---- ether-options 802.3ad: an interface JOINING an ae ----
  #
  # `schema/schema.yaml`'s own `MemberOfAggregate` edge doc states the exact
  # path this entry binds: "doc: ether-options 802.3ad ae0 (11 §7.3)" — the
  # schema's own citation of the internal spec document, already reviewed
  # into this repository, and the most authoritative source reachable for
  # this specific edge. A 2026-09-19 web search for a live Junos example
  # instead turned up `gigether-options 802.3ad ae0` on a third-party
  # tutorial page (not a primary Juniper source), which is the form the
  # SIBLING `MemberOfReth` edge's own schema doc uses for the unrelated
  # `redundant-parent` statement ("gigether-options redundant-parent
  # reth0"). The two options stanzas are not the same statement, and no
  # primary Juniper page was read directly in this session to settle which
  # of `ether-options` / `gigether-options` a real EX 802.3ad line uses.
  # THIS ENTRY FOLLOWS THE SCHEMA'S OWN CITATION rather than the
  # uncorroborated tutorial page, and this discrepancy is recorded here
  # for a maintainer with primary vendor documentation in hand to settle:
  # if the vendor page confirms `gigether-options`, this entry's path
  # segment is the one-word fix. The target `AggregateInterface` node is
  # resolved/created `by_name` (the same mechanism `interfaces.yaml`'s
  # `vlan-members` entry uses to resolve a `Vlan` by name), so an `ae0`
  # node exists and is named even though its `lacp_mode` cannot be set yet.
  - id: junos-ex/interfaces.member.ether-options.802-3ad
    path: [interfaces, "$if", ether-options, "802.3ad", "$ae"]
    binds:
      nodes:
        - { as: n0, kind: "@interface_like", key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
      edges:
        - { kind: MemberOfAggregate, from: n0, to: { by_name: { kind: AggregateInterface, from: "$ae" } } }
    versions: "*"
    reviewed_by: <named human>

  # ---- irb: the routed VLAN interface ----
  #
  # `irb` is a real, literal interface name on Junos EL/ELS switches (a
  # single virtual routed-VLAN interface, not a numbered physical port) —
  # schema/schema.yaml's own `Interface.form` enum names it a discriminant:
  # "Loopbacks and IRBs are form discriminants, not kinds (11 §6.1)" and
  # declares `irb` as one of its five `form` values. This entry restricts
  # the interface-name capture to the literal word `irb` via `where:` (the
  # same constraint mechanism `corpus/dict/junos-srx/protocols-ospf.yaml`
  # uses to scope a capture to a closed set of tokens) so that ONLY a
  # genuinely-named `irb` unit is bound here — never any other interface
  # whose address happens to be captured by a broader, unconstrained path.
  #
  # `form: irb` is NOT SET, for the same `ValueTy`/`InterfaceForm` gap the
  # LACP note above records — `const_enum: InterfaceForm.irb` fails to load
  # against today's `dict.rs` the same way `scalar: LacpMode` does. The
  # `Interface` node this entry creates is real (named `irb`, with real
  # `LogicalUnit`/`Address` children) and is reachable and correct under
  # every field this dictionary CAN set; it is simply indistinguishable
  # from a same-named physical interface by its `form` field alone until
  # that engine change lands. `where: { if: [irb] }` is what keeps this
  # entry from ever creating a WRONG node in the meantime — it cannot fire
  # on anything but the literal word `irb`.
  #
  # `unit <n> family inet address <addr>` at `[edit interfaces irb unit
  # logical-unit-number family inet address address]` is the same
  # `family/inet/address` shape `corpus/dict/junos-srx/interfaces.yaml`'s
  # `interfaces.unit.family-inet-address` entry already binds for every
  # OTHER interface; re-read against Juniper's own IRB configuration
  # guidance via search synthesis 2026-09-19 (egress blocked; see file
  # header), which uses exactly this line shape for an EX/QFX IRB:
  # `set interfaces irb unit 20 family inet address 10.0.20.1/24`.
  - id: junos-ex/interfaces.irb.unit.family-inet-address
    path: [interfaces, "$if", unit, "$u", family, inet, address, "$a"]
    where: { if: [irb] }
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: families, append_enum: Family.inet } ] }
        - { as: n2, kind: Address, owner: n1, key: "$a", fields: [ { field: value, from: "$a", scalar: InterfaceAddress }, { field: family, const_enum: AddressFamily.inet } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/interfaces.irb.unit.description
    path: [interfaces, "$if", unit, "$u", description, "$d"]
    where: { if: [irb] }
    binds:
      nodes:
        - { as: n0, kind: Interface, key: "$if", fields: [ { field: name, from: "$if", scalar: InterfaceName } ] }
        - { as: n1, kind: LogicalUnit, owner: n0, key: "$u", fields: [ { field: index, from: "$u", scalar: u32 }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>
