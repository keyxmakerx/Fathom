# corpus/dict/junos-ex/vlans.yaml — the `[edit vlans]` slice for the Junos
# EX switching platform.
#
# `junos-ex` is its OWN Dictionary from `junos-srx` (crates/fathom-ingest/
# src/dict.rs's `Dictionary::load_platform` loads one `platform:` id per
# directory, and `corpus/dict/<platform>/` is that directory), so nothing
# `corpus/dict/junos-srx/vlans.yaml` declares is inherited here — this file
# restates the one statement the task asked for, `vlan-id`, from scratch and
# against the same primary source, re-read for this platform.
#
# `vlan-id (all | none | number);` Hierarchy Level (ELS platforms):
# `[edit vlans vlan-name]`. This is, word for word, the EX-relevant half of
# the same page `corpus/dict/junos-srx/vlans.yaml` already cites — EX
# switches are exactly the "ELS platforms" that page's Hierarchy Level line
# names, so this is a closer fit for `junos-ex` than it ever was for
# `junos-srx` (SRX is not an ELS platform; the SRX file's own entry already
# noted this hierarchy is what the QFX/ELS page states, reused because no
# SRX-specific page said otherwise). Re-read 2026-09-19 via web search
# synthesis (this environment's network egress blocks a direct fetch of
# juniper.net, same failure the catalogue files in this session record) —
# https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/vlan-id-edit-vlans-qfx-series.html
#
# `vlan-id all` / `vlan-id none` are not carried, same reasoning as the SRX
# file: `Vlan.vlan_id` is a `VlanId` (1..=4094) and neither token is one.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-ex
source: { cite: "Juniper Junos CLI reference, vlan-id (edit vlans, QFX/ELS series); re-read via web-search synthesis", read_on: "2026-09-19" }
reviewed_by: <named human>
entries:
  - id: junos-ex/vlans.vlan-id
    path: [vlans, "$v", vlan-id, "$id"]
    binds:
      nodes:
        - { as: n0, kind: Vlan, key: "$v", fields: [ { field: name, from: "$v", scalar: Identifier }, { field: vlan_id, from: "$id", scalar: VlanId } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/vlans.description
    path: [vlans, "$v", description, "$d"]
    binds:
      nodes:
        - { as: n0, kind: Vlan, key: "$v", fields: [ { field: name, from: "$v", scalar: Identifier }, { field: description, from: "$d", scalar: Text } ] }
    versions: "*"
    reviewed_by: <named human>
