# corpus/dict/junos-ex/protocols.yaml — OSPF and BGP authentication
# credentials for the Junos EX switching platform (routing on an EX with a
# routing licence uses the identical `[edit protocols]` syntax as every
# other Junos platform). `junos-ex` is its own `Dictionary` from `junos-srx`
# (see vlans.yaml's header), so nothing here is inherited from the sibling
# SRX routing files — this restates the structural OSPF/BGP entries needed
# to reach the credential lines, plus the credentials themselves.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-ex
source: { cite: "Juniper Junos CLI reference, configuring-ospf-authentication, authentication (edit protocols ospf), authentication-key (edit protocols bgp); read 2026-08-15, re-checked 2026-09-19", read_on: "2026-09-19" }
reviewed_by: <named human>

token_maps:
  RoutingProtocolProtocol:
    ospf3: ospf_v3
  ProtocolAdjacencyNetworkType:
    p2p: point_to_point
    nbma: non_broadcast

entries:
  # ---- OSPF structure (area/interface), mirrored from junos-srx's own
  # protocols-ospf.yaml so the authentication entries below have a real
  # ProtocolAdjacency to attach to in a test capture ----
  - id: junos-ex/protocols.ospf.area.interface
    path: [protocols, "$proto", area, "$area", interface, "$if"]
    where: { proto: [ospf, ospf3] }
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance }
        - { as: rp, kind: RoutingProtocol, owner: ri, key: "$proto", fields: [ { field: protocol, from: "$proto", scalar: RoutingProtocolProtocol } ] }
        - { as: adj, kind: ProtocolAdjacency, owner: rp, key: "$if", fields: [ { field: area, from: "$area", scalar: OspfAreaId } ] }
    versions: "*"
    reviewed_by: <named human>

  # ---- OSPF authentication — CREDENTIAL, `secret:` only, no `binds:`, same
  # shape junos-srx/protocols-bgp.yaml's own authentication-key entries use
  # and explain in full (their header: "These model nothing... They exist
  # because 14 §9.1's fourth structural property is that the set of
  # `secret:` entries IS the redaction catalogue"). `junos-srx` carries NO
  # explicit dict-level entry for OSPF authentication at all — it relies
  # solely on `crates/fathom-ingest/src/redact.rs`'s `SECRET_WORD_LIST`
  # component match on `simple-password`/`md5`/`key` as its only net (that
  # file's own long comment on `simple-password` is the record of the gap
  # a length-only heuristic left before the word was added). These two
  # entries give `junos-ex` an explicit, path-level net in ADDITION to that
  # same word-list safety net, rather than relying on the safety net alone.
  #
  # `authentication (Protocols OSPF)` — Hierarchy Level:
  # `[edit protocols (ospf | ospf3) area area-id interface interface-name]`.
  # Already read and cited in this repository on 2026-08-15 by
  # `crates/fathom-ingest/src/redact.rs` (the `simple-password` doc comment
  # on `SECRET_WORD_LIST`), restated here rather than re-fetched (this
  # environment's network egress still blocks juniper.net, checked
  # 2026-09-19 — see the catalogue files' headers this session):
  #
  #   https://www.juniper.net/documentation/us/en/software/junos/ospf/topics/topic-map/configuring-ospf-authentication.html
  #   — "The simple key can be from 1 through 8 characters and can include
  #   ASCII strings." (CLAUDE.md rule 2's length: the test fixture in
  #   `crates/fathom-ingest/tests/junos_ex.rs` uses an 8-character
  #   simple-password, the real documented maximum, never a value shaped
  #   only for the detector.)
  #
  #   https://www.juniper.net/documentation/us/en/software/junos/ospf/topics/ref/statement/authentication-edit-protocols-ospf.html
  #   — names `simple-password`, `md5`, `multi-active-md5` and `keychain`;
  #   "The MD5 key values can be from 1 through 16 characters long." The
  #   test fixture's MD5 key is 16 characters, same reasoning.
  - id: junos-ex/protocols.ospf.area.interface.authentication.simple-password
    path: [protocols, "$proto", area, "$area", interface, "$if", authentication, simple-password, "$v"]
    where: { proto: [ospf, ospf3] }
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/protocols.ospf.area.interface.authentication.md5.key
    path: [protocols, "$proto", area, "$area", interface, "$if", authentication, md5, "$keyid", key, "$v"]
    where: { proto: [ospf, ospf3] }
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  # ---- BGP structure, mirrored from junos-srx/protocols-bgp.yaml ----
  - id: junos-ex/protocols.bgp.group.neighbor
    path: [protocols, "$proto", group, "$g", neighbor, "$n"]
    where: { proto: [bgp] }
    partial: true
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance }
        - { as: rp, kind: RoutingProtocol, owner: ri, key: "$proto", fields: [ { field: protocol, from: "$proto", scalar: RoutingProtocolProtocol } ] }
        - { as: adj, kind: ProtocolAdjacency, owner: rp, key: "$n", fields: [ { field: peer_address, from: "$n", scalar: IpAddr } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/protocols.bgp.group.neighbor.peer-as
    path: [protocols, "$proto", group, "$g", neighbor, "$n", peer-as, "$as"]
    where: { proto: [bgp] }
    binds:
      nodes:
        - { as: ri, kind: RoutingInstance }
        - { as: rp, kind: RoutingProtocol, owner: ri, key: "$proto", fields: [ { field: protocol, from: "$proto", scalar: RoutingProtocolProtocol } ] }
        - { as: adj, kind: ProtocolAdjacency, owner: rp, key: "$n", fields: [ { field: peer_address, from: "$n", scalar: IpAddr }, { field: peer_as, from: "$as", scalar: Asn } ] }
    versions: "*"
    reviewed_by: <named human>

  # ---- BGP authentication-key — CREDENTIAL, same three levels
  # junos-srx/protocols-bgp.yaml's own entries bind and explain in full.
  # `authentication-key (Protocols BGP and BMP)` — corroborated across two
  # independent search queries, both 2026-09-19, both returning the same
  # official page: "the authentication-key can be up to 126 characters and
  # can include any ASCII strings."
  # https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/authentication-key-edit-protocols-bgp.html
  # (CLAUDE.md rule 2: the test fixture uses a 126-character key, the real
  # documented maximum, not a detector-shaped value.)
  - id: junos-ex/protocols.bgp.authentication-key
    path: [protocols, "$proto", authentication-key, "$v"]
    where: { proto: [bgp] }
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/protocols.bgp.group.authentication-key
    path: [protocols, "$proto", group, "$g", authentication-key, "$v"]
    where: { proto: [bgp] }
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/protocols.bgp.group.neighbor.authentication-key
    path: [protocols, "$proto", group, "$g", neighbor, "$n", authentication-key, "$v"]
    where: { proto: [bgp] }
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>
