# corpus/dict/junos-ex/system.yaml — the credential-bearing `[edit system]`
# and `[edit snmp]` statements for the Junos EX switching platform, plus
# `host-name`. `junos-ex` is its own `Dictionary` from `junos-srx` (see
# vlans.yaml's header), so every one of these is restated here, not shared —
# a config parsed against this platform id gets NO redaction protection from
# any entry that lives only in `corpus/dict/junos-srx/`.
#
# Six of these seven entries exist to feed the redaction gate, not the
# binder: `14` §9.1's fourth structural property is that the set of
# `secret:` entries IS the redaction catalogue, so a stanza Fathom does not
# model still has to be catalogued here or its credential reaches the store
# (the same reasoning `corpus/dict/junos-srx/system.yaml`'s own header
# states).
#
# These are OS-level Junos statements, identical in syntax across the whole
# product line — the same CLI reference pages the SRX file cites govern
# them here too, re-checked 2026-09-19 for this platform's own file (direct
# fetch of juniper.net blocked in this environment; see the catalogue
# files' headers this session for the same EGRESS_BLOCKED failure; the URLs
# below were read via web search synthesis):
#
#   root-authentication / login user authentication (plain-text-password,
#   encrypted-password) —
#   https://www.juniper.net/documentation/us/en/software/junos/user-access/topics/topic-map/user-access-root-password.html
#   https://www.juniper.net/documentation/us/en/software/junos/user-access/topics/topic-map/user-access-plaintext-password.html
#
#   CLAUDE.md RULE 2 — the length this test config must use is what a real
#   device ACCEPTS, not what the detector needs. Corroborated across two
#   independent search queries returning the same official Root Password
#   page, both read 2026-09-19: "The default requirements for a plain-text
#   password are: must be from 6 up to 128 characters long." The
#   `encrypted-password` form accepts a pre-hashed string "whose number of
#   characters range from 1 through 128 characters" (same page). The test
#   fixture in `crates/fathom-ingest/tests/junos_ex.rs` uses an 18-character
#   plain-text password (within 6..=128) and a realistic `$6$...` crypt(3)
#   SHA-512 hash for the encrypted form (the same shape
#   `crates/fathom-ingest/tests/edgeos.rs` already uses and cites as glibc's
#   real `crypt()` output format), never a value shaped only for the
#   detector.
#
#   snmp community —
#   https://www.juniper.net/documentation/us/en/software/junos/cli-reference/topics/ref/statement/community-edit-snmp.html
#   Searched twice, 2026-09-19: **no Junos-specific maximum length for an
#   SNMP community string could be established.** Neither the vendor's own
#   `community (SNMP)` reference page nor a second, more targeted search
#   for a stated character limit surfaced one. Per CLAUDE.md rule 1, this is
#   recorded as "could not establish" rather than guessed; the test fixture
#   uses a representative real-world community string (a short, human-typed
#   word), not a maximal or detector-shaped one.
#
# `reviewed_by: <named human>` is a placeholder, not a name (invariant 10).
platform: junos-ex
source: { cite: "Juniper Junos CLI reference, user-access-root-password, user-access-plaintext-password, community (edit snmp); read via web-search synthesis", read_on: "2026-09-19" }
reviewed_by: <named human>
entries:
  - id: junos-ex/system.host-name
    path: [system, host-name, "$h"]
    binds:
      nodes:
        - { as: n0, kind: Device, fields: [ { field: hostname, from: "$h", scalar: Identifier } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/system.root-authentication.encrypted-password
    path: [system, root-authentication, encrypted-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/system.root-authentication.plain-text-password
    path: [system, root-authentication, plain-text-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/system.login.user.encrypted-password
    path: [system, login, user, "$u", authentication, encrypted-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/system.login.user.plain-text-password
    path: [system, login, user, "$u", authentication, plain-text-password, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/snmp.community
    path: [snmp, community, "$name"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/snmp.trap-group
    path: [snmp, trap-group, "$g"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>

  # `system services telnet` and `system services web-management http` -- sign-off r137
  # (the check sec.mgmt.plaintext). Read 2026-11-14 from Juniper's CLI reference:
  # "services (System Services)", Hierarchy Level `[edit system]`, whose syntax block holds
  # `telnet { connection-limit limit; rate-limit limit; }` and
  # `web-management { http { interfaces [ names ]; port port; } https { ... } }`;
  # https://juniper.net/documentation/en_US/junos13.2/topics/reference/configuration-statement/services-edit-system.html
  # and "http (System Services)", Hierarchy Level `[edit system services web-management]`:
  # "Configure the port and interfaces for HTTP service, which is unencrypted."
  # https://juniper.net/documentation/en_US/junos13.2/topics/reference/configuration-statement/http-edit-system.html
  # These are OS-level statements, the same across the product line.
  #
  # `partial` because a limit or a port may follow on the same line
  # (`set system services telnet connection-limit 5`); any such line still means the
  # service is configured. Only https is encrypted, so `web-management https` binds nothing.
  - id: junos-ex/system.services.telnet
    path: [system, services, telnet]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: Device }
        - { as: n1, kind: SystemSettings, owner: n0, fields: [ { field: telnet_enabled, const_bool: true } ] }
    versions: "*"
    reviewed_by: <named human>

  - id: junos-ex/system.services.web-management.http
    path: [system, services, web-management, http]
    partial: true
    binds:
      nodes:
        - { as: n0, kind: Device }
        - { as: n1, kind: SystemSettings, owner: n0, fields: [ { field: http_enabled, const_bool: true } ] }
    versions: "*"
    reviewed_by: <named human>
