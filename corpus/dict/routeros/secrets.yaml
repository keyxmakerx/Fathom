# corpus/dict/routeros/secrets.yaml -- credentials, destroyed by name in
# every menu. RouterOS's own hiding is not relied on: v6 prints secrets by
# default, and v7's hiding has had gaps (README-routeros.md, "Why by name").
# Most of these names are also caught by the gate's secret-word floor; the
# entries give them their label and a second detector. The ones the floor
# cannot see (`pin`, `cak`, `identity`, a script body) are here so they are
# caught at all.
#
# `$k`/`$i` are the row's identity key and value, whichever the row has.
platform: routeros
source: { cite: "MikroTik manual, List of menus with sensitive parameters; Configuration Management; SNMP; WireGuard; read 2026-10-10. Full trail: corpus/dict/README-routeros.md", read_on: "2026-10-10" }
reviewed_by: <named human>
entries:
  - id: routeros/interface.wireguard.private-key
    path: [interface, wireguard, "$k", "$i", private-key, "$v"]
    secret: { label: cert-key }
    versions: "*"
    reviewed_by: <named human>

  - id: routeros/interface.wireguard.peers.private-key
