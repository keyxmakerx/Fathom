  # SNMP v1/v2c: the community's `name` IS the community string, and it is
  # not on RouterOS's sensitive list, so it is printed even when hiding is on.
  - id: routeros/snmp.community.name
    path: [snmp, community, name, "$c"]
    partial: true
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>
