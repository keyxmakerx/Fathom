# corpus/dict/pfsense/secrets.yaml -- the credentials pfSense stores in
# plaintext or as a hash, given their label. Every other value is destroyed
# anyway (config.yaml's header); these entries name what was destroyed.
platform: pfsense
source: { cite: "pfsense/pfsense source, master 9363ac5 (2026-03-31): auth.inc, vpn_ipsec_phase1.php, services_snmp.php; see corpus/dict/README-pfsense.md", read_on: "2026-10-10" }
reviewed_by: <named human>
entries:
  - id: pfsense/system.user.bcrypt-hash
    path: [system, user, name, "$u", bcrypt-hash, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: pfsense/system.user.sha512-hash
    path: [system, user, name, "$u", sha512-hash, "$v"]
    secret: { label: password }
    versions: "*"
    reviewed_by: <named human>

  - id: pfsense/system.user.ipsecpsk
    path: [system, user, name, "$u", ipsecpsk, "$v"]
    secret: { label: psk }
    versions: "*"
    reviewed_by: <named human>

  - id: pfsense/ipsec.phase1.pre-shared-key
    path: [ipsec, phase1, ikeid, "$i", pre-shared-key, "$v"]
    secret: { label: psk }
    versions: "*"
    reviewed_by: <named human>

  - id: pfsense/snmpd.rocommunity
    path: [snmpd, rocommunity, "$v"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>

  - id: pfsense/snmpd.rwcommunity
    path: [snmpd, rwcommunity, "$v"]
    secret: { label: snmp-community }
    versions: "*"
    reviewed_by: <named human>
