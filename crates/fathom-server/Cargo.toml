[package]
name = "fathom-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The server: the thing that thinks, while the browser looks (49 §5). WO-11's skeleton — it starts, it answers a health check, and it stores nothing."

[[bin]]
name = "fathom-server"
path = "src/main.rs"

[dependencies]
# ADDED ONE AT A TIME, each with its own deps/decisions record and the closure
# document re-measured on arrival (WO-11 §5 step 3). Four commits, four green
# gates -- deliberately not "add them all and reconcile afterwards", because the
# point is that the gate is exercised on every arrival.
#
# default-features = false everywhere it is possible. It is not tidiness: 49 §6
# keeps C7 (no C or C++ in the shipped closure) only if nothing drags in a
# platform TLS stack, and a default feature is the usual way that happens
# without anyone choosing it. deps/decisions/00-CLOSURE.md §"Why
# default-features = false is a security control" is the precedent.
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "net",
    "macros",
    "signal",
    "time",
] }

# axum 0.8.9. `41` §5.2 chose it and `49` §6 keeps the choice, with one standing
# instruction: use its own `ws` feature when WebSockets arrive rather than
# adding `tokio-tungstenite` separately, which would be two copies of the same
# protocol code.
#
# default-features = false again, and the list is short because /health is the
# only endpoint this order builds. Absent and deliberately so: `json` (nothing
# serialises yet, and adding it drags serde in), `form`, `query`,
# `original-uri`, `matched-path`, and `tracing` -- axum's own tracing feature,
# which is not the same thing as depending on `tracing` and is not needed to log
# from a handler.
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "tokio",
] }

# tracing 0.1.44 and tracing-subscriber 0.3.23. WO-11 Disagreements 2 argues
# these arrive WITH the skeleton rather than late in phase 1: retrofitting
# structured logging means rewriting every call site.
#
# `ansi` IS OFF, and that is a security choice with a name. RUSTSEC-2025-0055
# (2025-08-29, CVE-2025-58160) is exactly this: untrusted input logged with ANSI
# escape sequences intact, which manipulates a terminal and has been chained
# through terminal-emulator bugs. 0.3.23 escapes them, so this is belt and
# braces -- but a server whose logs are read by a collector has no use for
# colour, and the cheapest way not to emit an escape sequence is not to have the
# code that writes one.
#
# `env-filter` IS OFF TOO, for a different reason: it pulls `regex`, which is
# five crates (regex, regex-automata, regex-syntax, aho-corasick, memchr) to
# parse a filter string. The skeleton reads one level from one environment
# variable, which needs no regular expressions. Turn it on when per-target
# filtering is actually wanted, and note the five crates when doing it.
#
# `json` is off as well: structured JSON output pulls `serde` and `serde_json`,
# and there is nothing consuming the logs yet. It is the right feature to turn
# on the day a collector exists -- with those two crates recorded in the closure
# like everything else.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
    "fmt",
    "std",
] }

# tokio-postgres 0.7.18 with deadpool-postgres 0.14.2. `49` §6 chose this over
# sqlx on a measurement: 58 crates in the build graph against sqlx's 124,
# measured 2026-08-21. `35` §5.1's cap is 160 in the closure, so sqlx would have
# spent 36 of the remaining budget on one convenience.
#
# NO TLS FEATURE, AND THAT IS TRIGGER 4 MADE CONCRETE. `49` §6 keeps C7 -- no C
# or C++ in the shipped closure -- only if TLS is terminated IN FRONT of the
# binary, because rustls's crypto provider (`ring` or `aws-lc-sys`) brings C and
# assembly back in. `43` §5.4 already decided TLS in front by default. So no
# `with-native-tls` and no `with-rustls`, and PostgreSQL sits on a Unix socket
# or loopback where there is nothing to encrypt against. `deny.toml` bans all
# four of the C carriers by name, so this cannot be undone by accident.
#
# tokio-postgres 0.7.18 is EXACTLY the patched version for RUSTSEC-2026-0178
# (2026-06-12): a malicious or compromised server sending a DataRow with fewer
# fields than its row description declares makes `Row::get` -- and the
# supposedly non-panicking `try_get` -- panic on an out-of-bounds index. See
# deps/decisions/tokio-postgres.md.
tokio-postgres = { version = "0.7.18" }
deadpool-postgres = { version = "0.14.2", default-features = false, features = [
    "rt_tokio_1",
] }

# The engine seam (docs/REBUILD-PLAN.md Phase 2, step one). Path dependencies
# on first-party workspace members, not external crates: gate-zero and the
# other four dependency-gate layers read Cargo.lock's `source = ...` line to
# find what is external, and a path member carries none, so this adds nothing
# to that closure. `fathom-schema` is the one this order's endpoint actually
# calls (`src/engine.rs`); `fathom-graph` and `fathom-id` are wired now so the
# next Phase 2 steps do not repeat this step -- they carry no caller yet, and
# that is correct for a seam landing ahead of what will use it.
fathom-graph = { path = "../fathom-graph" }
fathom-id = { path = "../fathom-id" }
fathom-schema = { path = "../fathom-schema" }

# ---------------------------------------------------------------------------
# PHASE 2's KEY HIERARCHY. Every version below is `docs/PHASE-2-STORAGE-DESIGN.md`
# §12.4's table, and each has its own `deps/decisions/` record because this
# workspace names it in a manifest (gate-zero's rule for a DIRECT dependency).
# ---------------------------------------------------------------------------

# The AEAD. ChaCha20-Poly1305, RFC 8439, 96-bit nonce, 128-bit tag.
#
# 0.11.0 AND NOT 0.10, AND THE REASON IS THE LOCKFILE, NOT TASTE. §12.4:
# `chacha20poly1305 0.10.1` wants `chacha20 ^0.9`; this lockfile already
# carries `chacha20 0.10.2` through `rand` <- `postgres-protocol`, and
# `deny.toml` sets `multiple-versions = "deny"`, so pinning 0.10 would put two
# `chacha20` majors in the graph and fail the gate. 0.11.0 unifies with what
# is already there. `deps/decisions/chacha20poly1305.md` carried `0.10` and is
# corrected in the same commit as this line.
#
# `alloc` is the one feature the vector-returning `Aead::encrypt`/`decrypt`
# need; `getrandom` is OFF because nonces are drawn through the `getrandom`
# crate directly below, at one place in this crate, rather than through the
# AEAD's convenience constructor. `zeroize` is ON: §12.4's table says so, and
# it is what wipes the expanded ChaCha state and the key inside the cipher on
# drop.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = [
    "alloc",
    "zeroize",
] }

# HKDF-SHA-256, Expand-only (`from_prk`, never `new`): §12.1, because the
# chain key is already uniform and there is nothing for Extract to do. The one
# genuinely new crate of the four roles.
hkdf = { version = "0.13.0", default-features = false }

# The chain MAC: HMAC-SHA-256 (§12.1). BOTH OF THESE WERE ALREADY IN
# `Cargo.lock` -- they arrive with SCRAM-SHA-256 in the PostgreSQL driver
# (`hmac` -> `postgres-protocol` -> ... -> `fathom-server`) -- so naming them
# here adds no crate to the closure. They are named anyway, and each gets its
# own decision record, because a crate this workspace calls directly is one it
# chose: gate-zero draws that line and it is the right line.
#
# Poly1305 is NOT the chain MAC and may never become one (§11.2): it is a
# one-time authenticator, sound only inside the AEAD where it gets a fresh
# one-time key per message.
hmac = { version = "0.13.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

# The CSPRNG: the OS generator directly, not `rand` (§12.4). No userspace
# generator state and no reseeding path -- which is the surface the 2026
# `rand` advisory concerns. Already in the lockfile; named here because this
# crate now calls it for every nonce and every fresh data key.
getrandom = { version = "0.4.3", default-features = false }

# Canonical bytes for the metadata a chain seal covers (§11.2's `canon`). A
# first-party path member: it adds nothing to the dependency closure, and it
# means the seal input has ONE spelling per value rather than whatever a
# formatter happened to emit.
fathom-canon = { path = "../fathom-canon" }

# ---------------------------------------------------------------------------
# PHASE 2's AUTHORITY LAYER. `docs/PHASE-2-ADMIN-AND-AUDIT-DESIGN.md` §15.3
# chose ES256 over EdDSA and said why: FIDO's metadata service was unreachable,
# so which authenticators support EdDSA could not be established, and CLAUDE.md
# rule 1 forbids betting on an unverified belief. ES256 is the choice that does
# not need the lookup that could not be done.
# ---------------------------------------------------------------------------

# The curve. `default-features = false` drops `std`, `pem`, `pkcs8` and
# `precomputed-tables`: none is on the path this crate uses, and `pem`/`pkcs8`
# would add a key-encoding surface for keys this server only ever verifies.
#
# `ecdsa` is the one feature named, and it pulls exactly what ES256 is:
# `arithmetic` (the field and group operations), `ecdsa-core/algorithm` (the
# signing half) and `sha256` (the hash in ES256's name), which resolves to the
# `sha2` already named above rather than adding one.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }

# The signature algorithm itself, named directly because `src/authority.rs`
# calls its types rather than only p256's re-exports -- `Signature`,
# `SigningKey`, `VerifyingKey`, and `Signature::normalize_s`, which is how §3's
# malleability correction is enforced.
#
# `der` IS NOT NAMED HERE and the absence is the point: §3's correction stores
# and binds a signature as the fixed-size `r || s` pair, never as DER, because
# several DER encodings of one signature are several byte strings over one
# fact. p256 0.14.0's own manifest declares its `ecdsa` dependency with
# `features = ["der"]`, so the `der` crate is in the closure whatever this line
# says; what this line decides is that no code in this workspace reaches for a
# DER parser.
ecdsa = { version = "0.17.0", default-features = false, features = [
    "algorithm",
    "digest",
] }
