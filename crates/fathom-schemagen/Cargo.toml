[package]
name = "fathom-schemagen"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "62 §17's generator: reads the gated schema/ tree via fathom-schema and deterministically emits the generated artifacts"

[dependencies]
fathom-canon = { path = "../fathom-canon" }
fathom-schema = { path = "../fathom-schema" }

[dev-dependencies]
# The determinism/drift tests read the generated types back; no cycle —
# fathom-ir does not depend on this crate.
fathom-ir = { path = "../fathom-ir" }

[[bin]]
name = "fathom-schemagen"
path = "src/bin/fathom-schemagen.rs"
