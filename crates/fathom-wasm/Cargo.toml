[package]
name = "fathom-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the .wasm artifact. rlib: the same code linked natively by this
# crate's own tests, so the protocol has one implementation and two harnesses.
crate-type = ["cdylib", "rlib"]

# `OP_ESTATE_DEMO`'s dispatch arm, and nothing else. Off by default, so the
# default build IS the shipping module; see fathom-inventory/Cargo.toml for the
# 35,095-byte measurement and for why the polarity is this way round.
[features]
demo-estate = ["fathom-inventory/demo-estate"]
# A READ PATH INTO THE HELD ESTATE, FOR TESTS ONLY. The opcodes are the only
# door a browser has, and they answer with rendered faces rather than the graph
# — which is correct, and which left no way to assert on PROVENANCE. `resolver
# = "2"` keeps a dev-dependency's features out of the release build, and
# artifact_gates.rs asserts that rather than trusting it.
inspect = []

[dependencies]
fathom-corpus = { path = "../fathom-corpus" }
fathom-find = { path = "../fathom-find" }
fathom-graph = { path = "../fathom-graph" }
fathom-id = { path = "../fathom-id" }
fathom-ingest = { path = "../fathom-ingest" }
fathom-inventory = { path = "../fathom-inventory" }
fathom-layout = { path = "../fathom-layout" }
fathom-ir = { path = "../fathom-ir" }
fathom-weld = { path = "../fathom-weld" }

# A package depending on itself: the only way to turn one of its own features on
# for its own test targets. `tests/face.rs` and `tests/equip.rs` drive
# `OP_ESTATE_DEMO` and call `fathom_inventory::demo_estate()` directly, and both
# keep working unchanged — the fixture leaves the module, not the workspace.
# `resolver = "2"` keeps this out of the release build; artifact_gates.rs
# asserts that rather than trusting it.
[dev-dependencies]
fathom-wasm = { path = ".", features = ["demo-estate", "inspect"] }
