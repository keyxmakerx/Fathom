[package]
name = "fathom-layout"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic diagram layout: a typed graph in, boxes and routed lines out. Runs in the core, never the UI (41 §750)"

[dependencies]
fathom-graph = { path = "../fathom-graph" }
fathom-inventory = { path = "../fathom-inventory" }
fathom-ir = { path = "../fathom-ir" }

[dev-dependencies]
# `demo_estate()` moved behind an off-by-default feature on 2026-08-15 to take
# 35 KB out of the shipping module (`47` §11). `order.rs` drives it, so this
# crate turns the feature on for its OWN test targets and for nothing else —
# resolver 2 keeps a dev-dependency's features out of any build that is not
# building dev-dependencies, which is what stops the fixture reaching the wasm.
fathom-inventory = { path = "../fathom-inventory", features = ["demo-estate"] }
fathom-ingest = { path = "../fathom-ingest" }
fathom-weld = { path = "../fathom-weld" }
fathom-id = { path = "../fathom-id" }
